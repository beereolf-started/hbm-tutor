<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HBM — Родитель</title>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface-2:#21262d;--border:#30363d;
  --text:#e6edf3;--muted:#7d8590;--green:#1a7f37;--green-h:#2ea043;--green-t:#3fb950;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--green-t);text-decoration:none}a:hover{text-decoration:underline}

.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-logo{font-weight:700;font-size:1em}
.topbar-r{display:flex;align-items:center;gap:12px}
.topbar-name{color:var(--muted);font-size:.88em}
.link-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.85em;padding:4px 8px;border-radius:6px}
.link-btn:hover{background:var(--surface-2);color:var(--text)}
.notif-btn{position:relative;background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.1em;padding:4px 8px;border-radius:6px;line-height:1}
.notif-btn:hover{background:var(--surface-2)}
.notif-badge{position:absolute;top:0;right:0;background:#ef4444;color:#fff;font-size:.6em;font-weight:700;padding:1px 4px;border-radius:10px;min-width:14px;text-align:center;display:none}
.wrap{max-width:820px;margin:0 auto;padding:28px 20px}
.meta{color:var(--muted);font-size:.85em}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.card h2{font-size:1.05em;font-weight:600;margin-bottom:10px}

/* Price */
.price-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:var(--surface-2);border-radius:8px;margin-bottom:12px;border:1px solid var(--border)}
.price-cur{font-size:1.3em;font-weight:700;color:var(--green-t)}
.price-disc{font-size:.82em;color:#fbbf24}
.price-bar{height:5px;background:var(--bg);border-radius:3px;width:80px;flex-shrink:0}
.price-bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green-t));border-radius:3px}
.goal{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.75em;font-weight:600}
.goal-ege{background:#2d1f5e;color:#a78bfa}.goal-olymp{background:#3a2a00;color:#fbbf24}.goal-base{background:#0d2e1e;color:#34d399}

/* Sections */
.sec{background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-bottom:6px;border:1px solid transparent}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.sec-title{font-size:.9em;font-weight:600;color:var(--text);flex:1}
.lock-badge{font-size:.72em;padding:2px 7px;border-radius:20px;background:#0d2e1e;color:var(--green-t);border:1px solid #1a5e32}

/* Progress badges */
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.badge{font-size:.72em;padding:2px 7px;border-radius:20px;font-weight:600}
.badge-hw{background:#1a1040;color:#a78bfa}
.badge-hw.done{background:#0d2e1e;color:#34d399}
.badge-idz{background:#3a2a00;color:#fbbf24}
.badge-idz.done{background:#0d2e1e;color:#34d399}
.badge-ctrl-pass{background:#0d2e1e;color:#34d399}
.badge-ctrl-fail{background:#2d0d0d;color:#f87171}
.badge-ctrl-none{background:var(--surface);color:var(--muted)}

/* Items */
.items-grid{display:flex;flex-direction:column;gap:3px}
.item{display:flex;align-items:center;gap:8px;font-size:.82em;padding:4px 2px}
.status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.st-none{background:#1c5e30}.st-progress{background:#f59e0b}.st-done{background:#10b981}
.item-grade{font-size:.78em;font-weight:600}
.grade-5{color:var(--green-t)}.grade-4{color:#bef264}.grade-3{color:#fde047}.grade-2{color:#fdba74}.grade-1{color:#fca5a5}

/* Progress bar for section */
.sec-prog{height:3px;background:var(--border);border-radius:2px;margin-bottom:6px}
.sec-prog-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green-t));border-radius:2px;transition:width .4s}
</style></head><body>
<div class="topbar"><span class="topbar-logo">👨‍👩‍👧 Кабинет родителя</span><div class="topbar-r"><span class="topbar-name" id="uname"></span><button class="notif-btn" onclick="openMessages()" title="Сообщения">🔔<span class="notif-badge" id="notifBadge"></span></button><button class="link-btn" onclick="logout()">Выйти</button></div></div>

<!-- Messages overlay -->
<div id="msgOverlay" style="display:none;position:fixed;inset:0;background:#000c;z-index:200;align-items:flex-end;justify-content:flex-end">
<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px 12px 0 0;width:360px;max-width:100vw;height:70vh;display:flex;flex-direction:column;margin-right:0">
  <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
    <span id="msgTitle" style="font-weight:600">💬 Сообщения</span>
    <button class="link-btn" onclick="closeMessages()">✕</button>
  </div>
  <div id="msgBody" style="flex:1;overflow-y:auto;padding:12px"></div>
  <div id="msgInput" style="display:none;padding:10px;border-top:1px solid var(--border);display:none">
    <div style="display:flex;gap:6px">
      <input id="msgIn" placeholder="Написать..." style="flex:1;padding:7px 10px" onkeydown="if(event.key==='Enter')sendMsg()">
      <button style="padding:7px 14px;background:var(--green);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600" onclick="sendMsg()">→</button>
    </div>
  </div>
</div>
</div>
<div class="wrap"><div id="children"></div></div>
<script src="/api.js"></script>
<script>
if(!requireAuth(['parent']))throw'';
document.getElementById('uname').textContent=localStorage.getItem('name');

const gradeColors={5:'grade-5',4:'grade-4',3:'grade-3',2:'grade-2',1:'grade-1'};

function secBadges(sec){
    const hw=sec.items.filter(i=>i.type==='hw');
    const hwDone=hw.length>0&&hw.every(i=>(i.grade||0)===5);
    const hwPart=hw.length>0&&hw.some(i=>(i.grade||0)>0);
    const ctrl=sec.control_enabled;
    const idz=sec.idz_enabled;
    let b='';
    if(hw.length>0){
        const cls=hwDone?'badge-hw done':'badge-hw';
        const hwGrades=hw.filter(i=>i.grade).map(i=>i.grade);
        const avgHw=hwGrades.length?Math.round(hwGrades.reduce((a,b)=>a+b,0)/hwGrades.length):null;
        b+=`<span class="badge ${cls}">ДЗ${avgHw?' '+avgHw:''}${hwDone?' ✓':''}</span>`}
    if(idz){
        const g=sec.idz||0;
        const cls=g===5?'badge-idz done':'badge-idz';
        b+=`<span class="badge ${cls}">ИДЗ${g?' '+g+'/5':''}</span>`}
    if(ctrl){
        if(sec.control==='passed') b+=`<span class="badge badge-ctrl-pass">Контроль ✓</span>`;
        else if(sec.control==='failed') b+=`<span class="badge badge-ctrl-fail">Контроль ✗</span>`;
        else b+=`<span class="badge badge-ctrl-none">Контроль —</span>`}
    return b}

function secProgress(sec){
    const items=sec.items;
    if(!items.length) return 0;
    const done=items.filter(i=>i.status==='done').length;
    return Math.round(done/items.length*100)}

async function load(){
    const list=await get('/api/students');
    if(!list.length){document.getElementById('children').innerHTML='<p class="meta" style="text-align:center;padding:40px">Нет привязанных детей</p>';return}
    let h='';
    for(const s of list){
        const [full,contacts]=await Promise.all([
            get('/api/students/'+s.id),
            get('/api/students/'+s.id+'/contacts').catch(()=>({tutors:[],parents:[]}))]);
        const gl=full.goal==='ege'?'ЕГЭ':full.goal==='olymp'?'Олимп':'База';
        // Pricing
        const n=full.sections.length;
        let disc=0;
        if(n){const share=full.base_rate*0.30/n;for(const sec of full.sections){
            const hw=sec.items.filter(i=>i.type==='hw');
            if(hw.length>0&&hw.every(i=>(i.grade||0)===5))disc+=share/3;
            if(sec.control==='passed')disc+=share/3;
            if(sec.idz_enabled&&(sec.idz||0)===5)disc+=share/3;}}
        const discR=Math.round(disc),pct=Math.round(disc/full.base_rate*100),cur=full.base_rate-discR;
        h+=`<div class="card"><h2>${full.name}</h2>
<div class="price-row">
  <span class="price-cur">${cur} ₽/ч</span>
  <span style="color:#7aaa8a;font-size:.8em;text-decoration:line-through">${full.base_rate} ₽</span>
  <span class="price-disc">−${discR} ₽ (−${pct}%)</span>
  <div class="price-bar"><div class="price-bar-fill" style="width:${Math.min(100,pct*100/30)}%"></div></div>
  <span class="meta" style="margin-left:auto">${pct}% скидка</span>
</div>
<div class="meta" style="margin-bottom:8px">${full.grade} класс · <span class="goal goal-${full.goal}">${gl}</span> · ${full.format} · <a href="/board.html?id=${full.id}">🎨 Доска</a></div>`;
        if(contacts.tutors.length){
            h+=`<div class="meta" style="margin-bottom:10px">👨‍🏫 ${contacts.tutors.map(t=>t.name+(t.subjects&&t.subjects.length?' ('+t.subjects.join(', ')+')':'')).join(', ')}</div>`}
        if(full.sections.length){
            for(const sec of full.sections){
                const pct2=secProgress(sec);
                const badges=secBadges(sec);
                h+=`<div class="sec">
<div class="sec-head">
  <span class="sec-title">${sec.title}</span>
  ${sec.locked?`<span class="lock-badge">🔒 Закрыт</span>`:''}
  <span class="meta">${pct2}%</span>
</div>`;
                if(badges) h+=`<div class="badges">${badges}</div>`;
                if(pct2>0) h+=`<div class="sec-prog"><div class="sec-prog-fill" style="width:${pct2}%"></div></div>`;
                const visItems=sec.items.filter(i=>i.type!=='topic'||i.name);
                if(visItems.length){
                    h+='<div class="items-grid">';
                    for(const it of visItems){
                        const icon=it.type==='hw'?'📝':it.type==='control'?'📋':it.type==='idz'?'📊':it.type==='media'?'🎬':'📌';
                        const gc=it.grade&&gradeColors[it.grade]?`<span class="item-grade ${gradeColors[it.grade]}">${it.grade}</span>`:'';
                        h+=`<div class="item"><div class="status st-${it.status||'none'}"></div><span>${icon} ${it.name||it.type}</span>${gc}</div>`}
                    h+='</div>'}
                h+='</div>'}
        }else{h+='<p class="meta" style="margin-top:8px">Программа не назначена</p>'}
        h+='</div>'}
    document.getElementById('children').innerHTML=h}
load();

// ── MESSAGING ──
let msgChatUid=null, chatPollTimer=null, msgChatName='';
function openMessages(){
  document.getElementById('msgOverlay').style.display='flex';
  msgChatUid=null;loadConvos()}
function closeMessages(){
  clearInterval(chatPollTimer);chatPollTimer=null;
  document.getElementById('msgOverlay').style.display='none'}
async function loadConvos(){
  clearInterval(chatPollTimer);chatPollTimer=null;
  const convos=await get('/api/messages').catch(()=>[]);
  const body=document.getElementById('msgBody');
  document.getElementById('msgTitle').textContent='💬 Сообщения';
  document.getElementById('msgInput').style.display='none';
  msgChatUid=null;
  if(!convos.length){body.innerHTML='<p style="color:var(--muted);text-align:center;padding:20px">Нет сообщений</p>';return}
  body.innerHTML=convos.map(c=>`<div style="padding:10px 8px;cursor:pointer;border-radius:8px;display:flex;align-items:center;gap:8px" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background=''" onclick="openChat('${c.partner_id}','${esc(c.partner_name)}')">
  <div style="width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9em;flex-shrink:0">${(c.partner_name||'?')[0].toUpperCase()}</div>
  <div style="flex:1;min-width:0"><div style="font-size:.88em;font-weight:600">${esc(c.partner_name)}</div><div style="font-size:.78em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.last_text||'')}</div></div>
  ${c.unread>0?`<span style="background:#ef4444;color:#fff;font-size:.68em;font-weight:700;padding:1px 5px;border-radius:8px">${c.unread}</span>`:''}
</div>`).join('')}
async function openChat(uid,name){
  msgChatUid=uid;if(name)msgChatName=name;
  document.getElementById('msgTitle').innerHTML=`<button onclick="loadConvos()" style="background:none;border:none;cursor:pointer;color:var(--muted);margin-right:6px;font-size:.85em">←</button>💬 ${esc(msgChatName)}`;
  const inp=document.getElementById('msgInput');inp.style.display='flex';
  await refreshChat();
  clearInterval(chatPollTimer);
  chatPollTimer=setInterval(refreshChat,5000);}
async function refreshChat(){
  if(!msgChatUid) return;
  const msgs=await get('/api/messages/'+msgChatUid).catch(()=>[]);
  const body=document.getElementById('msgBody');
  if(!body) return;
  const atBottom=body.scrollHeight-body.scrollTop-body.clientHeight<60;
  body.innerHTML=msgs.map(m=>{
    const mine=m.to_id===msgChatUid;
    return`<div style="display:flex;justify-content:${mine?'flex-end':'flex-start'};margin-bottom:6px">
  <div style="max-width:78%;padding:7px 10px;border-radius:10px;font-size:.85em;${mine?'background:var(--green);color:#fff':'background:var(--surface-2);color:var(--text)'}">${esc(m.text)}</div>
</div>`}).join('');
  if(atBottom) body.scrollTop=body.scrollHeight;
  pollNotifs();}
async function sendMsg(){
  const inp=document.getElementById('msgIn');if(!inp||!inp.value.trim())return;
  try{await post('/api/messages',{to_id:msgChatUid,text:inp.value.trim()});inp.value='';
    await refreshChat();}catch(e){alert(e.detail||'Ошибка')}}
async function pollNotifs(){
  try{const r=await get('/api/notifications');const n=r.unread||0;
    const b=document.getElementById('notifBadge');
    if(b){b.textContent=n>9?'9+':n;b.style.display=n>0?'':'none'}}catch(e){}
  setTimeout(pollNotifs,30000)}
pollNotifs();
</script></body></html>
