<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HBM — Панель</title>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface-2:#21262d;--border:#30363d;
  --text:#e6edf3;--muted:#7d8590;--green:#1a7f37;--green-h:#2ea043;--green-t:#3fb950;
  --red:#b91c1c;--red-h:#c0392b;--blue:#1f6feb;--yellow:#9e6a03;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
a{color:var(--green-t);text-decoration:none}a:hover{text-decoration:underline}

/* TOP BAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-logo{font-weight:700;font-size:1.05em;color:var(--text);display:flex;align-items:center;gap:8px}
.topbar-logo svg{width:22px;height:22px;fill:var(--green-t)}
.topbar-r{display:flex;align-items:center;gap:12px}
.role-pill{padding:2px 10px;border-radius:20px;font-size:.75em;font-weight:600;background:#1f3a27;color:var(--green-t);border:1px solid #2d5a38}
.role-pill.owner{background:#2d1f5e;color:#a78bfa;border-color:#4c3a8a}
.topbar-name{color:var(--muted);font-size:.9em}
.link-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.88em;padding:4px 8px;border-radius:6px}
.link-btn:hover{background:var(--surface-2);color:var(--text)}
.notif-btn{position:relative;background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.1em;padding:4px 8px;border-radius:6px;line-height:1}
.notif-btn:hover{background:var(--surface-2);color:var(--text)}
.notif-badge{position:absolute;top:0;right:0;background:#ef4444;color:#fff;font-size:.6em;font-weight:700;padding:1px 4px;border-radius:10px;min-width:14px;text-align:center;display:none}
.notif-panel{position:fixed;top:52px;right:12px;width:340px;max-height:480px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 30px #0008;z-index:100;display:none;flex-direction:column;overflow:hidden}
.notif-panel.open{display:flex}
.notif-panel-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:.88em;flex-shrink:0}
.notif-panel-body{overflow-y:auto;flex:1}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:var(--surface-2)}
.notif-item.unread{background:#1a2a1a}
.notif-item.unread:hover{background:#1f321f}
.notif-item-text{font-size:.85em;line-height:1.4}
.notif-item-time{font-size:.75em;color:var(--muted);margin-top:3px}
.notif-msgs-row{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:.85em;cursor:pointer}
.notif-msgs-row:hover{background:var(--surface-2)}
.notif-empty{padding:24px;text-align:center;color:var(--muted);font-size:.85em}

/* WRAP */
.wrap{max-width:1000px;margin:0 auto;padding:32px 24px}

/* DASHBOARD HOME */
.dash-header{margin-bottom:32px}
.dash-header h1{font-size:1.4em;font-weight:600;margin-bottom:4px}
.dash-header p{color:var(--muted);font-size:.9em}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:32px}
.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px 20px;cursor:pointer;transition:border-color .15s,transform .1s;text-decoration:none;display:block;color:var(--text)}
.dash-card:hover{border-color:var(--green-t);transform:translateY(-2px);text-decoration:none}
.dash-card:active{transform:translateY(0)}
.dc-icon{font-size:2.2em;margin-bottom:12px;line-height:1}
.dc-title{font-size:1.05em;font-weight:600;margin-bottom:4px}
.dc-count{font-size:1.8em;font-weight:700;color:var(--green-t);margin-bottom:6px;line-height:1}
.dc-desc{font-size:.82em;color:var(--muted)}

/* SECTION VIEW */
.sec-header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.back-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.88em;display:flex;align-items:center;gap:6px}
.back-btn:hover{border-color:var(--green-t);color:var(--green-t)}
.sec-title{font-size:1.2em;font-weight:600}
.sec-header-actions{margin-left:auto;display:flex;gap:8px}

/* BUTTONS */
.btn{padding:8px 18px;border:none;border-radius:8px;cursor:pointer;font-size:.88em;font-weight:600;transition:background .15s}
.btn-p{background:var(--green);color:#fff}.btn-p:hover{background:var(--green-h)}
.btn-s{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}.btn-s:hover{border-color:var(--green-t)}
.btn-d{background:var(--red);color:#fff}.btn-d:hover{background:var(--red-h)}
.btn-sm{padding:5px 12px;font-size:.82em}
.btn-xs{padding:3px 9px;font-size:.78em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}

/* CARDS GRID */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;position:relative;transition:border-color .15s}
.card:hover{border-color:#484f58}
.card h3{font-size:.95em;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.card .meta{color:var(--muted);font-size:.8em}
.card-body{cursor:pointer}

/* GOAL BADGES */
.goal{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72em;font-weight:600}
.goal-ege{background:#2d1f5e;color:#a78bfa}.goal-olymp{background:#3a2a00;color:#fbbf24}.goal-base{background:#0d2e1e;color:#34d399}

/* ACCT BADGE */
.acct-tag{font-size:.72em;padding:2px 7px;border-radius:20px;background:#0d2e1e;color:var(--green-t);border:1px solid #1a5e32}

/* DOT MENU */
.dot-menu{position:absolute;top:12px;right:12px}
.dot-btn{background:none;border:1px solid transparent;border-radius:6px;cursor:pointer;color:var(--muted);font-size:1.1em;width:30px;height:30px;display:flex;align-items:center;justify-content:center;line-height:1}
.dot-btn:hover{background:var(--surface-2);border-color:var(--border);color:var(--text)}
.dot-dd{display:none;position:absolute;right:0;top:34px;background:var(--surface);border:1px solid var(--border);border-radius:10px;min-width:190px;box-shadow:0 8px 24px #0008;z-index:20;overflow:hidden}
.dot-dd.open{display:block}
.dot-dd button{display:block;width:100%;text-align:left;padding:10px 16px;background:none;border:none;color:var(--text);font-size:.88em;cursor:pointer}
.dot-dd button:hover{background:var(--surface-2)}
.dot-dd button.danger{color:#f87171}
.dot-dd hr{border:none;border-top:1px solid var(--border);margin:4px 0}

/* USERS LIST */
.user-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.user-row-info{flex:1}
.user-row-name{font-size:.92em;font-weight:600;margin-bottom:2px}
.user-row-meta{font-size:.78em;color:var(--muted)}
.role-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72em;font-weight:600}
.rb-owner{background:#2d1f5e;color:#a78bfa}.rb-tutor{background:#0d2e3a;color:#38bdf8}
.rb-student{background:#0d2e1e;color:var(--green-t)}.rb-parent{background:#3a2200;color:#fb923c}
.subj-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.subj-tag{font-size:.72em;padding:2px 7px;border-radius:20px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}

/* SUBJECTS LIST */
.subj-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.subj-row-icon{font-size:1.4em;width:36px;text-align:center}
.subj-row-name{font-size:.92em;font-weight:600;flex:1}

/* FORM */
input,select,textarea{padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--text);font-size:.9em;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
label{display:block;color:var(--muted);font-size:.82em;margin:10px 0 4px;font-weight:500}
.form-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.form-row>*{flex:1;min-width:100px}

/* MODALS */
.modal-bg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:200}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;width:460px;max-width:94vw;max-height:86vh;overflow-y:auto}
.modal h2{font-size:1.1em;font-weight:600;margin-bottom:20px;color:var(--text)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.tab-bar{display:flex;gap:4px;margin-bottom:16px;background:var(--surface-2);padding:4px;border-radius:8px}
.tab-bar button{flex:1;padding:7px;border:none;border-radius:6px;background:none;color:var(--muted);cursor:pointer;font-size:.85em;font-weight:500}
.tab-bar button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px #0004}

/* MULTI-SELECT SUBJECTS */
.subj-multi{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:8px;background:var(--surface-2)}
.subj-chk{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px;border-radius:4px}
.subj-chk:hover{background:var(--surface)}
.subj-chk input[type=checkbox]{width:15px;height:15px;accent-color:var(--green-t);flex-shrink:0;cursor:pointer}
.subj-chk span{font-size:.88em}

.empty{text-align:center;color:var(--muted);padding:48px;font-size:.92em}

/* SCHEDULE */
.sched-outer{overflow:auto;border:1px solid var(--border);border-radius:10px;margin-top:4px;max-height:calc(100vh - 180px)}
.sched-table{border-collapse:collapse;width:100%;min-width:680px}
.sched-table thead th{background:var(--surface);padding:9px 6px;font-size:.78em;font-weight:600;color:var(--muted);text-align:center;border:1px solid var(--border);position:sticky;top:0;z-index:10;white-space:nowrap}
.sched-table thead th.tc{position:sticky;left:0;z-index:11;min-width:54px;background:var(--surface)}
.sched-time{background:var(--surface);position:sticky;left:0;z-index:5;padding:3px 8px;font-size:.72em;color:var(--muted);border:1px solid var(--border);text-align:right;white-space:nowrap;min-width:54px;width:54px;vertical-align:top;user-select:none;height:34px}
.sched-time.h{font-weight:700;color:var(--text)}
.sched-cell{border:1px solid var(--border);padding:2px 3px;height:34px;min-width:110px;cursor:pointer;vertical-align:top;transition:background .1s;position:relative;user-select:none}
.sched-cell:hover{background:var(--surface-2) !important}
.sched-cell.sched-drag-sel{background:#1f3a5f !important;outline:2px solid #3fb950}
.sched-chip{font-size:.7em;padding:3px 6px;border-radius:4px;line-height:1.35;overflow:hidden;height:100%;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.sched-chip:hover{filter:brightness(1.15)}
.sched-chip-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched-chip-note{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9em}
.sched-edit-btn{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.45);border:none;color:#fff;width:20px;height:20px;border-radius:3px;font-size:.65em;cursor:pointer;display:none;padding:0;line-height:20px;text-align:center;z-index:2}
.sched-cell:hover .sched-edit-btn{display:block}
.sched-controls{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sched-today-badge{font-size:.75em;padding:2px 8px;border-radius:20px;background:#0d2e1e;color:var(--green-t);border:1px solid #1a5e32;font-weight:600}
.sched-expand-row td{text-align:center;padding:6px}
.sched-expand-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 18px;font-size:.75em;cursor:pointer}
.sched-expand-btn:hover{background:var(--surface-2);color:var(--text)}
.sched-shutter-top td,.sched-shutter-bot td{background:var(--surface);border:1px solid var(--border)}
</style></head><body>

<div class="topbar">
  <div class="topbar-logo">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    HBM
  </div>
  <div class="topbar-r">
    <span class="topbar-name" id="userName"></span>
    <span class="role-pill" id="userRole"></span>
    <a class="link-btn" href="/profile.html" title="Мой профиль">👤</a>
    <button class="notif-btn" onclick="toggleNotifPanel()" title="Уведомления">🔔<span class="notif-badge" id="notifBadge"></span></button>
    <button class="link-btn" onclick="logout()">Выйти</button>
  </div>
</div>

<div class="notif-panel" id="notifPanel">
  <div class="notif-panel-head">
    <span>🔔 Уведомления</span>
    <div style="display:flex;gap:8px">
      <button class="link-btn" style="font-size:.78em" onclick="markAllNotifsRead()">Прочитать все</button>
      <button class="link-btn" style="font-size:.78em" onclick="closeNotifPanel()">✕</button>
    </div>
  </div>
  <div class="notif-panel-body" id="notifPanelBody"><div class="notif-empty">Загрузка...</div></div>
</div>

<div class="wrap" id="main"></div>

<!-- Modal: Add/Edit Student -->
<div class="modal-bg" id="mStudent"><div class="modal">
<h2 id="mStudentTitle">Новый ученик</h2>
<label>Имя</label><input id="sName" placeholder="Имя ученика">
<div class="form-row">
  <div><label>Класс</label><input id="sGrade" value="9" style="width:80px"></div>
  <div><label>Цель</label><select id="sGoal"><option value="ege">ЕГЭ</option><option value="olymp">Олимпиады</option><option value="base">База</option></select></div>
</div>
<div class="form-row">
  <div><label>Ставка (₽/ч)</label><input id="sRate" type="number" value="1500"></div>
  <div><label>Формат</label><select id="sFormat"><option value="online">Онлайн</option><option value="offline">Офлайн</option></select></div>
</div>
<label>Предмет <span style="color:var(--muted)">(необязательно)</span></label>
<select id="sSubject"></select>
<div class="modal-footer">
  <button class="btn btn-s" onclick="closeM('mStudent')">Отмена</button>
  <button class="btn btn-p" onclick="saveStudent()">Сохранить</button>
</div></div></div>

<!-- Modal: Student Account -->
<div class="modal-bg" id="mStudAccount"><div class="modal">
<h2>Аккаунт ученика</h2>
<p style="color:var(--muted);font-size:.85em;margin-bottom:12px">Создать учётную запись для входа в систему</p>
<label>Логин</label><input id="acLogin">
<label>Пароль</label><input id="acPw" value="hbm1234">
<div class="modal-footer">
  <button class="btn btn-s" onclick="closeM('mStudAccount')">Отмена</button>
  <button class="btn btn-p" onclick="saveStudAccount()">Создать</button>
</div></div></div>

<!-- Modal: Add Parent -->
<div class="modal-bg" id="mStudParent"><div class="modal">
<h2>Добавить родителя</h2>
<div class="tab-bar">
  <button id="pTabNew" class="active" onclick="switchParentTab('new')">Новый аккаунт</button>
  <button id="pTabExist" onclick="switchParentTab('exist')">Существующий</button>
</div>
<div id="pPanelNew">
  <label>Имя</label><input id="pName" placeholder="Имя родителя">
  <label>Логин</label><input id="pLogin">
  <label>Пароль</label><input id="pPw" value="hbm1234">
</div>
<div id="pPanelExist" style="display:none">
  <label>Пользователь с ролью «Родитель»</label>
  <select id="pExistUser" style="width:100%"></select>
</div>
<div class="modal-footer">
  <button class="btn btn-s" onclick="closeM('mStudParent')">Отмена</button>
  <button class="btn btn-p" onclick="saveStudParent()">Добавить</button>
</div></div></div>

<!-- Modal: Add Tutor to Student -->
<div class="modal-bg" id="mStudTutor"><div class="modal">
<h2>Добавить преподавателя</h2>
<label>Преподаватель</label>
<select id="tTutor" style="width:100%" onchange="updateTutorSubjects()"></select>
<div id="tutorSubjWrap" style="display:none">
  <label>Предмет (необязательно)</label>
  <select id="tSubject" style="width:100%"><option value="">— без предмета —</option></select>
</div>
<div class="modal-footer">
  <button class="btn btn-s" onclick="closeM('mStudTutor')">Отмена</button>
  <button class="btn btn-p" onclick="saveStudTutor()">Добавить</button>
</div></div></div>

<!-- Modal: Add User -->
<div class="modal-bg" id="mUser"><div class="modal">
<h2>Новый пользователь</h2>
<label>Роль</label><select id="uRole" onchange="onRoleChange()"></select>
<label>Имя</label><input id="uName">
<label>Логин</label><input id="uLogin">
<label>Пароль</label><input id="uPw" value="">
<div id="uTutorFields" style="display:none">
  <label>Предметы</label>
  <div class="subj-multi" id="uSubjectsList"></div>
</div>
<div id="uStudentFields" style="display:none"><label>Профиль ученика</label><select id="uStudent" style="width:100%"></select></div>
<div id="uParentFields" style="display:none"><label>Дети</label><select id="uChildren" multiple style="height:90px;width:100%"></select></div>
<div class="modal-footer">
  <button class="btn btn-s" onclick="closeM('mUser')">Отмена</button>
  <button class="btn btn-p" onclick="saveUser()">Создать</button>
</div></div></div>

<!-- Modal: Schedule Slot -->
<div class="modal-bg" id="mSched"><div class="modal" style="width:400px">
<h2 id="mSchedTitle">Занятие</h2>
<p id="mSchedDay" style="color:var(--muted);font-size:.85em;margin-bottom:16px"></p>
<label>Ученик</label>
<select id="schedStudent" style="width:100%"></select>
<label>Продолжительность</label>
<select id="schedDuration" style="width:100%">
  <option value="1">30 минут</option>
  <option value="2">1 час</option>
  <option value="3">1,5 часа</option>
  <option value="4">2 часа</option>
  <option value="5">2,5 часа</option>
  <option value="6">3 часа</option>
  <option value="7">3,5 часа</option>
  <option value="8">4 часа</option>
</select>
<label>Заметка <span style="color:var(--muted)">(необязательно)</span></label>
<input id="schedNote" placeholder="Тема урока, пометка..." maxlength="80">
<div class="modal-footer">
  <button class="btn btn-d btn-sm" id="schedDelBtn" onclick="clearSchedSlot()" style="margin-right:auto;display:none">🗑 Удалить</button>
  <button class="btn btn-s" onclick="closeM('mSched')">Отмена</button>
  <button class="btn btn-p" onclick="saveSchedSlot()">Сохранить</button>
</div></div></div>

<!-- Modal: Link Student to User -->
<div class="modal-bg" id="mLinkStudent"><div class="modal">
<h2>Привязать профиль ученика</h2>
<p id="mLinkStudentInfo" style="color:var(--muted);font-size:.85em;margin-bottom:12px"></p>
<label>Профиль ученика</label>
<select id="linkStudentSel" style="width:100%"></select>
<div class="modal-footer">
  <button class="btn btn-s" onclick="closeM('mLinkStudent')">Отмена</button>
  <button class="btn btn-p" onclick="saveLinkStudent()">Привязать</button>
</div></div></div>

<!-- Modal: Manage Tutor Subjects -->
<div class="modal-bg" id="mTutorSubjects"><div class="modal">
<h2>Предметы преподавателя</h2>
<p id="mTutorSubjectsName" style="color:var(--muted);font-size:.85em;margin-bottom:12px"></p>
<div class="subj-multi" id="tSubjectsList"></div>
<div class="modal-footer">
  <button class="btn btn-s" onclick="closeM('mTutorSubjects')">Закрыть</button>
  <button class="btn btn-p" onclick="saveTutorSubjects()">Сохранить</button>
</div></div></div>

<script src="/api.js"></script>
<script>
if(!requireAuth(['owner','tutor']))throw'';
const R=role(),isOwner=R==='owner';
const uname=localStorage.getItem('name');
document.getElementById('userName').textContent=uname;
const rp=document.getElementById('userRole');
rp.textContent=isOwner?'Владелец':'Преподаватель';
if(isOwner) rp.classList.add('owner');

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
let subjects=[],students=[],users=[];
let curSection=null; // null=home, 'students'|'users'|'subjects'

// ─── NAV ──────────────────────────────────────────────────────────────────
function goHome(){curSection=null;render()}
function goSection(s){
  curSection=s;
  if(s==='messages')loadConvos();
  if(s==='contacts')loadContacts();
  if(s==='schedule')loadSchedule();
  render()}
function render(){
  if(curSection===null) renderHome();
  else if(curSection==='students') renderStudents();
  else if(curSection==='users') renderUsers();
  else if(curSection==='subjects') renderSubjects();
  else if(curSection==='messages') renderMessages();
  else if(curSection==='contacts') renderContacts();
  else if(curSection==='schedule') renderSchedule()}

// ─── HOME ─────────────────────────────────────────────────────────────────
function renderHome(){
  const m=document.getElementById('main');
  const sections=[
    {key:'students',icon:'👥',title:'Ученики',count:students.length,desc:'Профили и успеваемость'},
    {key:'users',icon:'👤',title:'Пользователи',count:users.length,desc:'Аккаунты системы'},
    {key:'courses',icon:'📚',title:'Курсы',count:null,desc:'Учебные программы',href:'/courses.html'},
    {key:'contacts',icon:'💬',title:'Контакты',count:null,desc:'Написать ученику или родителю'},
    {key:'schedule',icon:'📅',title:'Расписание',count:null,desc:'Занятия по дням недели'},
    {key:'workshop',icon:'🛠',title:'Мастерская',count:null,desc:'Мои личные доски',href:'/workshop.html'},
  ];
  if(isOwner) sections.push({key:'subjects',icon:'📐',title:'Предметы',count:subjects.length,desc:'Учебные предметы'});
  let cards='';
  for(const s of sections){
    const el=s.href?'a':'div';
    const attr=s.href?`href="${s.href}"`:`onclick="goSection('${s.key}')"`;
    const cnt=s.count!==null?`<div class="dc-count">${s.count}</div>`:'<div class="dc-count" style="font-size:.9em;color:var(--muted)">→</div>';
    cards+=`<${el} class="dash-card" ${attr}><div class="dc-icon">${s.icon}</div><div class="dc-title">${s.title}</div>${cnt}<div class="dc-desc">${s.desc}</div></${el}>`;
  }
  m.innerHTML=`<div class="dash-header"><h1>Добро пожаловать, ${uname}</h1><p>Выберите раздел для работы</p></div><div class="dash-grid">${cards}</div>`}


// ─── STUDENTS ─────────────────────────────────────────────────────────────
function renderStudents(){
  const m=document.getElementById('main');
  let h=`<div class="sec-header">
    <button class="back-btn" onclick="goHome()">← Главная</button>
    <span class="sec-title">👥 Ученики</span>
    <div class="sec-header-actions"><button class="btn btn-p" onclick="openAddStudent()">+ Ученик</button></div>
  </div>`;
  if(!students.length){m.innerHTML=h+'<div class="empty">Нет учеников. Создайте первого!</div>';return}
  h+='<div class="cards-grid">';
  for(const s of students){
    const gc=s.goal==='ege'?'goal-ege':s.goal==='olymp'?'goal-olymp':'goal-base';
    const gl=s.goal==='ege'?'ЕГЭ':s.goal==='olymp'?'Олимп':'База';
    const subj=subjects.find(x=>x.id===s.subject_id);
    const hasAcct=users.some(u=>u.student_id===s.id);
    h+=`<div class="card" id="sc_${s.id}">
  <div class="card-body" onclick="location.href='/student.html?id=${s.id}'">
    <h3>${s.name}${hasAcct?` <span class="acct-tag">👤 Аккаунт</span>`:''}</h3>
    <div class="meta" style="margin-bottom:6px">
      ${s.grade} кл · <span class="goal ${gc}">${gl}</span> · ${s.base_rate} ₽/ч
      ${subj?'· '+subj.icon+' '+subj.name:''}
    </div>
    <a href="/board.html?id=${s.id}" onclick="event.stopPropagation()" style="font-size:.78em;color:var(--green-t);display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--surface-2);border-radius:6px;border:1px solid var(--border);text-decoration:none;margin-top:4px">🎨 Доска</a>
  </div>
  <div class="dot-menu" id="dm_${s.id}">
    <button class="dot-btn" onclick="event.stopPropagation();toggleMenu('${s.id}')">⋯</button>
    <div class="dot-dd" id="dd_${s.id}">
      <button onclick="closeMenuThen(()=>editStud('${s.id}'))">✏️ Редактировать</button>
      <button onclick="closeMenuThen(()=>openStudAccount('${s.id}'))">👤 ${hasAcct?'Изменить аккаунт':'Добавить аккаунт'}</button>
      <button onclick="closeMenuThen(()=>openStudParent('${s.id}'))">👨‍👩‍👧 Добавить родителя</button>
      ${isOwner?`<button onclick="closeMenuThen(()=>openStudTutor('${s.id}'))">👨‍🏫 Добавить преподавателя</button>`:''}
      <hr>
      <button class="danger" onclick="closeMenuThen(()=>delStud('${s.id}'))">🗑 Удалить</button>
    </div>
  </div>
</div>`}
  h+='</div>';m.innerHTML=h}

// ─── USERS ─────────────────────────────────────────────────────────────────
function renderUsers(){
  const m=document.getElementById('main');
  let h=`<div class="sec-header">
    <button class="back-btn" onclick="goHome()">← Главная</button>
    <span class="sec-title">👤 Пользователи</span>
    <div class="sec-header-actions"><button class="btn btn-p" onclick="openM('mUser')">+ Пользователь</button></div>
  </div>`;
  const rl={owner:'rb-owner',tutor:'rb-tutor',student:'rb-student',parent:'rb-parent'};
  const rn={owner:'👑 Владелец',tutor:'👨‍🏫 Преподаватель',student:'🎓 Ученик',parent:'👨‍👩‍👧 Родитель'};
  for(const u of users){
    const canDel=isOwner&&u.role!=='owner';
    const subjTags=u.subject_ids&&u.subject_ids.length
      ?u.subject_ids.map(sid=>{const s=subjects.find(x=>x.id===sid);return s?`<span class="subj-tag">${s.icon} ${s.name}</span>`:''}).join('')
      :'';
    let studentInfo='';
    if(u.role==='student'){
      const st=students.find(x=>x.id===u.student_id);
      studentInfo=st
        ?`<span style="font-size:.78em;color:var(--green-t)">🎓 ${esc(st.name)}</span>`
        :`<span style="font-size:.78em;color:#f87171">⚠ Профиль не привязан</span>`;}
    h+=`<div class="user-row">
  <div class="user-row-info">
    <div class="user-row-name">${u.name}</div>
    <div class="user-row-meta"><span class="role-badge ${rl[u.role]||''}">${rn[u.role]||u.role}</span> · ${u.login}</div>
    ${subjTags?`<div class="subj-tags">${subjTags}</div>`:''}
    ${studentInfo?`<div style="margin-top:2px">${studentInfo}</div>`:''}
  </div>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
    <a class="btn btn-s btn-sm" href="/profile.html?uid=${u.id}" title="Профиль пользователя">👤</a>
    ${u.role==='tutor'&&isOwner?`<button class="btn btn-s btn-sm" onclick="openTutorSubjects('${u.id}','${u.name}')">📐 Предметы</button>`:''}
    ${u.role==='student'?`<button class="btn btn-s btn-sm" onclick="openLinkStudent('${u.id}','${esc(u.name)}','${u.student_id||''}')">🔗 ${u.student_id?'Сменить':'Привязать'}</button>`:''}
    ${u.role==='student'&&u.student_id?`<button class="btn btn-s btn-sm" onclick="unlinkStudent('${u.id}','${esc(u.name)}')" title="Отвязать профиль">✂</button>`:''}
    ${canDel?`<button class="btn btn-d btn-sm" onclick="delUser('${u.id}')">✕</button>`:''}
  </div>
</div>`}
  m.innerHTML=h}

// ─── DROPDOWN MENUS ───────────────────────────────────────────────────────
function toggleMenu(stid){
  const dd=document.getElementById('dd_'+stid);
  const wasOpen=dd.classList.contains('open');
  document.querySelectorAll('.dot-dd.open').forEach(el=>el.classList.remove('open'));
  if(!wasOpen){dd.classList.add('open');setTimeout(()=>document.addEventListener('click',closeAllMenus,{once:true}),0)}}
function closeAllMenus(){document.querySelectorAll('.dot-dd.open').forEach(el=>el.classList.remove('open'))}
function closeMenuThen(fn){closeAllMenus();fn()}

let editStudId=null;
function openAddStudent(){
  editStudId=null;
  document.getElementById('mStudentTitle').textContent='Новый ученик';
  document.getElementById('sName').value='';
  document.getElementById('sGrade').value='9';
  document.getElementById('sGoal').value='ege';
  document.getElementById('sRate').value='1500';
  document.getElementById('sFormat').value='online';
  fillSubjSelect('sSubject');
  openM('mStudent')}
function editStud(stid){
  const s=students.find(x=>x.id===stid); if(!s) return;
  editStudId=stid;
  document.getElementById('mStudentTitle').textContent='Редактировать ученика';
  document.getElementById('sName').value=s.name;
  document.getElementById('sGrade').value=s.grade;
  document.getElementById('sGoal').value=s.goal;
  document.getElementById('sRate').value=s.base_rate;
  document.getElementById('sFormat').value=s.format;
  fillSubjSelect('sSubject');
  setTimeout(()=>document.getElementById('sSubject').value=s.subject_id||'',50);
  openM('mStudent')}
async function saveStudent(){
  try{
    const d={name:document.getElementById('sName').value,grade:document.getElementById('sGrade').value,
      goal:document.getElementById('sGoal').value,base_rate:+document.getElementById('sRate').value,
      format:document.getElementById('sFormat').value,subject_id:document.getElementById('sSubject').value||null};
    if(editStudId) await patch('/api/students/'+editStudId,d);
    else await post('/api/students',d);
    closeM('mStudent');await load();
  }catch(e){alert(e.detail||'Ошибка')}}

let acctStudId=null;
function openStudAccount(stid){
  acctStudId=stid;
  document.getElementById('acLogin').value='';
  document.getElementById('acPw').value='hbm1234';
  openM('mStudAccount')}
async function saveStudAccount(){
  if(!acctStudId) return;
  try{
    const s=students.find(x=>x.id===acctStudId);
    await post('/api/users',{role:'student',name:s?s.name:'Ученик',
      login:document.getElementById('acLogin').value,password:document.getElementById('acPw').value,student_id:acctStudId});
    closeM('mStudAccount');await load();

let parentStudId=null,parentTab='new';
function openStudParent(stid){
  parentStudId=stid;switchParentTab('new');
  document.getElementById('pName').value='';document.getElementById('pLogin').value='';document.getElementById('pPw').value='hbm1234';
  const parents=users.filter(u=>u.role==='parent');
  document.getElementById('pExistUser').innerHTML=parents.map(p=>`<option value="${p.id}">${p.name} (${p.login})</option>`).join('');
  openM('mStudParent')}
function switchParentTab(t){
  parentTab=t;
  document.getElementById('pPanelNew').style.display=t==='new'?'':'none';
  document.getElementById('pPanelExist').style.display=t==='exist'?'':'none';
  document.getElementById('pTabNew').className=t==='new'?'active':'';
  document.getElementById('pTabExist').className=t==='exist'?'active':''}
async function saveStudParent(){
  if(!parentStudId) return;
  try{
    if(parentTab==='new'){
      await post('/api/users',{role:'parent',name:document.getElementById('pName').value,
        login:document.getElementById('pLogin').value,password:document.getElementById('pPw').value,children_ids:[parentStudId]});
    }else{
      const uid=document.getElementById('pExistUser').value;
      if(!uid){alert('Выберите родителя');return}
      await post('/api/students/'+parentStudId+'/link-parent/'+uid,{});
    }
    closeM('mStudParent');await load();
  }catch(e){alert(e.detail||'Ошибка')}}

let tutorStudId=null;
function openStudTutor(stid){
  tutorStudId=stid;
  const tutors=users.filter(u=>u.role==='tutor');
  document.getElementById('tTutor').innerHTML=tutors.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
  updateTutorSubjects();
  openM('mStudTutor')}
async function updateTutorSubjects(){
  const tid=document.getElementById('tTutor').value;
  if(!tid){document.getElementById('tutorSubjWrap').style.display='none';return}
  const t=users.find(u=>u.id===tid);
  const sids=t?t.subject_ids:[];
  const opts=sids.map(sid=>{const s=subjects.find(x=>x.id===sid);return s?`<option value="${s.id}">${s.icon} ${s.name}</option>`:''}).join('');
  document.getElementById('tSubject').innerHTML='<option value="">— без предмета —</option>'+opts;
  document.getElementById('tutorSubjWrap').style.display=sids.length?'':'none'}
async function saveStudTutor(){
  if(!tutorStudId) return;
  const tid=document.getElementById('tTutor').value;
  if(!tid){alert('Нет преподавателей');return}
  try{await post('/api/students/'+tutorStudId+'/assign-tutor/'+tid,{});closeM('mStudTutor');await load();}
  catch(e){alert(e.detail||'Ошибка')}}

async function delStud(stid){
  const s=students.find(x=>x.id===stid);
  if(!confirm(`Удалить ученика «${s?s.name:stid}»?`)) return;
  try{await del('/api/students/'+stid);await load();}catch(e){alert(e.detail||'Ошибка')}}

// ─── TUTOR SUBJECTS ────────────────────────────────────────────────────────
let tutorSubjEditId=null;
function openTutorSubjects(uid,name){
  tutorSubjEditId=uid;
  document.getElementById('mTutorSubjectsName').textContent=name;
  const t=users.find(u=>u.id===uid);
  const activeSids=new Set(t?t.subject_ids:[]);
  document.getElementById('tSubjectsList').innerHTML=subjects.map(s=>`
    <label class="subj-chk">
      <input type="checkbox" value="${s.id}" ${activeSids.has(s.id)?'checked':''}>
      <span>${s.icon} ${s.name}</span>
    </label>`).join('');
  openM('mTutorSubjects')}
async function saveTutorSubjects(){
  if(!tutorSubjEditId) return;
  const t=users.find(u=>u.id===tutorSubjEditId);
  const prev=new Set(t?t.subject_ids:[]);
  const now=new Set([...document.querySelectorAll('#tSubjectsList input:checked')].map(el=>el.value));
  const toAdd=[...now].filter(id=>!prev.has(id));
  const toDel=[...prev].filter(id=>!now.has(id));
  try{
    await Promise.all([
      ...toAdd.map(sid=>post('/api/users/'+tutorSubjEditId+'/subjects/'+sid,{})),
      ...toDel.map(sid=>del('/api/users/'+tutorSubjEditId+'/subjects/'+sid))
    ]);
    closeM('mTutorSubjects');await load();
  }catch(e){alert(e.detail||'Ошибка')}}

function fillSubjSelect(id){
  const s=document.getElementById(id);

  document.getElementById('uSubjectsList').innerHTML=subjects.map(s=>`

function fillChildrenSelect(){
  document.getElementById('uChildren').innerHTML=students.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}
function buildRoleOptions(){
  const sel=document.getElementById('uRole');
  const opts=isOwner?[['tutor','👨‍🏫 Преподаватель'],['student','🎓 Ученик'],['parent','👨‍👩‍👧 Родитель']]:[['student','🎓 Ученик'],['parent','👨‍👩‍👧 Родитель']];
  sel.innerHTML=opts.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}
function onRoleChange(){
  const r=document.getElementById('uRole').value;
  document.getElementById('uTutorFields').style.display=r==='tutor'?'':'none';
  document.getElementById('uStudentFields').style.display=r==='student'?'':'none';

async function saveUser(){
  try{
    const r=document.getElementById('uRole').value;
    const d={role:r,name:document.getElementById('uName').value,login:document.getElementById('uLogin').value,password:document.getElementById('uPw').value};
    if(r==='tutor'){
      const sids=[...document.querySelectorAll('#uSubjectsList input:checked')].map(el=>el.value);
      d.subject_ids=sids; if(sids.length) d.subject_id=sids[0];}
    if(r==='student')d.student_id=document.getElementById('uStudent').value||null;
    if(r==='parent'){const sel=document.getElementById('uChildren');d.children_ids=[...sel.selectedOptions].map(o=>o.value);}
    await post('/api/users',d);closeM('mUser');await load();
  }catch(e){alert(e.detail||'Ошибка')}}

// ─── CONTACTS ─────────────────────────────────────────────────────────────
let contacts=[];
async function loadContacts(){
  contacts=await get('/api/contacts').catch(()=>[]);
  if(curSection==='contacts') renderContacts()}

function onlineLabel(last_seen){
  if(!last_seen) return '<span style="color:var(--muted);font-size:.78em">не был в сети</span>';
  const diff=Date.now()-new Date(last_seen).getTime();
  const mins=Math.floor(diff/60000);
  if(mins<2) return '<span style="color:#3fb950;font-size:.78em">● онлайн</span>';
  if(mins<60) return `<span style="color:var(--muted);font-size:.78em">был(а) ${mins} мин назад</span>`;
  const hrs=Math.floor(mins/60);
  if(hrs<24) return `<span style="color:var(--muted);font-size:.78em">был(а) ${hrs} ч назад</span>`;
  const days=Math.floor(hrs/24);
  return `<span style="color:var(--muted);font-size:.78em">был(а) ${days} д назад</span>`}

function renderContacts(){
  const m=document.getElementById('main');
  let h=`<div class="sec-header">
    <button class="back-btn" onclick="goHome()">← Главная</button>
    <span class="sec-title">💬 Контакты</span>
  </div>`;
  if(!contacts.length){
    m.innerHTML=h+'<div class="empty">Нет доступных контактов</div>';return}
  const roleLabel={owner:'Владелец',tutor:'Преподаватель',student:'Ученик',parent:'Родитель'};
  h+='<div style="display:flex;flex-direction:column;gap:6px">';
  for(const c of contacts){
    h+=`<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px">
  <div style="width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1em;flex-shrink:0">${(c.name||'?')[0].toUpperCase()}</div>
  <div style="flex:1;min-width:0">
    <div style="font-weight:600;font-size:.92em"><a href="/profile.html?uid=${c.id}" style="color:var(--text);text-decoration:none" onmouseover="this.style.color='var(--green-t)'" onmouseout="this.style.color='var(--text)'">${esc(c.name)}</a></div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:2px">
      <span style="color:var(--muted);font-size:.78em">${roleLabel[c.role]||c.role}</span>
      ${onlineLabel(c.last_seen)}
    </div>
  </div>
  <button class="btn btn-p" style="padding:5px 12px;font-size:.82em" onclick="goToChat('${c.id}','${esc(c.name)}')">Написать</button>
</div>`;
  }
  h+='</div>';
  m.innerHTML=h}

function goToChat(uid,name){
  curSection='messages';
  chatUid=uid; chatName=name;
  get('/api/messages/'+uid).then(t=>{chatThread=t;renderChat(document.getElementById('main'));
    clearInterval(chatPollTimer);chatPollTimer=setInterval(refreshChat,5000)}).catch(()=>{})}

// ─── MESSAGES ─────────────────────────────────────────────────────────────
let convos=[],chatUid=null,chatThread=[],chatPollTimer=null,chatName='';
async function loadConvos(){
  clearInterval(chatPollTimer);chatPollTimer=null;
  convos=await get('/api/messages').catch(()=>[]);
  if(curSection==='messages') renderMessages()}
function renderMessages(){
  const m=document.getElementById('main');
  if(chatUid){renderChat(m);return}
  let h=`<div class="sec-header">
    <button class="back-btn" onclick="goHome()">← Главная</button>
    <span class="sec-title">💬 Сообщения</span>
  </div>`;
  if(!convos.length){m.innerHTML=h+'<div class="empty">Нет сообщений</div>';return}
  h+='<div style="display:flex;flex-direction:column;gap:6px">';
  for(const c of convos){
    const unr=c.unread>0?`<span style="background:#ef4444;color:#fff;font-size:.7em;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:auto">${c.unread}</span>`:'';
    h+=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px" onclick="openChat('${c.partner_id}','${esc(c.partner_name)}')">
  <div style="width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">${(c.partner_name||'?')[0].toUpperCase()}</div>
  <div style="flex:1;min-width:0">
    <div style="font-weight:600;font-size:.92em">${esc(c.partner_name)}</div>
    <div style="color:var(--muted);font-size:.82em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.last_text||'')}</div>
  </div>
  ${unr}
</div>`}
  h+='</div>';m.innerHTML=h}
async function openChat(uid,name){
  chatUid=uid;if(name)chatName=name;
  chatThread=await get('/api/messages/'+uid).catch(()=>[]);
  renderChat(document.getElementById('main'));
  clearInterval(chatPollTimer);
  chatPollTimer=setInterval(refreshChat,5000);}
async function refreshChat(){
  if(!chatUid) return;
  const msgs=await get('/api/messages/'+chatUid).catch(()=>[]);
  chatThread=msgs;
  const tb=document.getElementById('threadBox');
  if(!tb) return;
  const atBottom=tb.scrollHeight-tb.scrollTop-tb.clientHeight<60;
  tb.innerHTML=msgs.map(msg=>{
    const mine=msg.from_id!==chatUid;
    return`<div style="display:flex;justify-content:${mine?'flex-end':'flex-start'}">
  <div style="max-width:72%;padding:8px 12px;border-radius:12px;${mine?'background:var(--green);color:#fff':'background:var(--surface-2);color:var(--text)'};font-size:.88em">
    ${esc(msg.text)}
  </div>
</div>`}).join('');
  if(atBottom) tb.scrollTop=tb.scrollHeight;
  pollNotifs();}
function renderChat(m){
  const name=convos.find(c=>c.partner_id===chatUid)?.partner_name||chatName||chatUid;
  let h=`<div class="sec-header">
    <button class="back-btn" onclick="clearInterval(chatPollTimer);chatPollTimer=null;chatUid=null;loadConvos()">← Сообщения</button>
    <span class="sec-title">💬 ${esc(name)}</span>
  </div>
  <div id="threadBox" style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px;max-height:60vh;overflow-y:auto;padding:4px">`;
  for(const msg of chatThread){
    const mine=msg.from_id!==chatUid;
    h+=`<div style="display:flex;justify-content:${mine?'flex-end':'flex-start'}">
  <div style="max-width:72%;padding:8px 12px;border-radius:12px;${mine?'background:var(--green);color:#fff':'background:var(--surface-2);color:var(--text)'};font-size:.88em">
    ${esc(msg.text)}
  </div>
</div>`}
  h+=`</div>
  <div style="display:flex;gap:8px">
    <input id="msgIn" placeholder="Написать..." style="flex:1" onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="btn btn-p" onclick="sendMsg()">Отправить</button>
  </div>`;
  m.innerHTML=h;
  const tb=document.getElementById('threadBox');if(tb)tb.scrollTop=tb.scrollHeight}
async function sendMsg(){
  const inp=document.getElementById('msgIn');if(!inp||!inp.value.trim())return;
  try{await post('/api/messages',{to_id:chatUid,text:inp.value.trim()});inp.value='';
    await refreshChat();}catch(e){alert(e.detail||'Ошибка')}}
let notifPanelOpen=false;
let lastNotifsData=null;
function fmtNotifTime(iso){
  if(!iso) return '';
  const d=Date.now()-new Date(iso).getTime(),m=Math.floor(d/60000);
  if(m<2) return 'только что';if(m<60) return m+' мин назад';
  const h=Math.floor(m/60);if(h<24) return h+' ч назад';
  return new Date(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
async function pollNotifs(){
  try{
    const r=await get('/api/notifications');
    lastNotifsData=r;
    const n=r.unread||0;
    const b=document.getElementById('notifBadge');
    if(b){b.textContent=n>99?'99+':n;b.style.display=n>0?'':'none'}
    if(notifPanelOpen) renderNotifPanel(r);
  }catch(e){}
  setTimeout(pollNotifs,30000)}
function renderNotifPanel(r){
  const body=document.getElementById('notifPanelBody');
  if(!body) return;
  const msgs=r.unread_messages||0;
  const notifs=r.notifications||[];
  let h='';
  if(msgs>0) h+=`<div class="notif-msgs-row" onclick="closeNotifPanel();goSection('messages')">
    <span>💬 ${msgs} новых сообщений</span><span style="color:var(--green-t);font-size:.8em">Открыть →</span></div>`;
  if(!notifs.length&&!msgs){h='<div class="notif-empty">Нет уведомлений</div>';}
  else h+=notifs.map(n=>`<div class="notif-item${n.is_read?'':' unread'}" onclick="handleNotif('${n.id}','${n.link||''}')">
    <div class="notif-item-text">${esc(n.text)}</div>
    <div class="notif-item-time">${fmtNotifTime(n.created_at)}</div></div>`).join('');
  body.innerHTML=h}
function toggleNotifPanel(){
  notifPanelOpen=!notifPanelOpen;
  document.getElementById('notifPanel').classList.toggle('open',notifPanelOpen);
  if(notifPanelOpen){if(lastNotifsData) renderNotifPanel(lastNotifsData);pollNotifs();}}
function closeNotifPanel(){notifPanelOpen=false;document.getElementById('notifPanel').classList.remove('open')}
async function handleNotif(id,link){
  await post('/api/notifications/'+id+'/read',{}).catch(()=>{});
  if(link) location.href=link;
  pollNotifs();}
async function markAllNotifsRead(){
  await post('/api/notifications/read-all',{}).catch(()=>{});
  pollNotifs();}
document.addEventListener('click',e=>{
  const panel=document.getElementById('notifPanel');
  const btn=e.target.closest('.notif-btn');
  if(!btn&&panel&&!panel.contains(e.target)){closeNotifPanel();}});

// ─── SCHEDULE ─────────────────────────────────────────────────────────────
let schedSlots=[];
let schedEditDay=null,schedEditSlot=null,schedEditId=null;

const DAYS_FULL=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const DAYS_S=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const S_COLORS=['#1f6feb','#3fb950','#f97316','#a78bfa','#ec4899','#14b8a6','#eab308','#ef4444'];
const SCHED_VIS_START=20; // 10:00
const SCHED_VIS_END=41;   // 20:30

function slotTime(i){const h=Math.floor(i/2),m=i%2?'30':'00';return String(h).padStart(2,'0')+':'+m}
function stColor(stid){
  if(!stid) return '#30363d';
  const idx=students.findIndex(s=>s.id===stid);
  return S_COLORS[idx>=0?idx%S_COLORS.length:0]}

async function loadSchedule(){
  schedSlots=await get('/api/schedule').catch(()=>[]);
  if(curSection==='schedule') renderSchedule()}

// Глобальные переменные для drag-выделения
let _sdDay=null,_sdStart=null,_sdEnd=null,_sdDragging=false,_sdMoved=false;
document.addEventListener('mouseup',function(){
  if(!_sdDragging) return;
  _sdDragging=false;
  const tbl=document.getElementById('schedTable');
  if(tbl) tbl.querySelectorAll('.sched-drag-sel').forEach(c=>c.classList.remove('sched-drag-sel'));
  if(_sdDay!==null){
    const lo=Math.min(_sdStart,_sdEnd),hi=Math.max(_sdStart,_sdEnd);
    const dur=_sdMoved?(hi-lo+1):2;
    openSchedAdd(_sdDay,lo,dur);
  }
  _sdDay=null;_sdStart=null;_sdEnd=null;_sdMoved=false;
});

function expandSched(which){
  const m=document.getElementById('main');
  if(which==='top'){
    m.querySelectorAll('.sched-row-hidden-top').forEach(r=>r.style.display='');
    const sh=m.querySelector('.sched-shutter-top');if(sh)sh.style.display='none';
  } else {
    m.querySelectorAll('.sched-row-hidden-bot').forEach(r=>r.style.display='');
    const sh=m.querySelector('.sched-shutter-bot');if(sh)sh.style.display='none';
  }}

function renderSchedule(){
  const m=document.getElementById('main');
  const todayDow=(new Date().getDay()+6)%7;
  const slotMap={};
  for(const s of schedSlots) slotMap[s.day_of_week+'_'+s.slot_index]=s;
  // Ячейки, перекрытые многослотовыми занятиями (не стартовые)
  const skipSet=new Set();
  for(const s of schedSlots){
    for(let k=1;k<(s.duration||1);k++) skipSet.add(s.day_of_week+'_'+(s.slot_index+k));}

  let h=`<div class="sec-header">
    <button class="back-btn" onclick="goHome()">← Главная</button>
    <span class="sec-title">📅 Расписание</span>
    <div class="sec-header-actions">
      <span class="sched-today-badge">${DAYS_FULL[todayDow]}</span>
    </div>
  </div>
  <p style="color:var(--muted);font-size:.82em;margin-bottom:10px">Нажмите на ячейку или потяните мышью, чтобы добавить занятие. Клик по занятию — открыть доску.</p>
  <div class="sched-outer" id="schedOuter"><table class="sched-table" id="schedTable">
  <thead><tr><th class="tc">Время</th>`;
  for(let d=0;d<7;d++){
    const isTod=d===todayDow;
    h+=`<th style="${isTod?'color:var(--green-t)':''}">${DAYS_S[d]}${isTod?' ●':''}</th>`}
  h+=`</tr></thead><tbody>`;

  // Верхняя шторка
  h+=`<tr class="sched-shutter-top"><td colspan="8" class="sched-expand-row">
    <button class="sched-expand-btn" onclick="expandSched('top')">▲ Раньше (00:00 – 09:30)</button>
  </td></tr>`;

  for(let i=0;i<48;i++){
    // Нижняя шторка перед слотом 42
    if(i===SCHED_VIS_END+1){
      h+=`<tr class="sched-shutter-bot"><td colspan="8" class="sched-expand-row">
        <button class="sched-expand-btn" onclick="expandSched('bot')">▼ Позже (21:00 – 23:30)</button>
      </td></tr>`;}

    const isHidTop=i<SCHED_VIS_START;
    const isHidBot=i>SCHED_VIS_END;
    const rowCls=isHidTop?'sched-row-hidden-top':(isHidBot?'sched-row-hidden-bot':'');
    const rowStyle=rowCls?' style="display:none"':'';
    const isHour=i%2===0;

    h+=`<tr class="${rowCls}"${rowStyle}>`;
    h+=`<td class="sched-time${isHour?' h':''}">${slotTime(i)}</td>`;
    for(let d=0;d<7;d++){
      if(skipSet.has(d+'_'+i)) continue;
      const isTod=d===todayDow;
      const slot=slotMap[d+'_'+i];
      const bg=isTod&&!slot?'background:#0f1f12;':'';
      const dur=slot?(slot.duration||1):1;
      const rsAttr=dur>1?` rowspan="${dur}"`:'';
      if(slot){
        const col=slot.color||stColor(slot.student_id);
        const colBg=col+'28';
        const sid=slot.student_id||'';
        h+=`<td class="sched-cell" data-day="${d}" data-slot="${i}" data-has-slot="1"${rsAttr} style="${bg}background:${colBg}">
          <div class="sched-chip" style="background:${col};color:#fff" onclick="event.stopPropagation();if('${sid}')window.location.href='/board.html?id=${sid}'">
            <div class="sched-chip-name">${esc(slot.student_name||'?')}</div>
            ${slot.note?`<div class="sched-chip-note">${esc(slot.note)}</div>`:''}
          </div>
          <button class="sched-edit-btn" onclick="event.stopPropagation();openSchedEdit(${d},${i})">✏</button>
        </td>`;
      } else {
        h+=`<td class="sched-cell" data-day="${d}" data-slot="${i}" style="${bg}"></td>`}
    }
    h+=`</tr>`}
  h+=`</tbody></table></div>`;
  m.innerHTML=h;

  // Drag-выделение через event delegation
  const tbl=document.getElementById('schedTable');
  tbl.addEventListener('mousedown',e=>{
    const cell=e.target.closest('.sched-cell[data-day]');
    if(!cell||cell.dataset.hasSlot) return;
    e.preventDefault();
    _sdDay=+cell.dataset.day; _sdStart=+cell.dataset.slot; _sdEnd=_sdStart;
    _sdDragging=true; _sdMoved=false;
    _sdHighlight(tbl);
  });
  tbl.addEventListener('mouseover',e=>{
    if(!_sdDragging) return;
    const cell=e.target.closest('.sched-cell[data-day]');
    if(!cell||+cell.dataset.day!==_sdDay||cell.dataset.hasSlot) return;
    const ns=+cell.dataset.slot;
    if(ns!==_sdEnd){_sdMoved=true; _sdEnd=ns; _sdHighlight(tbl);}
  });}

function _sdHighlight(tbl){
  tbl.querySelectorAll('.sched-drag-sel').forEach(c=>c.classList.remove('sched-drag-sel'));
  if(_sdDay===null) return;
  const lo=Math.min(_sdStart,_sdEnd),hi=Math.max(_sdStart,_sdEnd);
  tbl.querySelectorAll('.sched-cell[data-day]').forEach(c=>{
    if(+c.dataset.day===_sdDay&&+c.dataset.slot>=lo&&+c.dataset.slot<=hi&&!c.dataset.hasSlot)
      c.classList.add('sched-drag-sel');
  });}

function openSchedAdd(day,slotIdx,dur=2){
  schedEditDay=day; schedEditSlot=slotIdx; schedEditId=null;
  document.getElementById('mSchedTitle').textContent='Добавить занятие';
  const endTime=dur>1?' – '+slotTime(slotIdx+dur):'';
  document.getElementById('mSchedDay').textContent=DAYS_FULL[day]+' · '+slotTime(slotIdx)+endTime;
  document.getElementById('schedNote').value='';
  document.getElementById('schedDelBtn').style.display='none';
  document.getElementById('schedDuration').value=String(Math.min(Math.max(dur,1),8));
  const sel=document.getElementById('schedStudent');
  sel.innerHTML='<option value="">— выберите ученика —</option>'+
    students.map(s=>`<option value="${s.id}">${esc(s.name)} (${s.grade} кл.)</option>`).join('');
  openM('mSched')}

function openSchedEdit(day,slotIdx){
  const slot=schedSlots.find(s=>s.day_of_week===day&&s.slot_index===slotIdx);
  if(!slot){openSchedAdd(day,slotIdx);return}
  schedEditDay=day; schedEditSlot=slotIdx; schedEditId=slot.id;
  document.getElementById('mSchedTitle').textContent='Изменить занятие';
  document.getElementById('mSchedDay').textContent=DAYS_FULL[day]+' · '+slotTime(slotIdx);
  document.getElementById('schedNote').value=slot.note||'';
  document.getElementById('schedDuration').value=String(slot.duration||2);
  document.getElementById('schedDelBtn').style.display='';
  const sel=document.getElementById('schedStudent');
  sel.innerHTML='<option value="">— выберите ученика —</option>'+
    students.map(s=>`<option value="${s.id}"${s.id===slot.student_id?' selected':''}>${esc(s.name)} (${s.grade} кл.)</option>`).join('');
  openM('mSched')}

async function saveSchedSlot(){
  const stid=document.getElementById('schedStudent').value;
  const note=document.getElementById('schedNote').value.trim();
  const dur=parseInt(document.getElementById('schedDuration').value)||2;
  if(!stid){alert('Выберите ученика');return}
  try{
    await post('/api/schedule',{student_id:stid,day_of_week:schedEditDay,slot_index:schedEditSlot,duration:dur,note:note||null});
    closeM('mSched'); await loadSchedule();
  }catch(e){alert('Ошибка сохранения')}}

async function clearSchedSlot(){
  if(!schedEditId) return;
  if(!confirm('Удалить это занятие?')) return;
  try{
    await del('/api/schedule/'+schedEditId);
    closeM('mSched'); await loadSchedule();
  }catch(e){alert('Ошибка удаления')}}

// ─── LOAD ──────────────────────────────────────────────────────────────────
async function load(){
  [subjects,students,users]=await Promise.all([
    get('/api/subjects').catch(()=>[]),
    get('/api/students').catch(()=>[]),
    (isOwner||R==='tutor')?get('/api/users').catch(()=>[]):Promise.resolve([])]);
  render();
  // Handle ?chat=uid&name=name from profile page
  const _qp=new URLSearchParams(location.search);
  const _initChat=_qp.get('chat');
  if(_initChat){history.replaceState(null,'',location.pathname);goToChat(_initChat,_qp.get('name')||_initChat);}}

load();pollNotifs();loadContacts();
