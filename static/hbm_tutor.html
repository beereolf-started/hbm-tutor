<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HBM — Панель</title>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface-2:#21262d;--border:#30363d;
  --text:#e6edf3;--muted:#7d8590;--green:#1a7f37;--green-h:#2ea043;--green-t:#3fb950;
  --red:#b91c1c;--red-h:#c0392b;--blue:#1f6feb;--yellow:#9e6a03;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
a{color:var(--green-t);text-decoration:none}a:hover{text-decoration:underline}

/* TOP BAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-logo{font-weight:700;font-size:1.05em;color:var(--text);display:flex;align-items:center;gap:8px}
.topbar-logo svg{width:22px;height:22px;fill:none;stroke:var(--green-t)}
.topbar-r{display:flex;align-items:center;gap:12px}
.role-pill{padding:2px 10px;border-radius:20px;font-size:.75em;font-weight:600;background:#1f3a27;color:var(--green-t);border:1px solid #2d5a38}
.role-pill.owner{background:#2d1f5e;color:#a78bfa;border-color:#4c3a8a}
.topbar-name{color:var(--muted);font-size:.9em}
.link-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.88em;padding:4px 8px;border-radius:6px}
.link-btn:hover{background:var(--surface-2);color:var(--text)}
.notif-btn{position:relative;background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.1em;padding:4px 8px;border-radius:6px;line-height:1}
.notif-btn:hover{background:var(--surface-2);color:var(--text)}
.notif-badge{position:absolute;top:0;right:0;background:#ef4444;color:#fff;font-size:.6em;font-weight:700;padding:1px 4px;border-radius:10px;min-width:14px;text-align:center;display:none}
@keyframes bellshake{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-13deg)}45%{transform:rotate(10deg)}60%{transform:rotate(-7deg)}75%{transform:rotate(4deg)}}
.notif-btn.shake{animation:bellshake .7s ease-in-out}
.notif-panel{position:fixed;top:52px;right:12px;width:340px;max-height:480px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 30px #0008;z-index:100;display:none;flex-direction:column;overflow:hidden}
.notif-panel.open{display:flex}
.notif-panel-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:.88em;flex-shrink:0}
.notif-panel-body{overflow-y:auto;flex:1}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:var(--surface-2)}
.notif-item.unread{background:#1a2a1a}
.notif-item.unread:hover{background:#1f321f}
.notif-item-text{font-size:.85em;line-height:1.4}
.notif-item-time{font-size:.75em;color:var(--muted);margin-top:3px}
.notif-msgs-row{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:.85em;cursor:pointer}
.notif-msgs-row:hover{background:var(--surface-2)}
.notif-empty{padding:24px;text-align:center;color:var(--muted);font-size:.85em}

/* WRAP */
.wrap{max-width:1000px;margin:0 auto;padding:32px 24px}

/* DASHBOARD HOME */
.dash-header{margin-bottom:32px}
.dash-header h1{font-size:1.4em;font-weight:600;margin-bottom:4px}
.dash-header p{color:var(--muted);font-size:.9em}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:32px}
.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px 20px;cursor:pointer;transition:border-color .15s,transform .1s;text-decoration:none;display:block;color:var(--text)}
.dash-card:hover{border-color:var(--green-t);transform:translateY(-2px);text-decoration:none}
.dash-card:active{transform:translateY(0)}
.dc-icon{font-size:2.2em;margin-bottom:12px;line-height:1}
.dc-title{font-size:1.05em;font-weight:600;margin-bottom:4px}
.dc-count{font-size:1.8em;font-weight:700;color:var(--green-t);margin-bottom:6px;line-height:1}
.dc-desc{font-size:.82em;color:var(--muted)}

/* SECTION VIEW */
.sec-header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.back-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.88em;display:flex;align-items:center;gap:6px}
.back-btn:hover{border-color:var(--green-t);color:var(--green-t)}
.sec-title{font-size:1.2em;font-weight:600}
.sec-header-actions{margin-left:auto;display:flex;gap:8px}

/* BUTTONS */
.btn{padding:8px 18px;border:none;border-radius:8px;cursor:pointer;font-size:.88em;font-weight:600;transition:background .15s}
.btn-p{background:var(--green);color:#fff}.btn-p:hover{background:var(--green-h)}
.btn-s{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}.btn-s:hover{border-color:var(--green-t)}
.btn-d{background:var(--red);color:#fff}.btn-d:hover{background:var(--red-h)}
.btn-sm{padding:5px 12px;font-size:.82em}
.btn-xs{padding:3px 9px;font-size:.78em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}

/* CARDS GRID */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;position:relative;transition:border-color .15s}
.card:hover{border-color:#484f58}
.card h3{font-size:.95em;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.card .meta{color:var(--muted);font-size:.8em}
.card-body{cursor:pointer}

/* GOAL BADGES */
.goal{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72em;font-weight:600}
.goal-ege{background:#2d1f5e;color:#a78bfa}.goal-olymp{background:#3a2a00;color:#fbbf24}.goal-base{background:#0d2e1e;color:#34d399}

/* ACCT BADGE */
.acct-tag{font-size:.72em;padding:2px 7px;border-radius:20px;background:#0d2e1e;color:var(--green-t);border:1px solid #1a5e32}

/* DOT MENU */
.dot-menu{position:absolute;top:12px;right:12px}
.dot-btn{background:none;border:1px solid transparent;border-radius:6px;cursor:pointer;color:var(--muted);font-size:1.1em;width:30px;height:30px;display:flex;align-items:center;justify-content:center;line-height:1}
.dot-btn:hover{background:var(--surface-2);border-color:var(--border);color:var(--text)}
.dot-dd{display:none;position:absolute;right:0;top:34px;background:var(--surface);border:1px solid var(--border);border-radius:10px;min-width:190px;box-shadow:0 8px 24px #0008;z-index:20;overflow:hidden}
.dot-dd.open{display:block}
.dot-dd button{display:block;width:100%;text-align:left;padding:10px 16px;background:none;border:none;color:var(--text);font-size:.88em;cursor:pointer}
.dot-dd button:hover{background:var(--surface-2)}
.dot-dd button.danger{color:#f87171}
.dot-dd hr{border:none;border-top:1px solid var(--border);margin:4px 0}

/* USERS LIST */
.user-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.user-row-info{flex:1}
.user-row-name{font-size:.92em;font-weight:600;margin-bottom:2px}
.user-row-meta{font-size:.78em;color:var(--muted)}
.role-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72em;font-weight:600}
.rb-owner{background:#2d1f5e;color:#a78bfa}.rb-tutor{background:#0d2e3a;color:#38bdf8}
.rb-student{background:#0d2e1e;color:var(--green-t)}.rb-parent{background:#3a2200;color:#fb923c}
.rb-board-user{background:#1a2a1a;color:#3fb950}
.subj-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.subj-tag{font-size:.72em;padding:2px 7px;border-radius:20px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}

/* SUBJECTS LIST */
.subj-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.subj-row-icon{font-size:1.4em;width:36px;text-align:center}
.subj-row-name{font-size:.92em;font-weight:600;flex:1}

/* FORM */
input,select,textarea{padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--text);font-size:.9em;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
label{display:block;color:var(--muted);font-size:.82em;margin:10px 0 4px;font-weight:500}
.form-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.form-row>*{flex:1;min-width:100px}

/* MODALS */
.modal-bg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:200}
.modal-bg.show{display:flex}
.modal-overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:300}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;width:460px;max-width:94vw;max-height:86vh;overflow-y:auto}
.modal h2{font-size:1.1em;font-weight:600;margin-bottom:20px;color:var(--text)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-header h3{margin:0;font-size:1.05em;font-weight:600;color:var(--text)}
.modal-body{display:flex;flex-direction:column;gap:10px}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.3em;line-height:1;padding:3px 7px;border-radius:6px;transition:background .15s,color .15s;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--surface-2);color:var(--text)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.tab-bar{display:flex;gap:4px;margin-bottom:16px;background:var(--surface-2);padding:4px;border-radius:8px}
.tab-bar button{flex:1;padding:7px;border:none;border-radius:6px;background:none;color:var(--muted);cursor:pointer;font-size:.85em;font-weight:500}
.tab-bar button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px #0004}

/* MULTI-SELECT SUBJECTS */
.subj-multi{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:8px;background:var(--surface-2)}
.subj-chk{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px;border-radius:4px}
.subj-chk:hover{background:var(--surface)}
.subj-chk input[type=checkbox]{width:15px;height:15px;accent-color:var(--green-t);flex-shrink:0;cursor:pointer}
.subj-chk span{font-size:.88em}

.empty{text-align:center;color:var(--muted);padding:48px;font-size:.92em}

/* SCHEDULE */
.sched-outer{overflow:auto;border:1px solid var(--border);border-radius:10px;margin-top:4px;max-height:calc(100vh - 180px)}
.sched-table{border-collapse:collapse;width:100%;min-width:680px}
.sched-table thead th{background:var(--surface);padding:9px 6px;font-size:.78em;font-weight:600;color:var(--muted);text-align:center;border:1px solid var(--border);position:sticky;top:0;z-index:10;white-space:nowrap}
.sched-table thead th.tc{position:sticky;left:0;z-index:11;min-width:54px;background:var(--surface)}
.sched-time{background:var(--surface);position:sticky;left:0;z-index:5;padding:3px 8px;font-size:.72em;color:var(--muted);border:1px solid var(--border);text-align:right;white-space:nowrap;min-width:54px;width:54px;vertical-align:top;user-select:none;height:34px}
.sched-time.h{font-weight:700;color:var(--text)}
.sched-cell{border:1px solid var(--border);padding:2px 3px;height:34px;min-width:110px;cursor:pointer;vertical-align:top;transition:background .1s;position:relative;user-select:none}
.sched-cell:hover{background:var(--surface-2) !important}
.sched-cell.sched-drag-sel{background:#1f3a5f !important;outline:2px solid #3fb950}
.sched-chip{font-size:.7em;padding:3px 6px;border-radius:4px;line-height:1.35;overflow:hidden;height:100%;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.sched-chip:hover{filter:brightness(1.15)}
.sched-chip-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched-chip-note{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9em}
.sched-edit-btn{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.45);border:none;color:#fff;width:20px;height:20px;border-radius:3px;font-size:.65em;cursor:pointer;display:none;padding:0;line-height:20px;text-align:center;z-index:2}
.sched-cell:hover .sched-edit-btn{display:block}
.sched-controls{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sched-today-badge{font-size:.75em;padding:2px 8px;border-radius:20px;background:#0d2e1e;color:var(--green-t);border:1px solid #1a5e32;font-weight:600}
.sched-expand-row td{text-align:center;padding:6px}
.sched-expand-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 18px;font-size:.75em;cursor:pointer}
.sched-expand-btn:hover{background:var(--surface-2);color:var(--text)}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filter-bar input,.filter-bar select{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:5px 10px;font-size:.85em;min-width:140px}
.filter-bar input{flex:1;min-width:180px}
.sched-shutter-top td,.sched-shutter-bot td{background:var(--surface);border:1px solid var(--border)}
</style></head><body>

<div class="topbar">
  <div class="topbar-logo" onclick="goHome()" style="cursor:pointer;user-select:none" title="На главную">
    <svg viewBox="0 0 100 100" fill="none" stroke="#3fb950" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><line x1="16" y1="12" x2="16" y2="88"/><line x1="16" y1="50" x2="54" y2="50"/><line x1="54" y1="12" x2="88" y2="12"/><line x1="54" y1="12" x2="88" y2="50"/><line x1="88" y1="50" x2="54" y2="88"/><line x1="54" y1="88" x2="88" y2="88"/></svg>
    HBM
  </div>
  <div class="topbar-r">
    <span class="topbar-name" id="userName"></span>
    <span class="role-pill" id="userRole"></span>
    <a class="link-btn" href="/profile.html" title="Мой профиль">👤</a>
    <button class="notif-btn" onclick="toggleNotifPanel()" title="Уведомления">🔔<span class="notif-badge" id="notifBadge"></span></button>
    <button class="link-btn" onclick="logout()">Выйти</button>
  </div>
</div>

<div class="notif-panel" id="notifPanel">
  <div class="notif-panel-head">
    <span>🔔 Уведомления</span>
    <div style="display:flex;gap:8px">
      <button class="link-btn" style="font-size:.78em" onclick="markAllNotifsRead()">Прочитать все</button>
      <button class="link-btn" style="font-size:.78em" onclick="closeNotifPanel()">✕</button>
    </div>
  </div>
  <div class="notif-panel-body" id="notifPanelBody"><div class="notif-empty">Загрузка...</div></div>
</div>

<div class="wrap" id="main"></div>

<!-- Modal: Add/Edit Student -->
<div class="modal-bg" id="mStudent"><div class="modal">
<h2 id="mStudentTitle">Новый ученик</h2>
<label>Имя</label><input id="sName" placeholder="Имя ученика">
<div class="form-row">
  <div><label>Уровень</label><select id="sLevel" onchange="onLevelChange()">
    <option value="school">Школьник</option>
    <option value="university">Студент</option>
    <option value="additional">Доп. образование</option>
  </select></div>
  <div id="gradeWrap"><label>Класс</label><input id="sGrade" value="9" style="width:60px"></div>
</div>
<div class="form-row">
  <div><label>Цель</label><select id="sGoal">
    <option value="ege">ЕГЭ</option>
    <option value="oge">ОГЭ</option>
    <option value="olymp">Олимпиады</option>
    <option value="improve_grades">Улучшение оценок</option>
    <option value="deepening">Углубление материала</option>
    <option value="extra_education">Дополнительное образование</option>
  </select></div>
</div>
<div class="form-row">
  <div><label>Ставка (₽/ч)</label><input id="sRate" type="number" value="1500"></div>
  <div><label>Формат</label><select id="sFormat"><option value="online">Онлайн</option><option value="offline">Офлайн</option></select></div>
</div>
<label>Предмет <span style="color:var(--muted)">(необязательно)</span></label>
<select id="sSubject"></select>
<div class="modal-footer">
  <button class="btn btn-s" onclick="closeM('mStudent')">Отмена</button>
  <button class="btn btn-p" onclick="saveStudent()">Сохранить</button>
</div></div></div>

<!-- Modal: Student Account -->
<div class="modal-bg" id="mStudAccount"><div class="modal">
<h2>Аккаунт ученика</h2>
<p style="color:var(--muted);font-size:.85em;margin-bottom:12px">Создать учётную запись для входа в систему</p>
<label>Логин</label><input id="acLogin">
<label>Пароль</label><input id="acPw" value="hbm1234">
<div class="modal-footer">
  <button class="btn btn-s" onclick="closeM('mStudAccount')">Отмена</button>
  <button class="btn btn-p" onclick="saveStudAccount()">Создать</button>
</div></div></div>

<!-- Modal: Add Parent -->
<div class="modal-bg" id="mStudParent"><div class="modal">
<h2>Добавить родителя</h2>
<div class="tab-bar">
  <button id="pTabNew" class="active" onclick="switchParentTab('new')">Новый аккаунт</button>
  <button id="pTabExist" onclick="switchParentTab('exist')">Существующий</button>
</div>
<div id="pPanelNew">
  <label>Имя</label><input id="pName" placeholder="Имя родителя">
  <label>Логин</label><input id="pLogin">
  <label>Пароль</label><input id="pPw" value="hbm1234">
</div>
<div id="pPanelExist" style="display:none">
  <label>Пользователь с ролью «Родитель»</label>
  <select id="pExistUser" style="width:100%"></select>
</div>
<div class="modal-footer">
  <button class="btn btn-s" onclick="closeM('mStudParent')">Отмена</button>
  <button class="btn btn-p" onclick="saveStudParent()">Добавить</button>
</div></div></div>

<!-- Modal: Add Tutor to Student -->
<div class="modal-bg" id="mStudTutor"><div class="modal">
<h2>Добавить преподавателя</h2>
<label>Преподаватель</label>
<select id="tTutor" style="width:100%" onchange="updateTutorSubjects()"></select>
<div id="tutorSubjWrap" style="display:none">
  <label>Предмет (необязательно)</label>
  <select id="tSubject" style="width:100%"><option value="">— без предмета —</option></select>
</div>
<div class="modal-footer">
  <button class="btn btn-s" onclick="closeM('mStudTutor')">Отмена</button>
  <button class="btn btn-p" onclick="saveStudTutor()">Добавить</button>
</div></div></div>

<!-- Modal: Add User -->
<div class="modal-bg" id="mUser"><div class="modal">
<h2>Новый пользователь</h2>
<label>Роль</label><select id="uRole" onchange="onRoleChange()"></select>
<label>Имя</label><input id="uName">
<label>Логин</label><input id="uLogin">
<label>Пароль</label><input id="uPw" value="">
<div id="uTutorFields" style="display:none">
  <label>Предметы</label>
  <div class="subj-multi" id="uSubjectsList"></div>
</div>
<div id="uStudentFields" style="display:none"><label>Профиль ученика</label><select id="uStudent" style="width:100%"></select></div>
<div id="uParentFields" style="display:none"><label>Дети</label><select id="uChildren" multiple style="height:90px;width:100%"></select></div>
<div class="modal-footer">
  <button class="btn btn-s" onclick="closeM('mUser')">Отмена</button>
  <button class="btn btn-p" onclick="saveUser()">Создать</button>
</div></div></div>

<!-- Modal: Schedule Slot -->
<div class="modal-bg" id="mSched"><div class="modal" style="width:400px">
<h2 id="mSchedTitle">Занятие</h2>
<p id="mSchedDay" style="color:var(--muted);font-size:.85em;margin-bottom:16px"></p>
<label>Ученик</label>
<select id="schedStudent" style="width:100%"></select>
<label>Продолжительность</label>
<select id="schedDuration" style="width:100%">
  <option value="1">30 минут</option>
  <option value="2">1 час</option>
  <option value="3">1,5 часа</option>
  <option value="4">2 часа</option>
  <option value="5">2,5 часа</option>

<script>
if(!requireAuth(['owner','tutor','teamlead']))throw'';
const R=role(),isOwner=R==='owner',isTL=R==='teamlead';
const uname=localStorage.getItem('name');
document.getElementById('userName').textContent=uname;
const rp=document.getElementById('userRole');
rp.textContent=isOwner?'Владелец':isTL?'Тимлид':'Преподаватель';
if(isOwner) rp.classList.add('owner');
if(isTL) rp.style.cssText='background:#1f3350;color:#60a5fa;border-color:#2d5a8a';

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
let subjects=[],students=[],users=[];
function _djwt(t){try{return JSON.parse(atob(t.split('.')[1]))}catch{return{}}}
const myUserId=_djwt(localStorage.getItem('token')||'').sub||'';
let unreadMsgCount=0; // global unread messages count
let curSection=null; // null=home, 'students'|'users'|'subjects'

// ─── NAV ──────────────────────────────────────────────────────────────────
function goHome(){curSection=null;render()}
function goSection(s){
  curSection=s;
  if(s==='contacts'){loadContacts();loadConvos();}
  if(s==='schedule')loadSchedule();
  if(s==='finances')loadFinances();
  if(s==='team')loadTeam();
  render()}
function render(){
  if(curSection===null) renderHome();
  else if(curSection==='students') renderStudents();
  else if(curSection==='users') renderUsers();
  else if(curSection==='subjects') renderSubjects();
  else if(curSection==='messages') renderMessages();
  else if(curSection==='contacts') renderContacts();
  else if(curSection==='schedule') renderSchedule()
  else if(curSection==='finances') renderFinances()
  else if(curSection==='team') renderTeam()}

// ─── HOME ─────────────────────────────────────────────────────────────────
function renderHome(){
  const m=document.getElementById('main');
  const sections=[
    {key:'students',icon:'👥',title:'Ученики',count:students.length,desc:'Профили и успеваемость'},
    {key:'users',icon:'👤',title:'Пользователи',count:users.length,desc:'Аккаунты системы'},
    {key:'courses',icon:'📚',title:'Курсы',count:null,desc:'Учебные программы',href:'/courses.html'},
    {key:'contacts',icon:'💬',title:'Контакты',count:null,desc:'Написать ученику или родителю',badge:'contacts'},
    {key:'schedule',icon:'📅',title:'Расписание',count:null,desc:'Занятия по дням недели'},
    {key:'finances',icon:'💰',title:'Финансы',count:null,desc:isTL?'Доходы команды':isOwner?'Комиссия и учёт занятий':'Мои заработки'},
    {key:'workshop',icon:'🛠',title:'Мастерская',count:null,desc:'Мои личные доски',href:'/workshop.html'},
  ];
  if(isTL) sections.push({key:'team',icon:'👔',title:'Команда',count:null,desc:'Преподаватели и управление'});
  if(isOwner) sections.push({key:'subjects',icon:'📐',title:'Предметы',count:subjects.length,desc:'Учебные предметы'});
  let cards='';
  for(const s of sections){
    const el=s.href?'a':'div';
    const attr=s.href?`href="${s.href}"`:`onclick="goSection('${s.key}')"`;
    let cnt;
    if(s.count!==null) cnt=`<div class="dc-count">${s.count}</div>`;
    else if(s.badge==='contacts') cnt=`<div class="dc-count" style="position:relative">${unreadMsgCount>0?`<span id="contactsCardCount" style="background:#ef4444;color:#fff;font-size:.75em;font-weight:700;padding:1px 7px;border-radius:10px">${unreadMsgCount}</span>`:'<span id="contactsCardCount" style="display:none"></span><span style="font-size:.9em;color:var(--muted)">→</span>'}</div>`;
    else cnt='<div class="dc-count" style="font-size:.9em;color:var(--muted)">→</div>';
    cards+=`<${el} class="dash-card" ${attr}><div class="dc-icon">${s.icon}</div><div class="dc-title">${s.title}</div>${cnt}<div class="dc-desc">${s.desc}</div></${el}>`;
  }
  m.innerHTML=`<div class="dash-header"><h1>Добро пожаловать, ${uname}</h1><p>Выберите раздел для работы</p></div><div class="dash-grid">${cards}</div>`}


// ─── STUDENTS ─────────────────────────────────────────────────────────────
function renderStudents(studFilter){
  const m=document.getElementById('main');
  const sfQ=(studFilter!==undefined?studFilter:document.getElementById('studSearch')?.value)||'';
  const sfSubj=document.getElementById('studSubjFilter')?.value||'';
  const sfTutor=document.getElementById('studTutorFilter')?.value||'';
  const sfOwn=document.getElementById('studOwnFilter')?.checked||false;
  let h=`<div class="sec-header">
    <button class="back-btn" onclick="goHome()">← Главная</button>
    <span class="sec-title">👥 Ученики</span>
    <div class="sec-header-actions"><button class="btn btn-p" onclick="openAddStudent()">+ Ученик</button></div>
  </div>
  <div class="filter-bar">
    <input id="studSearch" placeholder="🔍 Поиск по имени..." value="${esc(sfQ)}" oninput="renderStudents()">
    ${isOwner?`<select id="studTutorFilter" onchange="renderStudents()"><option value="">Все преподаватели</option>${users.filter(u=>u.role==='tutor').map(u=>`<option value="${u.id}"${sfTutor===u.id?' selected':''}>${esc(u.name)}</option>`).join('')}</select>`:''}` +
    `${isOwner?`<select id="studSubjFilter" onchange="renderStudents()"><option value="">Все предметы</option>${subjects.map(x=>`<option value="${x.id}"${sfSubj===x.id?' selected':''}>${x.icon} ${esc(x.name)}</option>`).join('')}</select>`:''}
    ${isOwner?`<label style="display:flex;align-items:center;gap:5px;font-size:.85em;cursor:pointer"><input type="checkbox" id="studOwnFilter" ${sfOwn?'checked':''} onchange="renderStudents()"> Мои ученики</label>`:''}
  </div>`;
  if(!students.length){m.innerHTML=h+'<div class="empty">Нет учеников. Создайте первого!</div>';return}
  // Sort: own students first for owner
  let sorted=[...students];
  if(isOwner) sorted.sort((a,b)=>(b.created_by===myUserId?1:0)-(a.created_by===myUserId?1:0));
  // Filter
  const q=sfQ.toLowerCase();
  sorted=sorted.filter(s=>{
    if(q&&!s.name.toLowerCase().includes(q)) return false;
    if(sfSubj&&s.subject_id!==sfSubj) return false;
    if(sfTutor&&s.created_by!==sfTutor) return false;
    if(sfOwn&&s.created_by!==myUserId) return false;
    return true;
  });
  if(!sorted.length){m.innerHTML=h+'<div class="empty">Нет учеников по фильтру</div>';return}
  // Separator between own and others (owner only)
  let ownCount=isOwner?sorted.filter(s=>s.created_by===myUserId).length:sorted.length;
  h+='<div class="cards-grid">';
  let separatorShown=false;
  for(let i=0;i<sorted.length;i++){const s=sorted[i];
  if(isOwner&&!sfOwn&&i===ownCount&&ownCount>0&&ownCount<sorted.length){
    h+=`</div><div style="color:var(--muted);font-size:.78em;padding:8px 4px;margin-top:4px">Остальные ученики</div><div class="cards-grid">`;
  }
    const GOAL_LABEL={ege:'ЕГЭ',oge:'ОГЭ',olymp:'Олимпиады',improve_grades:'Улучшение оценок',deepening:'Углубление',extra_education:'Доп. образование'};
    const GOAL_CSS={ege:'goal-ege',oge:'goal-ege',olymp:'goal-olymp',improve_grades:'goal-base',deepening:'goal-base',extra_education:'goal-base'};
    const LEVEL_LABEL={school:'Школьник',university:'Студент',additional:'Доп. образование'};
    const gc=GOAL_CSS[s.goal]||'goal-base';
    const gl=GOAL_LABEL[s.goal]||s.goal;
    const lvl=LEVEL_LABEL[s.level||'school']||s.level;
    const gradeStr=s.level==='school'&&s.grade?s.grade+' кл · ':'';
    const subj=subjects.find(x=>x.id===s.subject_id);
    const hasAcct=users.some(u=>u.student_id===s.id);
    h+=`<div class="card" id="sc_${s.id}">
  <div class="card-body" onclick="location.href='/student.html?id=${s.id}'">
    <h3>${s.name}${hasAcct?` <span class="acct-tag">👤 Аккаунт</span>`:''}</h3>
    <div class="meta" style="margin-bottom:6px">
      ${gradeStr}<span style="opacity:.7">${lvl}</span> · <span class="goal ${gc}">${gl}</span> · ${s.base_rate} ₽/ч
      ${subj?'· '+subj.icon+' '+subj.name:''}
    </div>
    <a href="/board.html?id=${s.id}" onclick="event.stopPropagation()" style="font-size:.78em;color:var(--green-t);display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--surface-2);border-radius:6px;border:1px solid var(--border);text-decoration:none;margin-top:4px">🎨 Доска</a>
  </div>
  <div class="dot-menu" id="dm_${s.id}">
    <button class="dot-btn" onclick="event.stopPropagation();toggleMenu('${s.id}')">⋯</button>
    <div class="dot-dd" id="dd_${s.id}">
      <button onclick="closeMenuThen(()=>editStud('${s.id}'))">✏️ Редактировать</button>
      <button onclick="closeMenuThen(()=>openStudAccount('${s.id}'))">👤 ${hasAcct?'Изменить аккаунт':'Добавить аккаунт'}</button>
      <button onclick="closeMenuThen(()=>openStudParent('${s.id}'))">👨‍👩‍👧 Добавить родителя</button>
      ${isOwner?`<button onclick="closeMenuThen(()=>openStudTutor('${s.id}'))">👨‍🏫 Добавить преподавателя</button>`:''}
      <hr>
      <button class="danger" onclick="closeMenuThen(()=>delStud('${s.id}'))">🗑 Удалить</button>
    </div>
  </div>
</div>`}
  h+='</div>';m.innerHTML=h}

// ─── USERS ─────────────────────────────────────────────────────────────────
function renderUsers(){
  const m=document.getElementById('main');
  const uq=(document.getElementById('usrSearch')?.value||'').toLowerCase();
  const uroF=document.getElementById('usrRoleFilter')?.value||'';
  const usort=document.getElementById('usrSort')?.value||'name';
  let h=`<div class="sec-header">
    <button class="back-btn" onclick="goHome()">← Главная</button>
    <span class="sec-title">👤 Пользователи</span>
    <div class="sec-header-actions"><button class="btn btn-p" onclick="openM('mUser')">+ Пользователь</button></div>
  </div>
  <div class="filter-bar">
    <input id="usrSearch" placeholder="🔍 Имя, логин..." value="${uq}" oninput="renderUsers()">
    <select id="usrRoleFilter" onchange="renderUsers()">
      <option value="">Все роли</option>
      <option value="tutor"${uroF==='tutor'?' selected':''}>👨‍🏫 Преподаватели</option>
      <option value="student"${uroF==='student'?' selected':''}>🎓 Ученики</option>
      <option value="parent"${uroF==='parent'?' selected':''}>👨‍👩‍👧 Родители</option>
      <option value="board_user"${uroF==='board_user'?' selected':''}>🛠 Польз. доски</option>
    </select>
    <select id="usrSort" onchange="renderUsers()">
      <option value="name"${usort==='name'?' selected':''}>По имени</option>
      <option value="created"${usort==='created'?' selected':''}>По дате регистрации</option>
      <option value="online"${usort==='online'?' selected':''}>По активности</option>
      <option value="role"${usort==='role'?' selected':''}>По роли</option>
    </select>
  </div>`;
  const rl={owner:'rb-owner',tutor:'rb-tutor',student:'rb-student',parent:'rb-parent',board_user:'rb-board-user',teamlead:'rb-teamlead'};
  const rn={owner:'👑 Владелец',tutor:'👨‍🏫 Преподаватель',student:'🎓 Ученик',parent:'👨‍👩‍👧 Родитель',board_user:'🛠 Польз. доски',teamlead:'🏢 Тимлид'};
  const ROLE_ORD={owner:0,teamlead:1,tutor:2,student:3,parent:4,board_user:5};
  let filtUsers=users.filter(u=>{
    if(uq&&!u.name.toLowerCase().includes(uq)&&!u.login.toLowerCase().includes(uq)) return false;
    if(uroF&&u.role!==uroF) return false;
    return true;
  });
  if(usort==='created') filtUsers.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  else if(usort==='online') filtUsers.sort((a,b)=>new Date(b.last_seen||0)-new Date(a.last_seen||0));
  else if(usort==='role') filtUsers.sort((a,b)=>(ROLE_ORD[a.role]||9)-(ROLE_ORD[b.role]||9));
  else filtUsers.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  if(!filtUsers.length){m.innerHTML=h+'<div class="empty">Нет пользователей по фильтру</div>';return}
  function _userRow(u){
    const canDel=isOwner&&u.role!=='owner';
    const subjTags=u.subject_ids&&u.subject_ids.length
      ?u.subject_ids.map(sid=>{const s=subjects.find(x=>x.id===sid);return s?`<span class="subj-tag">${s.icon} ${s.name}</span>`:''}).join(''):'';
    let studentInfo='';
    if(u.role==='student'){
      const st=students.find(x=>x.id===u.student_id);
      studentInfo=st?`<span style="font-size:.78em;color:var(--green-t)">🎓 ${esc(st.name)}</span>`:`<span style="font-size:.78em;color:#f87171">⚠ Профиль не привязан</span>`;}
    const noCommBadge=u.role==='tutor'&&u.no_commission?`<span style="font-size:.72em;padding:1px 6px;border-radius:8px;background:#3fb95022;color:#3fb950;margin-left:4px">Без комиссии</span>`:'';
    return `<div class="user-row">
  <div class="user-row-info">
    <div class="user-row-name">${esc(u.name)}${noCommBadge}</div>
    <div class="user-row-meta"><span class="role-badge ${rl[u.role]||''}">${rn[u.role]||u.role}</span> · ${esc(u.login)}</div>
    ${subjTags?`<div class="subj-tags">${subjTags}</div>`:''}
    ${studentInfo?`<div style="margin-top:2px">${studentInfo}</div>`:''}
  </div>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
    <a class="btn btn-s btn-sm" href="/profile.html?uid=${u.id}" title="Профиль">👤</a>
    ${u.role==='tutor'&&isOwner?`<button class="btn btn-s btn-sm" onclick="openTutorSubjects('${u.id}','${esc(u.name)}')">📐</button>`:''}
    ${u.role==='student'?`<button class="btn btn-s btn-sm" onclick="openLinkStudent('${u.id}','${esc(u.name)}','${u.student_id||''}')">🔗 ${u.student_id?'Сменить':'Привязать'}</button>`:''}
    ${u.role==='student'&&u.student_id?`<button class="btn btn-s btn-sm" onclick="unlinkStudent('${u.id}','${esc(u.name)}')" title="Отвязать профиль">✂</button>`:''}
    ${canDel?`<button class="btn btn-d btn-sm" onclick="delUser('${u.id}')">✕</button>`:''}
  </div>
</div>`;}
  // Группировка: если фильтр по тьюторам — разделяем своих и командных
  if(uroF==='tutor'&&isOwner){
    const ownTutors=filtUsers.filter(u=>!u.teamlead_id);
    const invited=filtUsers.filter(u=>!!u.teamlead_id);
    const tlMap={};
    invited.forEach(u=>{if(!tlMap[u.teamlead_id])tlMap[u.teamlead_id]=[];tlMap[u.teamlead_id].push(u);});
    if(ownTutors.length){
      h+=`<div style="font-size:.8em;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px">Мои преподаватели</div>`;
      ownTutors.forEach(u=>{h+=_userRow(u);});}
    Object.entries(tlMap).forEach(([tlId,list])=>{
      const tl=users.find(u=>u.id===tlId);
      h+=`<div style="font-size:.8em;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px">Команда: ${esc(tl?tl.name:tlId)}</div>`;
      list.forEach(u=>{h+=_userRow(u);});});
    if(!ownTutors.length&&!invited.length) h+='<div class="empty">Нет преподавателей по фильтру</div>';
  } else {
    filtUsers.forEach(u=>{h+=_userRow(u);});}
  m.innerHTML=h}

// ─── DROPDOWN MENUS ───────────────────────────────────────────────────────
function toggleMenu(stid){
  const dd=document.getElementById('dd_'+stid);
  const wasOpen=dd.classList.contains('open');
  document.querySelectorAll('.dot-dd.open').forEach(el=>el.classList.remove('open'));
  if(!wasOpen){dd.classList.add('open');setTimeout(()=>document.addEventListener('click',closeAllMenus,{once:true}),0)}}
function closeAllMenus(){document.querySelectorAll('.dot-dd.open').forEach(el=>el.classList.remove('open'))}
function closeMenuThen(fn){closeAllMenus();fn()}

async function saveStudent(){
  try{
    const lv=document.getElementById('sLevel').value;
    const d={name:document.getElementById('sName').value,
      level:lv,
      grade:lv==='school'?(document.getElementById('sGrade').value||null):null,
      goal:document.getElementById('sGoal').value,base_rate:+document.getElementById('sRate').value,
      format:document.getElementById('sFormat').value,subject_id:document.getElementById('sSubject').value||null};
    if(editStudId) await patch('/api/students/'+editStudId,d);
    else await post('/api/students',d);
    closeM('mStudent');await load();
  }catch(e){alert(e.detail||'Ошибка')}}

    closeM('mStudAccount');await load();

let parentStudId=null,parentTab='new';
function openStudParent(stid){
  parentStudId=stid;switchParentTab('new');

function onlineLabel(last_seen){
  if(!last_seen) return '<span style="color:var(--muted);font-size:.78em">не был в сети</span>';
  const diff=Date.now()-new Date(last_seen).getTime();
  const mins=Math.floor(diff/60000);
  if(mins<2) return '<span style="color:#3fb950;font-size:.78em">● онлайн</span>';
  if(mins<60) return `<span style="color:var(--muted);font-size:.78em">был(а) ${mins} мин назад</span>`;
  const hrs=Math.floor(mins/60);
  if(hrs<24) return `<span style="color:var(--muted);font-size:.78em">был(а) ${hrs} ч назад</span>`;
  const days=Math.floor(hrs/24);
  return `<span style="color:var(--muted);font-size:.78em">был(а) ${days} д назад</span>`}

function _fmtFileSize(bytes){
  if(bytes<1024) return bytes+' Б';
  if(bytes<1048576) return (bytes/1024).toFixed(1)+' КБ';
  return (bytes/1048576).toFixed(1)+' МБ';}
function _renderFileBubble(j,mine){
  const align=mine?'flex-end':'flex-start';
  const bg=mine?'background:var(--green);color:#fff':'background:var(--surface-2);color:var(--text)';
  const url=esc(j.url);const name=esc(j.name||'файл');const sz=_fmtFileSize(j.size||0);
  if((j.mime||'').startsWith('image/')){
    return`<div style="display:flex;justify-content:${align}"><div style="max-width:72%;padding:6px;border-radius:12px;${bg}"><a href="${url}" target="_blank"><img src="${url}" style="max-width:240px;border-radius:8px;display:block"></a><div style="font-size:.75em;opacity:.8;margin-top:3px">${name} · ${sz}</div></div></div>`;}
  if((j.mime||'').startsWith('video/')){
    return`<div style="display:flex;justify-content:${align}"><div style="max-width:72%;padding:6px;border-radius:12px;${bg}"><video src="${url}" controls style="max-width:240px;border-radius:8px;display:block"></video><div style="font-size:.75em;opacity:.8;margin-top:3px">${name} · ${sz}</div></div></div>`;}
  return`<div style="display:flex;justify-content:${align}"><div style="max-width:72%;padding:8px 12px;border-radius:12px;${bg};font-size:.88em"><a href="${url}" target="_blank" style="color:inherit;text-decoration:none">📎 ${name}</a><div style="font-size:.75em;opacity:.8;margin-top:2px">${sz}</div></div></div>`;}

function _onGrpPhotoSelect(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.getElementById('grpPhotoCanvas');
      canvas.width=128;canvas.height=128;
      const ctx=canvas.getContext('2d');
      const s=Math.min(img.width,img.height);
      const ox=(img.width-s)/2,oy=(img.height-s)/2;
      ctx.drawImage(img,ox,oy,s,s,0,0,128,128);
      const data=canvas.toDataURL('image/jpeg',0.82);
      _groupInfo.photo=data;
      const av=document.getElementById('grpAvImg');
      if(av){av.outerHTML=`<img id="grpAvImg" src="${data}" style="width:88px;height:88px;border-radius:50%;object-fit:cover;cursor:pointer;border:3px solid var(--border)" onclick="document.getElementById('grpPhotoIn').click()">`;}
      patch('/api/groups/'+groupId,{photo:data}).catch(e=>alert(e.detail||'Ошибка'));
      const grp=groups.find(g=>g.id===groupId);if(grp)grp.photo=data;
    };img.src=ev.target.result;};
  reader.readAsDataURL(file);}

function fmtNotifTime(iso){
  if(!iso) return '';
  const d=Date.now()-new Date(iso).getTime(),m=Math.floor(d/60000);
  if(m<2) return 'только что';if(m<60) return m+' мин назад';
  const h=Math.floor(m/60);if(h<24) return h+' ч назад';
  return new Date(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
async function pollNotifs(){
  try{
    const r=await get('/api/notifications');
    lastNotifsData=r;
    const n=r.unread||0;
    unreadMsgCount=r.unread_messages||0;
    // Contacts card badge update
    const cc=document.getElementById('contactsCardCount');
    if(cc){cc.textContent=unreadMsgCount>0?unreadMsgCount:'';cc.style.display=unreadMsgCount>0?'':'none';}
    // Bell shake
    const btn=document.querySelector('.notif-btn');
    if(btn&&n>0){btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');setTimeout(()=>btn.classList.remove('shake'),800);}
    const b=document.getElementById('notifBadge');
    if(b){b.textContent=n>99?'99+':n;b.style.display=n>0?'':'none'}
    if(notifPanelOpen) renderNotifPanel(r);
  }catch(e){}
  setTimeout(pollNotifs,30000)}
function renderNotifPanel(r){
  const body=document.getElementById('notifPanelBody');
  if(!body) return;
  const msgs=r.unread_messages||0;
  const notifs=(r.notifications||[]).filter(n=>!n.is_read);
  let h='';
  if(msgs>0) h+=`<div class="notif-msgs-row" onclick="closeNotifPanel();goSection('messages')">
    <span>💬 ${msgs} новых сообщений</span><span style="color:var(--green-t);font-size:.8em">Открыть →</span></div>`;
  if(!notifs.length&&!msgs){h='<div class="notif-empty">Нет уведомлений</div>';}
  else h+=notifs.map(n=>`<div class="notif-item unread" onclick="handleNotif('${n.id}','${n.link||''}')">
    <div class="notif-item-text">${esc(n.text)}</div>
    <div class="notif-item-time">${fmtNotifTime(n.created_at)}</div></div>`).join('');
  body.innerHTML=h}

function showAddLesson(){
  const tutors=teamData||[];
  const tutorOpts=tutors.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  const modal=document.createElement('div');
  modal.className='modal-overlay';modal.id='mAddLesson';
  modal.onclick=e=>{if(e.target===modal)modal.remove()};
  modal.innerHTML=`<div class="modal" style="max-width:420px">
    <div class="modal-header"><h3>Добавить занятие</h3><button class="modal-close" onclick="document.getElementById('mAddLesson').remove()">✕</button></div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:10px">
      <select id="alTutor" style="padding:9px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--fg)" onchange="updateAlStudents()">
        <option value="">— преподаватель —</option>${tutorOpts}
      </select>
      <select id="alStudent" style="padding:9px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--fg)">
        <option value="">— сначала выберите преподавателя —</option>
      </select>
      <input type="datetime-local" id="alDate" value="${new Date().toISOString().slice(0,16)}" style="padding:9px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--fg)">
      <input type="number" id="alDur" value="60" placeholder="Длительность (мин)" style="padding:9px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--fg)">
      <input type="number" id="alRate" value="1500" placeholder="Ставка (₽)" style="padding:9px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--fg)">

function updateAlStudents(){
  const tid=document.getElementById('alTutor').value;
  const t=teamData.find(x=>x.id===tid);
  const sel=document.getElementById('alStudent');
  if(!t){sel.innerHTML='<option value="">— сначала выберите преподавателя —</option>';return;}
  sel.innerHTML='<option value="">— ученик —</option>'+
    t.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
}
async function doAddLesson(){
  const e=document.getElementById('alErr');e.style.display='none';
  const tid=document.getElementById('alTutor').value;
  const sid=document.getElementById('alStudent').value;
  const date=document.getElementById('alDate').value;
  const dur=parseInt(document.getElementById('alDur').value)||60;
  const rate=parseInt(document.getElementById('alRate').value)||1500;
  const note=document.getElementById('alNote').value.trim();
  if(!tid||!sid){e.textContent='Выберите преподавателя и ученика';e.style.display='block';return;}
  try{
    await post('/api/lessons',{tutor_id:tid,student_id:sid,held_at:date?new Date(date).toISOString():undefined,duration_min:dur,rate,note:note||undefined});
    const el=document.getElementById('mAddLesson');if(el)el.remove();loadFinances();
  }catch(x){e.textContent=x.detail||'Ошибка';e.style.display='block';}
}

function renderFinances(){
  const m=document.getElementById('main');
  if(isTL){renderTeamFinances(m);return;}
  if(isOwner){renderOwnerFinances(m);return;}
  if(R==='tutor'){renderTutorFinances(m);return;}
  m.innerHTML='<div class="empty">Финансы недоступны</div>';
}

function renderOwnerFinances(m){
  const stats=ownerStats;

  const defFrom=ownerDateFrom||(now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-01');
  const defTo=ownerDateTo||now.toISOString().slice(0,10);
  let h=`<div class="sec-header">
    <button class="back-btn" onclick="goHome()">← Главная</button>
    <span class="sec-title">💰 Финансы</span>

    <input type="date" value="${defFrom}" style="padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--fg);font-size:.88em" onchange="ownerDateFrom=this.value;loadFinances()">
    <input type="date" value="${defTo}" style="padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--fg);font-size:.88em" onchange="ownerDateTo=this.value;loadFinances()">

  const totalL=stats.total_lessons||0;const totalA=stats.total_amount||0;const totalC=stats.total_commission||0;
  h+=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center">
      <div style="font-size:1.6em;font-weight:700">${totalL}</div>
      <div style="font-size:.8em;color:var(--muted)">занятий</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center">
      <div style="font-size:1.6em;font-weight:700;color:var(--green-t)">${totalA.toLocaleString('ru')} ₽</div>
      <div style="font-size:.8em;color:var(--muted)">доход преп.</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center">
      <div style="font-size:1.6em;font-weight:700;color:#60a5fa">${totalC.toLocaleString('ru')} ₽</div>
      <div style="font-size:.8em;color:var(--muted)">моя комиссия</div>
    </div>
  </div>`;
  // Pie-style chart: horizontal bar per tutor
  const byT=stats.by_tutor||[];
  if(byT.length){
    const maxA=Math.max(...byT.map(t=>t.amount),1);
    const PIE_COLORS=['#3fb950','#60a5fa','#f59e0b','#f472b6','#a78bfa','#34d399','#fb923c','#e879f9'];
    h+=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px">
      <div style="font-weight:600;font-size:.88em;margin-bottom:12px">По преподавателям</div>`;
    byT.sort((a,b)=>b.amount-a.amount).forEach((t,i)=>{
      const col=PIE_COLORS[i%PIE_COLORS.length];
      const pct=Math.round(t.amount/maxA*100);
      const nc=t.no_commission?`<span style="font-size:.7em;padding:1px 5px;border-radius:6px;background:#3fb95022;color:#3fb950;margin-left:4px">Без ком.</span>`:'';
      h+=`<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:.82em;margin-bottom:3px">
          <span>${esc(t.name)}${nc}</span>
          <span style="color:var(--muted)">${t.lessons} зан. · ${t.amount.toLocaleString('ru')} ₽${t.commission?` · <span style="color:#60a5fa">ком. ${t.commission.toLocaleString('ru')} ₽</span>`:''}</span>
        </div>
        <div style="height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${col};border-radius:4px;transition:width .3s"></div>
        </div>

    h+=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px">
      <div style="font-weight:600;font-size:.88em;margin-bottom:10px">Моя комиссия по неделям</div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:80px">
        ${byW.map(w=>{const h2=Math.max(4,Math.round(w.commission/maxW*72));return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px" title="${w.week}: ${w.commission} ₽"><div style="width:100%;background:#60a5fa;border-radius:3px 3px 0 0;height:${h2}px"></div><div style="font-size:.6em;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg)">${w.week.slice(5)}</div></div>`;}).join('')}
      </div>
    </div>`;}
  // History table
  if(lessons.length){
    h+=`<div style="font-weight:600;font-size:.88em;color:var(--muted);margin-bottom:8px">История занятий</div>`;
    h+=`<div style="border:1px solid var(--border);border-radius:10px;overflow:hidden">
      <table style="width:100%;border-collapse:collapse;font-size:.82em">

          <th style="padding:8px 10px;text-align:right;color:var(--muted)">Доход</th>
          <th style="padding:8px 10px;text-align:right;color:var(--muted)">Ком.</th>
          <th style="padding:8px 10px"></th>
        </tr></thead><tbody>`;
    lessons.forEach(l=>{
      const tObj=stats.by_tutor.find(t=>t.id===l.tutor_id);
      const nc=tObj&&tObj.no_commission;
      const comm=nc?0:Math.round(l.amount*0.05);
      const dt=l.held_at?new Date(l.held_at).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';

        <td style="padding:7px 10px">${esc(l.tutor_name||'—')}</td>
        <td style="padding:7px 10px">${esc(l.student_name||'—')}</td>
        <td style="padding:7px 10px;text-align:right;color:var(--green-t)">${l.amount.toLocaleString('ru')} ₽</td>
        <td style="padding:7px 10px;text-align:right;color:#60a5fa">${comm?comm.toLocaleString('ru')+' ₽':'<span style="color:var(--muted)">—</span>'}</td>
        <td style="padding:7px 10px;text-align:right"><button onclick="delLesson('${l.id}')" style="background:none;border:none;color:#f87171;cursor:pointer;font-size:.9em" title="Удалить">✕</button></td>
      </tr>`;});
    h+=`</tbody></table></div>`;}
  else if(totalL===0) h+=`<div class="empty">Нет занятий за выбранный период</div>`;
  m.innerHTML=h;
}

      <div style="display:flex;align-items:flex-end;gap:4px;height:70px">

        </tr></thead><tbody>`;
    lessons.forEach(l=>{
      const dt=l.held_at?new Date(l.held_at).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';
      h+=`<tr style="border-top:1px solid var(--border)">
        <td style="padding:7px 10px;color:var(--muted)">${dt}</td>
        <td style="padding:7px 10px">${esc(l.student_name||'—')}</td>
        <td style="padding:7px 10px;text-align:right;color:var(--green-t)">${l.amount.toLocaleString('ru')} ₽</td>
        <td style="padding:7px 10px;text-align:right"><button onclick="delLesson('${l.id}')" style="background:none;border:none;color:#f87171;cursor:pointer;font-size:.9em" title="Удалить">✕</button></td>
      </tr>`;});
    h+=`</tbody></table></div>`;}
  else h+=`<div class="empty">Нет занятий за выбранный период</div>`;
  m.innerHTML=h;
}

function _finDeprecatedBills(){
  const STATUS={open:'Открыт',reported:'Оплата заявлена',closed:'Закрыт',archived:'В архиве'};
  const SC={open:'#1f6feb',reported:'#d29922',closed:'#1a7f37',archived:'#7d8590'};
  const finStatusF=document.getElementById('finStatusF')?.value||'active';
  const finSortF=document.getElementById('finSortF')?.value||'date';
  const finTutorQ=document.getElementById('finTutorF')?.value||'';
  const finStudentQ=document.getElementById('finStudentF')?.value||'';
  const finDateFrom=document.getElementById('finDateFrom')?.value||'';
  const finDateTo=document.getElementById('finDateTo')?.value||'';
  const finOverdue=document.getElementById('finOverdueF')?.value||'';
  let h=`<div class="sec-header">
    <button class="back-btn" onclick="goHome()">← Главная</button>
    <span class="sec-title">💰 Финансы</span>
  </div>
  <div class="filter-bar" style="flex-wrap:wrap;gap:6px">
    <select id="finStatusF" onchange="renderFinances()">
      <option value="active"${finStatusF==='active'?' selected':''}>Открытые</option>
      <option value="all"${finStatusF==='all'?' selected':''}>Все</option>
      <option value="reported"${finStatusF==='reported'?' selected':''}>Ожидают подтв.</option>
      <option value="closed"${finStatusF==='closed'?' selected':''}>Закрытые</option>
    </select>
    ${isOwner?(()=>{const tutors=[...new Set(finBills.map(b=>b.tutor_name||'').filter(Boolean))].sort();return`<select id="finTutorF" onchange="renderFinances()"><option value="">Все преподаватели</option>${tutors.map(t=>`<option value="${t}"${finTutorQ===t?' selected':''}>${esc(t)}</option>`).join('')}</select>`;})():''}` +
    `${(()=>{const students=[...new Set(finSessions.map(s=>s.student_name||'').filter(Boolean))].sort();return`<select id="finStudentF" onchange="renderFinances()"><option value="">Все ученики</option>${students.map(n=>`<option value="${n}"${finStudentQ===n?' selected':''}>${esc(n)}</option>`).join('')}</select>`;})()}
    <input type="date" id="finDateFrom" value="${finDateFrom}" onchange="renderFinances()" title="Дата от">
    <input type="date" id="finDateTo" value="${finDateTo}" onchange="renderFinances()" title="Дата до">
    <select id="finOverdueF" onchange="renderFinances()">
      <option value=""${finOverdue===''?' selected':''}>Любой срок</option>
      <option value="7"${finOverdue==='7'?' selected':''}>&gt;7 дн.</option>
      <option value="14"${finOverdue==='14'?' selected':''}>&gt;14 дн.</option>
      <option value="30"${finOverdue==='30'?' selected':''}>&gt;30 дн.</option>
    </select>
    <select id="finSortF" onchange="renderFinances()">
      <option value="date"${finSortF==='date'?' selected':''}>По дате</option>
      <option value="amount"${finSortF==='amount'?' selected':''}>По сумме</option>
      <option value="overdue"${finSortF==='overdue'?' selected':''}>По давности</option>
    </select>
  </div>`;
  const _filterBill=b=>{
    if(finStatusF==='active'&&b.status!=='open'&&b.status!=='reported') return false;
    if(finStatusF==='reported'&&b.status!=='reported') return false;
    if(finStatusF==='closed'&&b.status!=='closed'&&b.status!=='archived') return false;
    if(finTutorQ&&(b.tutor_name||'')!==finTutorQ) return false;
    if(finDateFrom&&new Date(b.created_at)<new Date(finDateFrom)) return false;
    if(finDateTo&&new Date(b.created_at)>new Date(finDateTo+'T23:59:59')) return false;
    if(finOverdue){const age=(Date.now()-new Date(b.created_at))/86400000;if(age<parseInt(finOverdue)) return false;}
    return true;
  };
  let shownBills=[...finBills].filter(_filterBill);
  if(finStudentQ) shownBills=shownBills.filter(b=>{
    const sess=finSessions.filter(s=>s.bill_id===b.id);
    return sess.some(s=>(s.student_name||'')===finStudentQ);
  });
  if(finSortF==='amount') shownBills.sort((a,b)=>b.total_commission-a.total_commission);
  else if(finSortF==='overdue') shownBills.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  else shownBills.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const openBills=finBills.filter(b=>b.status==='open'||b.status==='reported');
  const closedBills=finBills.filter(b=>b.status==='closed'||b.status==='archived');
  const totalOwed=openBills.reduce((s,b)=>s+b.total_commission,0);

  if(openBills.length){
    h+=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px">
      <div style="font-size:.85em;color:var(--muted);margin-bottom:4px">Итого к оплате комиссии</div>
      <div style="font-size:1.6em;font-weight:700;color:var(--green-t)">${totalOwed.toFixed(2)} ₽</div>
      <div style="font-size:.8em;color:var(--muted);margin-top:2px">5% от заработка ${openBills.reduce((s,b)=>s+b.total_lessons,0).toFixed(2)} ₽</div>
    </div>`;
  }

  if(isOwner) h+=`<div style="margin-bottom:10px"><button class="btn btn-p" style="font-size:.84em" onclick="ownerCreateBill()">+ Создать счёт</button></div>`;
  for(const b of shownBills){
    const sessions=finSessions.filter(s=>s.bill_id===b.id);
    const tutorLbl=isOwner&&b.tutor_name?` — ${esc(b.tutor_name)}`:''; 
    h+=`<div style="border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div>
          <span style="font-weight:600">Счёт от ${new Date(b.created_at).toLocaleDateString('ru-RU')}${tutorLbl}</span>
          <span style="margin-left:8px;font-size:.8em;padding:2px 8px;border-radius:10px;background:${SC[b.status]}22;color:${SC[b.status]}">${STATUS[b.status]}</span>
        </div>
        <div style="text-align:right">
          <div style="font-weight:700;color:var(--green-t)">${b.total_commission.toFixed(2)} ₽</div>
          <div style="font-size:.78em;color:var(--muted)">с ${b.total_lessons.toFixed(2)} ₽</div>
        </div>
      </div>
      <details><summary style="cursor:pointer;font-size:.83em;color:var(--muted)">Занятия (${sessions.length})</summary>
        <div style="margin-top:6px">${sessions.map(s=>{
          const dt=new Date(s.scheduled_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
          const dBtn=isOwner&&b.status==='open'?`<button onclick="ownerRemoveSession('${b.id}','${s.id}')" style="background:none;border:none;color:#f87171;cursor:pointer;padding:0 4px" title="Удалить">✕</button>`:'';
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:.82em;border-bottom:1px solid var(--border)"><span>${dt} · ${esc(s.student_name||'?')}</span><span style="display:flex;align-items:center;gap:2px"><span style="color:var(--green-t)">${(s.price||0).toFixed(2)} ₽</span>${dBtn}</span></div>`;
        }).join('')}</div>
      </details>
      ${b.owner_note?`<div style="font-size:.83em;color:var(--muted);margin-top:6px">📝 Владелец: ${esc(b.owner_note)}</div>`:''}
      ${b.status==='open'?`<div style="margin-top:10px">
        <button class="btn btn-p" style="width:100%" onclick="openReportBill('${b.id}')">💳 Сообщить об оплате</button>
      </div>`:''}
      ${b.status==='reported'?`<div style="margin-top:8px;font-size:.85em;color:var(--yellow)">⏳ Ожидаем подтверждения</div>`:''}
      ${isOwner?`<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
        ${b.status==='open'?`<button class="btn btn-s" style="font-size:.8em" onclick="ownerManageBill('${b.id}','close','')">✅ Закрыть</button><button class="btn btn-s" style="font-size:.8em" onclick="ownerAddSession('${b.id}')">+ Занятие</button>`:''}
        ${b.status==='reported'?`<button class="btn btn-p" style="font-size:.8em" onclick="ownerManageBill('${b.id}','close','')">✅ Подтвердить</button><button class="btn btn-s" style="font-size:.8em" onclick="ownerManageBill('${b.id}','reopen','')">↩ Переоткрыть</button>`:''}
        ${b.status==='closed'?`<button class="btn btn-s" style="font-size:.8em" onclick="ownerManageBill('${b.id}','archive','')">📦 В архив</button><button class="btn btn-s" style="font-size:.8em" onclick="ownerManageBill('${b.id}','reopen','')">↩ Переоткрыть</button>`:''}
      </div>`:''}
    </div>`;
  }

  if(!shownBills.length) h+=`<div style="color:var(--muted);padding:24px;text-align:center;font-size:.9em">Нет счетов по выбранному фильтру.</div>`;

  if(closedBills.length){
    h+=`<div style="font-weight:600;font-size:.88em;color:var(--muted);margin:16px 0 8px">История</div>`;
    for(const b of closedBills){
      h+=`<div style="border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">
        <div><span style="font-size:.85em;color:var(--muted)">${new Date(b.created_at).toLocaleDateString('ru-RU')}</span>
        <span style="margin-left:8px;font-size:.8em;padding:2px 8px;border-radius:10px;background:${SC[b.status]}22;color:${SC[b.status]}">${STATUS[b.status]}</span></div>
        <span style="font-weight:600">${b.total_commission.toFixed(2)} ₽</span>
      </div>`;
    }
  }

  // Modal for reporting payment
  h+=`<div id="mReportBill" class="modal" style="display:none"><div class="modal-box">
    <div class="modal-head"><span>💳 Сообщить об оплате</span><button onclick="closeM('mReportBill')">✕</button></div>
    <textarea id="reportBillNote" placeholder="Комментарий (способ оплаты, дата и т.д.)..." style="width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px;font-size:.88em;resize:vertical;min-height:80px;margin-bottom:12px"></textarea>
    <div style="display:flex;gap:8px">
      <button class="btn btn-p" style="flex:1" onclick="submitReportBill()">Отправить</button>
      <button class="btn btn-s" onclick="closeM('mReportBill')">Отмена</button>
    </div>
  </div></div>`;

  m.innerHTML=h;
}

// Глобальные переменные для drag-выделения
let _sdDay=null,_sdStart=null,_sdEnd=null,_sdDragging=false,_sdMoved=false;
document.addEventListener('mouseup',function(){
  if(!_sdDragging) return;
  _sdDragging=false;
  const tbl=document.getElementById('schedTable');
  if(tbl) tbl.querySelectorAll('.sched-drag-sel').forEach(c=>c.classList.remove('sched-drag-sel'));
  if(_sdDay!==null){
    const lo=Math.min(_sdStart,_sdEnd),hi=Math.max(_sdStart,_sdEnd);
    const dur=_sdMoved?(hi-lo+1):2;
    openSchedAdd(_sdDay,lo,dur);
  }
  _sdDay=null;_sdStart=null;_sdEnd=null;_sdMoved=false;
});

function expandSched(which){
  const m=document.getElementById('main');
  if(which==='top'){
    m.querySelectorAll('.sched-row-hidden-top').forEach(r=>r.style.display='');
    const sh=m.querySelector('.sched-shutter-top');if(sh)sh.style.display='none';
  } else {
    m.querySelectorAll('.sched-row-hidden-bot').forEach(r=>r.style.display='');
    const sh=m.querySelector('.sched-shutter-bot');if(sh)sh.style.display='none';
  }}

function renderSchedule(){
  const m=document.getElementById('main');
  const todayDow=(new Date().getDay()+6)%7;
  const slotMap={};
  for(const s of schedSlots) slotMap[s.day_of_week+'_'+s.slot_index]=s;
  // Ячейки, перекрытые многослотовыми занятиями (не стартовые)
  const skipSet=new Set();
  for(const s of schedSlots){
    for(let k=1;k<(s.duration||1);k++) skipSet.add(s.day_of_week+'_'+(s.slot_index+k));}

  let h=`<div class="sec-header">
    <button class="back-btn" onclick="goHome()">← Главная</button>
    <span class="sec-title">📅 Расписание</span>
    <div class="sec-header-actions">
      <span class="sched-today-badge">${DAYS_FULL[todayDow]}</span>
    </div>
  </div>
  <p style="color:var(--muted);font-size:.82em;margin-bottom:10px">Нажмите на ячейку или потяните мышью, чтобы добавить занятие. Клик по занятию — открыть доску.</p>
  <div class="sched-outer" id="schedOuter"><table class="sched-table" id="schedTable">
  <thead><tr><th class="tc">Время</th>`;
  for(let d=0;d<7;d++){
    const isTod=d===todayDow;
    h+=`<th style="${isTod?'color:var(--green-t)':''}">${DAYS_S[d]}${isTod?' ●':''}</th>`}
  h+=`</tr></thead><tbody>`;

  // Верхняя шторка
  h+=`<tr class="sched-shutter-top"><td colspan="8" class="sched-expand-row">
    <button class="sched-expand-btn" onclick="expandSched('top')">▲ Раньше (00:00 – 09:30)</button>
  </td></tr>`;

  for(let i=0;i<48;i++){
    // Нижняя шторка перед слотом 42
    if(i===SCHED_VIS_END+1){
      h+=`<tr class="sched-shutter-bot"><td colspan="8" class="sched-expand-row">
        <button class="sched-expand-btn" onclick="expandSched('bot')">▼ Позже (21:00 – 23:30)</button>
      </td></tr>`;}

    const isHidTop=i<SCHED_VIS_START;
    const isHidBot=i>SCHED_VIS_END;
    const rowCls=isHidTop?'sched-row-hidden-top':(isHidBot?'sched-row-hidden-bot':'');
    const rowStyle=rowCls?' style="display:none"':'';
    const isHour=i%2===0;

    h+=`<tr class="${rowCls}"${rowStyle}>`;
    h+=`<td class="sched-time${isHour?' h':''}">${slotTime(i)}</td>`;
    for(let d=0;d<7;d++){
      if(skipSet.has(d+'_'+i)) continue;
      const isTod=d===todayDow;
      const slot=slotMap[d+'_'+i];
      const bg=isTod&&!slot?'background:#0f1f12;':'';
      const dur=slot?(slot.duration||1):1;
      const rsAttr=dur>1?` rowspan="${dur}"`:'';
      if(slot){
        const col=slot.color||stColor(slot.student_id);
        const colBg=col+'28';
        const sid=slot.student_id||'';
        h+=`<td class="sched-cell" data-day="${d}" data-slot="${i}" data-has-slot="1"${rsAttr} style="${bg}background:${colBg}">
          <div class="sched-chip" style="background:${col};color:#fff" onclick="event.stopPropagation();if('${sid}')window.location.href='/board.html?id=${sid}'">
            <div class="sched-chip-name">${esc(slot.student_name||'?')}</div>
            ${slot.note?`<div class="sched-chip-note">${esc(slot.note)}</div>`:''}
          </div>
          <button class="sched-edit-btn" onclick="event.stopPropagation();openSchedEdit(${d},${i})">✏</button>
        </td>`;
      } else {
        h+=`<td class="sched-cell" data-day="${d}" data-slot="${i}" style="${bg}"></td>`}
    }
    h+=`</tr>`}
  h+=`</tbody></table></div>`;
  m.innerHTML=h;

  // Drag-выделение через event delegation
  const tbl=document.getElementById('schedTable');
  tbl.addEventListener('mousedown',e=>{
    const cell=e.target.closest('.sched-cell[data-day]');
    if(!cell||cell.dataset.hasSlot) return;
    e.preventDefault();
    _sdDay=+cell.dataset.day; _sdStart=+cell.dataset.slot; _sdEnd=_sdStart;
    _sdDragging=true; _sdMoved=false;
    _sdHighlight(tbl);
  });
  tbl.addEventListener('mouseover',e=>{
    if(!_sdDragging) return;
    const cell=e.target.closest('.sched-cell[data-day]');
    if(!cell||+cell.dataset.day!==_sdDay||cell.dataset.hasSlot) return;
    const ns=+cell.dataset.slot;
    if(ns!==_sdEnd){_sdMoved=true; _sdEnd=ns; _sdHighlight(tbl);}
  });}

function _sdHighlight(tbl){
  tbl.querySelectorAll('.sched-drag-sel').forEach(c=>c.classList.remove('sched-drag-sel'));
  if(_sdDay===null) return;
  const lo=Math.min(_sdStart,_sdEnd),hi=Math.max(_sdStart,_sdEnd);
  tbl.querySelectorAll('.sched-cell[data-day]').forEach(c=>{
    if(+c.dataset.day===_sdDay&&+c.dataset.slot>=lo&&+c.dataset.slot<=hi&&!c.dataset.hasSlot)
      c.classList.add('sched-drag-sel');
  });}

function openSchedAdd(day,slotIdx,dur=2){
  schedEditDay=day; schedEditSlot=slotIdx; schedEditId=null;
  document.getElementById('mSchedTitle').textContent='Добавить занятие';
  const endTime=dur>1?' – '+slotTime(slotIdx+dur):'';
  document.getElementById('mSchedDay').textContent=DAYS_FULL[day]+' · '+slotTime(slotIdx)+endTime;
  document.getElementById('schedPrice').value='';
  document.getElementById('schedNote').value='';
  document.getElementById('schedDelBtn').style.display='none';
  document.getElementById('schedDuration').value=String(Math.min(Math.max(dur,1),8));
  const sel=document.getElementById('schedStudent');
  sel.innerHTML='<option value="">— выберите ученика —</option>'+
    students.map(s=>`<option value="${s.id}">${esc(s.name)}${s.level==='school'&&s.grade?' ('+s.grade+' кл.)':''}</option>`).join('');
  openM('mSched')}

function openSchedEdit(day,slotIdx){
  const slot=schedSlots.find(s=>s.day_of_week===day&&s.slot_index===slotIdx);
  if(!slot){openSchedAdd(day,slotIdx);return}
  schedEditDay=day; schedEditSlot=slotIdx; schedEditId=slot.id;
  document.getElementById('mSchedTitle').textContent='Изменить занятие';
  document.getElementById('mSchedDay').textContent=DAYS_FULL[day]+' · '+slotTime(slotIdx);
  document.getElementById('schedPrice').value=slot.price||'';
  document.getElementById('schedNote').value=slot.note||'';
  document.getElementById('schedDuration').value=String(slot.duration||2);
  document.getElementById('schedDelBtn').style.display='';
  const sel=document.getElementById('schedStudent');
  sel.innerHTML='<option value="">— выберите ученика —</option>'+
    students.map(s=>`<option value="${s.id}"${s.id===slot.student_id?' selected':''}>${esc(s.name)}${s.level==='school'&&s.grade?' ('+s.grade+' кл.)':''}</option>`).join('');
  openM('mSched')}

async function saveSchedSlot(){
  const stid=document.getElementById('schedStudent').value;
  const note=document.getElementById('schedNote').value.trim();
  const dur=parseInt(document.getElementById('schedDuration').value)||2;
  if(!stid){alert('Выберите ученика');return}
  try{
    const price=parseFloat(document.getElementById('schedPrice').value)||null;
    await post('/api/schedule',{student_id:stid,day_of_week:schedEditDay,slot_index:schedEditSlot,duration:dur,note:note||null,price});
    closeM('mSched'); await loadSchedule();
  }catch(e){alert('Ошибка сохранения')}}

async function clearSchedSlot(){
  if(!schedEditId) return;
  if(!confirm('Удалить это занятие?')) return;
  try{
    await del('/api/schedule/'+schedEditId);
    closeM('mSched'); await loadSchedule();
  }catch(e){alert('Ошибка удаления')}}

// ─── TEAM (teamlead) ───────────────────────────────────────────────────────

    get('/api/teamlead/team').catch(()=>[]),
    (()=>{const p=new URLSearchParams();if(tlStatsDateFrom)p.set('date_from',tlStatsDateFrom);if(tlStatsDateTo)p.set('date_to',tlStatsDateTo);return get('/api/teamlead/stats?'+p).catch(()=>null);})()

}

    <div style="font-size:.82em;font-weight:600;margin-bottom:10px;color:var(--muted)">ДОХОД ПО НЕДЕЛЯМ</div>

    <button class="btn-primary" onclick="showInviteTutor()">+ Пригласить преподавателя</button>
  </div>

async function doInviteTutor(){
  const e=document.getElementById('itErr');e.style.display='none';
  const name=document.getElementById('itName').value.trim();
  const login=document.getElementById('itLogin').value.trim();
  const pw=document.getElementById('itPw').value;
  const subj=document.getElementById('itSubj').value;
  if(!name||!login||!pw){e.textContent='Заполните все поля';e.style.display='block';return}
  try{
    await post('/api/users',{name,login,password:pw,role:'tutor',subject_ids:subj?[subj]:[]});
    const el=document.getElementById('mInviteTutor');if(el)el.remove();await loadTeam();
  }catch(x){e.textContent=x.detail||'Ошибка';e.style.display='block'}
}

function showCredModal(uid,name){
  const modal=document.createElement('div');
  modal.className='modal-overlay';modal.id='mCreds';
  modal.onclick=e=>{if(e.target===modal)modal.remove()};
  modal.innerHTML=`<div class="modal" style="max-width:380px">
    <div class="modal-header"><h3>Доступ: ${esc(name)}</h3><button class="modal-close" onclick="document.getElementById('mCreds').remove()">✕</button></div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:10px">
      <input id="crLogin" placeholder="Новый логин (оставьте пустым если не менять)" style="padding:9px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--fg)">
      <input id="crPw" type="password" placeholder="Новый пароль (оставьте пустым если не менять)" style="padding:9px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--fg)">
      <p id="crErr" style="color:#f87171;font-size:.85em;display:none"></p>
    </div>
    <div class="modal-footer">
      <button class="btn-primary" onclick="doUpdateCreds('${uid}')">Сохранить</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}
async function doUpdateCreds(uid){
  const e=document.getElementById('crErr');e.style.display='none';
  const login=document.getElementById('crLogin').value.trim();
  const pw=document.getElementById('crPw').value;
  if(!login&&!pw){e.textContent='Введите логин или пароль';e.style.display='block';return}
  try{
    await patch('/api/teamlead/team/'+uid+'/credentials',{...(login?{login}:{}),...(pw?{password:pw}:{})});
    const el=document.getElementById('mCreds');if(el)el.remove();alert('Сохранено');
  }catch(x){e.textContent=x.detail||'Ошибка';e.style.display='block'}
}

  [subjects,students,users]=await Promise.all([
