/* Draw a text label on canvas, always readable (not affected by transform) */
function drawCSLabel(txt, wx, wy, color) {
  const sp = ts(wx, wy);
  ctx.save();
  ctx.font = `${Math.max(9, 11*vz)}px system-ui,sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, sp.x, sp.y);
  ctx.restore();
}

/* Return a color that is readable on the current canvas background.
   In dark mode, very dark colors (luminance < 60) are replaced with the accent. */
function readableColor(c) {
  if (!dark) return c;
  const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c);
  if (!m) return c;
  const lum = 0.299*parseInt(m[1],16) + 0.587*parseInt(m[2],16) + 0.114*parseInt(m[3],16);
  return lum < 60 ? '#22c55e' : c;
}

/* Draw tick marks and numeric labels on one CS axis line.
   csTickStep: CS units per tick (default 1); csScale: world px per CS unit. */
function drawCSTicks(el, origin, color) {
  const scale  = el.csScale    || 50;  // world px per CS unit
  const tStep  = el.csTickStep != null ? el.csTickStep : 1;  // CS units per tick
  const tickPx = scale * tStep;        // world px per tick
  if (tickPx <= 0) return;

  const dir    = csPositiveDir(el);
  const tickLen = 7 / vz;             // perp tick length in world units
  const px = -dir.y, py = dir.x;     // perpendicular

  const toPosEnd = { x: dir.posEnd.x - origin.x, y: dir.posEnd.y - origin.y };
  const toNegEnd = { x: dir.negEnd.x - origin.x, y: dir.negEnd.y - origin.y };
  const posLen = Math.max(0, toPosEnd.x * dir.x + toPosEnd.y * dir.y);
  const negLen = Math.max(0, -(toNegEnd.x * dir.x + toNegEnd.y * dir.y));

  const nPos = Math.min(200, Math.floor(posLen / tickPx));
  const nNeg = Math.min(200, Math.floor(negLen / tickPx));

  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 1 * vz;
  ctx.fillStyle   = color;

  for (let k = -nNeg; k <= nPos; k++) {
    if (k === 0) continue;
    const csVal = k * tStep;                          // actual CS value at this tick
    const wx = origin.x + csVal * scale * dir.x;
    const wy = origin.y + csVal * scale * dir.y;
    const sp  = ts(wx, wy);
    const tp1 = ts(wx + px*tickLen, wy + py*tickLen);
    const tp2 = ts(wx - px*tickLen, wy - py*tickLen);
    ctx.beginPath(); ctx.moveTo(tp1.x, tp1.y); ctx.lineTo(tp2.x, tp2.y); ctx.stroke();
    // label offset perpendicular
    const lsp = ts(wx + px*tickLen*2.5, wy + py*tickLen*2.5);
    ctx.save();
    ctx.font = `${Math.max(7, Math.round(10*vz))}px system-ui`;
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lbl = Number.isInteger(csVal) ? String(csVal) : parseFloat(csVal.toPrecision(6)).toString();
    ctx.fillText(lbl, lsp.x, lsp.y);
    ctx.restore();
  }
  ctx.restore();
}

/* Clip path = parallelogram defined by two vectors from origin */
function csParallelogramPath(O, ua, ub) {
  // ua = positive end - O  for line A
  // ub = positive end - O  for line B
  const A = ts(O.x + ua.x, O.y + ua.y);
  const B = ts(O.x + ub.x, O.y + ub.y);
  const AB = ts(O.x + ua.x + ub.x, O.y + ua.y + ub.y);
  const Os = ts(O.x, O.y);
  ctx.beginPath();
  ctx.moveTo(Os.x, Os.y);
  ctx.lineTo(A.x,  A.y);
  ctx.lineTo(AB.x, AB.y);
  ctx.lineTo(B.x,  B.y);
  ctx.closePath();
}

/* ─── Marching squares: draw contour of f(a,b)=0 in CS space ─── */
function marchingSquares(fn, ra, rb, toWorld, GRID) {
  const da = 2*ra/GRID, db = 2*rb/GRID;
  // pre-compute grid values
  const V = [];
  for (let j = 0; j <= GRID; j++) {
    V[j] = [];
    for (let i = 0; i <= GRID; i++) {
      const v = fn(-ra + i*da, -rb + j*db);
      V[j][i] = isFinite(v) ? v : NaN;
    }
  }
  const cross = (va, vb) => (va < 0) !== (vb < 0);
  const lerp  = (va, vb, v0, v1) => {
    const t = Math.abs(vb-va) < 1e-12 ? 0.5 : -va/(vb-va);
    return v0 + t*(v1-v0);
  };
  ctx.beginPath();
  for (let j = 0; j < GRID; j++) {
    for (let i = 0; i < GRID; i++) {
      const a0=-ra+i*da, b0=-rb+j*db, a1=a0+da, b1=b0+db;
      const vBL=V[j][i], vBR=V[j][i+1], vTR=V[j+1][i+1], vTL=V[j+1][i];
      if (!isFinite(vBL)||!isFinite(vBR)||!isFinite(vTR)||!isFinite(vTL)) continue;
      const pts = [];
      if (cross(vBL,vBR)) pts.push({a:lerp(vBL,vBR,a0,a1), b:b0});
      if (cross(vBR,vTR)) pts.push({a:a1,                   b:lerp(vBR,vTR,b0,b1)});
      if (cross(vTR,vTL)) pts.push({a:lerp(vTR,vTL,a1,a0), b:b1});
      if (cross(vTL,vBL)) pts.push({a:a0,                   b:lerp(vTL,vBL,b1,b0)});
      const seg = (p0, p1) => {
        const w0=toWorld(p0.a,p0.b), s0=ts(w0.x,w0.y);
        const w1=toWorld(p1.a,p1.b), s1=ts(w1.x,w1.y);
        ctx.moveTo(s0.x,s0.y); ctx.lineTo(s1.x,s1.y);
      };
      if (pts.length===2) seg(pts[0],pts[1]);
      else if (pts.length===4) { seg(pts[0],pts[1]); seg(pts[2],pts[3]); }
    }
  }
  ctx.stroke();
}

/* Plot one graph equation in CS space, clipped to the parallelogram */
function drawCSGraph(O, uA, uB, scaleA, scaleB, graph) {
  const parsed = parseEqn(graph.eq);
  if (!parsed) return;
  const color = graph.color || '#ef4444';
  const lw    = Math.max(1, (graph.width||2) * vz);
  const dash  = graph.dash||'solid';

  const lenA = Math.hypot(uA.x, uA.y);
  const lenB = Math.hypot(uB.x, uB.y);
  const rangeA = lenA / scaleA;
  const rangeB = lenB / scaleB;
  const nA = { x:uA.x/lenA, y:uA.y/lenA };
  const nB = { x:uB.x/lenB, y:uB.y/lenB };
  const toWorld = (a, b) => ({
    x: O.x + a*scaleA*nA.x + b*scaleB*nB.x,
    y: O.y + a*scaleA*nA.y + b*scaleB*nB.y
  });

  /* clip region: full 4-quadrant parallelogram */
  ctx.save();
  const negA={x:-uA.x,y:-uA.y}, negB={x:-uB.x,y:-uB.y};
  const c1=ts(O.x+uA.x+uB.x,  O.y+uA.y+uB.y);
  const c2=ts(O.x+negA.x+uB.x,O.y+negA.y+uB.y);
  const c3=ts(O.x+negA.x+negB.x,O.y+negA.y+negB.y);
  const c4=ts(O.x+uA.x+negB.x,O.y+uA.y+negB.y);
  ctx.beginPath();
  ctx.moveTo(c1.x,c1.y); ctx.lineTo(c2.x,c2.y);
  ctx.lineTo(c3.x,c3.y); ctx.lineTo(c4.x,c4.y);
  ctx.closePath(); ctx.clip();

  ctx.strokeStyle = color;
  ctx.lineWidth   = lw;
  ctx.lineJoin    = 'round'; ctx.lineCap = 'round';
  /* apply dash style */
  if (dash==='dashed')      ctx.setLineDash([8*vz, 6*vz]);
  else if (dash==='dotted') ctx.setLineDash([2*vz, 5*vz]);
  else                      ctx.setLineDash([]);

  const { mode } = parsed;

  if (mode==='implicit') {
    /* ── marching squares for F(x,y)=G(x,y) ── */
    const fn = (a, b) => mathEval(parsed.lhs, a, b) - mathEval(parsed.rhs, a, b);
    const GRID = Math.min(120, Math.max(60, Math.round(Math.max(rangeA,rangeB)*4)));
    marchingSquares(fn, rangeA, rangeB, toWorld, GRID);
  } else {
    /* ── parametric plot for y=f(x) or x=f(y) ── */
    const STEPS = 600;
    const independent = (mode==='yfx') ? rangeA : rangeB;
    const step = 2*independent/STEPS;
    let penDown = false;
    ctx.beginPath();
    for (let i = 0; i <= STEPS; i++) {
      const v = -independent + i*step;
      let a, b;
      if (mode==='yfx') { a=v; b=mathEval(parsed.rhs,a,0); }
      else               { b=v; a=mathEval(parsed.rhs,0,b); }
      if (!isFinite(a)||!isFinite(b)||Math.abs(b)>rangeB*50||Math.abs(a)>rangeA*50) {
        penDown=false; continue;
      }
      const _w=toWorld(a,b); const sp=ts(_w.x,_w.y);
      if (!penDown) { ctx.moveTo(sp.x,sp.y); penDown=true; }
      else ctx.lineTo(sp.x,sp.y);
    }
    ctx.stroke();
  }

  ctx.setLineDash([]);
  ctx.restore();
}

/* Draw all active CS overlays (called from redraw) */
function drawAllCS() {
  const seen = new Set();
  for (const el of all) {
    if (!el.csPartner) continue;
    const partner = all.find(e => e.id === el.csPartner);
    if (!partner) continue;
    const key = csKey(el.id, partner.id);
    if (seen.has(key)) continue;
    seen.add(key);

    const la = el, lb = partner;
    const O = lineIntersection(la, lb);
    if (!O) continue;

    const colorA = readableColor(la.color || '#22c55e');
    const colorB = readableColor(lb.color || '#10b981');
    const scaleA = la.csScale || 50;
    const scaleB = lb.csScale || 50;

    const dirA = csPositiveDir(la), dirB = csPositiveDir(lb);

    // segment vectors from O toward each endpoint of each line
    const uApos = { x: dirA.posEnd.x - O.x, y: dirA.posEnd.y - O.y };
    const uBpos = { x: dirB.posEnd.x - O.x, y: dirB.posEnd.y - O.y };
    const uAneg = { x: dirA.negEnd.x - O.x, y: dirA.negEnd.y - O.y };
    const uBneg = { x: dirB.negEnd.x - O.x, y: dirB.negEnd.y - O.y };

    /* ── Parallelogram highlight ── */
    ctx.save();
    // The parallelogram bounded by the four segment ends
    const c1 = ts(O.x + uApos.x + uBpos.x, O.y + uApos.y + uBpos.y);
    const c2 = ts(O.x + uAneg.x + uBpos.x, O.y + uAneg.y + uBpos.y);
    const c3 = ts(O.x + uAneg.x + uBneg.x, O.y + uAneg.y + uBneg.y);
    const c4 = ts(O.x + uApos.x + uBneg.x, O.y + uApos.y + uBneg.y);
    ctx.beginPath();
    ctx.moveTo(c1.x,c1.y); ctx.lineTo(c2.x,c2.y);
    ctx.lineTo(c3.x,c3.y); ctx.lineTo(c4.x,c4.y);
    ctx.closePath();
    ctx.fillStyle = dark ? 'rgba(34,197,94,0.04)' : 'rgba(34,197,94,0.06)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(34,197,94,0.25)'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    /* ── Origin dot ── */
    const Os = ts(O.x, O.y);
    ctx.save();
    ctx.beginPath(); ctx.arc(Os.x, Os.y, Math.max(3, 4*vz), 0, Math.PI*2);
    ctx.fillStyle = '#22c55e'; ctx.fill();
    ctx.strokeStyle = dark?'#060e07':'#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();

    /* ── Tick marks ── */
    drawCSTicks(la, O, colorA);
    drawCSTicks(lb, O, colorB);

    /* ── Endpoint drag handles (small diamonds, always shown when not selected) ── */
    const _csPairSel = selected.size === 2 && selected.has(la.id) && selected.has(lb.id);
    if (!_csPairSel) {
      const endpts = [
        { pt: dirA.posEnd, col: colorA }, { pt: dirA.negEnd, col: colorA },
        { pt: dirB.posEnd, col: colorB }, { pt: dirB.negEnd, col: colorB }
      ];
      ctx.save();
      for (const { pt, col } of endpts) {
        const sp = ts(pt.x, pt.y);
        ctx.save();
        ctx.translate(sp.x, sp.y); ctx.rotate(Math.PI / 4);
        ctx.fillStyle = col + '88';   // semi-transparent fill
        ctx.strokeStyle = col;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.rect(-5, -5, 10, 10); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    }

    /* ── Graphs ── */
    const hasDirection = la.arrow && la.arrow !== 'none' &&
                         lb.arrow && lb.arrow !== 'none';
    if (hasDirection && csIntersectionInView(O) && la.csGraphs) {
      for (const graph of la.csGraphs) {
        drawCSGraph(O, uApos, uBpos, scaleA, scaleB, graph);
      }
    }
  }
}

/* ── Copy graph curve onto board as a stroke element ── */
function graphToStroke(la, lb, graph) {
  const O = lineIntersection(la, lb);
  if (!O) return;
  const dirA  = csPositiveDir(la), dirB = csPositiveDir(lb);
  const uApos = { x: dirA.posEnd.x-O.x, y: dirA.posEnd.y-O.y };
  const uBpos = { x: dirB.posEnd.x-O.x, y: dirB.posEnd.y-O.y };
  const scaleA = la.csScale||50, scaleB = lb.csScale||50;
  const lenA   = Math.hypot(uApos.x,uApos.y), lenB = Math.hypot(uBpos.x,uBpos.y);
  const nA={x:uApos.x/lenA,y:uApos.y/lenA}, nB={x:uBpos.x/lenB,y:uBpos.y/lenB};
  const toWorld = (a,b)=>({
    x: O.x + a*scaleA*nA.x + b*scaleB*nB.x,
    y: O.y + a*scaleA*nA.y + b*scaleB*nB.y
  });
  const rangeA = lenA/scaleA, rangeB = lenB/scaleB;
  const parsed = parseEqn(graph.eq);
  if (!parsed) return;
  const segments = [];
  if (parsed.mode==='yfx'||parsed.mode==='xfy') {
    const STEPS=400;
    const independent = parsed.mode==='yfx'?rangeA:rangeB;
    const step = 2*independent/STEPS;
    let seg=[];
    for (let i=0;i<=STEPS;i++) {
      const v=-independent+i*step; let a,b;
      if (parsed.mode==='yfx'){a=v;b=mathEval(parsed.rhs,a,0);}
      else{b=v;a=mathEval(parsed.rhs,0,b);}
      if(!isFinite(a)||!isFinite(b)||Math.abs(b)>rangeB*50||Math.abs(a)>rangeA*50){
        if(seg.length>1) segments.push(seg); seg=[]; continue;
      }
      seg.push(toWorld(a,b));
    }
    if(seg.length>1) segments.push(seg);
  } else if (parsed.mode==='implicit') {
    /* Use marching squares to trace the implicit curve F(a,b)=G(a,b) → F-G=0 */
    const fn = (a,b) => mathEval(parsed.lhs,a,b) - mathEval(parsed.rhs,a,b);
    const GRID = Math.min(100, Math.max(50, Math.round(Math.max(rangeA,rangeB)*3)));
    const da = 2*rangeA/GRID, db = 2*rangeB/GRID;
    const V = [];
    for (let j=0;j<=GRID;j++) { V[j]=[]; for (let i=0;i<=GRID;i++) { const v=fn(-rangeA+i*da,-rangeB+j*db); V[j][i]=isFinite(v)?v:NaN; } }
    const cross=(va,vb)=>(va<0)!==(vb<0);
    const lerp=(va,vb,v0,v1)=>{ const t=Math.abs(vb-va)<1e-12?0.5:-va/(vb-va); return v0+t*(v1-v0); };
    for (let j=0;j<GRID;j++) {
      for (let i=0;i<GRID;i++) {
        const a0=-rangeA+i*da, b0=-rangeB+j*db, a1=a0+da, b1=b0+db;
        const vBL=V[j][i],vBR=V[j][i+1],vTR=V[j+1][i+1],vTL=V[j+1][i];
        if(!isFinite(vBL)||!isFinite(vBR)||!isFinite(vTR)||!isFinite(vTL)) continue;
        const pts=[];
        if(cross(vBL,vBR)) pts.push({a:lerp(vBL,vBR,a0,a1),b:b0});
        if(cross(vBR,vTR)) pts.push({a:a1,b:lerp(vBR,vTR,b0,b1)});
        if(cross(vTR,vTL)) pts.push({a:lerp(vTR,vTL,a1,a0),b:b1});
        if(cross(vTL,vBL)) pts.push({a:a0,b:lerp(vTL,vBL,b1,b0)});
        if(pts.length===2) segments.push([toWorld(pts[0].a,pts[0].b),toWorld(pts[1].a,pts[1].b)]);
        else if(pts.length===4) {
          segments.push([toWorld(pts[0].a,pts[0].b),toWorld(pts[1].a,pts[1].b)]);
          segments.push([toWorld(pts[2].a,pts[2].b),toWorld(pts[3].a,pts[3].b)]);
        }
      }
    }
  }
  if (!segments.length) return;
  addToUndo();
  /* Build ONE monolithic stroke with null separators between segments */
  const pts = [];
  for (let i = 0; i < segments.length; i++) {
    if (i > 0) pts.push({ x: null, y: null }); // pen-up sentinel
    for (const p of segments[i]) pts.push(p);
  }
  const el = { type:'stroke', id:gid(), pts, color:graph.color||'#ef4444', size:graph.width||2 };
  all.push(el); wsSend({ type:'stroke', data:el });
  redraw();
}

/* ── Image ── */
function drawImage(el) {
  let entry = imgCache.get(el.id);
  if (!entry) {
    entry = { img: new Image(), loaded: false };
    entry.img.onload = () => { entry.loaded = true; redraw(); };
    entry.img.src = el.src || '';
    imgCache.set(el.id, entry);
  }
  if (!entry.loaded) {
    /* Draw placeholder */
    const sp = ts(el.x, el.y);
    const sw = (el.w || 200) * vz, sh = (el.h || 150) * vz;
    ctx.save();
    ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
    ctx.strokeRect(sp.x, sp.y, sw, sh);
    ctx.fillStyle = 'rgba(34,197,94,.06)'; ctx.fillRect(sp.x, sp.y, sw, sh);
    ctx.setLineDash([]); ctx.fillStyle = 'rgba(34,197,94,.4)';
    ctx.font = `${Math.min(14*vz, 22)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🖼️', sp.x + sw/2, sp.y + sh/2);
    ctx.restore(); return;
  }
  const sp = ts(el.x, el.y);
  const sw = (el.w || 200) * vz, sh = (el.h || 150) * vz;
  ctx.save();
  if (el.rotation) {
    const cx = sp.x + sw/2, cy = sp.y + sh/2;
    ctx.translate(cx, cy); ctx.rotate(el.rotation); ctx.translate(-cx, -cy);
  }
  ctx.drawImage(entry.img, sp.x, sp.y, sw, sh);
  ctx.restore();
}

/* ── Rich-text DOM overlays (kept in sync with view transform) ── */
function updateRichtextOverlays() {
  /* Remove overlays for deleted elements */
  for (const [id, div] of rtoMap) {
    if (!all.find(e => e.id === id)) { div.remove(); rtoMap.delete(id); }
  }
  /* Add/update overlays for richtext elements */
  for (const el of all) {
    if (el.type !== 'richtext') continue;
    let div = rtoMap.get(el.id);
    if (!div) {
      div = document.createElement('div'); div.className = 'rto';
      document.body.appendChild(div);
      rtoMap.set(el.id, div);
    }
    const sp = ts(el.x, el.y);
    div.style.left   = (sp.x + 56) + 'px';  // +56px = sidebar
    div.style.top    = sp.y + 'px';
    div.style.width  = (el.w || 300) * vz + 'px';
    div.style.height = (el.h || 150) * vz + 'px';
    div.style.fontSize = Math.max(8, Math.round(vz * 14)) + 'px';
    div.style.transform = el.rotation ? `rotate(${el.rotation}rad)` : '';
    div.style.outline  = selected.has(el.id) ? '2px dashed #22c55e' : 'none';
    if (div._html !== el.html) { div.innerHTML = el.html || ''; div._html = el.html; }
  }
}

function drawElem(el) {
  if (!el) return;
  if      (el.type === 'stroke')   drawStroke(el);
  else if (el.type === 'shape')    drawShape(el);
  else if (el.type === 'text')     drawText(el);
  else if (el.type === 'image')    drawImage(el);
  /* richtext is rendered via DOM overlays in updateRichtextOverlays() */
}

function redraw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = dark ? '#060e07' : '#f8fdf9'; ctx.fillRect(0, 0, W, H);
  drawGrid();
  all.forEach(drawElem);
  if (cur) drawElem(cur);
  /* CS overlays: tick marks, parallelogram, graphs — drawn after elements, before highlights */
  drawAllCS();
  /* Hover highlight from element list */
  if (hoverHighlightId && selected.has(hoverHighlightId)) {
    const hel = all.find(e => e.id === hoverHighlightId);
    if (hel) {
      const bb = elemBBox(hel);
      if (bb) {
        const shp = ts(bb.x, bb.y);
        ctx.save();
        ctx.fillStyle = 'rgba(34,197,94,.2)';
        ctx.fillRect(shp.x - 6, shp.y - 6, bb.w * vz + 12, bb.h * vz + 12);
        ctx.restore();
      }
    }
  }
  for (const id of selected) { const el = all.find(e => e.id === id); if (el) drawSelHighlight(el); }
  drawSelBox();
  /* Sync rich-text DOM overlays with current view */
  updateRichtextOverlays();
  /* Bug #5: Auto-restore CS panel if it closed unexpectedly (e.g. after WS round-trip) */
  const _csPanel = document.getElementById('csSetPanel');
  if (!_csPanel.classList.contains('open') && csPanelLaId && csPanelLbId && tool === 'select') {
    const _cla = all.find(e => e.id === csPanelLaId);
    const _clb = all.find(e => e.id === csPanelLbId);
    if (_cla && _clb && selected.has(_cla.id) && selected.has(_clb.id)) {
      updateCSPanels(_cla, _clb);
    }
  }
  /* ── pen / eraser cursor ring ── */
  if (cursorPos && (tool === 'pen' || tool === 'erase')) {
    const r = tool === 'pen'
      ? Math.max(penSize * vz / 2, 2)
      : Math.max(penSize + 6, 4);
    ctx.save();
    ctx.strokeStyle = tool === 'erase'
      ? 'rgba(255,80,80,0.85)'
      : dark ? 'rgba(255,255,255,0.75)' : 'rgba(0,30,10,0.55)';
    ctx.lineWidth = 1.5; ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(cursorPos.x, cursorPos.y, r, 0, Math.PI * 2); ctx.stroke();
    if (tool === 'erase') {
      ctx.beginPath();
      ctx.moveTo(cursorPos.x-4,cursorPos.y-4); ctx.lineTo(cursorPos.x+4,cursorPos.y+4);
      ctx.moveTo(cursorPos.x+4,cursorPos.y-4); ctx.lineTo(cursorPos.x-4,cursorPos.y+4);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// §12  HIT TESTING
// ══════════════════════════════════════════════════════════

/* Bounding box in world coords */
function elemBBox(el) {
  if (el.type === 'stroke') {
    if (!el.pts?.length) return null;
    let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
    for (const p of el.pts) {
      if (p.x == null || !isFinite(p.x) || !isFinite(p.y)) continue;
      x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y);
    }
    if (!isFinite(x0)) return null;
    const r = (el.size||3)/2;
    return { x:x0-r, y:y0-r, w:x1-x0+r*2, h:y1-y0+r*2 };
  }
  if (el.type === 'shape') {
    const x=Math.min(el.x1,el.x2), y=Math.min(el.y1,el.y2);
    return { x, y, w:Math.abs(el.x2-el.x1), h:Math.abs(el.y2-el.y1) };
  }
  if (el.type === 'text')     return { x:el.x, y:el.y, w:el.w||240, h:el.h||60 };
  if (el.type === 'image')    return { x:el.x, y:el.y, w:el.w||200, h:el.h||150 };
  if (el.type === 'richtext') return { x:el.x, y:el.y, w:el.w||300, h:el.h||150 };
  return null;
}

/* ── Resize handles ── */
function getHandles(bb) {
  const {x,y,w,h} = bb;
  return { tl:{x,y}, t:{x:x+w/2,y}, tr:{x:x+w,y},
           r:{x:x+w,y:y+h/2}, br:{x:x+w,y:y+h},
           b:{x:x+w/2,y:y+h}, bl:{x,y:y+h}, l:{x,y:y+h/2} };
}

/* Transform a world-space point into the element's local (un-rotated) coordinate space.
   All handle/hit tests should use this to correctly handle rotated elements. */
function localPoint(wx, wy, el) {
  const rot = el.rotation || 0;
  if (!rot) return { x: wx, y: wy };
  const bb = elemBBox(el); if (!bb) return { x: wx, y: wy };
  const cx = bb.x + bb.w / 2, cy = bb.y + bb.h / 2;
  const dx = wx - cx, dy = wy - cy;
  const cos = Math.cos(-rot), sin = Math.sin(-rot);
  return { x: cx + dx * cos - dy * sin, y: cy + dx * sin + dy * cos };
}

function getResizeHandle(wx, wy) {
  const thr = 9/vz;
  /* Special case: both CS partner lines selected → allow endpoint handles on each axis */
  if (selected.size === 2) {
    const selArr = [...selected].map(id => all.find(e => e.id === id)).filter(Boolean);
    if (selArr.length === 2 &&
        selArr[0].type === 'shape' && selArr[0].shape === 'line' &&
        selArr[0].csPartner === selArr[1].id) {
      for (const el of selArr) {
        const lp = localPoint(wx, wy, el);
        if (Math.hypot(lp.x - el.x1, lp.y - el.y1) < thr) return { el, handle: 'p1' };
        if (Math.hypot(lp.x - el.x2, lp.y - el.y2) < thr) return { el, handle: 'p2' };
      }
    }
    return null;
  }
  /* Direct grab: CS axis endpoints accessible without prior selection */
  if (selected.size === 0) {
    for (const el of all) {
      if (el.type !== 'shape' || el.shape !== 'line' || !el.csPartner) continue;
      if (!all.find(e => e.id === el.csPartner)) continue;
      const lp = localPoint(wx, wy, el);
      if (Math.hypot(lp.x - el.x1, lp.y - el.y1) < thr) return { el, handle: 'p1', autoSelect: true };
      if (Math.hypot(lp.x - el.x2, lp.y - el.y2) < thr) return { el, handle: 'p2', autoSelect: true };
    }
  }
  if (selected.size !== 1) return null;
  const id = [...selected][0];
  const el = all.find(e => e.id === id); if (!el) return null;
  const lp = localPoint(wx, wy, el);
  /* Lines use actual endpoint + midpoint handles */
  if (el.type === 'shape' && el.shape === 'line') {
    if (Math.hypot(lp.x - el.x1, lp.y - el.y1) < thr) return { el, handle: 'p1' };
    if (Math.hypot(lp.x - el.x2, lp.y - el.y2) < thr) return { el, handle: 'p2' };
    const mx = (el.x1+el.x2)/2, my = (el.y1+el.y2)/2;
    if (Math.hypot(lp.x - mx, lp.y - my) < thr) return { el, handle: 'pm' };
    return null;
  }
  const bb = elemBBox(el); if (!bb) return null;
  for (const [name, pos] of Object.entries(getHandles(bb)))
    if (Math.hypot(lp.x - pos.x, lp.y - pos.y) < thr) return { el, handle: name };
  return null;
}

function getRotateHandle(wx, wy) {
  if (selected.size !== 1) return null;
  const id = [...selected][0];
  const el = all.find(e => e.id === id); if (!el) return null;
  const bb = elemBBox(el); if (!bb) return null;
  const sp = ts(bb.x, bb.y);
  const cx_s = sp.x + bb.w * vz / 2;
  const cy_s = sp.y + bb.h * vz / 2;
  /* Rotation handle is 26px above top-center of bbox in screen space, then rotated */
  const dy_unrec = sp.y - 5 - 26 - cy_s;
  const rot = el.rotation || 0;
  const rhxS = cx_s - dy_unrec * Math.sin(rot);
  const rhyS = cy_s + dy_unrec * Math.cos(rot);
  const rhW = tw(rhxS, rhyS);
  if (Math.hypot(wx - rhW.x, wy - rhW.y) < 10/vz) return el;
  return null;
}

/* Convert visual (world) endpoint positions → local element coordinates.
   Visual midpoint = local midpoint always; local halfvec = InvRotate(visual halfvec, rot). */
function applyResizeLine(wx, wy) {
  const el = resizeEl, s = resizeSnap, h = resizeHandle;
  const rot = el.rotation || 0;
  /* CS axes: midpoint (= intersection O) must stay fixed while moving p1/p2 */
  const lk = el.csPartner ? new Set([...lineLockedHandles, 'pm']) : lineLockedHandles;
  const ic = Math.cos(-rot), is = Math.sin(-rot);
  /* lhvec = InvRotate(world halfvec): lhx=hx*ic-hy*is, lhy=hx*is+hy*ic
     local p1 = midpoint - lhvec,  local p2 = midpoint + lhvec */
  function setVisual(W1x, W1y, W2x, W2y) {
    const mlx=(W1x+W2x)/2, mly=(W1y+W2y)/2;
    const hx=(W2x-W1x)/2, hy=(W2y-W1y)/2;
    const lhx=hx*ic-hy*is, lhy=hx*is+hy*ic;
    el.x1=mlx-lhx; el.y1=mly-lhy; el.x2=mlx+lhx; el.y2=mly+lhy;
  }
  if (h === 'pm') {
    if (lk.has('pm')) return;
    const dx=wx-s.wm.x, dy=wy-s.wm.y;
    setVisual(s.w1.x+dx,s.w1.y+dy, s.w2.x+dx,s.w2.y+dy);
  } else if (h === 'p1') {
    if (lk.has('p1')) return;
    if (lk.has('p2') && lk.has('pm')) {
      const dx=s.w1.x-s.w2.x, dy=s.w1.y-s.w2.y, len=Math.hypot(dx,dy);
      if (len<0.001) return;
      const t=((wx-s.w2.x)*dx+(wy-s.w2.y)*dy)/(len*len);
      setVisual(s.w2.x+dx*t,s.w2.y+dy*t, s.w2.x,s.w2.y);
    } else if (lk.has('pm')) {
      setVisual(wx,wy, 2*s.wm.x-wx,2*s.wm.y-wy);
    } else {
      setVisual(wx,wy, s.w2.x,s.w2.y);
    }
  } else if (h === 'p2') {
    if (lk.has('p2')) return;
    if (lk.has('p1') && lk.has('pm')) {
      const dx=s.w2.x-s.w1.x, dy=s.w2.y-s.w1.y, len=Math.hypot(dx,dy);
      if (len<0.001) return;
      const t=((wx-s.w1.x)*dx+(wy-s.w1.y)*dy)/(len*len);
      setVisual(s.w1.x,s.w1.y, s.w1.x+dx*t,s.w1.y+dy*t);
    } else if (lk.has('pm')) {
      setVisual(2*s.wm.x-wx,2*s.wm.y-wy, wx,wy);
    } else {
      setVisual(s.w1.x,s.w1.y, wx,wy);
    }
  }
}

function applyResize(wx, wy) {
  const el = resizeEl, s = resizeSnap, h = resizeHandle;
  if (el.type === 'shape') {
    if (el.shape !== 'line') { /* lines handled by applyResizeLine */
      let {x1,y1,x2,y2} = s;
      if (h.includes('l')) x1 = Math.min(wx, s.x2 - 2);
      if (h.includes('r')) x2 = Math.max(wx, s.x1 + 2);
      if (h.includes('t')) y1 = Math.min(wy, s.y2 - 2);
      if (h.includes('b')) y2 = Math.max(wy, s.y1 + 2);
      el.x1=x1; el.y1=y1; el.x2=x2; el.y2=y2;
    }
  } else if (el.type === 'text' || el.type === 'image' || el.type === 'richtext') {
    let {x, y, w, h: ht} = s;
    if (h.includes('r')) w = Math.max(20, wx - x);
    if (h.includes('b')) ht = Math.max(20, wy - y);
    if (h.includes('l')) { w = Math.max(20, s.x + s.w - wx); x = s.x + s.w - w; }
    if (h.includes('t')) { ht = Math.max(20, s.y + s.h - wy); y = s.y + s.h - ht; }
    el.x=x; el.y=y; el.w=w; el.h=ht;
  } else if (el.type === 'stroke') {
    const bb = {x:s.x, y:s.y, w:s.w, h:s.h};
    let nx=bb.x, ny=bb.y, nw=bb.w, nh=bb.h;
    if (h.includes('l')) { nx=wx; nw=Math.max(2, bb.x+bb.w-wx); }
    if (h.includes('r')) nw = Math.max(2, wx - bb.x);
    if (h.includes('t')) { ny=wy; nh=Math.max(2, bb.y+bb.h-wy); }
    if (h.includes('b')) nh = Math.max(2, wy - bb.y);
    el.pts = s.pts.map(p => {
      if (p.x == null || !isFinite(p.x)) return { x: null, y: null };
      return {
        x: bb.w>0 ? nx + (p.x - bb.x) * nw / bb.w : nx,
        y: bb.h>0 ? ny + (p.y - bb.y) * nh / bb.h : ny
      };
    });
  }
}

function hitTest(el, wx, wy) {
  const r = Math.max(6, 8) / vz;
  /* Un-rotate the test point into the element's local space */
  const lp = localPoint(wx, wy, el);
  const lx = lp.x, ly = lp.y;
  if (el.type === 'stroke') {
    if (!el.pts) return false;
    return el.pts.some(p => p.x != null && isFinite(p.x) && Math.hypot(p.x - lx, p.y - ly) < r + (el.size||3)/2);
  }
  if (el.type === 'shape') {
    if (el.shape === 'line') {
      const dx=el.x2-el.x1, dy=el.y2-el.y1, len=Math.hypot(dx,dy);
      if (len === 0) return false;
      const t = Math.max(0, Math.min(1, ((lx-el.x1)*dx + (ly-el.y1)*dy) / (len*len)));
      return Math.hypot(lx-el.x1-t*dx, ly-el.y1-t*dy) < r + (el.size||2);
    }
    const bb = elemBBox(el);
    return bb && lx >= bb.x && ly >= bb.y && lx <= bb.x+bb.w && ly <= bb.y+bb.h;
  }
  if (el.type === 'text' || el.type === 'image' || el.type === 'richtext') {
    const bb = elemBBox(el);
    return bb && lx >= bb.x && ly >= bb.y && lx <= bb.x+bb.w && ly <= bb.y+bb.h;
  }
  return false;
}

function getElemAt(wx, wy) {
  for (let i = all.length - 1; i >= 0; i--) if (hitTest(all[i], wx, wy)) return all[i];
  return null;
}

/* Elements fully inside a rubber-band rectangle (screen coords) */
function elemsInRect(sx1, sy1, sx2, sy2) {
  const x0=Math.min(sx1,sx2), y0=Math.min(sy1,sy2);
  const x1=Math.max(sx1,sx2), y1=Math.max(sy1,sy2);
  return all.filter(el => {
    const bb = elemBBox(el); if (!bb) return false;
    const sp = ts(bb.x, bb.y);
    return sp.x >= x0 && sp.y >= y0 && sp.x + bb.w*vz <= x1 && sp.y + bb.h*vz <= y1;
  });
}

// ══════════════════════════════════════════════════════════
// §13  TEXT EDITOR
// ══════════════════════════════════════════════════════════
const ted = document.getElementById('ted');
let tedEl  = null;   // text element being edited
let tedNew = false;  // true if element is brand-new (not yet in backend)

function updateTedStyle() {
  if (!tedEl) return;
  ted.style.fontSize      = (tedEl.fontSize || textFontSize) * vz + 'px';
  ted.style.fontWeight    = (tedEl.bold      || textBold)      ? 'bold'      : 'normal';
  ted.style.fontStyle     = (tedEl.italic    || textItalic)    ? 'italic'    : 'normal';
  ted.style.textDecoration= (tedEl.underline || textUnderline) ? 'underline' : 'none';
  ted.style.color         = tedEl.color || textColor;
}

function openTextEditor(el, isNew) {
  tedEl = el; tedNew = isNew;
  const sp = ts(el.x, el.y);
  const wrap = document.getElementById('ted-wrap');
  wrap.style.left   = (sp.x + 56) + 'px';   /* 56px = sidebar width */
  wrap.style.top    = sp.y + 'px';
  wrap.style.width  = (el.w || textBoxW) * vz + 'px';
  wrap.style.height = 'auto';
  updateTedStyle();
  ted.value = el.text || '';
  ted.style.height = 'auto';
  ted.style.height = ted.scrollHeight + 'px';
  wrap.style.display = 'block';
  requestAnimationFrame(() => ted.focus());
}

function commitTextEdit() {
  if (!tedEl) return;
  document.getElementById('ted-wrap').style.display = 'none';
  const text = ted.value.trim();
  const _tedEl = tedEl, _tedNew = tedNew;
  tedEl = null; tedNew = false;
  if (!text) {
    all = all.filter(e => e !== _tedEl);
    if (!_tedNew) wsSend({ type: 'erase_stroke', id: _tedEl.id });
  } else {
    _tedEl.text = text;
    _tedEl.h = Math.ceil(ted.scrollHeight / vz) + 10;
    if (_tedNew) {
      wsSend({ type: 'stroke', data: _tedEl });
    } else {
      wsSend({ type: 'erase_stroke', id: _tedEl.id });
      setTimeout(() => wsSend({ type: 'stroke', data: _tedEl }), 40);
    }
  }
  redraw();
}

ted.addEventListener('blur', () => setTimeout(commitTextEdit, 120));
ted.addEventListener('keydown', e => {
  if (e.key === 'Escape')                   { e.preventDefault(); ted.blur(); }
  if (e.key === 'Enter' && e.ctrlKey)       { e.preventDefault(); ted.blur(); }
  e.stopPropagation();
});
ted.addEventListener('input', () => { ted.style.height = 'auto'; ted.style.height = ted.scrollHeight + 'px'; });

// ══════════════════════════════════════════════════════════
// §14  POINTER HELPERS
// ══════════════════════════════════════════════════════════
function gp(e) {
  const r = cv.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

// ══════════════════════════════════════════════════════════
// §15  MOUSE / TOUCH EVENTS
// ══════════════════════════════════════════════════════════
let drawing = false, panning = false, panSt = null, spDown = false;

function onDown(e) {
  commitTextEdit();

  /* RMB / Space / Middle → pan */
  if (e.button === 2 || e.button === 1 || (e.button === 0 && spDown)) {
    panning = true; panSt = gp(e); cv.style.cursor = 'grabbing'; e.preventDefault(); return;
  }
  if (e.button !== 0) return;
  e.preventDefault();

  const p = gp(e), w = tw(p.x, p.y);

  /* ── Select ── */
  if (tool === 'select') {
    /* check rotation handle first */
    const rot = getRotateHandle(w.x, w.y);
    if (rot) {
      addToUndo();
      rotating = true; rotateEl = rot;
      const bb = elemBBox(rot);
      const c = ts(bb.x + bb.w/2, bb.y + bb.h/2);
      rotateCenter = c;
      rotateStartAngle = Math.atan2(p.y - c.y, p.x - c.x) - (rot.rotation || 0);
      rotateMoved = false;
      cv.style.cursor = 'grab'; return;
    }
    /* check resize handles */
    const rh = getResizeHandle(w.x, w.y);
    if (rh) {
      /* Direct CS endpoint grab: auto-select both axes first */
      if (rh.autoSelect) {
        selected.clear(); lineLockedHandles.clear(); sbLineOrder = 0;
        selected.add(rh.el.id);
        const _csP = all.find(e => e.id === rh.el.csPartner);
        if (_csP) selected.add(_csP.id);
        updateSelBar(); redraw();
      }
      addToUndo();
      resizing = true; resizeHandle = rh.handle; resizeEl = rh.el;
      const el = rh.el;
      /* Normalize rect/ellipse coords (x1≤x2, y1≤y2) to fix backward-drawn shapes */
      if (el.type === 'shape' && el.shape !== 'line') {
        const nx1=Math.min(el.x1,el.x2), ny1=Math.min(el.y1,el.y2);
        const nx2=Math.max(el.x1,el.x2), ny2=Math.max(el.y1,el.y2);
        el.x1=nx1; el.y1=ny1; el.x2=nx2; el.y2=ny2;
      }
      const bb = elemBBox(el);
      if (el.type === 'shape' && el.shape === 'line') {
        /* Store visual (world) positions so constraint logic works after rotation */
        const rot=el.rotation||0, cos=Math.cos(rot), sin=Math.sin(rot);
        const mlx=(el.x1+el.x2)/2, mly=(el.y1+el.y2)/2;
        const hx=(el.x2-el.x1)/2, hy=(el.y2-el.y1)/2;
        const rhx=hx*cos-hy*sin, rhy=hx*sin+hy*cos;
        resizeSnap = { x1:el.x1,y1:el.y1,x2:el.x2,y2:el.y2,
          wm:{x:mlx,y:mly}, w1:{x:mlx-rhx,y:mly-rhy}, w2:{x:mlx+rhx,y:mly+rhy} };
      } else {
        resizeSnap = el.type === 'stroke'
          ? { ...bb, pts: el.pts.map(p=>({...p})) }
          : el.type === 'shape' ? { x1:el.x1, y1:el.y1, x2:el.x2, y2:el.y2 }
          : { x:el.x, y:el.y, w:el.w, h:el.h };
      }
      return;
    }
    const el = getElemAt(w.x, w.y);
    if (el) {
      if (!e.shiftKey && !selected.has(el.id)) { selected.clear(); lineLockedHandles.clear(); sbLineOrder=0; }
      selected.add(el.id);
      /* CS unified: clicking one axis auto-selects its partner */
      if (el.csPartner) { const _csP=all.find(e=>e.id===el.csPartner); if(_csP) selected.add(_csP.id); }
      addToUndo();
      dragging = true; dragOrigin = { x: w.x, y: w.y }; dragMoved = false; snapPositions();
      cv.style.cursor = 'move';
    } else if (selected.size > 0 && !e.shiftKey && isInSelBox(w.x, w.y)) {
      /* Click anywhere inside the selection highlight area starts a drag */
      addToUndo();
      dragging = true; dragOrigin = { x: w.x, y: w.y }; dragMoved = false; snapPositions();
      cv.style.cursor = 'move';
    } else {
      if (!e.shiftKey) { selected.clear(); lineLockedHandles.clear(); sbLineOrder=0; }
      selBox = { x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    }
    updateSelBar(); redraw(); return;
  }

  /* ── Eraser ── */
  if (tool === 'erase') { addToUndo(); drawing = true; eraseAt(p.x, p.y); return; }

  /* ── Pen ── */
  if (tool === 'pen') {
    addToUndo();
    drawing = true;
    cur = { id: gid(), type: 'stroke', user_id: myId, color: penColor, size: penSize, pts: [w] };
    return;
  }

  /* ── Geometry ── */
  if (tool === 'geo_line' || tool === 'geo_rect' || tool === 'geo_ellipse') {
    addToUndo();
    drawing = true;
    cur = { id: gid(), type: 'shape', user_id: myId,
            shape: tool.replace('geo_',''), color: geoColor, size: geoSize, dash: geoDash,
            arrow: tool === 'geo_line' ? geoArrow : undefined,
            x1: w.x, y1: w.y, x2: w.x, y2: w.y };
    return;
  }

  /* ── Text ── */
  if (tool === 'text') {
    const existing = getElemAt(w.x, w.y);
    if (existing && existing.type === 'text') { openTextEditor(existing, false); return; }
    /* drag-to-define: start a temporary outline box */
    drawing = true;
    cur = { id: gid(), type: 'text', user_id: myId,
            x: w.x, y: w.y, w: 10, h: 10, text: '',
            color: textColor, fontSize: textFontSize,
            bold: textBold, italic: textItalic, underline: textUnderline,
            _drag: true };
  }
}

function onMove(e) {
  e.preventDefault();
  /* If mouse button was released outside canvas, clean up stale drag/rotate/pan state */
  if (!(e.buttons & 1) && (dragging || rotating || resizing)) {
    if (dragging)  { dragging  = false; dragOrigin  = null; if (dragMoved)   commitDrag();   dragMoved   = false; }
    if (rotating)  { rotating  = false; rotateCenter= null; rotateMoved = false; rotateEl = null; }
    if (resizing)  { resizing  = false; resizeEl = null; resizeHandle = null; resizeSnap = null; }
    cv.style.cursor = 'default'; redraw(); return;
  }
  if (!(e.buttons & 2) && panning) { panning = false; panSt = null; cv.style.cursor = 'default'; }
  const p = gp(e), w = tw(p.x, p.y);
  if (tool === 'pen' || tool === 'erase') { cursorPos = p; if (!drawing && !panning) { redraw(); return; } }

  if (panning && panSt) { vx += p.x - panSt.x; vy += p.y - panSt.y; panSt = p; redraw(); return; }

  if (tool === 'select') {
    if (rotating && rotateEl && rotateCenter) {
      const angle = Math.atan2(p.y - rotateCenter.y, p.x - rotateCenter.x);
      rotateEl.rotation = angle - rotateStartAngle;
      rotateMoved = true;
      cv.style.cursor = 'grabbing'; redraw(); return;
    }
    if (resizing) {
      if (resizeEl.type==='shape' && resizeEl.shape==='line') { applyResizeLine(w.x,w.y); }
      else { const lp=localPoint(w.x,w.y,resizeEl); applyResize(lp.x,lp.y); }
      redraw(); return;
    }
    if (dragging && dragOrigin) { applyDrag(w.x - dragOrigin.x, w.y - dragOrigin.y); redraw(); return; }
    if (selBox) { selBox.x2 = p.x; selBox.y2 = p.y; redraw(); return; }
    /* update cursor for handle hover */
    const rh = getResizeHandle(w.x, w.y);
    if (rh) {
      const RC = {tl:'nwse-resize',t:'ns-resize',tr:'nesw-resize',r:'ew-resize',
                  br:'nwse-resize',b:'ns-resize',bl:'nesw-resize',l:'ew-resize',
                  p1:'crosshair',p2:'crosshair',pm:'move'};
      const isLkd = rh.el.type==='shape' && rh.el.shape==='line' && lineLockedHandles.has(rh.handle);
      cv.style.cursor = isLkd ? 'pointer' : (RC[rh.handle] || 'default');
    } else {
      const hovEl = getElemAt(w.x, w.y);
      cv.style.cursor = (hovEl || (selected.size > 0 && isInSelBox(w.x, w.y))) ? 'move' : 'default';
    }
    updateCSHoverAxis(w.x, w.y);
    return;
  }

  /* track which CS axis mouse is near (for scroll-on-tick) */
  updateCSHoverAxis(w.x, w.y);

  if (!drawing) return;
  if (tool === 'erase') { eraseAt(p.x, p.y); redraw(); return; }
  if (tool === 'text' && cur?._drag) {
    cur.w = Math.max(30, w.x - cur.x); cur.h = Math.max(20, w.y - cur.y); redraw(); return;
  }
  if (tool === 'pen' && cur) {
    if (e.shiftKey) {
      cur.pts = [cur.pts[0], w]; // Shift: прямая линия — только начало + текущая точка
    } else {
      cur.pts.push(w);
    }
    redraw(); return;
  }
  if ((tool === 'geo_line' || tool === 'geo_rect' || tool === 'geo_ellipse') && cur) {
    cur.x2 = w.x; cur.y2 = w.y;
    /* Shift = constrain proportions */
    if (e.shiftKey) {
      const dx = cur.x2 - cur.x1, dy = cur.y2 - cur.y1;
      const sz = Math.max(Math.abs(dx), Math.abs(dy));
      cur.x2 = cur.x1 + Math.sign(dx) * sz;
      cur.y2 = cur.y1 + Math.sign(dy) * sz;
    }
    redraw();
  }
}

function onUp(e) {
  if (panning) {
    panning = false; panSt = null;
    cv.style.cursor = tool === 'select' ? 'default' : 'crosshair'; return;
  }

  if (tool === 'select') {
    if (rotating) {
      rotating = false;
      if (rotateEl && rotateMoved) {
        const _rotEl = rotateEl;
        wsSend({ type: 'erase_stroke', id: _rotEl.id });
        setTimeout(() => wsSend({ type: 'stroke', data: _rotEl }), 40);
      } else {
        undoStack.pop(); // no actual rotation — discard snapshot
      }
      rotateEl = null; rotateCenter = null;
      cv.style.cursor = 'default'; redraw(); return;
    }
    if (resizing) {
      resizing = false;
      const _resEl = resizeEl, _s = resizeSnap, _h = resizeHandle;
      /* Line: check if element actually changed (click = toggle lock, drag = commit) */
      const unchanged = _resEl.type === 'shape'
        ? (_resEl.x1 === _s.x1 && _resEl.y1 === _s.y1 && _resEl.x2 === _s.x2 && _resEl.y2 === _s.y2)
        : false;
      if (_resEl.type === 'shape' && _resEl.shape === 'line' && unchanged) {
        undoStack.pop(); // click = toggle lock, not a real resize
        lineLockedHandles.has(_h) ? lineLockedHandles.delete(_h) : lineLockedHandles.add(_h);
      } else {
        wsSend({ type: 'erase_stroke', id: _resEl.id });
        setTimeout(() => wsSend({ type: 'stroke', data: _resEl }), 40);
        /* Refresh CS panel if a CS axis endpoint was dragged */
        if (_resEl.csPartner) {
          const _csPartner = all.find(e => e.id === _resEl.csPartner);
          if (_csPartner) setTimeout(() => updateCSPanels(_resEl, _csPartner), 60);
        }
      }
      resizeEl = null; resizeHandle = null; resizeSnap = null;
      cv.style.cursor = 'default'; redraw(); return;
    }
    if (dragging) {
      dragging = false; dragOrigin = null;
      if (dragMoved) commitDrag();
      else undoStack.pop(); // no movement — discard snapshot
      cv.style.cursor = 'default';
    }
    if (selBox) {
      const found = elemsInRect(selBox.x1, selBox.y1, selBox.x2, selBox.y2);
      if (!e?.shiftKey) selected.clear();
      found.forEach(el => selected.add(el.id));
      /* CS unified: rubber-band selection also adds CS partners */
      found.forEach(el => { if (el.csPartner) { const p=all.find(e=>e.id===el.csPartner); if(p) selected.add(p.id); } });
      selBox = null; updateSelBar();
    }
    redraw(); return;
  }

  if (!drawing) return; drawing = false;

  /* ── Text drag finalize ── */
  if (tool === 'text' && cur?._drag) {
    addToUndo(); // snapshot before adding text element
    delete cur._drag;
    if (cur.w < 40) cur.w = textBoxW;
    if (cur.h < 30) cur.h = 60;
    all.push(cur);
    openTextEditor(cur, true);
    cur = null; return;
  }

  if (tool === 'pen' && cur && cur.pts.length >= 2) {
    all.push(cur); wsSend({ type: 'stroke', data: cur });
  }
  if ((tool === 'geo_line' || tool === 'geo_rect' || tool === 'geo_ellipse') && cur) {
    if (Math.abs(cur.x2 - cur.x1) > 1 || Math.abs(cur.y2 - cur.y1) > 1) {
      all.push(cur); wsSend({ type: 'stroke', data: cur });
    }
  }
  cur = null; redraw();
}

function eraseAt(sx, sy) {
  const w = tw(sx, sy);
  const r = (penSize + 6) / vz;
  for (let i = all.length - 1; i >= 0; i--) {
    const el = all[i];
    const hit = hitTest(el, w.x, w.y) ||
                (el.type === 'stroke' && el.pts?.some(p => Math.hypot(p.x-w.x, p.y-w.y) < r));
    if (hit) { wsSend({ type: 'erase_stroke', id: el.id }); all.splice(i, 1); return; }
  }
}

cv.addEventListener('mousedown',  onDown);
cv.addEventListener('mousemove',  onMove);
cv.addEventListener('mouseup',    onUp);
cv.addEventListener('mouseleave', e => { cursorPos = null; redraw(); });
/* Catch mouse-up outside canvas so dragging/panning state doesn't go stale */
document.addEventListener('mouseup', e => {
  if (dragging || panning || resizing || rotating) onUp(e);
});
cv.addEventListener('contextmenu', e => e.preventDefault());
/* Double-click: select CS parallelogram, or open text editor */
cv.addEventListener('dblclick', e => {
  if (tool !== 'select') return;
  const p = gp(e), w = tw(p.x, p.y);
  /* Check CS parallelogram hit first — select both CS axes */
  const csPair = csParallelogramAt(w.x, w.y);
  if (csPair) {
    e.preventDefault();
    selected.clear(); lineLockedHandles.clear(); sbLineOrder = 0;
    selected.add(csPair.la.id); selected.add(csPair.lb.id);
    updateSelBar(); redraw(); return;
  }
  const el = getElemAt(w.x, w.y);
  if (el && el.type === 'text') { e.preventDefault(); addToUndo(); openTextEditor(el, false); }
});

/* Touch */
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) onDown({ button:0, ...e, touches: e.touches });
  else { panning = true; panSt = gp(e); }
}, { passive: false });
cv.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e); }, { passive: false });
cv.addEventListener('touchend',   e => { e.preventDefault(); onUp(e);   });

/* ─── CS axis near-mouse detection (for scroll-on-tick) ─── */
let csHoverAxis = null;  // {el} of CS axis closest to mouse, or null
function updateCSHoverAxis(wx, wy) {
  const DIST_THRESH = 18 / vz;  // world units
  let best = null, bestD = DIST_THRESH;
  const seen = new Set();
  for (const el of all) {
    if (!el.csPartner) continue;
    const key = el.id < el.csPartner ? el.id+':'+el.csPartner : el.csPartner+':'+el.id;
    if (seen.has(key)) continue; seen.add(key);
    // project mouse onto this line segment
    const vp = getVisualPts(el);
    const dx=vp.p2.x-vp.p1.x, dy=vp.p2.y-vp.p1.y;
    const len2=dx*dx+dy*dy; if(len2<1e-9) continue;
    const t=Math.max(0,Math.min(1,((wx-vp.p1.x)*dx+(wy-vp.p1.y)*dy)/len2));
    const px=vp.p1.x+t*dx-wx, py=vp.p1.y+t*dy-wy;
    const d=Math.hypot(px,py);
    if(d<bestD){ bestD=d; best=el; }
    // also check partner
    const partner=all.find(e=>e.id===el.csPartner); if(!partner) continue;
    const vp2=getVisualPts(partner);
    const dx2=vp2.p2.x-vp2.p1.x, dy2=vp2.p2.y-vp2.p1.y;
    const len22=dx2*dx2+dy2*dy2; if(len22<1e-9) continue;
    const t2=Math.max(0,Math.min(1,((wx-vp2.p1.x)*dx2+(wy-vp2.p1.y)*dy2)/len22));
    const px2=vp2.p1.x+t2*dx2-wx, py2=vp2.p1.y+t2*dy2-wy;
    const d2=Math.hypot(px2,py2);
    if(d2<bestD){ bestD=d2; best=partner; }
  }
  csHoverAxis=best;
}

/* Snap tick step to a nice value: 0.1,0.2,0.5,1,2,5,10,20,50… */
function snapTickStep(v, up) {
  const NICE=[0.1,0.2,0.25,0.5,1,2,5,10,20,50,100];
  if (up) {
    for(const n of NICE) if(n>v+1e-9) return n;
    return v*2;
  } else {
    for(let i=NICE.length-1;i>=0;i--) if(NICE[i]<v-1e-9) return NICE[i];
    return Math.max(0.01, v/2);
  }
}

/* Snap CS range to a nice value: 0.5,1,2,5,10,20,50,100,200,500,1000…
   up=true → more units visible (zoom out), up=false → fewer (zoom in) */
function snapRange(v, up) {
  const NICE=[0.5,1,2,5,10,20,50,100,200,500,1000,2000,5000];
  if (up) {
    for(const n of NICE) if(n>v+1e-9) return n;
    return v*2;
  } else {
    for(let i=NICE.length-1;i>=0;i--) if(NICE[i]<v-1e-9) return NICE[i];
    return Math.max(0.1, v/2);
  }
}

/* Wheel = zoom, OR adjust CS range (density) when hovering a CS axis */
cv.addEventListener('wheel', e => {
  e.preventDefault();
  if (csHoverAxis) {
    /* Scroll on CS axis → adjust range (zoom in/out on axis scale)
       scroll up (deltaY<0) = zoom in = fewer units visible = smaller range
       scroll down (deltaY>0) = zoom out = more units visible = larger range */
    const ax = csHoverAxis;
    const hl = Math.hypot((ax.x2-ax.x1)/2, (ax.y2-ax.y1)/2);
    const curRange = hl / (ax.csScale || 50);
    const zoomOut = e.deltaY > 0;  // scroll down = more units visible
    const newRange = snapRange(curRange, zoomOut);
    ax.csScale = hl / Math.max(0.001, newRange);
    /* update panel if visible */
    const panel = document.getElementById('csSetPanel');
    if (panel.classList.contains('open')) {
      const partner = all.find(e=>e.id===ax.csPartner);
      if (partner) {
        const la = ax.csPartner === partner.id ? ax : partner;
        const lb = la===ax ? partner : ax;
        updateCSPanels(la, lb);
      }
    }
    wsSend({type:'erase_stroke',id:ax.id});
    setTimeout(()=>wsSend({type:'stroke',data:ax}),40);
    redraw();
  } else {
    /* Normal global zoom */
    const p=gp(e), d=e.deltaY>0?0.9:1.1;
    const nz=Math.max(0.05,Math.min(20,vz*d));
    vx=p.x-(p.x-vx)*nz/vz; vy=p.y-(p.y-vy)*nz/vz; vz=nz; redraw();
  }
}, { passive: false });

// ══════════════════════════════════════════════════════════
// §16  KEYBOARD
// ══════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target === ted) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.code === 'Space') { e.preventDefault(); spDown = true; if (!drawing) cv.style.cursor = 'grab'; return; }

  const k = e.key.toLowerCase();

  /* ESC — закрыть пикер / сбросить выделение */
  if (k === 'escape') {
    e.preventDefault();
    if (geoPicking) { hideGeoPicker(); return; }
    commitTextEdit(); clearSel(); setTool('select'); return;
  }

  /* ── Навигация в геопикере ── */
  if (geoPicking) {
    if (k === 'arrowdown' || k === 'arrowright') { geoPickIdx = (geoPickIdx+1) % 3; updateGeoPickerHighlight(); e.preventDefault(); return; }
    if (k === 'arrowup'   || k === 'arrowleft')  { geoPickIdx = (geoPickIdx+2) % 3; updateGeoPickerHighlight(); e.preventDefault(); return; }
    if (k === 'enter') { setTool(GEO_TOOLS[geoPickIdx]); hideGeoPicker(); e.preventDefault(); return; }
    if (k === 'l' || k === 'д') { geoPickIdx=0; setTool('geo_line');    hideGeoPicker(); e.preventDefault(); return; }
    if (k === 'r' || k === 'к') { geoPickIdx=1; setTool('geo_rect');    hideGeoPicker(); e.preventDefault(); return; }
    if (k === 'c' || k === 'с') { geoPickIdx=2; setTool('geo_ellipse'); hideGeoPicker(); e.preventDefault(); return; }
    if (k === 'g' || k === 'п') { hideGeoPicker(); e.preventDefault(); return; }
    e.preventDefault(); return; // поглощаем все клавиши пока пикер открыт
  }

  /* ── R: отслеживать зажатие для горячих клавиш вращения ──
     Ставим ДО Ctrl-блока чтобы Ctrl+Arrow работало для точного вращения */
  if (k === 'r' || k === 'к') { rKeyDown = true; e.preventDefault(); return; }

  /* ── R + стрелки/AD → вращение выделения ── */
  if (rKeyDown && selected.size >= 1) {
    const isLeft  = k === 'arrowleft'  || k === 'a' || k === 'ф';
    const isRight = k === 'arrowright' || k === 'd' || k === 'в';
    if (isLeft || isRight) {
      e.preventDefault();
      /* Shift=15°, Ctrl=0.5°, иначе 2° */
      const step = e.shiftKey ? 15*Math.PI/180 : e.ctrlKey ? 0.5*Math.PI/180 : 2*Math.PI/180;
      const da   = isLeft ? -step : step;
      if (selected.size === 1) {
        /* Одиночное: вращать на месте */
        const el = all.find(x => x.id === [...selected][0]);
        if (el) {
          el.rotation = (el.rotation || 0) + da;
          wsSend({ type: 'erase_stroke', id: el.id });
          setTimeout(() => wsSend({ type: 'stroke', data: el }), 40);
          redraw();
        }
      } else {
        /* Группа: вращать всё вокруг общего центра bbox */
        let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
        for (const id of selected) {
          const el = all.find(x => x.id === id); if (!el) continue;
          const bb = elemBBox(el); if (!bb) continue;
          minX=Math.min(minX,bb.x); minY=Math.min(minY,bb.y);
          maxX=Math.max(maxX,bb.x+bb.w); maxY=Math.max(maxY,bb.y+bb.h);
        }
        const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
        for (const id of selected) {
          const el = all.find(x => x.id === id); if (!el) continue;
          rotateElementAround(el, cx, cy, da);
          wsSend({ type: 'erase_stroke', id: el.id });
          setTimeout(() => wsSend({ type: 'stroke', data: el }), 40);
        }
        redraw();
      }
      return;
    }
  }

  /* ── Ctrl / Meta комбинации — ПОСЛЕ R-блока чтобы Ctrl+Arrow работал ── */
  if (e.ctrlKey || e.metaKey) {
    if (e.code === 'KeyZ') { e.preventDefault(); doUndo(); return; }
    if (e.code === 'KeyC') { e.preventDefault(); doCopy(); return; }
    if (e.code === 'KeyX') { e.preventDefault(); doCut();  return; }
    /* Ctrl+V is handled by document 'paste' event listener */
    return; // остальные Ctrl+key не пробрасываем как инструменты
  }

  /* ── Инструменты (только без Ctrl/Meta) ── */
  if (k === 'v' || k === 'м')      { setTool('select');  return; }
  if (k === 'p' || k === 'з')      { setTool('pen');     return; }
  if (k === 'e' || k === 'у')      { setTool('erase');   return; }
  if (k === 'i' || k === 'ш')      { openMediaPicker(); return; }
  if (k === 'g' || k === 'п')      { showGeoPicker();   return; }
  if (k === 't' || k === 'е')      { setTool('text');   return; }

  /* ── Удалить выделенное ── */
  if ((k === 'delete' || k === 'backspace') && selected.size) {
    addToUndo();
    for (const id of selected) { all = all.filter(el => el.id !== id); wsSend({ type: 'erase_stroke', id }); }
    clearSel(); redraw();
  }
});

document.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    spDown = false;
    if (!panning) cv.style.cursor = tool === 'select' ? 'default' : 'crosshair';
  }
  const k = e.key.toLowerCase();
  if (k === 'r' || k === 'к') rKeyDown = false;
});

// ══════════════════════════════════════════════════════════
// §17  WEBSOCKET
// ══════════════════════════════════════════════════════════
const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
const tok   = localStorage.getItem('token');
let ws = null, rc = 0;

function connect() {
  ws = new WebSocket(`${proto}//${location.host}/ws/board/${SID}?token=${tok}`);
  ws.onopen  = () => { document.getElementById('status').textContent = '✓'; rc = 0; ws.send(JSON.stringify({ type: 'load' })); };
  ws.onclose = () => { document.getElementById('status').textContent = '⚠'; setTimeout(() => { rc++; if (rc < 30) connect(); }, 1000 * Math.min(rc+1, 5)); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if      (m.type === 'hello')        myId = m.user_id;
    else if (m.type === 'strokes')      { all = m.data || []; redraw(); }
    else if (m.type === 'stroke')       { all.push(m.data); redraw(); }
    else if (m.type === 'clear')        { all = []; redraw(); }
    else if (m.type === 'erase_stroke') { all = all.filter(s => s.id !== m.id); redraw(); }
  };
}
connect();

function wsSend(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }

// §18  ACTIONS
// ══════════════════════════════════════════════════════════
/* doUndo is defined in §8d above */
function doClear() {
  if (confirm('Очистить всю доску?')) {
    addToUndo();
    all = []; clearSel(); redraw(); wsSend({ type: 'clear' });
  }
}

// §19  STARTUP
// ══════════════════════════════════════════════════════════
applyTheme();
resize();
setTool('select');

/* selBar: auto-hide on mouse leave with 600ms lag */
(function() {
  const bar = document.getElementById('selBar');
  let t;
  bar.addEventListener('mouseenter', () => clearTimeout(t));
  bar.addEventListener('mouseleave', () => { t = setTimeout(() => bar.classList.remove('open'), 600); });
})();

/* ── Media: open file picker ── */
function openMediaPicker() { document.getElementById('mediaInput').click(); }

/* Process an image File/Blob: read as DataURL, create element on board */
function processImageFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const src = ev.target.result;
    const img = new Image();
    img.onload = () => {
      addToUndo();
      let w = img.naturalWidth, h = img.naturalHeight;
      const maxW = 600, maxH = 500;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
      const pos = tw(W / 2, H / 2);
      const el = { type: 'image', id: gid(), x: pos.x - w/2, y: pos.y - h/2, w, h, src };
      imgSrcStore.set(el.id, src);
      imgCache.set(el.id, { img, loaded: true });
      all.push(el);
      wsSend({ type: 'stroke', data: el });
      selected.clear(); selected.add(el.id);
      setTool('select');
      redraw(); updateSelBar();
    };
    img.src = src;
  };
  reader.readAsDataURL(file);
}

/* File input change → process selected image */
document.getElementById('mediaInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) processImageFile(file);
  e.target.value = '';
});

/* ── Paste event: image from clipboard, rich text, or board elements ── */
document.addEventListener('paste', e => {
  if (e.target === ted) return;
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;

  const items = [...(e.clipboardData?.items || [])];

  /* 1. Image (screenshot, Ctrl+C from image editor) */
  const imgItem = items.find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (imgItem) {
    e.preventDefault();
    const file = imgItem.getAsFile();
    if (file) processImageFile(file);
    return;
  }

  /* 2. HTML (formatted text from Word, browser, etc.) */
  const htmlItem = items.find(i => i.type === 'text/html');
  if (htmlItem) {
    e.preventDefault();
    htmlItem.getAsString(html => {
      addToUndo();
      const pos = tw(W / 2, H / 2);
      const el = { type: 'richtext', id: gid(), x: pos.x - 150, y: pos.y - 60, w: 320, h: 180, html };
      all.push(el);
      wsSend({ type: 'stroke', data: el });
      selected.clear(); selected.add(el.id);
      redraw(); updateSelBar();
    });
    return;
  }

  /* 3. Board elements from clipboard */
  if (clipboard.length) { e.preventDefault(); doPaste(); }
});

/* Draggable text editor */
(function() {
  const tedWrap = document.getElementById('ted-wrap');
  const tedBar  = document.getElementById('ted-bar');
  let tdrag = false, tdx = 0, tdy = 0, tlx = 0, tly = 0;
  tedBar.addEventListener('mousedown', e => {
    e.stopPropagation();
    tdrag = true;
    tdx = e.clientX; tdy = e.clientY;
    tlx = parseInt(tedWrap.style.left) || 0;
    tly = parseInt(tedWrap.style.top)  || 0;
  });
  document.addEventListener('mousemove', e => {
    if (!tdrag) return;
    const nx = tlx + e.clientX - tdx, ny = tly + e.clientY - tdy;
    tedWrap.style.left = nx + 'px'; tedWrap.style.top = ny + 'px';
    /* sync world position of text element */
    if (tedEl) { const wc = tw(nx - 56, ny); tedEl.x = wc.x; tedEl.y = wc.y; redraw(); }
  });
  document.addEventListener('mouseup', () => { tdrag = false; });
})();

/* JS-based submenu hover — reliable across gap + overlapping panels */
document.querySelectorAll('.tw').forEach(tw => {
  const sm = tw.querySelector('.sm');
  let hideTimer;
  const show = () => { clearTimeout(hideTimer); sm.style.display = 'flex'; };
  const hide = () => { hideTimer = setTimeout(() => { sm.style.display = ''; }, 250); };
  tw.addEventListener('mouseenter', show);
  tw.addEventListener('mouseleave', hide);
  sm.addEventListener('mouseenter', show);
  sm.addEventListener('mouseleave', hide);
});
