          return{t:'surd',p:sg*(pr/gv),s:sg*(s/gv),n,q:q/gv};
        }
      }
    }
  }
  return null;
}

function toExactVal(x, tol=3e-6){
  if(!isFinite(x))return{t:'dec',v:x};
  const base=_toExactBase(x,tol);
  if(base)return base;
  /* Nested surd: try x = sqrt(expr) → x²  should be recognizable */
  const sg=x<0?-1:1,ax=Math.abs(x);
  const xsq=_toExactBase(ax*ax,tol);
  if(xsq&&xsq.t!=='dec'){
    const chk=_evalExact(xsq);
    if(isFinite(chk)&&Math.abs(Math.sqrt(Math.abs(chk))-ax)<tol*100){
      return{t:'sqrtsurd',inner:xsq,sign:sg};
    }
  }
  return{t:'dec',v:x};
}

/* ── LaTeX string generation ──────────────────────────────── */
function toLatexStr(ev){
  if(!ev||ev.t==='dec')return(ev?ev.v:NaN).toFixed(4);
  if(ev.t==='rat'){
    if(ev.q===1)return String(ev.p);
    const neg=ev.p<0;
    return (neg?'-':'') + `\\dfrac{${Math.abs(ev.p)}}{${ev.q}}`;
  }
  if(ev.t==='surd'){
    const sqrtStr=`\\sqrt{${ev.n}}`;
    let numStr;
    if(ev.p===0){
      numStr=ev.s===1?sqrtStr:ev.s===-1?`-${sqrtStr}`:`${ev.s}${sqrtStr}`;
    } else {
      const spart=Math.abs(ev.s)===1?(ev.s<0?`-${sqrtStr}`:`+${sqrtStr}`):(ev.s<0?`${ev.s}${sqrtStr}`:`+${ev.s}${sqrtStr}`);
      numStr=`${ev.p}${spart}`;
    }
    if(ev.q===1)return numStr;
    return`\\dfrac{${numStr}}{${ev.q}}`;
  }
  if(ev.t==='sqrtsurd'){
    const inner=toLatexStr(ev.inner);
    const needs=ev.inner.t==='surd'||ev.inner.t==='rat'&&ev.inner.q>1;
    const s=(ev.sign<0?'-':'') + `\\sqrt{${inner}}`;
    return s;
  }
  return'?';
}

function makeCoordLatex(xv,yv){
  return`\\left(${toLatexStr(xv)};\\;${toLatexStr(yv)}\\right)`;
}

function _segsFromExact(ev){
  if(!ev||ev.t==='dec')return[{k:'t',s:ev?ev.v.toFixed(4):'?'}];
  if(ev.t==='rat'){
    if(ev.q===1)return[{k:'t',s:String(ev.p)}];
    return[{k:'f',n:[{k:'t',s:String(ev.p)}],d:[{k:'t',s:String(ev.q)}]}];
  }
  if(ev.t==='surd'){
    const numSegs=[];
    if(ev.p!==0)numSegs.push({k:'t',s:String(ev.p)});
    if(ev.s!==0){
      if(ev.p!==0)numSegs.push({k:'t',s:ev.s>0?'+':''});
      if(ev.s<0)numSegs.push({k:'t',s:'-'});
      const absS=Math.abs(ev.s);
      if(absS!==1)numSegs.push({k:'t',s:String(absS)});
      numSegs.push({k:'r',c:[{k:'t',s:String(ev.n)}]});
    }
    if(ev.q===1)return numSegs;
    return[{k:'f',n:numSegs,d:[{k:'t',s:String(ev.q)}]}];
  }
  return[{k:'t',s:'?'}];
}

function makeCoordSegs(xv,yv){
  return[{k:'t',s:'('},..._segsFromExact(xv),{k:'t',s:'; '},..._segsFromExact(yv),{k:'t',s:')'}];
}

/* Legacy text formatter (hover labels etc.) */
function fmtExact(x){
  const ev=toExactVal(x);
  if(!ev||ev.t==='dec')return x.toFixed(4);
  if(ev.t==='rat')return ev.q===1?String(ev.p):`${ev.p}/${ev.q}`;
  if(ev.t==='surd'){
    const sp=ev.s===1?`√${ev.n}`:ev.s===-1?`-√${ev.n}`:`${ev.s}√${ev.n}`;
    const num=ev.p===0?sp:`${ev.p}${ev.s>0?'+':''}${sp}`;
    return ev.q===1?num:`(${num})/${ev.q}`;
  }
  return x.toFixed(4);
}
function fmtCoord(x){return fmtExact(x);}

/* ── Exact quadratic solver ────────────────────────────────
   Solves A·t²+B·t+C=0, returns array of exact-val objects  */
function solveQuadExact(A,B,C){
  /* Snap coefficients to integer multiples via lcm of denominators */
  const rA=_snapRat(A,200),rB=_snapRat(B,200),rC=_snapRat(C,200);
  let IA,IB,IC;
  if(rA&&rB&&rC){
    const L=_lcm3(Math.abs(rA[1]),Math.abs(rB[1]),Math.abs(rC[1]));
    IA=Math.round(rA[0]*L/rA[1]); IB=Math.round(rB[0]*L/rB[1]); IC=Math.round(rC[0]*L/rC[1]);
  } else {
    /* fallback: use float roots then try to snap */
    const disc=B*B-4*A*C; if(disc<-1e-9)return[];
    const sq=Math.sqrt(Math.max(0,disc));
    if(Math.abs(disc)<1e-9)return[toExactVal(-B/(2*A))];
    return[toExactVal((-B-sq)/(2*A)),toExactVal((-B+sq)/(2*A))];
  }
  if(IA===0){if(IB===0)return[];const r=_snapRat(-IC/IB);return r?[{t:'rat',p:r[0],q:r[1]}]:[toExactVal(-IC/IB)];}
  const disc=IB*IB-4*IA*IC;
  if(disc<-1e-9)return[];
  if(Math.abs(disc)<1e-3){const r=_snapRat(-IB/(2*IA));return r?[{t:'rat',p:r[0],q:r[1]}]:[toExactVal(-IB/(2*IA))];}
  /* Try perfect-square discriminant */
  const sqI=Math.round(Math.sqrt(Math.abs(disc)));
  if(sqI*sqI===Math.abs(disc)&&disc>0){
    const mk=(p,q)=>{const r=_snapRat(p/q);return r?{t:'rat',p:r[0],q:r[1]}:toExactVal(p/q);};
    return[mk(-IB-sqI,2*IA),mk(-IB+sqI,2*IA)];
  }
  /* Factor disc: disc = k²·m (m square-free) */
  let m=Math.abs(Math.round(disc)),k=1;
  if(Math.abs(disc-Math.round(disc))<0.5){
    for(let pp=2;pp*pp<=m;pp++)while(m%(pp*pp)===0){k*=pp;m=Math.round(m/(pp*pp));}
  }
  /* Roots: (-IB ± k·√m) / (2·IA) — simplify by gcd */
  const g=_gcd(_gcd(Math.abs(IB)||1,k||1),Math.abs(2*IA)||1);
  const p0=-IB/g,kn=k/g,qn=2*IA/g;
  const sgn=qn<0?-1:1;
  const QQ=Math.abs(qn);
  return[
    {t:'surd',p:sgn*p0,s:-sgn*kn,n:m,q:QQ},
    {t:'surd',p:sgn*p0,s: sgn*kn,n:m,q:QQ}
  ];
}

/* ── Polynomial degree detection ──────────────────────────── */
function detectLinear(rhs,params){
  const ys=[1,2,3].map(x=>mathEval(rhs,x,0,params));
  if(ys.some(y=>!isFinite(y)))return null;
  if(Math.abs(ys[0]-2*ys[1]+ys[2])>1e-6)return null;
  const slope=ys[1]-ys[0];return{slope,intercept:ys[0]-slope};
}
function detectQuadratic(rhs,params){
  const ys=[1,2,3,4].map(x=>mathEval(rhs,x,0,params));
  if(ys.some(y=>!isFinite(y)))return null;
  const d2a=ys[0]-2*ys[1]+ys[2],d2b=ys[1]-2*ys[2]+ys[3];
  if(Math.abs(d2a-d2b)>1e-6||Math.abs(d2a)<1e-9)return null;
  const A=d2a/2,B=ys[1]-ys[0]-3*A,C=ys[0]-A-B;return{A,B,C};
}
function detectCubic(rhs,params){
  const xs=[1,2,3,4,5].map(i=>i);
  const ys=xs.map(x=>mathEval(rhs,x,0,params));
  if(ys.some(y=>!isFinite(y)))return null;
  /* 3rd-order finite diff should be constant */
  const d3=[[0,1,2,3],[1,2,3,4]].map(([a,b,c,d])=>ys[d]-3*ys[c]+3*ys[b]-ys[a]);
  if(Math.abs(d3[0]-d3[1])>1e-5||Math.abs(d3[0])<1e-9)return null;
  const A=d3[0]/6;
  const B=(ys[1]-ys[0]-7*A)/1; /* oversimplified placeholder */ void B;
  return{cubic:true};  /* flag only — numeric fallback handles cubic */
}

/* ── Algebraic intersection solver ─────────────────────────
   Returns [{mathX,mathY,xExact,yExact}] or null (→ numeric) */
function _evalExact(ev){
  if(!ev)return NaN;
  if(ev.t==='rat')return ev.p/ev.q;
  if(ev.t==='surd')return(ev.p+ev.s*Math.sqrt(ev.n))/ev.q;
  return ev.v;
}

function algebraicIntersect(g1,g2,params){
  const p1=parseEqn(g1.eq),p2=parseEqn(g2.eq);
  if(!p1||!p2||p1.mode!=='yfx'||p2.mode!=='yfx')return null;
  const l1=detectLinear(p1.rhs,params),l2=detectLinear(p2.rhs,params);
  const q1=!l1?detectQuadratic(p1.rhs,params):null;
  const q2=!l2?detectQuadratic(p2.rhs,params):null;

  /* line × line */
  if(l1&&l2){
    const dm=l1.slope-l2.slope;if(Math.abs(dm)<1e-12)return[];
    const xi=(l2.intercept-l1.intercept)/dm;
    const xv=toExactVal(xi),yv=toExactVal(l1.slope*xi+l1.intercept);
    return[{mathX:xi,mathY:_evalExact(yv),xExact:xv,yExact:yv}];
  }

  /* line × parabola */
  if((l1&&q2)||(q1&&l2)){
    const lin=l1||l2,quad=q1||q2;
    const roots=solveQuadExact(quad.A,quad.B-lin.slope,quad.C-lin.intercept);
    return roots.map(xv=>{
      const xi=_evalExact(xv);
      const yi=lin.slope*xi+lin.intercept;
      return{mathX:xi,mathY:yi,xExact:xv,yExact:toExactVal(yi)};
    });
  }

  /* parabola × parabola */
  if(q1&&q2){
    const dA=q1.A-q2.A,dB=q1.B-q2.B,dC=q1.C-q2.C;
    let roots;
    if(Math.abs(dA)<1e-9){
      if(Math.abs(dB)<1e-9)return Math.abs(dC)<1e-9?null:[];
      const xv=toExactVal(-dC/dB);roots=[xv];
    } else {
      roots=solveQuadExact(dA,dB,dC);
    }
    return roots.map(xv=>{
      const xi=_evalExact(xv);
      const yi=q1.A*xi*xi+q1.B*xi+q1.C;
      return{mathX:xi,mathY:yi,xExact:xv,yExact:toExactVal(yi)};
    });
  }

  return null; /* fall through to numerical */
}

function numericalIntersect(g1,g2,rangeA,rangeB,offA,offB,params){
  const p1=parseEqn(g1.eq),p2=parseEqn(g2.eq);if(!p1||!p2)return[];
  const F1=(x,y)=>p1.mode==='yfx'?y-mathEval(p1.rhs,x,0,params):p1.mode==='xfy'?x-mathEval(p1.rhs,0,y,params):mathEval(p1.lhs,x,y,params)-mathEval(p1.rhs,x,y,params);
  const F2=(x,y)=>p2.mode==='yfx'?y-mathEval(p2.rhs,x,0,params):p2.mode==='xfy'?x-mathEval(p2.rhs,0,y,params):mathEval(p2.lhs,x,y,params)-mathEval(p2.rhs,x,y,params);
  const pts=[],seen=new Set();
  const hh=Math.min(rangeA,rangeB)*0.002;
  function refine(x0,y0){
    let x=x0,y=y0;
    for(let it=0;it<25;it++){
      const f1=F1(x,y),f2=F2(x,y);if(!isFinite(f1)||!isFinite(f2))return null;
      if(Math.abs(f1)<1e-11&&Math.abs(f2)<1e-11)break;
      const f1x=(F1(x+hh,y)-f1)/hh,f1y=(F1(x,y+hh)-f1)/hh;
      const f2x=(F2(x+hh,y)-f2)/hh,f2y=(F2(x,y+hh)-f2)/hh;
      const det=f1x*f2y-f1y*f2x;if(Math.abs(det)<1e-15)break;
      x-=(f1*f2y-f2*f1y)/det;y-=(f2*f1x-f1*f2x)/det;
    }
    if(!isFinite(x)||!isFinite(y))return null;
    if(Math.abs(x-offA)>rangeA*1.02||Math.abs(y-offB)>rangeB*1.02)return null;
    return{mathX:x,mathY:y};
  }
  function add(r){if(!r)return;const k=`${Math.round(r.mathX*1e5)},${Math.round(r.mathY*1e5)}`;if(seen.has(k))return;seen.add(k);const xv=toExactVal(r.mathX,1e-9),yv=toExactVal(r.mathY,1e-9);pts.push({...r,xExact:xv,yExact:yv,exact:false});}
  if(p1.mode==='yfx'&&p2.mode==='yfx'){
    const N=300;let prev=null;
    for(let i=0;i<=N;i++){
      const x=offA-rangeA+2*rangeA*i/N;
      const y1=mathEval(p1.rhs,x,0,params),y2=mathEval(p2.rhs,x,0,params),d=y1-y2;
      if(isFinite(d)){if(prev){if(Math.abs(d)<1e-9){const yi=mathEval(p1.rhs,x,0,params);if(isFinite(yi))add({mathX:x,mathY:yi});}else if(prev.s!==0&&Math.sign(d)!==0&&Math.sign(d)!==prev.s){let xa=prev.x,xb=x,fa=prev.d;for(let j=0;j<40;j++){const xm=(xa+xb)/2;const fm=mathEval(p1.rhs,xm,0,params)-mathEval(p2.rhs,xm,0,params);if(!isFinite(fm)||Math.abs(fm)<1e-12){xa=xm;break;}if(Math.sign(fm)===Math.sign(fa)){xa=xm;fa=fm;}else xb=xm;}const yi=mathEval(p1.rhs,xa,0,params);if(isFinite(yi))add({mathX:xa,mathY:yi});}}prev={x,d,s:Math.sign(d)||prev?.s||0};}else prev=null;
    }
  } else {
    const NX=60,NY=60,dx=2*rangeA/NX,dy=2*rangeB/NY;
    for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){
      const x0=offA-rangeA+i*dx,y0=offB-rangeB+j*dy;
      const corners=[[x0,y0],[x0+dx,y0],[x0+dx,y0+dy],[x0,y0+dy]];
      const f1s=corners.map(([x,y])=>F1(x,y)),f2s=corners.map(([x,y])=>F2(x,y));
      if(f1s.some(f=>!isFinite(f))||f2s.some(f=>!isFinite(f)))continue;
      const sg1=f1s.map(Math.sign).filter(s=>s!==0),sg2=f2s.map(Math.sign).filter(s=>s!==0);
      if(sg1.length<2||sg2.length<2)continue;
      if(!sg1.some(s=>s!==sg1[0])||!sg2.some(s=>s!==sg2[0]))continue;
      add(refine(x0+dx/2,y0+dy/2));
    }
  }
  return pts;
}

/* Build intersection result object from flat list of {mathX,mathY,xLatex?,yLatex?} */
function _buildISectResult(la,lb,rawPts,O,scaleA,scaleB,offA,offB,nA,nB,rangeA,rangeB){
  const toWorld=(a,b)=>({x:O.x+a*scaleA*nA.x+b*scaleB*nB.x,y:O.y+a*scaleA*nA.y+b*scaleB*nB.y});
  const seen=new Set(); const allPts=[];
  for(const pt of rawPts){
    const a=pt.mathX-offA,b=pt.mathY-offB;
    if(Math.abs(a)>rangeA*1.01||Math.abs(b)>rangeB*1.01)continue;
    const dk=`${Math.round(pt.mathX*1e4)},${Math.round(pt.mathY*1e4)}`;
    if(seen.has(dk))continue; seen.add(dk);
    const w=toWorld(a,b);
    /* Prefer SymPy LaTeX; fallback to JS exact; last resort: decimal */
    let katexStr,fallback;
    if(pt.xLatex&&pt.yLatex){
      katexStr=`\\left(${pt.xLatex};\\ ${pt.yLatex}\\right)`;
      fallback=`(${pt.xLatex}; ${pt.yLatex})`;
    } else {
      const mx=pt.mathX??pt.xFloat, my=pt.mathY??pt.yFloat;
      const xv=pt.xExact||toExactVal(mx,1e-9), yv=pt.yExact||toExactVal(my,1e-9);
      katexStr=makeCoordLatex(xv,yv);
      fallback=`(${fmtCoord(mx)}; ${fmtCoord(my)})`;
    }
    allPts.push({...pt,worldX:w.x,worldY:w.y,katex:katexStr,label:fallback});
  }
  const result={la,lb,pts:allPts};
  result._graphsKey=JSON.stringify(la.csGraphs||[])+JSON.stringify(lb.csGraphs||[]);
  return result;
}

async function computeAllIntersections(la,lb){
  const O=lineIntersection(la,lb);if(!O)return null;
  const dirA=csPositiveDir(la),dirB=csPositiveDir(lb);
  const uApos={x:dirA.posEnd.x-O.x,y:dirA.posEnd.y-O.y};
  const uBpos={x:dirB.posEnd.x-O.x,y:dirB.posEnd.y-O.y};
  const scaleA=la.csScale||50,scaleB=lb.csScale||50;
  const offA=la.csOriginA||0,offB=la.csOriginB||0;
  const lenA=Math.hypot(uApos.x,uApos.y),lenB=Math.hypot(uBpos.x,uBpos.y);
  const rangeA=lenA/scaleA,rangeB=lenB/scaleB;
  const nA={x:uApos.x/lenA,y:uApos.y/lenA},nB={x:uBpos.x/lenB,y:uBpos.y/lenB};
  const graphs=la.csGraphs||[];if(graphs.length<2)return null;
  /* Collect current parameter values */
  const _params={};for(const p of(la.csParams||[]))_params[p.name]=p.value??1;
  /* Substitute param values into equation string for SymPy */
  const _subP=eq=>{let s=eq;for(const[k,v]of Object.entries(_params))s=s.replace(new RegExp('\\b'+k+'\\b','g'),'('+v+')');return s;};
  /* For inequalities always intersect with the boundary curve, not the region */
  const _bndEq = eq => eq.replace(/<=|≤/g,'=').replace(/>=|≥/g,'=').replace(/</g,'=').replace(/>/g,'=');
  const _bnd = g => g.ineq ? {...g, eq:_bndEq(g.eq)} : g;
  const rawPts=[];
  for(let i=0;i<graphs.length;i++) for(let j=i+1;j<graphs.length;j++){
    const g1=_bnd(graphs[i]),g2=_bnd(graphs[j]);
    /* Always compute numerical/algebraic baseline — guaranteed complete */
    let numPts=algebraicIntersect(g1,g2,_params);
    if(!numPts) numPts=numericalIntersect(g1,g2,rangeA,rangeB,offA,offB,_params);

    /* Try SymPy for exact labels */
    let symPts=null;
    try{
      const r=await fetch('/api/cs/solve',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('token')},
        body:JSON.stringify({eq1:_subP(g1.eq),eq2:_subP(g2.eq)})});
      if(r.ok){const d=await r.json(); if(d.ok)symPts=d.solutions;}
    }catch{}

    if(symPts&&symPts.length>0){
      /* Merge: for each numerical point find the nearest SymPy point (within MERGE_TOL)
         and attach its exact LaTeX. Points not matched by SymPy are kept as numeric.
         SymPy points outside visible range are filtered by _buildISectResult. */
      const MERGE_TOL=1e-3;
      const MAX_LATEX=120;
      // Build SymPy point array with cleaned labels
      const spts=symPts.filter(s=>isFinite(s.xFloat)&&isFinite(s.yFloat)).map(s=>{
        const ugly=s.xLatex&&(s.xLatex.includes('operatorname')||
          s.xLatex.includes('RootOf')||s.xLatex.length>MAX_LATEX);
        return{mathX:s.xFloat,mathY:s.yFloat,
          xLatex:ugly?null:s.xLatex,yLatex:ugly?null:s.yLatex};
      });
      const usedSym=new Set();
      // Attach SymPy label to each numerical point if close enough
      const merged=numPts.map(np=>{
        let bestI=-1,bestD=MERGE_TOL;
        for(let k=0;k<spts.length;k++){
          const d=Math.hypot(spts[k].mathX-np.mathX,spts[k].mathY-np.mathY);
          if(d<bestD){bestD=d;bestI=k;}
        }
        if(bestI>=0){
          usedSym.add(bestI);
          const sp=spts[bestI];
          // Use SymPy's exact float (higher precision from solveset)
          return{...np,mathX:sp.mathX,mathY:sp.mathY,xLatex:sp.xLatex,yLatex:sp.yLatex};
        }
        return np;
      });
      // Add SymPy points that have no matching numerical counterpart
      // (numerical might have missed them due to sampling density)
      for(let k=0;k<spts.length;k++){
        if(!usedSym.has(k)) merged.push(spts[k]);
      }
      rawPts.push(...merged);
    } else {
      rawPts.push(...numPts);
    }
  }
  return _buildISectResult(la,lb,rawPts,O,scaleA,scaleB,offA,offB,nA,nB,rangeA,rangeB);
}

/* ── Calculus expression helpers ──────────────────────────── */
function _hasCalcOp(s){return /\b(diff|int|sum)\s*\(/.test(s);}

async function _callCalcAPI(eq,csParams){
  const params={};for(const p of(csParams||[]))params[p.name]=p.value??1;
  try{
    const r=await fetch('/api/cs/calc',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('token')},
      body:JSON.stringify({expr:eq,params})});
    if(r.ok)return await r.json();
  }catch{}
  return null;
}

async function _resolveCalcGraph(graph,la){
  graph.resolving=true;
  const res=await _callCalcAPI(graph.eq,la.csParams);
  graph.resolving=false;
  if(res&&res.ok&&res.resultExpr){
    graph.resolvedEq='y = '+res.resultExpr;
    graph.resultLatex=res.resultLatex;
    graph.plottable=res.plottable!==false;
  }else{
    graph.resolvedEq=null;graph.resultLatex=null;
    graph.calcError=(res&&res.error)||'Ошибка вычисления';
  }
}

/* Fast synchronous intersection (no SymPy) — used for live param slider updates */
function _computeISectNumericalSync(la,lb){
  const O=lineIntersection(la,lb);if(!O)return null;
  const dirA=csPositiveDir(la),dirB=csPositiveDir(lb);
  const uApos={x:dirA.posEnd.x-O.x,y:dirA.posEnd.y-O.y};
  const uBpos={x:dirB.posEnd.x-O.x,y:dirB.posEnd.y-O.y};
  const scaleA=la.csScale||50,scaleB=lb.csScale||50;
  const offA=la.csOriginA||0,offB=la.csOriginB||0;
  const lenA=Math.hypot(uApos.x,uApos.y),lenB=Math.hypot(uBpos.x,uBpos.y);
  const rangeA=lenA/scaleA,rangeB=lenB/scaleB;
  const nA={x:uApos.x/lenA,y:uApos.y/lenA},nB={x:uBpos.x/lenB,y:uBpos.y/lenB};
  const graphs=la.csGraphs||[];if(graphs.length<2)return null;
  const _params={};for(const p of(la.csParams||[]))_params[p.name]=p.value??1;
  const _bndEq=eq=>eq.replace(/<=|≤/g,'=').replace(/>=|≥/g,'=').replace(/</g,'=').replace(/>/g,'=');
  const _bnd=g=>g.ineq?{...g,eq:_bndEq(g.eq)}:g;
  const rawPts=[];
  for(let i=0;i<graphs.length;i++)for(let j=i+1;j<graphs.length;j++){
    const g1=_bnd(graphs[i]),g2=_bnd(graphs[j]);
    let pts=algebraicIntersect(g1,g2,_params);
    if(!pts)pts=numericalIntersect(g1,g2,rangeA,rangeB,offA,offB,_params);
    rawPts.push(...pts);
  }
  return _buildISectResult(la,lb,rawPts,O,scaleA,scaleB,offA,offB,nA,nB,rangeA,rangeB);
}

let csGraphHover=null;         // {la,lb,worldX,worldY,mathX,mathY,graph}
let csIntersections=null;      // result of computeAllIntersections or null
let csIntersectionsComputing=false;

/* ── KaTeX HTML overlay for intersection + hover labels ────── */
const _mathLabelStyle = (col,sx,sy) =>
  `position:fixed;left:${sx}px;top:${sy}px;` +
  `background:${dark?'rgba(22,27,34,0.93)':'rgba(255,255,255,0.93)'};` +
  `border:1.5px solid ${col};border-radius:5px;padding:3px 8px;` +
  `color:${col};font-size:13px;line-height:1.5;pointer-events:none;white-space:nowrap`;

function updateMathOverlay(){
  const overlay=document.getElementById('cs-math-overlay');
  if(!overlay)return;
  overlay.innerHTML='';
  const useKatex=typeof katex!=='undefined';

  function addLabel(wx,wy,col,katexStr,fallback){
    const sp=ts(wx,wy);
    const div=document.createElement('div');
    div.style.cssText=_mathLabelStyle(col,sp.x+12,sp.y-32);
    if(useKatex){
      try{katex.render(katexStr,div,{throwOnError:false,displayMode:false});}
      catch{div.textContent=fallback;}
    } else {div.textContent=fallback;}
    overlay.appendChild(div);
  }

  if(csIntersectionsComputing){
    /* Show spinner near CS origin */
    const spin=document.createElement('div');
    spin.style.cssText='position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);'+
      'background:rgba(22,27,34,0.85);color:#f59e0b;border:1px solid #f59e0b;'+
      'border-radius:6px;padding:8px 18px;font-size:14px;pointer-events:none';
    spin.textContent='⏳ Вычисляю пересечения…';
    overlay.appendChild(spin);
    return;
  }

  if(csIntersections?.pts?.length){
    for(const pt of csIntersections.pts){
      addLabel(pt.worldX,pt.worldY,'#f59e0b',pt.katex||pt.label,pt.label);
    }
  }
  if(csGraphHover){
    const col=csGraphHover.graph?.color||'#22c55e';
    const nx=csGraphHover.mathX.toFixed(4), ny=csGraphHover.mathY.toFixed(4);
    addLabel(csGraphHover.worldX,csGraphHover.worldY,col,
      `(${nx};\\ ${ny})`,`(${nx}; ${ny})`);
  }
}

/* Validate csIntersections: clear if graphs were removed or changed */
function _validateCsIntersections(){
  if(!csIntersections)return;
  const la=all.find(e=>e.id===csIntersections.la.id);
  const lb=all.find(e=>e.id===csIntersections.lb.id);
  if(!la||!lb){csIntersections=null;return;}
  const key=JSON.stringify(la.csGraphs||[])+JSON.stringify(lb.csGraphs||[]);
  if(csIntersections._graphsKey&&csIntersections._graphsKey!==key)csIntersections=null;
}

function updateCSGraphHover(wx,wy){
  const seen=new Set();let found=null;
  for(const el of all){
    if(!el.csPartner||!el.csGraphs?.length)continue;
    const partner=all.find(e=>e.id===el.csPartner);if(!partner)continue;
    const key=csKey(el.id,el.csPartner);if(seen.has(key))continue;seen.add(key);
    const la=el,lb=partner;
    const O=lineIntersection(la,lb);if(!O)continue;
    const dirA=csPositiveDir(la),dirB=csPositiveDir(lb);
    const uApos={x:dirA.posEnd.x-O.x,y:dirA.posEnd.y-O.y};
    const uBpos={x:dirB.posEnd.x-O.x,y:dirB.posEnd.y-O.y};
    const scaleA=la.csScale||50,scaleB=lb.csScale||50;
    const offA=la.csOriginA||0,offB=la.csOriginB||0;
    const lenA=Math.hypot(uApos.x,uApos.y),lenB=Math.hypot(uBpos.x,uBpos.y);
    const nA={x:uApos.x/lenA,y:uApos.y/lenA},nB={x:uBpos.x/lenB,y:uBpos.y/lenB};
    const rangeA=lenA/scaleA,rangeB=lenB/scaleB;
    const disp=csWorldToDisplay(wx,wy,O,nA,nB,scaleA,scaleB);if(!disp)continue;
    const{a:da,b:db}=disp;
    if(Math.abs(da)>rangeA*1.05||Math.abs(db)>rangeB*1.05)continue;
    const mx=da+offA,my=db+offB,THRESH=15;
    let bestD=Infinity,bestPt=null,bestG=null;
    for(const graph of la.csGraphs){
      const parsed=parseEqn(graph.eq);if(!parsed)continue;
      if(parsed.mode==='yfx'){
        const cy=mathEval(parsed.rhs,mx,0);if(!isFinite(cy))continue;
        const cb=cy-offB,d=Math.abs(db-cb)*scaleB*vz;
        if(d<THRESH&&d<bestD){bestD=d;const w={x:O.x+da*scaleA*nA.x+cb*scaleB*nB.x,y:O.y+da*scaleA*nA.y+cb*scaleB*nB.y};bestPt={worldX:w.x,worldY:w.y,mathX:mx,mathY:cy};bestG=graph;}
      }else if(parsed.mode==='xfy'){
        const cx=mathEval(parsed.rhs,0,my);if(!isFinite(cx))continue;
        const ca=cx-offA,d=Math.abs(da-ca)*scaleA*vz;
        if(d<THRESH&&d<bestD){bestD=d;const w={x:O.x+ca*scaleA*nA.x+db*scaleB*nB.x,y:O.y+ca*scaleA*nA.y+db*scaleB*nB.y};bestPt={worldX:w.x,worldY:w.y,mathX:cx,mathY:my};bestG=graph;}
      }else{
        const fn=(x,y)=>mathEval(parsed.lhs,x,y)-mathEval(parsed.rhs,x,y);
        const F0=fn(mx,my);if(!isFinite(F0))continue;
        const hh=Math.max(0.0001,Math.max(rangeA,rangeB)*0.001);
        const Fx=(fn(mx+hh,my)-F0)/hh,Fy=(fn(mx,my+hh)-F0)/hh;
        const g2=Fx*Fx+Fy*Fy;if(g2<1e-12)continue;
        const distPx=Math.abs(F0)/Math.sqrt(g2)*Math.min(scaleA,scaleB)*vz;
        if(distPx<THRESH&&distPx<bestD){
          let rx=mx,ry=my;
          for(let it=0;it<12;it++){const f=fn(rx,ry);if(Math.abs(f)<1e-10)break;const fx=(fn(rx+hh,ry)-f)/hh,fy=(fn(rx,ry+hh)-f)/hh;const g=fx*fx+fy*fy;if(g<1e-16)break;rx-=f*fx/g;ry-=f*fy/g;}
          const ra=rx-offA,rb=ry-offB;if(!isFinite(ra)||!isFinite(rb))continue;
          const fd=Math.hypot((ra-da)*scaleA,(rb-db)*scaleB)*vz;
          if(fd<THRESH&&fd<bestD){bestD=fd;const w={x:O.x+ra*scaleA*nA.x+rb*scaleB*nB.x,y:O.y+ra*scaleA*nA.y+rb*scaleB*nB.y};bestPt={worldX:w.x,worldY:w.y,mathX:rx,mathY:ry};bestG=graph;}
        }
      }
    }
    if(bestPt){found={la,lb,...bestPt,graph:bestG};break;}
  }
  const changed=(csGraphHover===null)!==(found===null)||(found&&csGraphHover&&(Math.round(csGraphHover.worldX*10)!==Math.round(found.worldX*10)||Math.round(csGraphHover.worldY*10)!==Math.round(found.worldY*10)));
  csGraphHover=found;if(changed)redraw();
}

/* Draw only the colored dot; label is rendered by KaTeX HTML overlay */
function _drawCSInfoDot(sp,col){
  ctx.beginPath();ctx.arc(sp.x,sp.y,Math.max(4,6*vz),0,Math.PI*2);
  ctx.fillStyle=col;ctx.fill();ctx.strokeStyle=dark?'#0d1117':'#fff';ctx.lineWidth=2;ctx.stroke();
}

/* Draw all active CS overlays (called from redraw) */
function drawAllCS() {
  const seen = new Set();
  for (const el of all) {
    if (!el.csPartner) continue;
    const partner = all.find(e => e.id === el.csPartner);
    if (!partner) continue;
    const key = csKey(el.id, partner.id);
    if (seen.has(key)) continue;
    seen.add(key);

    const la = el, lb = partner;
    const O = lineIntersection(la, lb);
    if (!O) continue;

    const colorA = readableColor(la.color || '#22c55e');
    const colorB = readableColor(lb.color || '#10b981');
    const scaleA = la.csScale || 50;
    const scaleB = lb.csScale || 50;
    const offA   = la.csOriginA || 0;   // CS value at physical O along axis A
    const offB   = la.csOriginB || 0;   // CS value at physical O along axis B

    const dirA = csPositiveDir(la), dirB = csPositiveDir(lb);

    // segment vectors from O toward each endpoint of each line
    const uApos = { x: dirA.posEnd.x - O.x, y: dirA.posEnd.y - O.y };
    const uBpos = { x: dirB.posEnd.x - O.x, y: dirB.posEnd.y - O.y };
    const uAneg = { x: dirA.negEnd.x - O.x, y: dirA.negEnd.y - O.y };
    const uBneg = { x: dirB.negEnd.x - O.x, y: dirB.negEnd.y - O.y };

    /* ── Parallelogram highlight ── */
    ctx.save();
    // The parallelogram bounded by the four segment ends
    const c1 = ts(O.x + uApos.x + uBpos.x, O.y + uApos.y + uBpos.y);
    const c2 = ts(O.x + uAneg.x + uBpos.x, O.y + uAneg.y + uBpos.y);
    const c3 = ts(O.x + uAneg.x + uBneg.x, O.y + uAneg.y + uBneg.y);
    const c4 = ts(O.x + uApos.x + uBneg.x, O.y + uApos.y + uBneg.y);
    ctx.beginPath();
    ctx.moveTo(c1.x,c1.y); ctx.lineTo(c2.x,c2.y);
    ctx.lineTo(c3.x,c3.y); ctx.lineTo(c4.x,c4.y);
    ctx.closePath();
    ctx.fillStyle = dark ? 'rgba(34,197,94,0.04)' : 'rgba(34,197,94,0.06)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(34,197,94,0.25)'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    /* ── Origin dot (clamped to parallelogram boundary when offset) ── */
    {
      const halfA_cs = Math.hypot(uApos.x, uApos.y) / scaleA;
      const halfB_cs = Math.hypot(uBpos.x, uBpos.y) / scaleB;
      /* mathematical origin sits at display coords (-offA, -offB) */
      const dot_a = Math.max(-halfA_cs, Math.min(halfA_cs, -offA));
      const dot_b = Math.max(-halfB_cs, Math.min(halfB_cs, -offB));
      const clamped = dot_a !== -offA || dot_b !== -offB;
      const O_dot = {
        x: O.x + dot_a * scaleA * dirA.x + dot_b * scaleB * dirB.x,
        y: O.y + dot_a * scaleA * dirA.y + dot_b * scaleB * dirB.y
      };
      const Ods = ts(O_dot.x, O_dot.y);
      ctx.save();
      ctx.beginPath(); ctx.arc(Ods.x, Ods.y, Math.max(3, 4*vz), 0, Math.PI*2);
      ctx.fillStyle = clamped ? '#f59e0b' : '#22c55e'; ctx.fill();
      ctx.strokeStyle = dark?'#060e07':'#fff'; ctx.lineWidth = 1.5; ctx.stroke();
      /* small arrow hint when clamped off-screen */
      if (clamped) {
        ctx.font = `${Math.max(9, Math.round(11*vz))}px system-ui`;
        ctx.fillStyle = '#f59e0b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('0', Ods.x, Ods.y);
      }
      ctx.restore();
    }

    /* ── Tick marks ── */
    drawCSTicks(la, O, colorA, offA);
    drawCSTicks(lb, O, colorB, offB);

    /* ── Endpoint drag handles (small diamonds, always shown when not selected) ── */
    const _csPairSel = selected.size === 2 && selected.has(la.id) && selected.has(lb.id);
    if (!_csPairSel) {
      const endpts = [
        { pt: dirA.posEnd, col: colorA }, { pt: dirA.negEnd, col: colorA },
        { pt: dirB.posEnd, col: colorB }, { pt: dirB.negEnd, col: colorB }
      ];
      ctx.save();
      for (const { pt, col } of endpts) {
        const sp = ts(pt.x, pt.y);
        ctx.save();
        ctx.translate(sp.x, sp.y); ctx.rotate(Math.PI / 4);
        ctx.fillStyle = col + '88';   // semi-transparent fill
        ctx.strokeStyle = col;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.rect(-5, -5, 10, 10); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    }

    /* ── Graphs ── */
    const hasDirection = la.arrow && la.arrow !== 'none' &&
                         lb.arrow && lb.arrow !== 'none';
    if (hasDirection && csIntersectionInView(O) && la.csGraphs) {
      const _params = {};
      for (const p of (la.csParams || [])) _params[p.name] = p.value ?? 1;
      for (const graph of la.csGraphs) {
        drawCSGraph(O, uApos, uBpos, scaleA, scaleB, graph, offA, offB, _params);
      }
      /* ── Hover dot ── */
      const _myKey = csKey(la.id, lb.id);
      if (csGraphHover && csKey(csGraphHover.la.id, csGraphHover.lb.id) === _myKey) {
        const sp = ts(csGraphHover.worldX, csGraphHover.worldY);
        const col = csGraphHover.graph.color || '#ef4444';
        ctx.save();
        _drawCSInfoDot(sp, col);
        ctx.restore();
      }
      /* ── Intersection dots ── */
      const _hasISect = csIntersections && csIntersections.pts?.length > 0 &&
        csKey(csIntersections.la.id, csIntersections.lb.id) === _myKey;
      if (_hasISect) {
        ctx.save();
        for (const pt of csIntersections.pts) {
          _drawCSInfoDot(ts(pt.worldX, pt.worldY), '#f59e0b');
        }
        ctx.restore();
      }
    }
  }
}

/* ── Copy graph curve onto board as a stroke element ── */
function graphToStroke(la, lb, graph) {
  const O = lineIntersection(la, lb);
  if (!O) return;
  const dirA  = csPositiveDir(la), dirB = csPositiveDir(lb);
  const uApos = { x: dirA.posEnd.x-O.x, y: dirA.posEnd.y-O.y };
  const uBpos = { x: dirB.posEnd.x-O.x, y: dirB.posEnd.y-O.y };
  const scaleA = la.csScale||50, scaleB = lb.csScale||50;
  const lenA   = Math.hypot(uApos.x,uApos.y), lenB = Math.hypot(uBpos.x,uBpos.y);
  const nA={x:uApos.x/lenA,y:uApos.y/lenA}, nB={x:uBpos.x/lenB,y:uBpos.y/lenB};
  const toWorld = (a,b)=>({
    x: O.x + a*scaleA*nA.x + b*scaleB*nB.x,
    y: O.y + a*scaleA*nA.y + b*scaleB*nB.y
  });
  const rangeA = lenA/scaleA, rangeB = lenB/scaleB;
  const ao = la.csOriginA || 0, bo = la.csOriginB || 0;
  const parsed = parseEqn(graph.eq);
  if (!parsed) return;
  const segments = [];
  if (parsed.mode==='yfx'||parsed.mode==='xfy') {
    const STEPS=400;
    const independent = parsed.mode==='yfx'?rangeA:rangeB;
    const step = 2*independent/STEPS;
    let seg=[];
    for (let i=0;i<=STEPS;i++) {
      const v=-independent+i*step; let a,b;
      if (parsed.mode==='yfx'){
        a=v; const x_cs=a+ao; b=mathEval(parsed.rhs,x_cs,0)-bo;
      } else {
        b=v; const y_cs=b+bo; a=mathEval(parsed.rhs,0,y_cs)-ao;
      }
      if(!isFinite(a)||!isFinite(b)||Math.abs(b)>rangeB*50||Math.abs(a)>rangeA*50){
        if(seg.length>1) segments.push(seg); seg=[]; continue;
      }
      seg.push(toWorld(a,b));
    }
    if(seg.length>1) segments.push(seg);
  } else if (parsed.mode==='implicit') {
    /* Use marching squares to trace the implicit curve F(a,b)=G(a,b) → F-G=0 */
    const fn = (a,b) => mathEval(parsed.lhs,a+ao,b+bo) - mathEval(parsed.rhs,a+ao,b+bo);
    const GRID = Math.min(100, Math.max(50, Math.round(Math.max(rangeA,rangeB)*3)));
    const da = 2*rangeA/GRID, db = 2*rangeB/GRID;
    const V = [];
    for (let j=0;j<=GRID;j++) { V[j]=[]; for (let i=0;i<=GRID;i++) { const v=fn(-rangeA+i*da,-rangeB+j*db); V[j][i]=isFinite(v)?v:NaN; } }
    const cross=(va,vb)=>(va<0)!==(vb<0);
    const lerp=(va,vb,v0,v1)=>{ const t=Math.abs(vb-va)<1e-12?0.5:-va/(vb-va); return v0+t*(v1-v0); };
    for (let j=0;j<GRID;j++) {
      for (let i=0;i<GRID;i++) {
        const a0=-rangeA+i*da, b0=-rangeB+j*db, a1=a0+da, b1=b0+db;
        const vBL=V[j][i],vBR=V[j][i+1],vTR=V[j+1][i+1],vTL=V[j+1][i];
        if(!isFinite(vBL)||!isFinite(vBR)||!isFinite(vTR)||!isFinite(vTL)) continue;
        const pts=[];
        if(cross(vBL,vBR)) pts.push({a:lerp(vBL,vBR,a0,a1),b:b0});
        if(cross(vBR,vTR)) pts.push({a:a1,b:lerp(vBR,vTR,b0,b1)});
        if(cross(vTR,vTL)) pts.push({a:lerp(vTR,vTL,a1,a0),b:b1});
        if(cross(vTL,vBL)) pts.push({a:a0,b:lerp(vTL,vBL,b1,b0)});
        if(pts.length===2) segments.push([toWorld(pts[0].a,pts[0].b),toWorld(pts[1].a,pts[1].b)]);
        else if(pts.length===4) {
          segments.push([toWorld(pts[0].a,pts[0].b),toWorld(pts[1].a,pts[1].b)]);
          segments.push([toWorld(pts[2].a,pts[2].b),toWorld(pts[3].a,pts[3].b)]);
        }
      }
    }
  }
  if (!segments.length) return;
  addToUndo();
  /* Build ONE monolithic stroke with null separators between segments */
  const pts = [];
  for (let i = 0; i < segments.length; i++) {
    if (i > 0) pts.push({ x: null, y: null }); // pen-up sentinel
    for (const p of segments[i]) pts.push(p);
  }
  const el = { type:'stroke', id:gid(), pts, color:graph.color||'#ef4444', size:graph.width||2 };
  all.push(el); wsSend({ type:'stroke', data:el });
  redraw();
}

/* ── Document file card ── */
const _DOC_ICONS = {pdf:'📕',doc:'📝',docx:'📝',xls:'📊',xlsx:'📊',ppt:'📉',pptx:'📉',
                    zip:'🗜️','7z':'🗜️',txt:'📃',csv:'📋',rtf:'📝',odt:'📝',ods:'📊',odp:'📉'};
function drawDocFile(el) {
  const sp = ts(el.x, el.y);
  const sw = (el.w || 260) * vz, sh = (el.h || 72) * vz;
  ctx.save();
  /* Card background */
  ctx.fillStyle   = dark ? '#1c2128' : '#f6f8fa';
  ctx.strokeStyle = dark ? '#30363d' : '#d0d7de';
  ctx.lineWidth   = Math.max(1, vz);
  ctx.beginPath(); ctx.roundRect(sp.x, sp.y, sw, sh, 8*vz); ctx.fill(); ctx.stroke();
  if (sw < 32 || sh < 18) { ctx.restore(); return; }
  /* File icon */
  const ext = (el.filename||'').split('.').pop().toLowerCase();
  const icon = _DOC_ICONS[ext] || '📄';
  const iconSz = Math.min(sh * 0.46, 26*vz);
  ctx.font = `${iconSz}px system-ui`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(icon, sp.x + 10*vz, sp.y + sh*0.42);
  /* Filename */
  const nameX = sp.x + iconSz*1.3 + 10*vz;
  const maxW   = sw - iconSz*1.3 - 18*vz;
  const fnsz   = Math.max(8, Math.min(13*vz, sh*0.24));
  ctx.font = `600 ${fnsz}px system-ui,sans-serif`;
  ctx.fillStyle   = dark ? '#e6edf3' : '#24292f';
  ctx.textBaseline = 'alphabetic';
  let fname = el.filename || 'document';
  while (fname.length > 2 && ctx.measureText(fname).width > maxW) fname = fname.slice(0,-2)+'…';
  ctx.fillText(fname, nameX, sp.y + sh*0.46);
  /* File size */
  if (el.filesize) {
    const szTxt = el.filesize >= 1048576
      ? (el.filesize/1048576).toFixed(1)+' МБ'
      : Math.round(el.filesize/1024)+' КБ';
    ctx.font = `${Math.max(7, fnsz*0.82)}px system-ui,sans-serif`;
    ctx.fillStyle = dark ? '#7d8590' : '#57606a';
    ctx.fillText(szTxt, nameX, sp.y + sh*0.75);
  }
  /* "открыть" hint */
  const hintSz = Math.max(7, Math.min(10*vz, sh*0.16));
  ctx.font = `${hintSz}px system-ui,sans-serif`;
  ctx.fillStyle = dark ? '#3fb95066' : '#1a7f3766';
  ctx.textAlign = 'right';
  ctx.fillText('двойной клик → открыть', sp.x + sw - 6*vz, sp.y + sh - 4*vz);
  ctx.restore();
}

/* ── Image ── */
function drawImage(el) {
  let entry = imgCache.get(el.id);
  if (!entry) {
    entry = { img: new Image(), loaded: false };
    entry.img.onload = () => { entry.loaded = true; redraw(); };
    entry.img.src = el.src || '';
    imgCache.set(el.id, entry);
  }
  if (!entry.loaded) {
    /* Draw placeholder */
    const sp = ts(el.x, el.y);
    const sw = (el.w || 200) * vz, sh = (el.h || 150) * vz;
    ctx.save();
    ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
    ctx.strokeRect(sp.x, sp.y, sw, sh);
    ctx.fillStyle = 'rgba(34,197,94,.06)'; ctx.fillRect(sp.x, sp.y, sw, sh);
    ctx.setLineDash([]); ctx.fillStyle = 'rgba(34,197,94,.4)';
    ctx.font = `${Math.min(14*vz, 22)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🖼️', sp.x + sw/2, sp.y + sh/2);
    ctx.restore(); return;
  }
  const sp = ts(el.x, el.y);
  const sw = (el.w || 200) * vz, sh = (el.h || 150) * vz;
  ctx.save();
  if (el.rotation) {
    const cx = sp.x + sw/2, cy = sp.y + sh/2;
    ctx.translate(cx, cy); ctx.rotate(el.rotation); ctx.translate(-cx, -cy);
  }
  ctx.drawImage(entry.img, sp.x, sp.y, sw, sh);
  ctx.restore();
}

/* ── Rich-text DOM overlays (kept in sync with view transform) ── */
function updateRichtextOverlays() {
  /* Remove overlays for deleted elements */
  for (const [id, div] of rtoMap) {
    if (!all.find(e => e.id === id)) { div.remove(); rtoMap.delete(id); }
  }
  /* Add/update overlays for richtext elements */
  for (const el of all) {
    if (el.type !== 'richtext') continue;
    let div = rtoMap.get(el.id);
    if (!div) {
      div = document.createElement('div'); div.className = 'rto';
      document.body.appendChild(div);
      rtoMap.set(el.id, div);
    }
    const sp = ts(el.x, el.y);
    div.style.left   = (sp.x + 56) + 'px';  // +56px = sidebar
    div.style.top    = sp.y + 'px';
    div.style.width  = (el.w || 300) * vz + 'px';
    div.style.height = (el.h || 150) * vz + 'px';
    div.style.fontSize = Math.max(8, Math.round(vz * 14)) + 'px';
    div.style.transform = el.rotation ? `rotate(${el.rotation}rad)` : '';
    div.style.outline  = selected.has(el.id) ? '2px dashed #22c55e' : 'none';
    if (div._html !== el.html) { div.innerHTML = el.html || ''; div._html = el.html; }
  }
}

function drawElem(el) {
  if (!el) return;
  if      (el.type === 'stroke')   drawStroke(el);
  else if (el.type === 'shape')    drawShape(el);
  else if (el.type === 'text')     drawText(el);
  else if (el.type === 'image')    drawImage(el);
  else if (el.type === 'code')     drawCode(el);
  else if (el.type === 'docfile')  drawDocFile(el);
  /* richtext is rendered via DOM overlays in updateRichtextOverlays() */
}

function redraw() {
  _validateCsIntersections();
  if (tedEl && document.getElementById('ted-wrap').style.display !== 'none') {
    _positionTedWrap(); updateTedStyle(); _sizeTedToContent();
  }
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = (BOARD_THEMES[boardTheme] || BOARD_THEMES['dark-blue']).bg;
  ctx.fillRect(0, 0, W, H);
  drawGrid();
  all.forEach(drawElem);
  if (cur) drawElem(cur);
  /* CS overlays: tick marks, parallelogram, graphs — drawn after elements, before highlights */
  drawAllCS();
  /* Hover highlight from element list */
  if (hoverHighlightId && selected.has(hoverHighlightId)) {
    const hel = all.find(e => e.id === hoverHighlightId);
    if (hel) {
      const bb = elemBBox(hel);
      if (bb) {
        const shp = ts(bb.x, bb.y);
        ctx.save();
        ctx.fillStyle = 'rgba(34,197,94,.2)';
        ctx.fillRect(shp.x - 6, shp.y - 6, bb.w * vz + 12, bb.h * vz + 12);
        ctx.restore();
      }
    }
  }
  for (const id of selected) { const el = all.find(e => e.id === id); if (el) { drawSelHighlight(el); if (resizing) drawSnapIndicator(el); } }
  drawSelBox();
  /* Sync rich-text DOM overlays with current view */
  updateRichtextOverlays();
  /* Sync code widget DOM overlays */
  updateCodeWidgets();
  /* KaTeX math labels overlay */
  updateMathOverlay();
  /* CS panel: reposition to follow pan/zoom, and auto-open if another user opened it */
  const _csPanel = document.getElementById('csSetPanel');
  if (_csPanel.classList.contains('open') && csPanelLaId) {
    const _cla = all.find(e => e.id === csPanelLaId);
    const _clb = _cla && all.find(e => e.id === _cla.csPartner);
    if (_cla && _clb) _positionCSPanel(_cla, _clb);
  } else if (!_csPanel.classList.contains('open')) {
    /* Auto-open panel if a CS element has csPanelOpen=true (set by another user or ourselves) */
    const _cla = all.find(e => e.csPartner && e.csPanelOpen);
    if (_cla) {
      const _clb = all.find(e => e.id === _cla.csPartner);
      if (_clb && csPanelLaId !== _cla.id) updateCSPanels(_cla, _clb);
    }
  }
  /* ── peer cursors ── */
  for (const [uid, pc] of Object.entries(peerCursors)) {
    if (!onlineUsers[uid]) continue;
    const sp = ts(pc.x, pc.y);
    const color = peerColor(uid);
    const name = onlineUsers[uid] || uid;
    ctx.save();
    // Arrow cursor shape
    ctx.fillStyle = color;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y);
    ctx.lineTo(sp.x + 12, sp.y + 10);
    ctx.lineTo(sp.x + 5,  sp.y + 10);
    ctx.lineTo(sp.x + 5,  sp.y + 18);
    ctx.lineTo(sp.x + 2,  sp.y + 18);
    ctx.lineTo(sp.x + 2,  sp.y + 10);
    ctx.lineTo(sp.x - 2,  sp.y + 10);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Name label
    ctx.fillStyle = color;
    ctx.font = 'bold 11px system-ui';
    const tw2 = ctx.measureText(name).width + 10;
    ctx.beginPath();
    ctx.roundRect(sp.x + 6, sp.y + 18, tw2, 18, 4);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(name, sp.x + 11, sp.y + 30);
    ctx.restore();
  }

  /* ── pen / eraser cursor ring ── */
  if (cursorPos && (tool === 'pen' || tool === 'erase')) {
    const r = tool === 'pen'
      ? Math.max(penSize * vz / 2, 2)
      : Math.max(penSize + 6, 4);
    ctx.save();
    ctx.setLineDash([]);
    // Dark shadow ring — always visible on any background (white images, light boards)
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = tool === 'erase' ? 'rgba(160,0,0,0.65)' : 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.arc(cursorPos.x, cursorPos.y, r, 0, Math.PI * 2); ctx.stroke();
    // Bright inner ring on top
    ctx.lineWidth = 1;
    ctx.strokeStyle = tool === 'erase' ? 'rgba(255,80,80,0.95)' : 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(cursorPos.x, cursorPos.y, r, 0, Math.PI * 2); ctx.stroke();
    if (tool === 'erase') {
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cursorPos.x-4,cursorPos.y-4); ctx.lineTo(cursorPos.x+4,cursorPos.y+4);
      ctx.moveTo(cursorPos.x+4,cursorPos.y-4); ctx.lineTo(cursorPos.x-4,cursorPos.y+4);
      ctx.stroke();
    }
    ctx.restore();
  }
  /* ── flowchart anchor overlay ── */
  if (tool === 'flow_connector') {
    for (const el of all) {
      if (el.type!=='shape'||!FLOW_SHAPES.has(el.shape)) continue;
      const anchors=getFlowAnchors(el);
      anchors.forEach((a,i)=>{
        const sp=ts(a.x,a.y);
        const isStart = connStart?.elemId===el.id && connStart?.anchorIdx===i;
        ctx.save();
        ctx.beginPath(); ctx.arc(sp.x,sp.y, isStart?7:5, 0, Math.PI*2);
        ctx.fillStyle = isStart ? (geoColor||'#3fb950') : 'rgba(255,255,255,0.55)';
        ctx.fill();
        ctx.strokeStyle = geoColor||'#3fb950'; ctx.lineWidth=1.5;
        ctx.stroke();
        ctx.restore();
      });
    }
    /* Preview: short solid stub + arrowhead from first anchor, then dashed line to cursor */
    if (connStart && connPreview) {
      const fromEl=all.find(e=>e.id===connStart.elemId);
      if (fromEl) {
        const fa=getFlowAnchors(fromEl)[connStart.anchorIdx];
        if (fa) {
          ctx.save();
          const _dv={up:{dx:0,dy:-1},down:{dx:0,dy:1},left:{dx:-1,dy:0},right:{dx:1,dy:0}}[fa.dir]||{dx:0,dy:-1};
          const STUB=28; // screen pixels for stub length
          const sp=ts(fa.x,fa.y);
          const stubEnd={x:sp.x+_dv.dx*STUB, y:sp.y+_dv.dy*STUB};
          const ep=ts(connPreview.x,connPreview.y);
          const clr=geoColor||'#3fb950';
          const lw=(geoSize||2)*vz;
          /* Solid stub line */
          ctx.strokeStyle=clr; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.setLineDash([]);
          ctx.beginPath(); ctx.moveTo(sp.x,sp.y); ctx.lineTo(stubEnd.x,stubEnd.y); ctx.stroke();
          /* Arrowhead at stub tip */
          ctx.fillStyle=clr;
          const ahl=Math.max(10,lw*4), asp=0.42;
          const ang=Math.atan2(_dv.dy,_dv.dx);
          ctx.beginPath(); ctx.moveTo(stubEnd.x,stubEnd.y);
          ctx.lineTo(stubEnd.x-ahl*Math.cos(ang-asp),stubEnd.y-ahl*Math.sin(ang-asp));
          ctx.lineTo(stubEnd.x-ahl*Math.cos(ang+asp),stubEnd.y-ahl*Math.sin(ang+asp));
          ctx.closePath(); ctx.fill();
          /* Dashed line from stub tip to cursor */
          ctx.strokeStyle=clr; ctx.lineWidth=lw; ctx.setLineDash([6*vz,4*vz]);
          ctx.beginPath(); ctx.moveTo(stubEnd.x,stubEnd.y); ctx.lineTo(ep.x,ep.y); ctx.stroke();
          ctx.restore();
        }
      }
    }
  }
}

// ══════════════════════════════════════════════════════════
// §12  HIT TESTING
// ══════════════════════════════════════════════════════════

/* Bounding box in world coords */
function elemBBox(el) {
  if (el.type === 'stroke') {
    if (!el.pts?.length) return null;
    let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
    for (const p of el.pts) {
      if (p.x == null || !isFinite(p.x) || !isFinite(p.y)) continue;
      x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y);
    }
    if (!isFinite(x0)) return null;
    const r = (el.size||3)/2;
    return { x:x0-r, y:y0-r, w:x1-x0+r*2, h:y1-y0+r*2 };
  }
  if (el.type === 'shape') {
    if (el.shape === 'triangle') {
      const xs = [el.x1,el.x2,el.x3], ys = [el.y1,el.y2,el.y3];
      const x=Math.min(...xs), y=Math.min(...ys);
      return { x, y, w:Math.max(...xs)-x, h:Math.max(...ys)-y };
    }
    if (el.shape === 'parallelogram') {
      const dx=el.x3-el.x2, dy=el.y3-el.y2;
      const xs=[el.x1,el.x2,el.x3,el.x1+dx], ys=[el.y1,el.y2,el.y3,el.y1+dy];
      const x=Math.min(...xs), y=Math.min(...ys);
      return {x, y, w:Math.max(...xs)-x, h:Math.max(...ys)-y};
    }
    if (el.shape === 'connector') {
      const pts = resolveConnector(el);
      if (!pts||!pts.length) return null;
      let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
      for(const p of pts){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}
      return {x:x0,y:y0,w:Math.max(x1-x0,1),h:Math.max(y1-y0,1)};
    }
    const x=Math.min(el.x1,el.x2), y=Math.min(el.y1,el.y2);
    return { x, y, w:Math.abs(el.x2-el.x1), h:Math.abs(el.y2-el.y1) };
  }
  if (el.type === 'text')     return { x:el.x, y:el.y, w:el.w||240, h:el.h||60 };
  if (el.type === 'image')    return { x:el.x, y:el.y, w:el.w||200, h:el.h||150 };
  if (el.type === 'richtext') return { x:el.x, y:el.y, w:el.w||300, h:el.h||150 };
  if (el.type === 'code')     return { x:el.x, y:el.y, w:el.w||400, h:el.h||260 };
  if (el.type === 'docfile')  return { x:el.x, y:el.y, w:el.w||260, h:el.h||72 };
  return null;
}

/* ── Resize handles ── */
function getHandles(bb) {
  const {x,y,w,h} = bb;
  return { tl:{x,y}, t:{x:x+w/2,y}, tr:{x:x+w,y},
           r:{x:x+w,y:y+h/2}, br:{x:x+w,y:y+h},
           b:{x:x+w/2,y:y+h}, bl:{x,y:y+h}, l:{x,y:y+h/2} };
}

/* Transform a world-space point into the element's local (un-rotated) coordinate space.
   All handle/hit tests should use this to correctly handle rotated elements. */
function localPoint(wx, wy, el) {
  const rot = el.rotation || 0;
  if (!rot) return { x: wx, y: wy };
  const bb = elemBBox(el); if (!bb) return { x: wx, y: wy };
  const cx = el.ro ? el.ro.x : bb.x + bb.w / 2;
  const cy = el.ro ? el.ro.y : bb.y + bb.h / 2;
  const dx = wx - cx, dy = wy - cy;
  const cos = Math.cos(-rot), sin = Math.sin(-rot);
  return { x: cx + dx * cos - dy * sin, y: cy + dx * sin + dy * cos };
}

function getResizeHandle(wx, wy) {
  const thr = 9/vz;
  /* Special case: both CS partner lines selected → allow endpoint handles on each axis */
  if (selected.size === 2) {
    const selArr = [...selected].map(id => all.find(e => e.id === id)).filter(Boolean);
    if (selArr.length === 2 &&
        selArr[0].type === 'shape' && selArr[0].shape === 'line' &&
        selArr[0].csPartner === selArr[1].id) {
      for (const el of selArr) {
        const lp = localPoint(wx, wy, el);
        if (Math.hypot(lp.x - el.x1, lp.y - el.y1) < thr) return { el, handle: 'p1' };
        if (Math.hypot(lp.x - el.x2, lp.y - el.y2) < thr) return { el, handle: 'p2' };
      }
    }
    return null;
  }
  /* Direct grab: CS axis endpoints accessible without prior selection */
  if (selected.size === 0) {
    for (const el of all) {
      if (el.type !== 'shape' || el.shape !== 'line' || !el.csPartner) continue;
      if (!all.find(e => e.id === el.csPartner)) continue;
      const lp = localPoint(wx, wy, el);
      if (Math.hypot(lp.x - el.x1, lp.y - el.y1) < thr) return { el, handle: 'p1', autoSelect: true };
      if (Math.hypot(lp.x - el.x2, lp.y - el.y2) < thr) return { el, handle: 'p2', autoSelect: true };
    }
  }
  if (selected.size !== 1) return null;
  const id = [...selected][0];
  const el = all.find(e => e.id === id); if (!el) return null;
  const lp = localPoint(wx, wy, el);
  /* Lines use actual endpoint + midpoint handles */
  if (el.type === 'shape' && el.shape === 'line') {
    if (Math.hypot(lp.x - el.x1, lp.y - el.y1) < thr) return { el, handle: 'p1' };
    if (Math.hypot(lp.x - el.x2, lp.y - el.y2) < thr) return { el, handle: 'p2' };
    const mx = (el.x1+el.x2)/2, my = (el.y1+el.y2)/2;
    if (Math.hypot(lp.x - mx, lp.y - my) < thr) return { el, handle: 'pm' };
    return null;
  }
  /* Triangle: 3 vertex handles */
  if (el.type === 'shape' && el.shape === 'triangle') {
    if (Math.hypot(lp.x - el.x1, lp.y - el.y1) < thr) return { el, handle: 'tv1' };
    if (Math.hypot(lp.x - el.x2, lp.y - el.y2) < thr) return { el, handle: 'tv2' };
    if (Math.hypot(lp.x - el.x3, lp.y - el.y3) < thr) return { el, handle: 'tv3' };
    return null;
  }
  /* Parallelogram: 4 edge-midpoint handles */
  if (el.type === 'shape' && el.shape === 'parallelogram') {
    const dx=el.x3-el.x2, dy=el.y3-el.y2;
    const Dx=el.x1+dx, Dy=el.y1+dy;
    const handles = {
      p_ab: {x:(el.x1+el.x2)/2, y:(el.y1+el.y2)/2},
      p_bc: {x:(el.x2+el.x3)/2, y:(el.y2+el.y3)/2},
      p_cd: {x:(el.x3+Dx)/2,    y:(el.y3+Dy)/2},
      p_da: {x:(Dx+el.x1)/2,    y:(Dy+el.y1)/2},
    };
    for (const [name, pos] of Object.entries(handles))
      if (Math.hypot(lp.x - pos.x, lp.y - pos.y) < thr) return { el, handle: name };
    return null;
  }
  const bb = elemBBox(el); if (!bb) return null;
  for (const [name, pos] of Object.entries(getHandles(bb)))
    if (Math.hypot(lp.x - pos.x, lp.y - pos.y) < thr) return { el, handle: name };
  return null;
}

function getRotateHandle(wx, wy) {
  if (selected.size !== 1) return null;
  const id = [...selected][0];
  const el = all.find(e => e.id === id); if (!el || el.type === 'code') return null;
  const bb = elemBBox(el); if (!bb) return null;
  const sp = ts(bb.x, bb.y);
  const cx_s = sp.x + bb.w * vz / 2;
  const cy_s = sp.y + bb.h * vz / 2;
  /* Rotation handle is 26px above top-center of bbox in screen space, then rotated */
  const dy_unrec = sp.y - 5 - 26 - cy_s;
  const rot = el.rotation || 0;
  const rhxS = cx_s - dy_unrec * Math.sin(rot);
  const rhyS = cy_s + dy_unrec * Math.cos(rot);
  const rhW = tw(rhxS, rhyS);
  if (Math.hypot(wx - rhW.x, wy - rhW.y) < 10/vz) return el;
  return null;
}

// ──────────────────────────────────────────────────────────
// Snap helpers for triangle vertices and parallelogram edges
// ──────────────────────────────────────────────────────────

/* Snap a triangle vertex at (vx,vy) toward special configurations.
   pa, pb = the OTHER two vertices [x,y].
   Returns [{x,y}, snapType|null]. Uses hysteresis via vertexSnapState. */
function snapTriVert(vx, vy, el, handle) {
  const pts = [{x:el.x1,y:el.y1},{x:el.x2,y:el.y2},{x:el.x3,y:el.y3}];
  const vIdx = handle === 'tv1' ? 0 : handle === 'tv2' ? 1 : 2;
  const pa = pts[(vIdx+1)%3], pb = pts[(vIdx+2)%3];
  const key = `${el.id}_${handle}`;
  const curSnap = vertexSnapState.get(key) || null;

  const snapIn = 18/vz, snapOut = 34/vz;
  const side = Math.hypot(pb.x-pa.x, pb.y-pa.y);
  let best = null, bestDist = Infinity;

  if (side > 2) {
    const mx = (pa.x+pb.x)/2, my = (pa.y+pb.y)/2;
    const dx = pb.x-pa.x, dy = pb.y-pa.y;
    const ux = dx/side, uy = dy/side;     // unit along pa→pb
    const px = -uy, py = ux;             // unit perp (left of pa→pb)

    /* 1. Equilateral: two positions at ±side*√3/2 from midpoint along perp */
    const eh = side * Math.sqrt(3) / 2;
    for (const s of [1,-1]) {
      const tx = mx + s*px*eh, ty = my + s*py*eh;
      const d = Math.hypot(vx-tx, vy-ty);
      const thr = (curSnap === 'equil') ? snapOut : snapIn;
      if (d < thr && d < bestDist) { best = {x:tx, y:ty, type:'equil'}; bestDist = d; }
    }

    /* 2. Isosceles (current vertex equidistant from pa & pb): snap to perp bisector.
       Perp bisector passes through midpoint in direction (px,py).
       Project (vx,vy) onto it, measure dist to bisector. */
    const distToBisect = Math.abs((vx-mx)*ux + (vy-my)*uy); // dist to perp bisector
    const tIsoBisect = curSnap === 'iso' ? snapOut : snapIn;
    if (distToBisect < tIsoBisect && !best) {
      const t = (vx-mx)*px + (vy-my)*py; // projection along bisector direction
      best = {x: mx+t*px, y: my+t*py, type:'iso'}; bestDist = distToBisect;
    }

    /* 3. Right angle at current vertex: Thales circle (center=midpoint, r=side/2) */
    const r = side/2;
    const distC = Math.hypot(vx-mx, vy-my);
    if (distC > 0.5) {
      const distToCircle = Math.abs(distC - r);
      const thr = (curSnap === 'right') ? snapOut : snapIn;
      if (distToCircle < thr && (!best || distToCircle < bestDist * 0.8)) {
        const tx = mx + (vx-mx)/distC*r, ty = my + (vy-my)/distC*r;
        best = {x:tx, y:ty, type:'right'}; bestDist = distToCircle;
      }
    }
  }

  if (best) { vertexSnapState.set(key, best.type); return [{x:best.x, y:best.y}, best.type]; }
  vertexSnapState.delete(key);
  return [{x:vx, y:vy}, null];
}

/* Snap parallelogram toward rectangle (AB⊥BC) with hysteresis. Modifies el.x3,y3. */
function snapParaToRect(el) {
  const AB={x:el.x2-el.x1,y:el.y2-el.y1}, BC={x:el.x3-el.x2,y:el.y3-el.y2};
  const la2=AB.x*AB.x+AB.y*AB.y, lb2=BC.x*BC.x+BC.y*BC.y;
  if (la2<1||lb2<1) return;
  const dot=AB.x*BC.x+AB.y*BC.y;
  const cos=Math.abs(dot)/Math.sqrt(la2*lb2);
  if (paraSnapRect) {
    if (cos > 0.2) { paraSnapRect=false; return; }
    const t=dot/la2; el.x3-=t*AB.x; el.y3-=t*AB.y;
  } else {
    if (cos < 0.1) { paraSnapRect=true; const t=dot/la2; el.x3-=t*AB.x; el.y3-=t*AB.y; }
  }
}

/* Draw snap indicator overlay for selected triangle (visual hint of current snap). */
function drawSnapIndicator(el) {
  if (el.type !== 'shape' || el.shape !== 'triangle') return;
  const snaps = ['tv1','tv2','tv3'].map(h => vertexSnapState.get(`${el.id}_${h}`));
  const snapType = snaps.find(Boolean);
  if (!snapType) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(250,200,60,0.55)';
  ctx.lineWidth = 1.2 * vz;
  ctx.setLineDash([3*vz, 3*vz]);
  if (snapType === 'equil') {
    /* Draw outline of current triangle in highlight color (shape already drawn) */
    const pts = [{x:el.x1,y:el.y1},{x:el.x2,y:el.y2},{x:el.x3,y:el.y3}];
    ctx.beginPath();
    pts.forEach((p,i) => { const sp2=ts(p.x,p.y); i===0?ctx.moveTo(sp2.x,sp2.y):ctx.lineTo(sp2.x,sp2.y); });
    ctx.closePath(); ctx.stroke();
  } else if (snapType === 'right') {
    /* Draw small right-angle mark at the snapped vertex */
    const vIdx = snaps.findIndex(Boolean);
    const vx = [el.x1,el.x2,el.x3][vIdx], vy = [el.y1,el.y2,el.y3][vIdx];
    const p1 = [{x:el.x2,y:el.y2},{x:el.x3,y:el.y3},{x:el.x1,y:el.y1}][vIdx];
    const p2 = [{x:el.x3,y:el.y3},{x:el.x1,y:el.y1},{x:el.x2,y:el.y2}][vIdx];
    const d1=Math.hypot(p1.x-vx,p1.y-vy), d2=Math.hypot(p2.x-vx,p2.y-vy);
    if (d1>1 && d2>1) {
      const sz = 10/vz;
      const u1x=(p1.x-vx)/d1*sz, u1y=(p1.y-vy)/d1*sz;
      const u2x=(p2.x-vx)/d2*sz, u2y=(p2.y-vy)/d2*sz;
      const sv=ts(vx,vy);
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(sv.x+u1x*vz, sv.y+u1y*vz);
      ctx.lineTo(sv.x+(u1x+u2x)*vz, sv.y+(u1y+u2y)*vz);
      ctx.lineTo(sv.x+u2x*vz, sv.y+u2y*vz);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* Convert visual (world) endpoint positions → local element coordinates.
   Visual midpoint = local midpoint always; local halfvec = InvRotate(visual halfvec, rot). */
function applyResizeLine(wx, wy) {
  const el = resizeEl, s = resizeSnap, h = resizeHandle;
  const rot = el.rotation || 0;
  /* CS axes: midpoint (= intersection O) must stay fixed while moving p1/p2 */
  const lk = el.csPartner ? new Set([...lineLockedHandles, 'pm']) : lineLockedHandles;
  const ic = Math.cos(-rot), is = Math.sin(-rot);
  /* lhvec = InvRotate(world halfvec): lhx=hx*ic-hy*is, lhy=hx*is+hy*ic
     local p1 = midpoint - lhvec,  local p2 = midpoint + lhvec */
  function setVisual(W1x, W1y, W2x, W2y) {
    const mlx=(W1x+W2x)/2, mly=(W1y+W2y)/2;
    const hx=(W2x-W1x)/2, hy=(W2y-W1y)/2;
    const lhx=hx*ic-hy*is, lhy=hx*is+hy*ic;
    el.x1=mlx-lhx; el.y1=mly-lhy; el.x2=mlx+lhx; el.y2=mly+lhy;
  }
  if (h === 'pm') {
    if (lk.has('pm')) return;
    const dx=wx-s.wm.x, dy=wy-s.wm.y;
    setVisual(s.w1.x+dx,s.w1.y+dy, s.w2.x+dx,s.w2.y+dy);
  } else if (h === 'p1') {
    if (lk.has('p1')) return;
    if (lk.has('p2') && lk.has('pm')) {
      const dx=s.w1.x-s.w2.x, dy=s.w1.y-s.w2.y, len=Math.hypot(dx,dy);
      if (len<0.001) return;
      const t=((wx-s.w2.x)*dx+(wy-s.w2.y)*dy)/(len*len);
      setVisual(s.w2.x+dx*t,s.w2.y+dy*t, s.w2.x,s.w2.y);
    } else if (lk.has('pm')) {
      setVisual(wx,wy, 2*s.wm.x-wx,2*s.wm.y-wy);
    } else {
      setVisual(wx,wy, s.w2.x,s.w2.y);
    }
  } else if (h === 'p2') {
    if (lk.has('p2')) return;
    if (lk.has('p1') && lk.has('pm')) {
      const dx=s.w2.x-s.w1.x, dy=s.w2.y-s.w1.y, len=Math.hypot(dx,dy);
      if (len<0.001) return;
      const t=((wx-s.w1.x)*dx+(wy-s.w1.y)*dy)/(len*len);
      setVisual(s.w1.x,s.w1.y, s.w1.x+dx*t,s.w1.y+dy*t);
    } else if (lk.has('pm')) {
      setVisual(2*s.wm.x-wx,2*s.wm.y-wy, wx,wy);
    } else {
      setVisual(s.w1.x,s.w1.y, wx,wy);
    }
  }
}

/* Snap text box height to exactly fit its content at current fontSize + width.
   Uses 1.4 line-height to match the textarea CSS so canvas and editor are consistent. */
function autoFitTextHeight(el) {
  if (el.type !== 'text' || !el.text) return;
  const fs = (el.fontSize || 18) * vz;
  ctx.save();
  ctx.font = `${el.italic?'italic ':''}${el.bold?'bold ':''}${fs}px ${el.font||'system-ui,sans-serif'}`;
  const lines = wrapText(el.text, (el.w || 200) * vz - 10);
  ctx.restore();
  /* line-height 1.4 to match textarea CSS + 8px vertical padding equivalent */
  el.h = Math.ceil(lines.length * (el.fontSize || 18) * 1.4) + 8;
}

/* Find the largest fontSize where wrapped text fits within el.w × el.h.
   Called during and after resize so text always fills the box without overflow. */
function fitFontSize(el) {
  if (!el.text || !el.w || !el.h) return;
  const maxW = el.w * vz - 10;
  const bold = el.bold ? 'bold ' : '';
  const italic = el.italic ? 'italic ' : '';
  const fontFace = el.font || 'system-ui,sans-serif';
  let lo = 6, hi = 200;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    ctx.font = `${italic}${bold}${mid * vz}px ${fontFace}`;
    const lines = wrapText(el.text, maxW);
    if (lines.length * mid * 1.4 + 8 <= el.h) lo = mid; else hi = mid;
  }
  el.fontSize = lo;
}

function applyResize(wx, wy) {
  const el = resizeEl, s = resizeSnap, h = resizeHandle;
  if (el.type === 'shape') {
    if (el.shape === 'triangle') {
      const [snapped] = snapTriVert(wx, wy, el, h);
      if (h === 'tv1') { el.x1=snapped.x; el.y1=snapped.y; }
      else if (h === 'tv2') { el.x2=snapped.x; el.y2=snapped.y; }
      else if (h === 'tv3') { el.x3=snapped.x; el.y3=snapped.y; }
      // el.ro stays fixed — this is what prevents other vertices from drifting
    } else if (el.shape === 'parallelogram') {
      const mk = 'm_' + h.slice(2);
      const ddx = wx - s[mk].x, ddy = wy - s[mk].y;
      if      (h === 'p_ab') { el.x1=s.x1+ddx; el.y1=s.y1+ddy; el.x2=s.x2+ddx; el.y2=s.y2+ddy; }
      else if (h === 'p_bc') { el.x2=s.x2+ddx; el.y2=s.y2+ddy; el.x3=s.x3+ddx; el.y3=s.y3+ddy; }
      else if (h === 'p_cd') { el.x3=s.x3+ddx; el.y3=s.y3+ddy; }
      else if (h === 'p_da') { el.x1=s.x1+ddx; el.y1=s.y1+ddy; }
      snapParaToRect(el);
      // el.ro stays fixed — prevents other vertices from drifting when rotated
    } else if (el.shape !== 'line') { /* lines handled by applyResizeLine */
      let {x1,y1,x2,y2} = s;
      if (h.includes('l')) x1 = Math.min(wx, s.x2 - 2);
      if (h.includes('r')) x2 = Math.max(wx, s.x1 + 2);
      if (h.includes('t')) y1 = Math.min(wy, s.y2 - 2);
      if (h.includes('b')) y2 = Math.max(wy, s.y1 + 2);
      el.x1=x1; el.y1=y1; el.x2=x2; el.y2=y2;
    }
  } else if (el.type === 'text' || el.type === 'image' || el.type === 'richtext' || el.type === 'code') {
    let {x, y, w, h: ht} = s;
    if (h.includes('r')) w = Math.max(20, wx - x);
    if (h.includes('b')) ht = Math.max(20, wy - y);
    if (h.includes('l')) { w = Math.max(20, s.x + s.w - wx); x = s.x + s.w - w; }
    if (h.includes('t')) { ht = Math.max(20, s.y + s.h - wy); y = s.y + s.h - ht; }
    /* Aspect ratio lock for images */
    if (imgLockAspect && el.type === 'image' && s.w > 0 && s.h > 0) {
      const ratio = s.w / s.h;
      if (h.includes('r') || h.includes('l')) { const newHt = Math.max(20, w / ratio); if (h.includes('t')) y = s.y + s.h - newHt; ht = newHt; }
      else if (h.includes('b') || h.includes('t')) { const newW = Math.max(20, ht * ratio); if (h.includes('l')) x = s.x + s.w - newW; w = newW; }
    }
    el.x=x; el.y=y; el.w=w; el.h=ht;
    if (el.type === 'text') {
      if (h.includes('l') || h.includes('r')) el._wLocked = true;
      /* height handle: fit font into box; width-only: no font change (autoFitTextHeight on release) */
      if (h.includes('b') || h.includes('t')) fitFontSize(el);
    }
  } else if (el.type === 'stroke') {
    const bb = {x:s.x, y:s.y, w:s.w, h:s.h};
    let nx=bb.x, ny=bb.y, nw=bb.w, nh=bb.h;
    if (h.includes('l')) { nx=wx; nw=Math.max(2, bb.x+bb.w-wx); }
    if (h.includes('r')) nw = Math.max(2, wx - bb.x);
    if (h.includes('t')) { ny=wy; nh=Math.max(2, bb.y+bb.h-wy); }
    if (h.includes('b')) nh = Math.max(2, wy - bb.y);
    el.pts = s.pts.map(p => {
      if (p.x == null || !isFinite(p.x)) return { x: null, y: null };
      return {
        x: bb.w>0 ? nx + (p.x - bb.x) * nw / bb.w : nx,
        y: bb.h>0 ? ny + (p.y - bb.y) * nh / bb.h : ny
      };
    });
  }
}

function _ptInPoly(pts, lx, ly, r) {
  /* Within r of any edge */
  for (let i = 0; i < pts.length; i++) {
    const a=pts[i], b=pts[(i+1)%pts.length];
    const dx=b.x-a.x, dy=b.y-a.y, l2=dx*dx+dy*dy;
    if (l2===0) { if(Math.hypot(lx-a.x,ly-a.y)<r) return true; continue; }
    const t=Math.max(0,Math.min(1,((lx-a.x)*dx+(ly-a.y)*dy)/l2));
    if (Math.hypot(lx-a.x-t*dx,ly-a.y-t*dy)<r) return true;
  }
  /* Ray-cast inside test */
  let inside=false;
  for (let i=0,j=pts.length-1; i<pts.length; j=i++) {
    const xi=pts[i].x,yi=pts[i].y,xj=pts[j].x,yj=pts[j].y;
    if (((yi>ly)!==(yj>ly))&&(lx<(xj-xi)*(ly-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function _polyEdge(pts, lx, ly, r) {
  for (let i = 0; i < pts.length; i++) {
    const a=pts[i], b=pts[(i+1)%pts.length];
    const dx=b.x-a.x, dy=b.y-a.y, l2=dx*dx+dy*dy;
    if (l2===0) { if(Math.hypot(lx-a.x,ly-a.y)<r) return true; continue; }
    const t=Math.max(0,Math.min(1,((lx-a.x)*dx+(ly-a.y)*dy)/l2));
    if (Math.hypot(lx-a.x-t*dx,ly-a.y-t*dy)<r) return true;
  }
  return false;
}
function hitTest(el, wx, wy, borderOnly) {
  const r = Math.max(6, 8) / vz;
  const lp = localPoint(wx, wy, el);
  const lx = lp.x, ly = lp.y;

  if (el.type === 'stroke') {
    if (!el.pts) return false;
    const _spts = el.pts.filter(p => p.x != null && isFinite(p.x));
    if (_spts.length === 0) return false;
    const _thr = r + (el.size||3)/2;
    for (let _i = 0; _i < _spts.length; _i++) {
      if (Math.hypot(_spts[_i].x-lx, _spts[_i].y-ly) < _thr) return true;
      if (_i < _spts.length-1) {
        const _ax=_spts[_i].x,_ay=_spts[_i].y,_bx=_spts[_i+1].x,_by=_spts[_i+1].y;
        const _dx=_bx-_ax,_dy=_by-_ay,_l2=_dx*_dx+_dy*_dy;
        if (_l2>0) {
          const _t=Math.max(0,Math.min(1,((lx-_ax)*_dx+(ly-_ay)*_dy)/_l2));
          if (Math.hypot(lx-_ax-_t*_dx,ly-_ay-_t*_dy)<_thr) return true;
        }
      }
    }
    return false;
  }

  if (el.type === 'shape') {
    if (el.shape === 'line') {
      const dx=el.x2-el.x1, dy=el.y2-el.y1, len=Math.hypot(dx,dy);
      if (len === 0) return false;
      const t = Math.max(0, Math.min(1, ((lx-el.x1)*dx + (ly-el.y1)*dy) / (len*len)));
      return Math.hypot(lx-el.x1-t*dx, ly-el.y1-t*dy) < r + (el.size||2);
    }
    if (el.shape === 'connector') {
      const _cpts = resolveConnector(el);
      if (!_cpts || _cpts.length < 2) return false;
      const _hw = r + (el.size||2);
      for (let _i = 0; _i < _cpts.length-1; _i++) {
        const _ax=_cpts[_i].x,_ay=_cpts[_i].y,_bx=_cpts[_i+1].x,_by=_cpts[_i+1].y;
        const _dx=_bx-_ax,_dy=_by-_ay,_l2=_dx*_dx+_dy*_dy;
        if (_l2===0){if(Math.hypot(lx-_ax,ly-_ay)<_hw)return true;continue;}
        const _t=Math.max(0,Math.min(1,((lx-_ax)*_dx+(ly-_ay)*_dy)/_l2));
        if (Math.hypot(lx-_ax-_t*_dx,ly-_ay-_t*_dy)<_hw) return true;
      }
      return false;
    }
    if (el.shape === 'triangle') {
      const [ax,ay,bx,by,cx,cy] = [el.x1,el.y1,el.x2,el.y2,el.x3,el.y3];
      const segDist = (px,py,x1,y1,x2,y2) => {
        const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
        if(l2===0) return Math.hypot(px-x1,py-y1);
        const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/l2));
        return Math.hypot(px-x1-t*dx,py-y1-t*dy);
      };
      if (segDist(lx,ly,ax,ay,bx,by)<r || segDist(lx,ly,bx,by,cx,cy)<r || segDist(lx,ly,cx,cy,ax,ay)<r) return true;
      if (borderOnly) return false;
      const d1=(lx-bx)*(ay-by)-(ax-bx)*(ly-by);
      const d2=(lx-cx)*(by-cy)-(bx-cx)*(ly-cy);
      const d3=(lx-ax)*(cy-ay)-(cx-ax)*(ly-ay);
      return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0));
    }
    if (el.shape === 'parallelogram') {
      const _ppts=[{x:el.x1,y:el.y1},{x:el.x2,y:el.y2},{x:el.x3,y:el.y3},{x:el.x1+el.x3-el.x2,y:el.y1+el.y3-el.y2}];
      if (_polyEdge(_ppts,lx,ly,r)) return true;
      if (borderOnly) return false;
      let _ins=true;
      const _fs=Math.sign((_ppts[1].x-_ppts[0].x)*(ly-_ppts[0].y)-(_ppts[1].y-_ppts[0].y)*(lx-_ppts[0].x));
      for (let i=0;i<4;i++){
        const a=_ppts[i],b=_ppts[(i+1)%4];
        const cross=(b.x-a.x)*(ly-a.y)-(b.y-a.y)*(lx-a.x);
        if(Math.sign(cross)!==_fs&&cross!==0){_ins=false;break;}
      }
      return _ins;
    }
    if (el.shape === 'ellipse' || el.shape === 'node') {
      const _cx=(el.x1+el.x2)/2,_cy=(el.y1+el.y2)/2;
      const _rx=Math.abs(el.x2-el.x1)/2,_ry=Math.abs(el.y2-el.y1)/2;
      if (_rx<1||_ry<1) return false;
      if (borderOnly) {
        const _d=Math.sqrt((lx-_cx)*(lx-_cx)/(_rx*_rx)+(ly-_cy)*(ly-_cy)/(_ry*_ry));
        return Math.abs(_d-1)*Math.min(_rx,_ry)<r;
      }
      return (lx-_cx)*(lx-_cx)/((_rx+r)*(_rx+r))+(ly-_cy)*(ly-_cy)/((_ry+r)*(_ry+r))<=1;
    }
    if (el.shape === 'diamond') {
      const _bx=Math.min(el.x1,el.x2),_by=Math.min(el.y1,el.y2);
      const _rw=Math.abs(el.x2-el.x1),_rh=Math.abs(el.y2-el.y1);
      const _cx=_bx+_rw/2,_cy=_by+_rh/2;
      const _dp=[{x:_cx,y:_by},{x:_bx+_rw,y:_cy},{x:_cx,y:_by+_rh},{x:_bx,y:_cy}];
      return borderOnly ? _polyEdge(_dp,lx,ly,r) : _ptInPoly(_dp,lx,ly,r);
    }
    if (el.shape === 'iopara') {
      const _bx=Math.min(el.x1,el.x2),_by=Math.min(el.y1,el.y2);
      const _rw=Math.abs(el.x2-el.x1),_rh=Math.abs(el.y2-el.y1);
      const _sk=Math.min(_rw*0.18,_rh*0.6);
      const _ip=[{x:_bx+_sk,y:_by},{x:_bx+_rw,y:_by},{x:_bx+_rw-_sk,y:_by+_rh},{x:_bx,y:_by+_rh}];
      return borderOnly ? _polyEdge(_ip,lx,ly,r) : _ptInPoly(_ip,lx,ly,r);
    }
    if (el.shape === 'hexagon') {
      const _bx=Math.min(el.x1,el.x2),_by=Math.min(el.y1,el.y2);
      const _rw=Math.abs(el.x2-el.x1),_rh=Math.abs(el.y2-el.y1);
      const _cx=_bx+_rw/2,_cy=_by+_rh/2,_ind=Math.min(_rw*0.2,_rh*0.5);
      const _hp=[{x:_bx+_ind,y:_by},{x:_bx+_rw-_ind,y:_by},{x:_bx+_rw,y:_cy},
                 {x:_bx+_rw-_ind,y:_by+_rh},{x:_bx+_ind,y:_by+_rh},{x:_bx,y:_cy}];
      return borderOnly ? _polyEdge(_hp,lx,ly,r) : _ptInPoly(_hp,lx,ly,r);
    }
    /* rect / rounded / subprocess / cylinder / document */
    const bb = elemBBox(el);
    if (!bb) return false;
    if (borderOnly) {
      const inX = lx>=bb.x-r && lx<=bb.x+bb.w+r;
      const inY = ly>=bb.y-r && ly<=bb.y+bb.h+r;
      return (inX && (Math.abs(ly-bb.y)<r || Math.abs(ly-bb.y-bb.h)<r)) ||
             (inY && (Math.abs(lx-bb.x)<r || Math.abs(lx-bb.x-bb.w)<r));
    }
    return lx >= bb.x-r && ly >= bb.y-r && lx <= bb.x+bb.w+r && ly <= bb.y+bb.h+r;
  }

  if (el.type === 'text' || el.type === 'image' || el.type === 'richtext' || el.type === 'code' || el.type === 'docfile') {
    const bb = elemBBox(el);
    return bb && lx >= bb.x && ly >= bb.y && lx <= bb.x+bb.w && ly <= bb.y+bb.h;
  }
  return false;
}

function getElemAt(wx, wy) {
  for (let i = all.length - 1; i >= 0; i--) if (hitTest(all[i], wx, wy)) return all[i];
  return null;
}

/* Elements fully inside a rubber-band rectangle (screen coords) */
function elemsInRect(sx1, sy1, sx2, sy2) {
  const x0=Math.min(sx1,sx2), y0=Math.min(sy1,sy2);
  const x1=Math.max(sx1,sx2), y1=Math.max(sy1,sy2);
  return all.filter(el => {
    const bb = elemBBox(el); if (!bb) return false;
    const sp = ts(bb.x, bb.y);
    return sp.x >= x0 && sp.y >= y0 && sp.x + bb.w*vz <= x1 && sp.y + bb.h*vz <= y1;
  });
}

// ══════════════════════════════════════════════════════════
// §13  TEXT EDITOR
// ══════════════════════════════════════════════════════════
const ted = document.getElementById('ted');
let tedEl      = null;   // text element being edited
let tedNew     = false;  // true if element is brand-new (not yet in backend)
let tedIsLabel = false;  // true when editing a shape label (not a text element)

function updateTedStyle() {
  if (!tedEl) return;
  ted.style.fontSize      = (tedEl.fontSize || textFontSize) * vz + 'px';  // also set by _positionTedWrap
  ted.style.fontFamily    = tedEl.font || textFont;
  ted.style.fontWeight    = (tedEl.bold      || textBold)      ? 'bold'      : 'normal';
  ted.style.fontStyle     = (tedEl.italic    || textItalic)    ? 'italic'    : 'normal';
  ted.style.textDecoration= (tedEl.underline || textUnderline) ? 'underline' : 'none';
  ted.style.color         = tedEl.color || textColor;
}

function openTextEditor(el, isNew) {
  tedEl = el; tedNew = false;
  if (isNew) wsSend({ type: 'stroke', data: { ...el, text: '' } });
  ted.value = el.text || '';
  updateTedStyle();
  document.getElementById('ted-wrap').style.display = 'block';
  _positionTedWrap();
  _sizeTedToContent();  // size after display:block so offsetWidth is measurable
  redraw();
  requestAnimationFrame(() => ted.focus());
}

function _positionTedWrap() {
  if (!tedEl) return;
  const sp = ts(tedEl.x, tedEl.y);
  const wrap = document.getElementById('ted-wrap');
  wrap.style.left = (sp.x + 56) + 'px';
  wrap.style.top  = (sp.y + 52) + 'px';
}

/* Size the wrap + textarea to exactly fit the current text content.
   Two modes:
   - _wLocked=true  → width fixed (user manually resized it); only height auto-fits
   - _wLocked=false → width expands right to fit widest line; no browser wrap */
function _sizeTedToContent() {
  if (!tedEl || tedIsLabel) return;
  const wrap = document.getElementById('ted-wrap');

  if (tedEl._wLocked) {
    /* Fixed-width: let textarea wrap, measure height via scrollHeight */
    const fw = Math.max(40, tedEl.w * vz);
    ted.style.whiteSpace = 'pre-wrap';
    ted.style.width  = fw + 'px';
    wrap.style.width = fw + 'px';
    ted.style.height = '1px';               // reset so scrollHeight is accurate
    const h = Math.max(28, ted.scrollHeight);
    ted.style.height  = h + 'px';
    wrap.style.height = h + 'px';
    tedEl.h = h / vz;
    /* tedEl.w intentionally not changed — it's locked */
  } else {
    /* Auto-width: expand right, no browser wrap */
    ted.style.whiteSpace = 'pre';
    const mirror = document.getElementById('ted-mirror');
    mirror.style.fontSize      = ted.style.fontSize;
    mirror.style.fontFamily    = ted.style.fontFamily    || 'system-ui,sans-serif';
    mirror.style.fontWeight    = ted.style.fontWeight    || 'normal';
    mirror.style.fontStyle     = ted.style.fontStyle     || 'normal';
    mirror.style.letterSpacing = ted.style.letterSpacing || '';
    const lines = ted.value.split('\n');
    /* For empty text keep the drag-defined box width; for typed text start from 60px */
    let maxW = ted.value ? 60 : Math.max(60, (tedEl.w || 0) * vz);
    lines.forEach(line => {
      mirror.textContent = line || '\u00a0';
      maxW = Math.max(maxW, mirror.offsetWidth + 4); // +4px cursor buffer only
    });
    ted.style.width  = maxW + 'px';
    wrap.style.width = maxW + 'px';
    ted.style.height = '1px';
    const h = Math.max(28, ted.scrollHeight);
    ted.style.height  = h + 'px';
    wrap.style.height = h + 'px';
    tedEl.w = maxW / vz;
    tedEl.h = h / vz;
  }
}

/* Open inline editor for a shape label (dblclick on flowchart block) */
function openLabelEditor(el) {
  commitTextEdit();
  const bb = elemBBox(el); if (!bb) return;
  const ctr = ts(bb.x + bb.w/2, bb.y + bb.h/2);
  const edW = Math.max(60, Math.min(bb.w * vz - 8, 320));
  tedEl = el; tedNew = false; tedIsLabel = true;
  const wrap = document.getElementById('ted-wrap');
  wrap.style.left   = (ctr.x - edW/2 + 56) + 'px';
  wrap.style.top    = (ctr.y - 22) + 'px';
  wrap.style.width  = edW + 'px';
  wrap.style.height = 'auto';
  ted.style.fontSize  = Math.max(11, 14 * vz) + 'px';
  ted.style.fontFamily = 'system-ui,sans-serif';
  ted.style.fontWeight = 'normal'; ted.style.fontStyle = 'normal'; ted.style.textDecoration = 'none';
  ted.style.color = dark ? '#fff' : '#111';
  ted.style.textAlign = 'center';
  ted.value = el.label || '';
  ted.style.height = 'auto';
  ted.style.height = Math.max(ted.scrollHeight, 28) + 'px';
  wrap.style.display = 'block';
  requestAnimationFrame(() => { ted.focus(); ted.select(); });
}

function commitTextEdit() {
  if (!tedEl) return;
  document.getElementById('ted-wrap').style.display = 'none';
  ted.style.textAlign = '';
  const text = ted.value.trim();
  const _tedEl = tedEl, _tedNew = tedNew, _isLabel = tedIsLabel;
  tedEl = null; tedNew = false; tedIsLabel = false;
  /* ── Shape label edit ── */
  if (_isLabel) {
    _tedEl.label = text || undefined;
    wsSend({ type: 'erase_stroke', id: _tedEl.id });
    setTimeout(() => wsSend({ type: 'stroke', data: _tedEl }), 40);
    redraw(); return;
  }
  if (!text) {
    all = all.filter(e => e !== _tedEl);
    if (!_tedNew) wsSend({ type: 'erase_stroke', id: _tedEl.id });
  } else {
    _tedEl.text = text;
    /* w/h already kept live by _sizeTedToContent() during editing */
    if (_tedNew) {
      wsSend({ type: 'stroke', data: _tedEl });
    } else {
      wsSend({ type: 'erase_stroke', id: _tedEl.id });
      setTimeout(() => wsSend({ type: 'stroke', data: _tedEl }), 40);
    }
  }
  redraw();
}

// §13b  ENGLISH TOOLS  (IPA transcription + translation)
