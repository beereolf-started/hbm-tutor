<!DOCTYPE html><html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HBM — Доска</title>
<style>
/* ─── Reset ─── */
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:system-ui,sans-serif;user-select:none;color:var(--fg);background:var(--bg)}

/* ─── CSS Variables — HBM General Style ─── */
:root{
  --bg:#0d1117;--bg-ui:#161b22;--fg:#e6edf3;--fg-dim:#7d8590;
  --sep:#30363d;--hover:#21262d;--accent:#3fb950;--accent-hi:#2ea043;
  --accent-bg:rgba(63,185,80,.12);--input:#21262d;--shadow:rgba(0,0,0,.45)}
body.dark{color-scheme:dark}
body.light{
  color-scheme:light;
  --bg:#f6f8fa;--bg-ui:#ffffff;--fg:#1f2328;--fg-dim:#656d76;
  --sep:#d0d7de;--hover:#f3f4f6;--accent:#1a7f37;--accent-hi:#116329;
  --accent-bg:rgba(26,127,55,.1);--input:#ffffff;--shadow:rgba(0,0,0,.12)}

/* ─── Top Bar ─── */
#topbar{
  position:fixed;top:0;left:0;right:0;height:52px;z-index:30;
  background:var(--bg-ui);border-bottom:1px solid var(--sep);
  display:flex;align-items:center;gap:12px;padding:0 16px 0 68px}
#topbar .tb-logo{font-weight:700;font-size:1em;color:var(--fg);display:flex;align-items:center;gap:6px}
#topbar .tb-logo svg{width:20px;height:20px;fill:var(--accent)}
#boardTitle{flex:1;font-size:.9em;color:var(--fg-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topbar .tb-r{display:flex;align-items:center;gap:8px}
#backLink{
  font-size:.82em;text-decoration:none;color:var(--accent);
  background:var(--bg-ui);border:1px solid var(--sep);
  border-radius:8px;padding:6px 12px;white-space:nowrap}
#backLink:hover{background:var(--hover)}

/* ─── Sidebar ─── */
#sb{
  position:fixed;left:0;top:52px;bottom:0;width:56px;
  display:flex;flex-direction:column;justify-content:space-between;
  background:var(--bg-ui);border-right:1px solid var(--sep);
  padding:8px 4px;z-index:20;
  box-shadow:2px 0 8px var(--shadow)}
#sb-top,#sb-bot{display:flex;flex-direction:column;gap:4px;align-items:center}

/* Sidebar button */
.sb{
  width:44px;height:44px;border:none;border-radius:10px;cursor:pointer;
  background:transparent;color:var(--fg);
  display:flex;align-items:center;justify-content:center;
  font-size:1.15em;transition:background .15s,color .15s;position:relative}
.sb:hover{background:var(--hover)}
.sb.act{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(34,197,94,.35)}
.sb .bdg{position:absolute;bottom:4px;right:4px;font-size:9px;line-height:1;opacity:.75}

/* Tool-wrap + hover submenu */
.tw{position:relative}
.sm{
  position:absolute;left:52px;top:0;
  display:none;flex-direction:column;gap:4px;
  background:var(--bg-ui);border:1px solid var(--sep);
  border-radius:9px;padding:6px;z-index:30;min-width:52px;
  box-shadow:0 4px 16px rgba(0,0,0,.35)}
/* submenu shown/hidden via JS hover (see §19) */
.ssb{
  width:42px;height:42px;border:none;border-radius:7px;cursor:pointer;
  background:transparent;color:var(--fg);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1em;transition:background .12s}
.ssb:hover{background:var(--hover)}
.ssb.act{background:var(--accent);color:#fff}

/* ─── Settings Panel ─── */
#sp{
  position:fixed;left:115px;top:60px;
  background:var(--bg-ui);border:1px solid var(--sep);
  border-radius:12px;padding:13px 15px;
  z-index:25;box-shadow:0 6px 24px var(--shadow);
  display:none;min-width:220px;max-width:270px}
#sp.open{display:block}
#sp h4{font-size:.7em;letter-spacing:.08em;text-transform:uppercase;
  color:var(--fg-dim);margin-bottom:11px;font-weight:600}
.sp-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sp-row label{font-size:.78em;color:var(--fg-dim);white-space:nowrap;min-width:54px}
.clrs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cb{
  width:22px;height:22px;border-radius:50%;
  border:2px solid transparent;cursor:pointer;flex-shrink:0;transition:transform .1s}
.cb:hover{transform:scale(1.15)}
.cb.act{border-color:#fff;outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{width:110px;accent-color:var(--accent);cursor:pointer}
input[type=number]{
  width:64px;padding:4px 8px;border-radius:7px;
  border:1px solid var(--sep);background:var(--input);
  color:var(--fg);font-size:.82em;transition:border-color .15s}
input[type=number]:focus{outline:none;border-color:var(--accent)}
.tog-row{display:flex;gap:4px}
.tog{
  min-width:36px;height:28px;padding:0 8px;
  border:1px solid var(--sep);border-radius:7px;
  cursor:pointer;background:transparent;color:var(--fg);
  font-size:.82em;transition:background .12s,color .12s}
.tog:hover{background:var(--hover)}
.tog.act{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ─── HUD (legacy, now hidden) ─── */
#hud{display:none}
.hb{
  width:32px;height:32px;border:1px solid var(--sep);border-radius:7px;
  background:transparent;color:var(--fg-dim);cursor:pointer;font-size:.88em;
  display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.hb:hover{background:var(--hover);color:var(--fg)}

/* ─── Canvas ─── */
canvas{position:fixed;top:52px;left:56px}

/* ─── Inline text editor ─── */
#ted-wrap{
  position:fixed;display:none;z-index:40;
  border:2px dashed var(--accent);border-radius:5px;
  background:var(--bg-ui);opacity:.96;
  resize:both;overflow:hidden;min-width:80px;min-height:52px}
#ted-bar{
  padding:2px 8px;cursor:move;background:var(--accent);
  color:#fff;font-size:.7em;user-select:none;
  border-radius:3px 3px 0 0;display:flex;align-items:center;gap:4px}
#ted{
  display:block;width:100%;box-sizing:border-box;
  border:none;background:transparent;color:var(--fg);
  font-family:system-ui,sans-serif;resize:none;outline:none;
  padding:4px 6px;line-height:1.4;white-space:pre-wrap;
  min-height:28px;overflow-y:auto}

/* ─── Selection properties bar ─── */
#selBar{
  position:fixed;top:60px;left:340px;
  background:var(--bg-ui);border:1px solid var(--sep);
  border-radius:10px;padding:8px 12px;
  z-index:25;box-shadow:0 4px 20px rgba(0,0,0,.3);
  display:none;align-items:center;gap:10px;flex-wrap:wrap;
  transition:opacity .15s}
#selBar.open{display:flex}
#selBar h5{font-size:.72em;opacity:.5;white-space:nowrap}

/* ─── Status / Tip ─── */
#status{position:fixed;bottom:8px;right:12px;font-size:.7em;opacity:.4;z-index:10}
#tip{position:fixed;bottom:8px;left:64px;font-size:.7em;opacity:.28;z-index:10;pointer-events:none}

/* ─── Geo Picker ─── */
#geoPicker{
  position:fixed;left:60px;
  background:var(--bg-ui);border:1px solid var(--sep);
  border-radius:10px;padding:6px;z-index:50;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  display:none;flex-direction:column;gap:2px;min-width:180px}
.gp-hdr{font-size:.68em;opacity:.45;text-transform:uppercase;letter-spacing:.07em;padding:2px 6px 4px}
.gp-item{
  padding:7px 10px;border-radius:7px;cursor:pointer;
  font-size:.85em;display:flex;align-items:center;gap:8px;
  transition:background .1s}
.gp-item:hover{background:var(--hover)}
.gp-item.act{background:var(--accent);color:#fff}
.gp-key{
  margin-left:auto;opacity:.5;font-size:.75em;
  background:var(--bg);border:1px solid var(--sep);
  border-radius:4px;padding:1px 5px}
.gp-item.act .gp-key{opacity:.7;background:rgba(255,255,255,.15);border-color:transparent}

/* ─── Rich-text overlay ─── */
.rto{
  position:fixed;pointer-events:none;overflow:hidden;z-index:5;
  line-height:1.4;word-wrap:break-word;box-sizing:border-box;padding:4px 6px}
/* In dark mode, force light text so pasted content (often black) stays readable */
body.dark  .rto{color:#e6edf3;background:rgba(13,17,23,.78)}
body.light .rto{color:#1f2328;background:rgba(246,248,250,.85)}
.rto *{max-width:100%}
.rto ul,.rto ol{padding-left:1.4em}
.rto ul{list-style:disc}
.rto ol{list-style:decimal}
.rto p{margin-bottom:.3em}
.rto h1,.rto h2,.rto h3{font-weight:bold;margin-bottom:.2em}

/* ─── Selection element list ─── */
.sel-list{
  width:100%;border-top:1px solid var(--sep);
  padding-top:6px;margin-top:4px;
  display:none;flex-direction:column;gap:2px;
  max-height:180px;overflow-y:auto}
.sel-list.open{display:flex}
.sel-item{
  display:flex;align-items:center;gap:6px;
  padding:3px 6px;border-radius:5px;font-size:.78em;
  cursor:default;transition:background .1s}
.sel-item:hover{background:var(--hover)}
.sel-item .si-icon{opacity:.6;width:18px;text-align:center;flex-shrink:0}
.sel-item .si-id{opacity:.38;font-family:monospace;font-size:.9em;flex:1;overflow:hidden}
.sel-item .si-rm{
  width:20px;height:20px;border:1px solid var(--sep);
  border-radius:4px;cursor:pointer;background:transparent;
  color:var(--fg);font-size:.9em;line-height:1;flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.sel-item .si-rm:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ─── Coordinate system panels ─── */
#csSetPanel{
  position:fixed;top:60px;
  background:var(--bg-ui);border:1px solid var(--sep);
  border-radius:12px;padding:12px 14px;
  z-index:24;box-shadow:0 6px 24px var(--shadow);
  display:none;flex-direction:column;gap:6px;
  min-width:272px;max-width:320px;
  max-height:calc(100vh - 80px);overflow-y:auto}
#csSetPanel.open{display:flex}
#csGraphPanel{display:none!important}           /* merged into csSetPanel */
.cs-hdr{
  font-size:.68em;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);font-weight:700;margin-bottom:1px}
.cs-axis-block{
  background:var(--accent-bg);border-radius:8px;
  padding:7px 10px;display:flex;flex-direction:column;gap:5px}
.cs-row{display:flex;align-items:center;gap:7px;font-size:.82em}
.cs-row label{color:var(--fg-dim);min-width:50px;font-size:.92em;white-space:nowrap}
.cs-row input[type=number]{width:54px}
.cs-row .cs-unit{font-size:.75em;color:var(--fg-dim)}
.cs-sep{height:1px;background:var(--sep);margin:3px 0}
.csg-item{
  display:flex;align-items:center;gap:5px;
  padding:4px 6px;border-radius:7px;font-size:.79em;
  background:var(--accent-bg)}
.csg-item .csg-dot{
  width:13px;height:13px;border-radius:50%;flex-shrink:0;cursor:pointer;
  border:2px solid transparent;transition:transform .1s;position:relative}
.csg-item .csg-dot:hover{transform:scale(1.2)}
.csg-item .csg-eq{
  flex:1;font-family:monospace;font-size:.9em;
  cursor:pointer;color:var(--fg);overflow:hidden;white-space:nowrap}
.csg-item .csg-rm{
  width:18px;height:18px;border:1px solid var(--sep);
  border-radius:4px;cursor:pointer;background:transparent;
  color:var(--fg);font-size:.85em;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.csg-item .csg-rm:hover{background:#ef4444;color:#fff;border-color:#ef4444}
.csg-ctrl{display:flex;gap:3px;padding:1px 6px 3px 28px;flex-wrap:wrap;align-items:center}
.csg-sty{
  height:21px;padding:0 6px;border:1px solid var(--sep);border-radius:5px;
  cursor:pointer;background:transparent;color:var(--fg-dim);
  font-size:.71em;transition:background .1s,color .1s,border-color .1s;white-space:nowrap}
.csg-sty:hover,.csg-sty.act{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.csg-sty.cp{margin-left:4px;color:var(--fg-dim)}
.csg-sty.cp:hover{background:var(--hover);color:var(--fg);border-color:var(--sep)}
.csg-add{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:2px}
.csg-add input[type=text]{
  flex:1;min-width:90px;padding:4px 8px;border-radius:6px;
  border:1px solid var(--sep);background:var(--input);
  color:var(--fg);font-size:.8em;font-family:monospace;
  transition:border-color .15s}
.csg-add input[type=text]:focus{outline:none;border-color:var(--accent)}
.cs-btn{
  padding:3px 9px;border:1px solid var(--accent);border-radius:6px;
  cursor:pointer;background:transparent;color:var(--accent);
  font-size:.8em;white-space:nowrap;transition:background .12s}
.cs-btn:hover{background:var(--accent);color:#fff}
.cs-btn.active{background:var(--accent);color:#fff}
</style>

</head>
<body class="dark">

<!-- ─── Top Bar ─── -->
<div id="topbar">
  <div class="tb-logo">
    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </svg>
    HBM
  </div>
  <div id="boardTitle">Доска</div>
  <div class="tb-r">
    <button class="hb" title="Отменить Ctrl+Z" onclick="doUndo()">↩</button>
    <button class="hb" id="btnClear" title="Очистить доску" onclick="doClear()">🗑</button>
    <button class="hb" id="bTheme" title="Тема" onclick="toggleTheme()">🌙</button>
    <button class="hb" title="Сбросить вид" onclick="resetView()">⊙</button>
    <a id="backLink" href="/hbm_tutor.html">← Назад</a>
  </div>
</div>

<!-- ─── Sidebar ─── -->
<div id="sb">
  <div id="sb-top">

    <!-- Select -->
    <button class="sb act" id="btnSel" title="Выделение (V)" onclick="setTool('select')">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
        <path d="M4 2L4 16.5L7.8 12.5L10.4 18.5L12.1 17.7L9.5 11.8L14.5 11.8Z"/>
      </svg>
    </button>

    <!-- Draw group -->
    <div class="tw">
      <button class="sb" id="btnDraw" title="Рисование (P)" onclick="activateDrawGroup()">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17L6.5 13.5L15 5L17 3C18 2 19 3 18 4L16 6L7.5 14.5Z"/>
          <path d="M3 17L6.5 13.5"/>
        </svg>
        <span class="bdg" id="drawBdg">✏</span>
      </button>
      <div class="sm" id="smDraw">
        <button class="ssb" id="sPen"   title="Перо (P)"   onclick="setTool('pen')">🖊️</button>
        <button class="ssb" id="sErase" title="Ластик (E)" onclick="setTool('erase')">🧹</button>
      </div>
    </div>

    <!-- Geometry group -->
    <div class="tw">
      <button class="sb" id="btnGeo" title="Геометрия (G)" onclick="activateGeoGroup()">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="2" y="10" width="8" height="7" rx="1"/>
          <ellipse cx="15" cy="6" rx="3.5" ry="3.5"/>
          <line x1="10" y1="3" x2="18" y2="11"/>
        </svg>
        <span class="bdg" id="geoBdg">—</span>
      </button>
      <div class="sm" id="smGeo">
        <button class="ssb" id="sLine"    title="Линия"           onclick="setTool('geo_line')">╱</button>
        <button class="ssb" id="sRect"    title="Прямоугольник"   onclick="setTool('geo_rect')">▭</button>
        <button class="ssb" id="sEllipse" title="Эллипс"          onclick="setTool('geo_ellipse')">⬭</button>
      </div>
    </div>

    <!-- Text -->
    <button class="sb" id="btnText" title="Текст (T)" onclick="setTool('text')"
            style="font-weight:700;font-size:1.2em;letter-spacing:-.02em">T</button>

    <!-- Media -->
    <button class="sb" id="btnMedia" title="Вставить изображение (I)" onclick="openMediaPicker()"
            style="font-size:1.2em">🖼️</button>

  </div>
  <div id="sb-bot"></div>
</div>

<!-- ─── Settings Panel ─── -->
<div id="sp"></div>

<!-- ─── Selection Bar ─── -->
<div id="selBar"></div>

<!-- ─── CS Settings Panel ─── -->
<div id="csSetPanel"></div>

<!-- ─── CS Graph Panel ─── -->
<div id="csGraphPanel"></div>

<!-- ─── Geo Picker ─── -->
<div id="geoPicker">
  <div class="gp-hdr">Примитив</div>
  <div class="gp-item" data-idx="0">╱ Линия <span class="gp-key">L</span></div>
  <div class="gp-item" data-idx="1">▭ Прямоугольник <span class="gp-key">R</span></div>
  <div class="gp-item" data-idx="2">⬭ Эллипс / круг <span class="gp-key">C</span></div>
</div>

<!-- ─── Inline text editor ─── -->
<div id="ted-wrap">
  <div id="ted-bar">↔ Текст</div>
  <textarea id="ted" rows="1" spellcheck="false"></textarea>
</div>

<!-- ─── Media file input ─── -->
<input type="file" id="mediaInput" accept="image/*" style="display:none">

<!-- ─── Canvas ─── -->
<canvas id="c"></canvas>
<div id="status">Подключение...</div>
<div id="tip">ПКМ/Space=навигация · Колесо=зум · Del=удалить · Ctrl+Z=отмена · Ctrl+C/X/V=копировать · Shift+перо=прямая · G=геометрия · I=картинка · R+←→=поворот · ESC=сброс</div>

<script src="/api.js"></script>
<script>
// ══════════════════════════════════════════════════════════
// §0  BOOTSTRAP
// ══════════════════════════════════════════════════════════
const Q = new URLSearchParams(location.search), SID = Q.get('id');
if (!SID) { location.href = '/hbm_tutor.html'; throw ''; }
const ROLE = role();
document.getElementById('backLink').href =
  ROLE === 'student' ? '/student_lk.html' :
  ROLE === 'parent'  ? '/parent_lk.html'  : '/student.html?id=' + SID;
if (ROLE === 'student' || ROLE === 'parent')
  document.getElementById('btnClear').style.display = 'none';

// Load student name for topbar
(async function(){
  try{
    const tok=localStorage.getItem('token');
    if(!tok) return;
    const r=await fetch('/api/students/'+SID,{headers:{Authorization:'Bearer '+tok}});
    if(r.ok){const s=await r.json();document.getElementById('boardTitle').textContent=s.name+' — Доска';}
  }catch(e){}
})();

// ══════════════════════════════════════════════════════════
// §1  THEME
// ══════════════════════════════════════════════════════════
let dark = localStorage.getItem('board_theme') !== 'light';

function applyTheme() {
  document.body.className = dark ? 'dark' : 'light';
  document.getElementById('bTheme').textContent = dark ? '🌙' : '☀️';
  redraw();
}
function toggleTheme() {
  dark = !dark;
  localStorage.setItem('board_theme', dark ? 'dark' : 'light');
  applyTheme();
}

// ══════════════════════════════════════════════════════════
// §2  CANVAS
// ══════════════════════════════════════════════════════════
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H;

function resize() {
  W = cv.width  = window.innerWidth  - 56;
  H = cv.height = window.innerHeight - 52;
  redraw();
}
window.addEventListener('resize', resize);

// ══════════════════════════════════════════════════════════
// §3  VIEW TRANSFORM
// ══════════════════════════════════════════════════════════
let vx = 0, vy = 0, vz = 1;
const tw = (sx, sy) => ({ x: (sx - vx) / vz, y: (sy - vy) / vz });
const ts = (wx, wy) => ({ x: wx * vz + vx,   y: wy * vz + vy   });
function resetView() { vx = 0; vy = 0; vz = 1; redraw(); }

// ══════════════════════════════════════════════════════════
// §4  CONSTANTS
// ══════════════════════════════════════════════════════════
const COLORS_DARK  = ['#e2f5e8','#ffffff','#22c55e','#ef4444','#06b6d4','#f59e0b','#a855f7','#ec4899'];
const COLORS_LIGHT = ['#0d2418','#ffffff','#22c55e','#ef4444','#06b6d4','#f59e0b','#a855f7','#ec4899'];
const COLORS = COLORS_DARK; // updated on theme change via getColors()
function getColors() { return dark ? COLORS_DARK : COLORS_LIGHT; }

/* Image rendering cache */
const imgCache    = new Map(); // id → {img:HTMLImageElement, loaded:bool}
const imgSrcStore = new Map(); // id → base64 src (kept separately to save undo-stack memory)
/* Rich-text DOM overlays */
const rtoMap = new Map(); // id → div

// ══════════════════════════════════════════════════════════
// §5  TOOL STATE
// ══════════════════════════════════════════════════════════
let tool = 'select';

/* Undo stack (client-side) */
const undoStack = [];
const MAX_UNDO  = 50;

/* Hover highlight (from element list) */
let hoverHighlightId = null;
/* Whether sel-list is expanded */
let selListOpen = false;
/* Track active CS pair for panel persistence (bug #5) */
let csPanelLaId = null, csPanelLbId = null;

// Pen / Erase settings
let penColor = COLORS[0], penSize = 3;

function gid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

let selected  = new Set();   // selected element ids

let dragging  = false;       // are we moving selected elements?

let dragSnap   = null;       // snapshot of positions at drag start
let resizing  = false;       // are we resizing a selected element?
let resizeHandle = null;     // handle name: tl/t/tr/r/br/b/bl/l
let resizeEl  = null;        // element being resized
let resizeSnap = null;       // snapshot of element state at resize start

let rotateMoved = false;     // true if rotation actually changed

let sbSnapHA = 'p1', sbSnapHB = 'p1', sbRotCenter = 'p1'; // 2-line UI state
let sbLineOrder = 0; // 0: lineEls[0]=anchor(Л1), 1: lineEls[1]=anchor(Л1)
let rotating  = false;       // are we rotating a selected element?

function clearSel() { selected.clear(); selBox = null; lineLockedHandles.clear(); sbSnapHA='p1'; sbSnapHB='p1'; sbRotCenter='p1'; sbLineOrder=0; hoverHighlightId=null; selListOpen=false; updateSelBar(); redraw(); }

/* Save element positions before a drag */
function snapPositions() {
  dragSnap = {};
  for (const id of selected) {
    const el = all.find(e => e.id === id); if (!el) continue;
    if      (el.type === 'stroke')   dragSnap[id] = el.pts.map(p => ({ ...p }));
    else if (el.type === 'shape')   dragSnap[id] = { x1:el.x1, y1:el.y1, x2:el.x2, y2:el.y2 };
    else if (el.type === 'text' || el.type === 'image' || el.type === 'richtext') dragSnap[id] = { x:el.x, y:el.y };
  }
}

/* Apply world-space delta to selected elements in real time */
function applyDrag(dwx, dwy) {
  dragMoved = true;
  for (const id of selected) {
    const el = all.find(e => e.id === id); if (!el || !dragSnap[id]) continue;
    if      (el.type === 'stroke')   el.pts = dragSnap[id].map(p => ({ x: p.x + dwx, y: p.y + dwy }));
    else if (el.type === 'shape')   { el.x1 = dragSnap[id].x1+dwx; el.y1 = dragSnap[id].y1+dwy; el.x2 = dragSnap[id].x2+dwx; el.y2 = dragSnap[id].y2+dwy; }
    else if (el.type === 'text' || el.type === 'image' || el.type === 'richtext') { el.x = dragSnap[id].x+dwx; el.y = dragSnap[id].y+dwy; }
  }
}

/* Commit moved elements: erase old + re-add at new position */
function commitDrag() {
  for (const id of selected) {
    const el = all.find(e => e.id === id); if (!el) continue;
    wsSend({ type: 'erase_stroke', id: el.id });
    wsSend({ type: 'stroke', data: el });
  }
}

/* True if world point (wx,wy) falls inside the padded selection highlight of any selected element.
   Accounts for element rotation so the full visual bounding box is usable as drag handle. */
function isInSelBox(wx, wy) {
  for (const id of selected) {
    const el = all.find(e => e.id === id); if (!el) continue;
    const bb = elemBBox(el); if (!bb) continue;
    const lp = localPoint(wx, wy, el);
    const pad = 8 / vz;
    if (lp.x >= bb.x - pad && lp.y >= bb.y - pad &&
        lp.x <= bb.x + bb.w + pad && lp.y <= bb.y + bb.h + pad) return true;
  }
  return false;
}

function setTool(t) {
  commitTextEdit();
  if (t !== 'select') { selected.clear(); selBox = null; }
  tool = t;

  /* Sidebar button states */
  document.querySelectorAll('.sb').forEach(b => b.classList.remove('act'));
  const mainMap = { select:'btnSel', pen:'btnDraw', erase:'btnDraw',
                    geo_line:'btnGeo', geo_rect:'btnGeo', geo_ellipse:'btnGeo', text:'btnText' };
  document.getElementById(mainMap[t])?.classList.add('act');

  /* Sub-tool button states */
  document.querySelectorAll('.ssb').forEach(b => b.classList.remove('act'));
  const subMap = { pen:'sPen', erase:'sErase', geo_line:'sLine', geo_rect:'sRect', geo_ellipse:'sEllipse' };
  if (subMap[t]) document.getElementById(subMap[t])?.classList.add('act');

  /* Badges */
  const drawBadges = { pen:'✏', erase:'🧹' };
  if (drawBadges[t]) document.getElementById('drawBdg').textContent = drawBadges[t];
  const geoBadges  = { geo_line:'—', geo_rect:'▭', geo_ellipse:'⬭' };
  if (geoBadges[t])  document.getElementById('geoBdg').textContent  = geoBadges[t];

  /* Cursor */
  const cursors = { select:'default', pen:'none', erase:'none',
                    geo_line:'crosshair', geo_rect:'crosshair', geo_ellipse:'crosshair', text:'text' };
  cv.style.cursor = cursors[t] || 'default';

  /* Panels */
  if (t === 'select') { closeSP(); updateSelBar(); }
  else                { renderSP(); document.getElementById('selBar').classList.remove('open'); }

  redraw();
}

// §8c  CLIPBOARD  (copy / cut / paste)
// ══════════════════════════════════════════════════════════

/* Deep-clone element with fresh id, optionally shifted by (dx,dy) in world space */
function cloneEl(el, dx = 0, dy = 0) {
  const c = JSON.parse(JSON.stringify(el));
  c.id = gid();
  if (c.type === 'stroke')  c.pts = c.pts.map(p => p.x == null ? { x: null, y: null } : { x: p.x+dx, y: p.y+dy });
  else if (c.type === 'shape') { c.x1+=dx; c.y1+=dy; c.x2+=dx; c.y2+=dy; }
  else if (c.type === 'text' || c.type === 'image' || c.type === 'richtext') { c.x+=dx; c.y+=dy; }
  return c;
}

function doCopy() {
  if (!selected.size) return;
  clipboard = [...selected].map(id => {
    const el = all.find(e => e.id === id);
    return el ? JSON.parse(JSON.stringify(el)) : null;
  }).filter(Boolean);
}

function doCut() {
  if (!selected.size) return;
  addToUndo();
  doCopy();
  for (const id of selected) { all = all.filter(e => e.id !== id); wsSend({ type: 'erase_stroke', id }); }
  clearSel(); redraw();
}

function doPaste() {
  if (!clipboard.length) return;
  addToUndo();
  const off = 20 / vz;   // 20 screen px → world units
  selected.clear();
  const newEls = clipboard.map(el => cloneEl(el, off, off));
  newEls.forEach(el => { all.push(el); wsSend({ type: 'stroke', data: el }); selected.add(el.id); });
  /* Shift clipboard origin for next paste so repeated Ctrl+V stacks neatly */
  clipboard = clipboard.map(el => cloneEl(el, off, off));
  redraw(); updateSelBar();
}

// ══════════════════════════════════════════════════════════
// §8d  LOCAL UNDO STACK
// ══════════════════════════════════════════════════════════

/* Save snapshot of all[] before a mutating operation.
   Image srcs are large (base64) — stored separately in imgSrcStore to avoid
   bloating the undo stack with megabytes per level. */
function addToUndo() {
  if (undoStack.length >= MAX_UNDO) undoStack.shift();
  undoStack.push(all.map(el => {
    const copy = JSON.parse(JSON.stringify(el));
    if (el.type === 'image' && el.src) {
      imgSrcStore.set(el.id, el.src); // persist src separately
      copy.src = null;                // omit from snapshot
    }
    return copy;
  }));
}

function doUndo() {
  if (!undoStack.length) return;
  const prev = undoStack.pop();
  /* Restore image srcs from store */
  for (const el of prev) {
    if (el.type === 'image' && !el.src) {
      const src = imgSrcStore.get(el.id);
      if (src) el.src = src;
    }
  }
  const prevIds = new Set(prev.map(e => e.id));
  const curIds  = new Set(all.map(e => e.id));
  /* Elements removed in this action → re-add */
  for (const el of prev) {
    if (!curIds.has(el.id)) wsSend({ type: 'stroke', data: el });
  }
  /* Elements added in this action → erase */
  for (const el of all) {
    if (!prevIds.has(el.id)) wsSend({ type: 'erase_stroke', id: el.id });
  }
  /* Elements that changed → update */
  for (const el of prev) {
    if (curIds.has(el.id)) {
      const cur = all.find(e => e.id === el.id);
      const prevJ = JSON.stringify(el), curJ = cur ? JSON.stringify(cur) : '';
      if (prevJ !== curJ) {
        wsSend({ type: 'erase_stroke', id: el.id });
        setTimeout(() => wsSend({ type: 'stroke', data: el }), 40);
      }
    }
  }
  all = prev;
  clearSel();
  redraw();
}

/* Build a row of color swatches + custom RGB picker */
function mkColorRow(current, onChange) {
  const d = document.createElement('div'); d.className = 'clrs';
  getColors().forEach(c => {
    const b = document.createElement('div');
    b.className = 'cb' + (c === current ? ' act' : '');
    b.style.background = c; b.title = c;
    b.onclick = () => {
      d.querySelectorAll('.cb, label.cb').forEach(x => x.classList.remove('act'));
      b.classList.add('act'); onChange(c);
    };
    d.appendChild(b);
  });
  /* Custom color picker — rainbow swatch opens native color picker */
  const lbl = document.createElement('label');
  const isCustom = !getColors().includes(current);
  lbl.className = 'cb' + (isCustom ? ' act' : '');
  lbl.title = 'Свой цвет (RGB)';
  lbl.style.cssText = `background:${isCustom ? current : 'conic-gradient(hsl(0,100%,55%),hsl(60,100%,55%),hsl(120,100%,45%),hsl(180,100%,45%),hsl(240,100%,60%),hsl(300,100%,55%),hsl(360,100%,55%))'};cursor:pointer;overflow:visible;position:relative`;
  const inp = document.createElement('input');
  inp.type = 'color'; inp.value = isCustom ? current : '#ff0000';
  inp.style.cssText = 'position:absolute;width:0;height:0;opacity:0;left:0;top:0;';
  inp.oninput = () => {
    d.querySelectorAll('.cb, label.cb').forEach(x => x.classList.remove('act'));
    lbl.classList.add('act');
    lbl.style.background = inp.value;
    onChange(inp.value);
  };
  lbl.appendChild(inp);
  d.appendChild(lbl);
  return d;
}

          </div></div>`);
      sp.querySelector('#tArN').onclick = () => { geoArrow='none';  renderSP(); };
      sp.querySelector('#tArE').onclick = () => { geoArrow='end';   renderSP(); };

    }
  }

  else if (tool === 'text') {
    $('<h4>Текст</h4><div class="sp-row"><label>Цвет</label></div>');

    $(`<div class="sp-row"><label>Размер</label>

        </div></div>

    sp.querySelector('#spFS').oninput = e => { textFontSize = +e.target.value || 18; updateTedStyle(); };
    sp.querySelector('#spTW').oninput = e => { textBoxW = +e.target.value || 240; };
    sp.querySelector('#tB').onclick = () => { textBold      = !textBold;      renderSP(); updateTedStyle(); };
    sp.querySelector('#tI').onclick = () => { textItalic    = !textItalic;    renderSP(); updateTedStyle(); };

  }

}

// ══════════════════════════════════════════════════════════
// §9b  LINE GEOMETRY HELPERS
// ══════════════════════════════════════════════════════════

/* Visual (world) positions of p1/pm/p2, accounting for el.rotation */
function getVisualPts(el) {
  const rot = el.rotation || 0;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  const mlx = (el.x1+el.x2)/2, mly = (el.y1+el.y2)/2;
  const hx = (el.x2-el.x1)/2, hy = (el.y2-el.y1)/2;
  const rhx = hx*cos - hy*sin, rhy = hx*sin + hy*cos;
  return { p1:{x:mlx-rhx,y:mly-rhy}, pm:{x:mlx,y:mly}, p2:{x:mlx+rhx,y:mly+rhy} };
}

/* Store new visual endpoints back into local coords (inverse of getVisualPts) */
function setVisualLine(el, W1x, W1y, W2x, W2y) {
  const rot = el.rotation || 0;
  const ic = Math.cos(-rot), is = Math.sin(-rot);
  const mlx=(W1x+W2x)/2, mly=(W1y+W2y)/2;
  const hx=(W2x-W1x)/2, hy=(W2y-W1y)/2;
  const lhx=hx*ic-hy*is, lhy=hx*is+hy*ic;
  el.x1=mlx-lhx; el.y1=mly-lhy; el.x2=mlx+lhx; el.y2=mly+lhy;
}

/* Translate el so that its handle lands at (tx,ty) */
function moveLineTo(el, handle, tx, ty) {
  const vp = getVisualPts(el);
  const dx = tx - vp[handle].x, dy = ty - vp[handle].y;
  setVisualLine(el, vp.p1.x+dx, vp.p1.y+dy, vp.p2.x+dx, vp.p2.y+dy);
}

/* Rotate el's visual endpoints around world point (cx,cy) by delta angle da */
function rotateLineAround(el, cx, cy, da) {
  const vp = getVisualPts(el);
  const cos = Math.cos(da), sin = Math.sin(da);
  const r2 = (px,py) => { const dx=px-cx,dy=py-cy; return {x:cx+dx*cos-dy*sin,y:cy+dx*sin+dy*cos}; };
  const nw1 = r2(vp.p1.x,vp.p1.y), nw2 = r2(vp.p2.x,vp.p2.y);
  setVisualLine(el, nw1.x,nw1.y, nw2.x,nw2.y);
}

/* Signed visual angle of line in radians (direction from p1→p2) */
function lineVisAngle(el) {
  const vp = getVisualPts(el);
  return Math.atan2(vp.p2.y - vp.p1.y, vp.p2.x - vp.p1.x);
}

/* Angle between two lines in degrees [0, 180] */
function angleBetwLines(a, b) {
  let da = lineVisAngle(b) - lineVisAngle(a);
  da = ((da % Math.PI) + Math.PI) % Math.PI;
  return da * 180 / Math.PI;
}

/* Rotate any element around world point (cx,cy) by angle da (radians).
   Used for group rotation with R+arrow keys. */
function rotateElementAround(el, cx, cy, da) {
  const cos = Math.cos(da), sin = Math.sin(da);
  const rot2 = (px, py) => ({
    x: cx + (px-cx)*cos - (py-cy)*sin,
    y: cy + (px-cx)*sin + (py-cy)*cos
  });
  if (el.type === 'shape' && el.shape === 'line') {
    rotateLineAround(el, cx, cy, da);                  // uses existing helper
  } else if (el.type === 'shape') {
    const bb = elemBBox(el);
    const nc = rot2(bb.x + bb.w/2, bb.y + bb.h/2);
    const hw = bb.w/2, hh = bb.h/2;
    el.x1 = nc.x-hw; el.y1 = nc.y-hh; el.x2 = nc.x+hw; el.y2 = nc.y+hh;
    el.rotation = (el.rotation || 0) + da;
  } else if (el.type === 'text' || el.type === 'image' || el.type === 'richtext') {
    const bb = elemBBox(el);
    const nc = rot2(bb.x + bb.w/2, bb.y + bb.h/2);
    el.x = nc.x - bb.w/2; el.y = nc.y - bb.h/2;
    el.rotation = (el.rotation || 0) + da;
  } else if (el.type === 'stroke') {
    el.pts = el.pts.map(p => rot2(p.x, p.y));
  }
}

// ══════════════════════════════════════════════════════════
// §9c  COORDINATE SYSTEM HELPERS
// ══════════════════════════════════════════════════════════

/* Canonical key for a CS pair (order-independent) */
function csKey(id1, id2) { return [id1, id2].sort().join('|'); }

/* Intersection of two infinite lines defined by their visual endpoints.
   Returns null if lines are parallel (|det| < ε). */
function lineIntersection(la, lb) {
  const a = getVisualPts(la), b = getVisualPts(lb);
  const ax = a.p1.x, ay = a.p1.y, bx = a.p2.x, by = a.p2.y;
  const cx = b.p1.x, cy = b.p1.y, dx = b.p2.x, dy = b.p2.y;
  const dabx = bx-ax, daby = by-ay;
  const dcdx = dx-cx, dcdy = dy-cy;
  const det = dabx*dcdy - daby*dcdx;
  if (Math.abs(det) < 1e-9) return null;
  const t = ((cx-ax)*dcdy - (cy-ay)*dcdx) / det;
  return { x: ax + t*dabx, y: ay + t*daby };
}

/* True if two lines can form a CS (angle between them ≥ MIN_CS_ANGLE degrees) */
const MIN_CS_ANGLE = 10;
function linesCanFormCS(la, lb) {
  const ang = angleBetwLines(la, lb);          // 0..180
  const norm = Math.min(ang, 180 - ang);       // 0..90
  return norm >= MIN_CS_ANGLE;
}

/* True if intersection is "close enough" to be useful for graphing.
   We check that the intersection lies within MAX_CS_DIST world units
   from the viewport centre — roughly 10× the visible half-diagonal. */
function csIntersectionInView(pt) {
  if (!pt) return false;
  const cx = (tw(0,0).x + tw(W,H).x)/2, cy = (tw(0,0).y + tw(W,H).y)/2;
  const diagHalf = Math.hypot(W,H) / vz / 2;
  return Math.hypot(pt.x-cx, pt.y-cy) < diagHalf * 10;
}

/* Positive unit vector of a line (toward the "positive" end = arrow end).
   Falls back to p1→p2 when no arrow. */
function csPositiveDir(el) {
  const vp = getVisualPts(el);
  // positive = arrow target; if 'start' the positive end is p1, else p2
  const pos = (el.arrow === 'start') ? vp.p1 : vp.p2;
  const neg = (el.arrow === 'start') ? vp.p2 : vp.p1;
  const len = Math.hypot(pos.x-neg.x, pos.y-neg.y) || 1;
  return { x:(pos.x-neg.x)/len, y:(pos.y-neg.y)/len, posEnd:pos, negEnd:neg };
}

/* Create CS link between two lines.  Stores csPartner / csScale on both.
   Centers both lines at their intersection (midpoints → O). */
function makeCS(la, lb) {
  addToUndo();
  la.csPartner = lb.id;
  lb.csPartner = la.id;
  /* Center both lines at intersection so midpoints always equal O */
  const O = lineIntersection(la, lb);
  if (O) {
    [la, lb].forEach(el => {
      const vp = getVisualPts(el);
      const dx = vp.p2.x - vp.p1.x, dy = vp.p2.y - vp.p1.y;
      const len = Math.hypot(dx, dy);
      if (len < 0.001) return;
      const hl = len / 2;                          // half-length
      const nx = dx / len, ny = dy / len;           // unit vector p1→p2
      setVisualLine(el, O.x - nx*hl, O.y - ny*hl, O.x + nx*hl, O.y + ny*hl);
      el.csScale = Math.max(1, hl / 10);           // default: range of 10 units
    });
  }
  /* Sync */
  [la, lb].forEach(el => {
    wsSend({ type:'erase_stroke', id:el.id });
    setTimeout(() => wsSend({ type:'stroke', data:el }), 40);
  });
}

/* Dissolve CS link between two lines */
function dissolveCS(la, lb) {
  addToUndo();
  delete la.csPartner; delete la.csScale; delete la.csTickStep; delete la.csGraphs;
  delete lb.csPartner; delete lb.csScale; delete lb.csTickStep;
  [la, lb].forEach(el => {
    wsSend({ type:'erase_stroke', id:el.id });
    setTimeout(() => wsSend({ type:'stroke', data:el }), 40);
  });
}

/* Safe math expression evaluator: supports x,y, ^, sqrt, sin, cos, tan, abs, exp, ln, log, pi, e */
function mathEval(expr, xVal, yVal) {
  try {
    const code = expr
      .replace(/\^/g, '**')
      .replace(/\bsqrt\b/g, 'Math.sqrt')
      .replace(/\bcbrt\b/g, 'Math.cbrt')
      .replace(/\bsin\b/g,  'Math.sin')
      .replace(/\bcos\b/g,  'Math.cos')
      .replace(/\btan\b/g,  'Math.tan')
      .replace(/\basin\b/g, 'Math.asin')
      .replace(/\bacos\b/g, 'Math.acos')
      .replace(/\batan\b/g, 'Math.atan')
      .replace(/\babs\b/g,  'Math.abs')
      .replace(/\bexp\b/g,  'Math.exp')
      .replace(/\bln\b/g,   'Math.log')
      .replace(/\blog\b/g,  'Math.log10')
      .replace(/\bsign\b/g, 'Math.sign')
      .replace(/\bfloor\b/g,'Math.floor')
      .replace(/\bceil\b/g, 'Math.ceil')
      .replace(/\bround\b/g,'Math.round')
      .replace(/\bpi\b/gi,  'Math.PI')   // case-insensitive pi/Pi/PI, applied once
      .replace(/(?<![A-Za-z_])e(?![A-Za-z_0-9])/g, 'Math.E'); // standalone 'e' (not Math.E, exp…)
    // eslint-disable-next-line no-new-func
    return new Function('x','y', '"use strict";return (' + code + ');')(xVal, yVal);
  } catch { return NaN; }
}

/* Parse equation string like "y=x^2", "x^3=sqrt(y)", "x^2+y^2=25" (implicit).
   Returns { mode:'yfx'|'xfy'|'implicit', rhs/lhs } or null on failure. */
function parseEqn(raw) {
  const parts = raw.split('=');
  if (parts.length !== 2) return null;
  const [lhs, rhs] = parts.map(s => s.trim());
  if (lhs === 'y') return { mode:'yfx', rhs };
  if (lhs === 'x') return { mode:'xfy', rhs };
  if (rhs === 'y') return { mode:'xfy', rhs: lhs };
  if (rhs === 'x') return { mode:'yfx', rhs: lhs };
  const hXL=/\bx\b/.test(lhs), hYL=/\by\b/.test(lhs);
  const hXR=/\bx\b/.test(rhs), hYR=/\by\b/.test(rhs);
  // Implicit: y appears on BOTH sides, or lhs mixes x and y
  if ((hYL && hXL) || (hYR && hXR) || (hYL && hYR)) {
    return { mode:'implicit', lhs, rhs };
  }
  // Explicit fallback
  if (hYL && !hXL) return { mode:'xfy', rhs: lhs };
  if (hXL && !hYL) return { mode:'yfx', rhs: lhs };
  return { mode:'yfx', rhs }; // default
}

/* Returns {la, lb} if world point (wx,wy) is inside any CS parallelogram, else null.
   Uses the parallelogram spanned by the full extent of both CS axes (all 4 quadrants). */
function csParallelogramAt(wx, wy) {
  const seen = new Set();
  for (const el of all) {
    if (!el.csPartner) continue;
    const partner = all.find(e => e.id === el.csPartner);
    if (!partner) continue;
    const key = csKey(el.id, partner.id);
    if (seen.has(key)) continue; seen.add(key);
    const la = el, lb = partner;
    const O = lineIntersection(la, lb);
    if (!O) continue;
    const vA = getVisualPts(la), vB = getVisualPts(lb);
    /* Use the half-vectors (both directions) from O */
    const uA = { x: vA.p2.x - vA.p1.x, y: vA.p2.y - vA.p1.y }; // full vector p1→p2
    const uB = { x: vB.p2.x - vB.p1.x, y: vB.p2.y - vB.p1.y };
    /* Solve (wx-O.x, wy-O.y) = a*uA + b*uB  →  check |a|<=0.5, |b|<=0.5 (half-extent) */
    const det = uA.x * uB.y - uA.y * uB.x;
    if (Math.abs(det) < 1e-9) continue;
    const dx = wx - O.x, dy = wy - O.y;
    const a = (dx * uB.y - dy * uB.x) / det;
    const b = (uA.x * dy - uA.y * dx) / det;
    if (Math.abs(a) <= 0.5 && Math.abs(b) <= 0.5) return { la, lb };
  }
  return null;
}

/* ── CS unified panel ──
   Call with (la, lb) to show/update, or (null, null) to hide. */
function updateCSPanels(la, lb) {
  const panel = document.getElementById('csSetPanel');

  if (!la || !lb) { panel.classList.remove('open'); csPanelLaId = null; csPanelLbId = null; return; }

  /* Store IDs for persistence so panel can be restored after WS round-trips */
  csPanelLaId = la.id; csPanelLbId = lb.id;
  /* Helper: always look up the LIVE element from all[] to avoid stale references */
  const getLa = () => all.find(e => e.id === csPanelLaId) || la;
  const getLb = () => all.find(e => e.id === csPanelLbId) || lb;

  const O = lineIntersection(la, lb);
  const hasDir = la.arrow && la.arrow !== 'none' &&
                 lb.arrow && lb.arrow !== 'none';
  const inView = O && csIntersectionInView(O);
  const GRAPH_COLORS = ['#ef4444','#10b981','#f59e0b','#a855f7','#ec4899','#22c55e'];

  /* ── Position below selBar ── */
  const positionPanel = () => {
    const sbr = document.getElementById('selBar').getBoundingClientRect();
    panel.style.top  = (sbr.bottom + 6) + 'px';
    panel.style.left = Math.max(340, sbr.left) + 'px';
  };
  requestAnimationFrame(positionPanel);

  /* ─── Build content ─── */
  panel.innerHTML = '';
  panel.classList.add('open');

  const colorA = la.color || '#22c55e', colorB = lb.color || '#10b981';

  /* Header */
  const hdr = document.createElement('div'); hdr.className = 'cs-hdr';
  hdr.textContent = '⊕ Система координат'; panel.appendChild(hdr);

  /* Helper: half-length of axis line (rotation-invariant) */
  const halfLen = el => Math.hypot((el.x2-el.x1)/2, (el.y2-el.y1)/2);

  /* Axis blocks (A and B) */
  ['A','B'].forEach((letter, idx) => {
    const axEl = idx === 0 ? la : lb;
    const clr  = idx === 0 ? colorA : colorB;

    const block = document.createElement('div'); block.className = 'cs-axis-block';
    block.style.borderLeft = `3px solid ${clr}`;

    /* Title row */
    const title = document.createElement('div');
    title.style.cssText = `font-size:.78em;font-weight:600;color:var(--fg);margin-bottom:1px`;
    title.textContent = `Ось ${letter}`;
    block.appendChild(title);

    const mkInp = () => {
      const i = document.createElement('input');
      i.type='number'; i.min='0.001'; i.step='any';
      i.style.cssText='width:60px;padding:3px 6px;border-radius:6px;border:1px solid var(--sep);background:var(--input);color:var(--fg);font-size:.82em;transition:border-color .15s';
      i.onfocus = () => i.style.borderColor='var(--accent)';
      i.onblur  = () => i.style.borderColor='var(--sep)';
      return i;
    };

    /* ── Range row (диапазон: единицы от центра до конца) ── */
    const rangeRow = document.createElement('div'); rangeRow.className = 'cs-row';
    const rangeInp = mkInp();
    const hl0 = halfLen(axEl);
    rangeInp.value = parseFloat((hl0 / (axEl.csScale || 50)).toPrecision(4));
    rangeInp.title = 'Количество единиц от центра до конца оси';
    rangeInp.oninput = () => {
      const r = parseFloat(rangeInp.value);
      if (r > 0) {
        const liveEl = all.find(e => e.id === axEl.id) || axEl;
        const hl = halfLen(liveEl);
        liveEl.csScale = axEl.csScale = hl / r;
        redraw();
      }
    };
    rangeInp.onchange = () => {
      const liveEl = all.find(e => e.id === axEl.id) || axEl;
      wsSend({type:'erase_stroke',id:liveEl.id});
      setTimeout(()=>wsSend({type:'stroke',data:liveEl}),40);
    };
    const rangeLabel = document.createElement('label'); rangeLabel.textContent='Диапазон';
    const rangeUnit  = document.createElement('span');  rangeUnit.className='cs-unit'; rangeUnit.textContent='ед';
    rangeRow.append(rangeLabel, rangeInp, rangeUnit);
    block.appendChild(rangeRow);

    /* ── Size row (физическая длина полуоси) ── */
    const sizeRow = document.createElement('div'); sizeRow.className = 'cs-row';
    const sizeInp = mkInp();
    sizeInp.value = Math.round(hl0);
    sizeInp.title = 'Физический размер полуоси (мировые пикселы)';
    sizeInp.oninput = () => {
      const newHl = parseFloat(sizeInp.value);
      if (newHl > 0) {
        const _la2 = getLa(), _lb2 = getLb();
        const Oi = lineIntersection(_la2, _lb2);
        if (!Oi) return;
        const liveEl = all.find(e => e.id === axEl.id) || axEl;
        const vp = getVisualPts(liveEl);
        const dx = vp.p2.x - vp.p1.x, dy = vp.p2.y - vp.p1.y;
        const len = Math.hypot(dx, dy); if (len < 0.001) return;
        const nx = dx/len, ny = dy/len;
        setVisualLine(liveEl, Oi.x - nx*newHl, Oi.y - ny*newHl, Oi.x + nx*newHl, Oi.y + ny*newHl);
        redraw();
      }
    };
    sizeInp.onchange = () => {
      const liveEl = all.find(e => e.id === axEl.id) || axEl;
      wsSend({type:'erase_stroke',id:liveEl.id});
      setTimeout(()=>wsSend({type:'stroke',data:liveEl}),40);
    };
    const sizeLabel = document.createElement('label'); sizeLabel.textContent='Размер';
    const sizeUnit  = document.createElement('span');  sizeUnit.className='cs-unit'; sizeUnit.textContent='px';
    sizeRow.append(sizeLabel, sizeInp, sizeUnit);
    block.appendChild(sizeRow);

    /* ── Tick step row ── */
    const tickRow = document.createElement('div'); tickRow.className = 'cs-row';
    const tickInp = mkInp();
    tickInp.value = axEl.csTickStep != null ? axEl.csTickStep : 1;
    tickInp.oninput = () => {
      const v = parseFloat(tickInp.value);
      if (v>0) { const liveEl = all.find(e => e.id === axEl.id) || axEl;
        liveEl.csTickStep = axEl.csTickStep = v; redraw(); }
    };
    tickInp.onchange = () => {
      const liveEl = all.find(e => e.id === axEl.id) || axEl;
      wsSend({type:'erase_stroke',id:liveEl.id});
      setTimeout(()=>wsSend({type:'stroke',data:liveEl}),40); };
    const tickLabel = document.createElement('label'); tickLabel.textContent='Шаг';
    const tickUnit  = document.createElement('span');  tickUnit.className='cs-unit'; tickUnit.textContent='ед';
    tickRow.append(tickLabel, tickInp, tickUnit);
    block.appendChild(tickRow);

    panel.appendChild(block);
  });

  /* Intersection info */
  const sep1 = document.createElement('div'); sep1.className='cs-sep'; panel.appendChild(sep1);
  if (O) {
    const info = document.createElement('div'); info.className='cs-row'; info.style.fontSize='.78em';
    const lbl=document.createElement('label'); lbl.textContent='Пересечение';
    const val=document.createElement('span');
    val.style.cssText='font-family:monospace;color:var(--fg-dim)';
    val.textContent=`(${O.x.toFixed(0)}, ${O.y.toFixed(0)})`;
    info.append(lbl,val); panel.appendChild(info);
    if (!inView) {
      const w=document.createElement('div');
      w.style.cssText='font-size:.73em;color:#f59e0b';
      w.textContent='⚠ Пересечение вне экрана — график недоступен';
      panel.appendChild(w);
    }
  } else {
    const w=document.createElement('div');
    w.style.cssText='font-size:.73em;color:#ef4444';
    w.textContent='⚠ Прямые параллельны'; panel.appendChild(w);
  }

  /* Graphs section — only if arrows set AND intersection visible */
  if (!hasDir || !inView) return;

  const sep2 = document.createElement('div'); sep2.className='cs-sep'; panel.appendChild(sep2);
  const ghdr = document.createElement('div'); ghdr.className='cs-hdr';
  ghdr.textContent='∫ Графики'; panel.appendChild(ghdr);

  const graphs = la.csGraphs || [];

  /* Existing graph items */
  graphs.forEach((g, i) => {
    /* ── Main row ── */
    const item = document.createElement('div'); item.className='csg-item';

    const dot = document.createElement('div'); dot.className='csg-dot';
    dot.style.background = g.color||'#ef4444'; dot.title='Сменить цвет';
    const cpk = document.createElement('input'); cpk.type='color'; cpk.value=g.color||'#ef4444';
    cpk.style.cssText='position:absolute;width:0;height:0;opacity:0';
    dot.appendChild(cpk);
    dot.onclick=()=>cpk.click();
    const gIdx = i; // capture index for live-lookup
    const liveG = () => { const _la=getLa(); return (_la.csGraphs && _la.csGraphs[gIdx]) || g; };
    cpk.oninput=()=>{ const lg=liveG(); lg.color=g.color=cpk.value; dot.style.background=lg.color; redraw(); };
    cpk.onchange=()=>{ const _la=getLa(); wsSend({type:'erase_stroke',id:_la.id}); setTimeout(()=>wsSend({type:'stroke',data:_la}),40); };

    const eq=document.createElement('span'); eq.className='csg-eq';
    eq.textContent=g.eq; eq.title='Нажмите для редактирования';
    eq.onclick=()=>{
      const curEq = liveG().eq || g.eq;
      const nw=prompt('Уравнение:',curEq);
      if (nw!==null && nw.trim()) {
        const lg=liveG(); const p=parseEqn(nw.trim());
        lg.eq=g.eq=nw.trim(); if(p){ lg.mode=g.mode=p.mode; }
        const _la=getLa(),_lb=getLb();
        redraw(); wsSend({type:'erase_stroke',id:_la.id});
        setTimeout(()=>wsSend({type:'stroke',data:_la}),40); updateCSPanels(_la,_lb); }
    };

    const rm=document.createElement('button'); rm.className='csg-rm'; rm.textContent='×'; rm.title='Удалить';
    rm.onclick=()=>{
      const _la=getLa(),_lb=getLb();
      if (_la.csGraphs) _la.csGraphs.splice(gIdx,1); redraw();
      wsSend({type:'erase_stroke',id:_la.id}); setTimeout(()=>wsSend({type:'stroke',data:_la}),40);
      updateCSPanels(_la,_lb); };

    item.append(dot,cpk,eq,rm); panel.appendChild(item);

    /* ── Style controls row ── */
    const ctrl = document.createElement('div'); ctrl.className='csg-ctrl';

    /* Dash style buttons */
    const DASHES=[['─── solid','solid'],['– – dashed','dashed'],['··· dotted','dotted']];
    DASHES.forEach(([label,val])=>{
      const btn=document.createElement('button'); btn.className='csg-sty';
      btn.textContent=label; btn.title=`Стиль: ${val}`;
      if ((g.dash||'solid')===val) btn.classList.add('act');
      btn.onclick=()=>{
        g.dash=val; redraw();
        const _la=getLa(),_lb=getLb();
        wsSend({type:'erase_stroke',id:_la.id}); setTimeout(()=>wsSend({type:'stroke',data:_la}),40);
        updateCSPanels(_la,_lb); };
      ctrl.appendChild(btn);
    });

    /* Width buttons */
    const WIDTHS=[[1,'1px'],[2,'2px'],[3,'3px']];
    WIDTHS.forEach(([val,label])=>{
      const btn=document.createElement('button'); btn.className='csg-sty';
      btn.textContent=label;
      if ((g.width||2)===val) btn.classList.add('act');
      btn.onclick=()=>{
        g.width=val; redraw();
        const _la=getLa(),_lb=getLb();
        wsSend({type:'erase_stroke',id:_la.id}); setTimeout(()=>wsSend({type:'stroke',data:_la}),40);
        updateCSPanels(_la,_lb); };
      ctrl.appendChild(btn);
    });

    /* Copy-to-board button */
    const cpBtn=document.createElement('button'); cpBtn.className='csg-sty cp';
    cpBtn.textContent='📋 на доску'; cpBtn.title='Скопировать линию графика на доску';
    cpBtn.onclick=()=>graphToStroke(getLa(),getLb(),g);
    ctrl.appendChild(cpBtn);

    panel.appendChild(ctrl);
  });

  /* Add graph row */
  const sep3=document.createElement('div'); sep3.className='cs-sep'; panel.appendChild(sep3);
  const addRow=document.createElement('div'); addRow.className='csg-add';

  let nextColor=GRAPH_COLORS[graphs.length%GRAPH_COLORS.length];
  const colorDot=document.createElement('div'); colorDot.className='csg-dot'; colorDot.style.cssText=`background:${nextColor};position:relative`;
  const colorPick=document.createElement('input'); colorPick.type='color'; colorPick.value=nextColor;
  colorPick.style.cssText='position:absolute;width:0;height:0;opacity:0';
  colorDot.appendChild(colorPick); colorDot.onclick=()=>colorPick.click();
  colorPick.oninput=()=>{ nextColor=colorPick.value; colorDot.style.background=nextColor; };

  const eqInp=document.createElement('input'); eqInp.type='text';
  eqInp.placeholder='y=x^2  ·  x^2+y^2=r^2';
  eqInp.title='y=f(x) | x=f(y) | F(x,y)=G(x,y)';

  const addBtn=document.createElement('button'); addBtn.className='cs-btn'; addBtn.textContent='+';
  addBtn.onclick=()=>{
    const raw=eqInp.value.trim(); if(!raw) return;
    const parsed=parseEqn(raw);
    if(!parsed){ eqInp.style.outline='2px solid #ef4444'; return; }
    eqInp.style.outline='';
    const _la=getLa(), _lb=getLb();
    if(!_la.csGraphs) _la.csGraphs=[];
    _la.csGraphs.push({eq:raw,mode:parsed.mode,color:nextColor,dash:'solid',width:2});
    redraw(); wsSend({type:'erase_stroke',id:_la.id});
    setTimeout(()=>wsSend({type:'stroke',data:_la}),40);
    eqInp.value=''; updateCSPanels(_la,_lb); };
  eqInp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addBtn.click();}});

  addRow.append(colorDot,colorPick,eqInp,addBtn); panel.appendChild(addRow);

  const hint=document.createElement('div');
  hint.style.cssText='font-size:.69em;color:var(--fg-dim);padding-top:1px';
  hint.textContent='y=f(x) · x=f(y) · F(x,y)=G(x,y) · sin cos sqrt ln ^ pi';
  panel.appendChild(hint);
}

function updateSelBar() {
  const bar = document.getElementById('selBar');
  bar.innerHTML = '';
  updateCSPanels(null, null);   // reset CS panels; will re-open below if 2 CS lines selected
  if (!selected.size || tool !== 'select') { bar.classList.remove('open'); return; }

  const selEls  = all.filter(e => selected.has(e.id));
  const editable = selEls.filter(e => e.type === 'stroke' || e.type === 'shape');
  if (!selEls.length) { bar.classList.remove('open'); return; }

  bar.classList.add('open');

  /* ── Header: count + list toggle ── */
  const hRow = document.createElement('div');
  hRow.style.cssText = 'display:flex;align-items:center;gap:6px';
  const h5 = document.createElement('h5');
  h5.textContent = `Выделено: ${selEls.length}`;
  hRow.appendChild(h5);
  /* List toggle */
  const listToggle = document.createElement('button');
  listToggle.className = 'tog' + (selListOpen ? ' act' : '');
  listToggle.title = 'Список элементов';
  listToggle.textContent = '↳';
  listToggle.style.cssText = 'min-width:26px;height:22px;padding:0;font-size:.85em';
  listToggle.onclick = () => { selListOpen = !selListOpen; updateSelBar(); };
  hRow.appendChild(listToggle);
  bar.appendChild(hRow);

  if (editable.length) {
    /* Color row */
    const firstColor = editable[0].color || getColors()[0];
    let colorUndoAdded = false;
    bar.appendChild(mkColorRow(firstColor, c => {
      if (!colorUndoAdded) { addToUndo(); colorUndoAdded = true; }
      editable.forEach(el => el.color = c);
      redraw();
      editable.forEach(el => {
        wsSend({ type: 'erase_stroke', id: el.id });
        setTimeout(() => wsSend({ type: 'stroke', data: el }), 40);
      });
    }));

    /* Thickness slider */
    const firstSize = editable[0].size || 3;
    const rRow = document.createElement('div'); rRow.className = 'sp-row';
    rRow.innerHTML = `<label style="min-width:0">Толщина <span id="sbSzV" style="font-size:.8em;opacity:.65">${firstSize}</span></label>
      <input type="range" id="sbSz" min="1" max="40" value="${firstSize}" style="width:90px">`;
    rRow.querySelector('#sbSz').addEventListener('mousedown', () => addToUndo());
    rRow.querySelector('#sbSz').oninput = e => {
      const v = +e.target.value;
      document.getElementById('sbSzV').textContent = v;
      editable.forEach(el => el.size = v);
      redraw();
    };
    rRow.querySelector('#sbSz').onchange = () => {
      editable.forEach(el => {
        wsSend({ type: 'erase_stroke', id: el.id });
        setTimeout(() => wsSend({ type: 'stroke', data: el }), 40);
      });
    };
    bar.appendChild(rRow);

    /* Arrow selector — only when selected lines are present */
    const lineEls = selEls.filter(e => e.type === 'shape' && e.shape === 'line');
    if (lineEls.length) {
      const firstArrow = lineEls[0].arrow || 'none';
      const arRow = document.createElement('div'); arRow.className = 'sp-row';
      arRow.innerHTML = `<label style="min-width:0">Стрелки</label>
        <div class="tog-row">
          <button class="tog${firstArrow==='none' ?' act':''}" id="sbArN">—</button>
          <button class="tog${firstArrow==='end'  ?' act':''}" id="sbArE">→</button>
          <button class="tog${firstArrow==='start'?' act':''}" id="sbArS">←</button>
          <button class="tog${firstArrow==='both' ?' act':''}" id="sbArB">↔</button>
        </div>`;
      const setArrow = v => {
        addToUndo();
        lineEls.forEach(el => { el.arrow = v; });
        redraw();
        lineEls.forEach(el => {
          wsSend({ type: 'erase_stroke', id: el.id });
          setTimeout(() => wsSend({ type: 'stroke', data: el }), 40);
        });
        updateSelBar();
      };
      arRow.querySelector('#sbArN').onclick = () => setArrow('none');
      arRow.querySelector('#sbArE').onclick = () => setArrow('end');
      arRow.querySelector('#sbArS').onclick = () => setArrow('start');
      arRow.querySelector('#sbArB').onclick = () => setArrow('both');
      bar.appendChild(arRow);
    }

    /* Two-line positioning — shows when exactly 2 lines are selected */
    const lineElsSel = selEls.filter(e => e.type === 'shape' && e.shape === 'line');
    if (lineElsSel.length === 2) {
      const la = sbLineOrder === 0 ? lineElsSel[0] : lineElsSel[1];
      const lb = sbLineOrder === 0 ? lineElsSel[1] : lineElsSel[0];

      const mkHBtns = (sel, id) =>
        `<div class="tog-row" id="${id}">${['p1','pm','p2'].map(h =>
          `<button class="tog${h===sel?' act':''}" data-h="${h}">${h}</button>`).join('')}</div>`;

      const posDiv = document.createElement('div');
      posDiv.style.cssText = 'display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--sep);padding-left:10px;';

      const laClr = la.color || COLORS[2], lbClr = lb.color || COLORS[2];
      const orderRow = document.createElement('div'); orderRow.className = 'sp-row'; orderRow.style.gap = '4px';
      orderRow.innerHTML = `
        <button class="tog act" style="border-left:3px solid ${laClr};padding:0 6px" title="Прямая 1 — якорь">Л1</button>
        <button class="tog" id="spSwap" title="Поменять местами Л1 и Л2">⇄</button>
        <button class="tog" style="border-left:3px solid ${lbClr};padding:0 6px" title="Прямая 2 — двигается">Л2</button>
        <span style="font-size:.72em;opacity:.45;margin-left:4px">∠&nbsp;${angleBetwLines(la,lb).toFixed(1)}°</span>`;
      orderRow.querySelector('#spSwap').onclick = () => { sbLineOrder = 1 - sbLineOrder; updateSelBar(); };
      posDiv.appendChild(orderRow);

      const snapRow = document.createElement('div'); snapRow.className = 'sp-row'; snapRow.style.gap = '4px';
      snapRow.innerHTML = `<label style="min-width:0">Совм.</label>
        <span style="font-size:.7em;opacity:.55">Л1</span>${mkHBtns(sbSnapHA,'spHA')}
        <span style="opacity:.4">≡</span>
        <span style="font-size:.7em;opacity:.55">Л2</span>${mkHBtns(sbSnapHB,'spHB')}
        <button class="tog" id="spSnap" title="Переместить Л2">✓</button>`;
      snapRow.querySelectorAll('#spHA .tog').forEach(b => b.onclick = () => {
        sbSnapHA = b.dataset.h; snapRow.querySelectorAll('#spHA .tog').forEach(x => x.classList.toggle('act', x===b));
      });
      snapRow.querySelectorAll('#spHB .tog').forEach(b => b.onclick = () => {
        sbSnapHB = b.dataset.h; snapRow.querySelectorAll('#spHB .tog').forEach(x => x.classList.toggle('act', x===b));
      });
      snapRow.querySelector('#spSnap').onclick = () => {
        addToUndo();
        const anchor = getVisualPts(la)[sbSnapHA];
        moveLineTo(lb, sbSnapHB, anchor.x, anchor.y);
        redraw();
        wsSend({ type:'erase_stroke', id:lb.id });
        setTimeout(() => wsSend({ type:'stroke', data:lb }), 40);
        updateSelBar();
      };
      posDiv.appendChild(snapRow);

      const curAng = angleBetwLines(la, lb);
      const angRow = document.createElement('div'); angRow.className = 'sp-row'; angRow.style.gap = '4px';
      angRow.innerHTML = `<label style="min-width:0">∠Л2</label>
        <input type="number" id="spAngV" min="-360" max="360" value="${curAng.toFixed(1)}" style="width:56px">
        <span style="opacity:.35">°</span>
        <span style="opacity:.5;font-size:.78em">вкруг&nbsp;Л2</span>
        ${mkHBtns(sbRotCenter,'spRC')}
        <button class="tog" id="spAngOk">Ок</button>`;
      angRow.querySelectorAll('#spRC .tog').forEach(b => b.onclick = () => {
        sbRotCenter = b.dataset.h; angRow.querySelectorAll('#spRC .tog').forEach(x => x.classList.toggle('act', x===b));
      });
      angRow.querySelector('#spAngOk').onclick = () => {
        const tgt = parseFloat(angRow.querySelector('#spAngV').value);
        if (isNaN(tgt)) return;
        addToUndo();
        const tgtRad = tgt * Math.PI / 180;
        const curRad = ((lineVisAngle(lb) - lineVisAngle(la)) % Math.PI + Math.PI) % Math.PI;
        const da = tgtRad - curRad;
        const center = getVisualPts(lb)[sbRotCenter];
        rotateLineAround(lb, center.x, center.y, da);
        redraw();
        wsSend({ type:'erase_stroke', id:lb.id });
        setTimeout(() => wsSend({ type:'stroke', data:lb }), 40);
        updateSelBar();
      };
      posDiv.appendChild(angRow);

      /* ── Coordinate System button ── */
      const csRow = document.createElement('div'); csRow.className = 'sp-row'; csRow.style.gap='5px';
      const alreadyCS = la.csPartner === lb.id || lb.csPartner === la.id;
      const canCS = linesCanFormCS(la, lb);
      const O_cs = lineIntersection(la, lb);
      if (alreadyCS) {
        const btnDissolve = document.createElement('button');
        btnDissolve.className = 'cs-btn active'; btnDissolve.textContent = '⊕ СК ✓';
        btnDissolve.title = 'Система координат активна. Нажмите, чтобы отключить';
        btnDissolve.onclick = () => { dissolveCS(la, lb); updateSelBar(); updateCSPanels(null,null); redraw(); };
        csRow.appendChild(btnDissolve);
        const btnSettings = document.createElement('button');
        btnSettings.className = 'cs-btn'; btnSettings.textContent = '⚙';
        btnSettings.title = 'Настройки СК';
        btnSettings.onclick = () => updateCSPanels(la, lb);
        csRow.appendChild(btnSettings);
      } else if (canCS && O_cs) {
        const btnMake = document.createElement('button');
        btnMake.className = 'cs-btn'; btnMake.textContent = '⊕ Создать СК';
        btnMake.title = 'Сделать эти прямые системой координат';
        btnMake.onclick = () => { makeCS(la, lb); updateSelBar(); updateCSPanels(la, lb); redraw(); };
        csRow.appendChild(btnMake);
      } else if (!canCS) {
        const note = document.createElement('span');
        note.style.cssText = 'font-size:.72em;opacity:.42';
        const ang = angleBetwLines(la, lb), norm = Math.min(ang, 180-ang);
        note.textContent = `∠${norm.toFixed(0)}° — слишком мал для СК`;
        csRow.appendChild(note);
      }
      posDiv.appendChild(csRow);
      bar.appendChild(posDiv);

      /* Refresh CS panels whenever 2 lines are shown in selBar */
      if (alreadyCS) updateCSPanels(la, lb); else updateCSPanels(null, null);
    } else {
      /* Not exactly 2 lines selected — hide CS panels */
      updateCSPanels(null, null);
    }
  }

  /* Delete button */
  const del = document.createElement('button');
  del.className = 'tog'; del.textContent = '🗑 Удалить';
  del.onclick = () => {
    addToUndo();
    for (const id of selected) { all = all.filter(el => el.id !== id); wsSend({ type: 'erase_stroke', id }); }
    clearSel(); redraw();
  };
  bar.appendChild(del);

  /* ── Element list (expandable) ── */
  const listDiv = document.createElement('div');
  listDiv.className = 'sel-list' + (selListOpen ? ' open' : '');
  const typeIcon = el => {
    if (el.type === 'stroke')   return '🖊';
    if (el.type === 'image')    return '🖼';
    if (el.type === 'richtext') return '📄';
    if (el.type === 'text')     return 'T';
    if (el.type === 'shape')    return el.shape === 'line' ? '╱' : el.shape === 'rect' ? '▭' : '⬭';
    return '?';
  };
  selEls.forEach(el => {
    const row    = document.createElement('div'); row.className = 'sel-item';
    const icon   = document.createElement('span'); icon.className = 'si-icon'; icon.textContent = typeIcon(el);
    const idSpan = document.createElement('span'); idSpan.className = 'si-id';
    idSpan.textContent = el.type + ' ' + el.id.slice(0, 5) + '…';
    const rmBtn  = document.createElement('button'); rmBtn.className = 'si-rm'; rmBtn.textContent = '×';
    rmBtn.title = 'Убрать из выделения';
    rmBtn.onclick = ev => {
      ev.stopPropagation();
      selected.delete(el.id);
      if (hoverHighlightId === el.id) hoverHighlightId = null;
      updateSelBar(); redraw();
    };
    row.appendChild(icon); row.appendChild(idSpan); row.appendChild(rmBtn);
    row.addEventListener('mouseenter', () => { hoverHighlightId = el.id; redraw(); });
    row.addEventListener('mouseleave', () => { hoverHighlightId = null; redraw(); });
    listDiv.appendChild(row);
  });
  bar.appendChild(listDiv);
}

// §11  DRAWING
// ══════════════════════════════════════════════════════════
function drawGrid() {
  const gs = 40 * vz; if (gs < 6) return;
  ctx.save();
  ctx.strokeStyle = dark ? 'rgba(255,255,255,0.09)' : 'rgba(0,0,0,0.07)'; ctx.lineWidth = 1;
  const ox = vx % gs, oy = vy % gs;
  for (let x = ox; x < W; x += gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = oy; y < H; y += gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.restore();
}

function drawStroke(s) {
  if (!s.pts || s.pts.length < 2) return;
  ctx.save();
  if (s.rotation) {
    const bb = elemBBox(s);
    if (bb) { const c=ts(bb.x+bb.w/2,bb.y+bb.h/2); ctx.translate(c.x,c.y); ctx.rotate(s.rotation); ctx.translate(-c.x,-c.y); }
  }
  ctx.strokeStyle = s.color || '#e2e8f0'; ctx.lineWidth = (s.size || 3) * vz;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  let penDown = false;
  for (let i = 0; i < s.pts.length; i++) {
    const pt = s.pts[i];
    /* null/NaN point = pen-up separator (used for monolithic graph copies) */
    if (pt.x == null || !isFinite(pt.x) || !isFinite(pt.y)) { penDown = false; continue; }
    const p = ts(pt.x, pt.y);
    if (!penDown) { ctx.moveTo(p.x, p.y); penDown = true; }
    else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke(); ctx.restore();
}

function drawShape(s) {
  const s1 = ts(s.x1, s.y1), s2 = ts(s.x2, s.y2);
  ctx.save();
  if (s.rotation) {
    const bb = elemBBox(s);
    if (bb) { const c=ts(bb.x+bb.w/2,bb.y+bb.h/2); ctx.translate(c.x,c.y); ctx.rotate(s.rotation); ctx.translate(-c.x,-c.y); }
  }
  ctx.strokeStyle = s.color || '#22c55e'; ctx.lineWidth = (s.size || 2) * vz; ctx.lineCap = 'round';
  if (s.dash) ctx.setLineDash([(s.size||2) * 5 * vz, (s.size||2) * 3 * vz]);
  ctx.beginPath();
  if (s.shape === 'line') {
    ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
    /* Arrowheads */
    if (s.arrow && s.arrow !== 'none') {
      ctx.setLineDash([]);
      ctx.fillStyle = s.color || '#22c55e';
      const lw = (s.size || 2) * vz;
      const hl = Math.max(14, lw * 4), sp = 0.42; // half-angle ~24°
      const ah = (ax, ay, bx, by) => {
        const a = Math.atan2(ay - by, ax - bx);
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax - hl * Math.cos(a - sp), ay - hl * Math.sin(a - sp));
        ctx.lineTo(ax - hl * Math.cos(a + sp), ay - hl * Math.sin(a + sp));
        ctx.closePath(); ctx.fill();
      };
      if (s.arrow === 'end'   || s.arrow === 'both') ah(s2.x, s2.y, s1.x, s1.y);
      if (s.arrow === 'start' || s.arrow === 'both') ah(s1.x, s1.y, s2.x, s2.y);
    }
  }
  else if (s.shape === 'rect')    { ctx.strokeRect(s1.x, s1.y, s2.x - s1.x, s2.y - s1.y); }
  else if (s.shape === 'ellipse') {
    const cx = (s1.x+s2.x)/2, cy = (s1.y+s2.y)/2;
    const rx = Math.abs(s2.x-s1.x)/2, ry = Math.abs(s2.y-s1.y)/2;
    ctx.ellipse(cx, cy, Math.max(rx,1), Math.max(ry,1), 0, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

/* Word-wrap helper */
function wrapText(txt, maxW) {
  const out = [];
  for (const raw of txt.split('\n')) {
    const words = raw.split(' '); let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; }
      else line = test;
    }
    out.push(line);
  }
  return out;
}

function drawText(t) {
  const sp = ts(t.x, t.y);
  const sw = (t.w || 240) * vz, sh = (t.h || 60) * vz;
  if (t._drag) {
    ctx.save();
    ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]);
    ctx.fillStyle = 'rgba(34,197,94,.06)'; ctx.fillRect(sp.x, sp.y, sw, sh);
    ctx.strokeRect(sp.x, sp.y, sw, sh);
    ctx.font = `${12*vz}px system-ui,sans-serif`; ctx.fillStyle = 'rgba(34,197,94,.5)';
    ctx.fillText('Текст', sp.x+6, sp.y+16*vz);
    ctx.restore(); return;
  }
  if (!t.text) return;
  const fs = (t.fontSize || 18) * vz;
  ctx.save();
  if (t.rotation) { const cx=sp.x+sw/2,cy=sp.y+sh/2; ctx.translate(cx,cy); ctx.rotate(t.rotation); ctx.translate(-cx,-cy); }
  ctx.font = `${t.italic?'italic ':''}${t.bold?'bold ':''}${fs}px system-ui,sans-serif`;
  ctx.fillStyle = t.color || '#e2e8f0';
  /* Clip to text box */
  ctx.beginPath(); ctx.rect(sp.x, sp.y, sw, sh); ctx.clip();
  const lines = wrapText(t.text, sw - 10);
  let ly = sp.y + fs;
  for (const line of lines) {
    if (ly - fs > sp.y + sh) break;
    ctx.fillText(line, sp.x + 5, ly);
    if (t.underline) {
      const mw = ctx.measureText(line).width;
      ctx.save(); ctx.strokeStyle = t.color||'#e2e8f0'; ctx.lineWidth = Math.max(1, vz);
      ctx.beginPath(); ctx.moveTo(sp.x+5, ly+2); ctx.lineTo(sp.x+5+mw, ly+2); ctx.stroke(); ctx.restore();
    }
    ly += fs * 1.35;
  }
  ctx.restore();
}

function drawSelHighlight(el) {
  const bb = elemBBox(el); if (!bb) return;
  const sp = ts(bb.x, bb.y);
  /* Screen-space centre of the element's bounding box */
  const cx_s = sp.x + bb.w * vz / 2;
  const cy_s = sp.y + bb.h * vz / 2;
  const rot = el.rotation || 0;
  ctx.save();
  /* Rotate the entire selection decoration around the element's screen centre */
  if (rot) { ctx.translate(cx_s, cy_s); ctx.rotate(rot); ctx.translate(-cx_s, -cy_s); }
  ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
  ctx.strokeRect(sp.x - 5, sp.y - 5, bb.w * vz + 10, bb.h * vz + 10);
  /* resize + rotation handles (single selection, or CS pair with 2 selected) */
  const csPairSel = selected.size === 2 && el.type === 'shape' && el.shape === 'line' &&
                    el.csPartner && selected.has(el.csPartner);
  if (selected.size === 1 || csPairSel) {
    ctx.setLineDash([]);
    if (el.type === 'shape' && el.shape === 'line') {
      /* Show p1/p2 endpoint handles for all lines (including CS axes) */
      for (const [pt, hname] of [[[el.x1,el.y1],'p1'],[[el.x2,el.y2],'p2']]) {
        const hsp = ts(pt[0], pt[1]);
        const lk = lineLockedHandles.has(hname);
        ctx.fillStyle = lk ? '#22c55e' : '#fff';
        ctx.strokeStyle = lk ? '#fff' : '#22c55e'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(hsp.x, hsp.y, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      }
      /* Midpoint diamond — filled blue when locked; for CS shows origin */
      const msp = ts((el.x1+el.x2)/2, (el.y1+el.y2)/2);
      const lkPm = lineLockedHandles.has('pm');
      ctx.save(); ctx.translate(msp.x, msp.y); ctx.rotate(Math.PI/4);
      ctx.fillStyle = lkPm ? '#22c55e' : '#fff';
      ctx.strokeStyle = lkPm ? '#fff' : '#22c55e'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.rect(-5,-5,10,10); ctx.fill(); ctx.stroke();
      ctx.restore();
    } else {
      for (const pos of Object.values(getHandles(bb))) {
        const hsp = ts(pos.x, pos.y);
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.rect(hsp.x-5, hsp.y-5, 10, 10); ctx.fill(); ctx.stroke();
      }
    }
    /* rotation handle — only for single selection */
    if (!csPairSel) {
      const rhx = sp.x - 5 + (bb.w * vz + 10) / 2;
      const rhy = sp.y - 5 - 26;
      ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1; ctx.setLineDash([3,2]);
      ctx.beginPath(); ctx.moveTo(rhx, sp.y - 5); ctx.lineTo(rhx, rhy + 7); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(rhx, rhy, 7, 0, Math.PI*2);
      ctx.fillStyle = '#22c55e'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 9px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('↻', rhx, rhy);
    }
  }
  ctx.restore();
}

function drawSelBox() {
  if (!selBox) return;
  const x = Math.min(selBox.x1, selBox.x2), y = Math.min(selBox.y1, selBox.y2);
  const w = Math.abs(selBox.x2 - selBox.x1), h = Math.abs(selBox.y2 - selBox.y1);
  ctx.save();
  ctx.fillStyle = 'rgba(34,197,94,.07)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]);
  ctx.strokeRect(x, y, w, h);
  ctx.restore();
}
