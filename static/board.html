<!DOCTYPE html><html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HBM — Доска</title>
<style>
/* ─── Reset ─── */
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:system-ui,sans-serif;user-select:none;color:var(--fg);background:var(--bg)}

/* ─── CSS Variables — HBM General Style ─── */
:root{
  --bg:#0d1117;--bg-ui:#161b22;--fg:#e6edf3;--fg-dim:#7d8590;
  --sep:#30363d;--hover:#21262d;--accent:#3fb950;--accent-hi:#2ea043;
  --accent-bg:rgba(63,185,80,.12);--input:#21262d;--shadow:rgba(0,0,0,.45)}
body.dark{color-scheme:dark}
body.light{
  color-scheme:light;
  --bg:#f6f8fa;--bg-ui:#ffffff;--fg:#1f2328;--fg-dim:#656d76;
  --sep:#d0d7de;--hover:#f3f4f6;--accent:#1a7f37;--accent-hi:#116329;
  --accent-bg:rgba(26,127,55,.1);--input:#ffffff;--shadow:rgba(0,0,0,.12)}

/* ─── Appearance panel ─── */
#appearancePanel{
  display:none;position:fixed;top:52px;right:8px;z-index:200;
  background:var(--bg-ui);border:1px solid var(--sep);border-radius:12px;
  padding:14px 16px;flex-direction:column;gap:12px;min-width:230px;
  box-shadow:0 6px 24px rgba(0,0,0,.35)}
#appearancePanel.open{display:flex}
.ap-row{display:flex;align-items:center;gap:10px}
.ap-label{font-size:.78em;opacity:.65;min-width:52px}
.ap-swatches{display:flex;gap:6px}
.ap-swatch{
  width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  transition:transform .12s,border-color .12s;flex-shrink:0;position:relative}
.ap-swatch:hover{transform:scale(1.15)}
.ap-swatch.active{border-color:var(--accent)}
.ap-swatch-dot{
  width:8px;height:8px;border-radius:50%;position:absolute;bottom:1px;right:1px}
.ap-grid-btns{display:flex;gap:4px}
.ap-grid-btn{
  padding:5px 10px;border-radius:7px;border:1px solid var(--sep);background:var(--hover);
  color:var(--fg);cursor:pointer;font-size:.88em;transition:background .12s,border-color .12s}
.ap-grid-btn:hover{background:var(--sep)}
.ap-grid-btn.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}

/* ─── Online avatars ─── */
.peer-avatar{
  width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.75em;font-weight:700;color:#fff;cursor:pointer;border:2px solid transparent;
  transition:border-color .15s,transform .1s;flex-shrink:0;user-select:none}
.peer-avatar:hover{transform:scale(1.1)}
.peer-avatar.following{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.peer-avatar-tooltip{
  position:fixed;background:var(--bg-ui);border:1px solid var(--sep);
  border-radius:6px;padding:4px 8px;font-size:.75em;color:var(--fg);
  pointer-events:none;z-index:100;white-space:nowrap}

/* ─── Follow mode indicator (topbar) ─── */
#followInd{
  display:none;align-items:center;gap:5px;cursor:pointer;
  background:rgba(251,146,60,.15);border:1px solid rgba(251,146,60,.5);
  border-radius:7px;padding:3px 9px;font-size:.78em;color:#fb923c;white-space:nowrap;
  transition:background .15s;user-select:none}
#followInd:hover{background:rgba(251,146,60,.28)}
#followInd.vis{display:flex}

/* ─── Top Bar ─── */
#topbar{
  position:fixed;top:0;left:0;right:0;height:52px;z-index:30;
  background:var(--bg-ui);border-bottom:1px solid var(--sep);
  display:flex;align-items:center;gap:12px;padding:0 16px 0 68px;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#topbar::-webkit-scrollbar{display:none}
#topbar .tb-logo{font-weight:700;font-size:1em;color:var(--fg);display:flex;align-items:center;gap:6px;flex-shrink:0}
#topbar .tb-logo svg{width:20px;height:20px;fill:none;stroke:var(--accent)}
#boardTitle{flex:1;font-size:.9em;color:var(--fg-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#topbar .tb-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
#backLink{
  font-size:.82em;text-decoration:none;color:var(--accent);
  background:var(--bg-ui);border:1px solid var(--sep);
  border-radius:8px;padding:6px 12px;white-space:nowrap}
#backLink:hover{background:var(--hover)}

/* ─── Sidebar ─── */
#sb{
  position:fixed;left:0;top:52px;bottom:0;width:56px;
  display:flex;flex-direction:column;justify-content:space-between;
  background:var(--bg-ui);border-right:1px solid var(--sep);
  padding:8px 4px;z-index:20;
  box-shadow:2px 0 8px var(--shadow)}
#sb-top,#sb-bot{display:flex;flex-direction:column;gap:4px;align-items:center}

/* Sidebar button */
.sb{
  width:44px;height:44px;border:none;border-radius:10px;cursor:pointer;
  background:transparent;color:var(--fg);
  display:flex;align-items:center;justify-content:center;
  font-size:1.15em;transition:background .15s,color .15s;position:relative}
.sb:hover{background:var(--hover)}
.sb.act{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(34,197,94,.35)}
.sb .bdg{position:absolute;bottom:4px;right:4px;font-size:9px;line-height:1;opacity:.75}

/* Tool-wrap + hover submenu */
.tw{position:relative;width:48px}
.sm{
  position:absolute;left:50px;top:0;
  display:none;flex-direction:column;gap:4px;
  background:var(--bg-ui);border:1px solid var(--sep);
  border-radius:9px;padding:6px;z-index:100;min-width:52px;
  box-shadow:0 4px 16px rgba(0,0,0,.35)}
/* CSS hover: .tw:hover includes mouse over .sm (DOM child) so no gap issue */
.tw:hover .sm{display:flex}
.ssb{
  width:42px;height:42px;border:none;border-radius:7px;cursor:pointer;
  background:transparent;color:var(--fg);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1em;transition:background .12s}
.ssb:hover{background:var(--hover)}
.ssb.act{background:var(--accent);color:#fff}

/* ─── Settings Panel ─── */
#sp{
  position:fixed;left:115px;top:60px;
  background:var(--bg-ui);border:1px solid var(--sep);
  border-radius:12px;padding:13px 15px;
  z-index:25;box-shadow:0 6px 24px var(--shadow);
  display:none;min-width:220px;max-width:270px}
#sp.open{display:block}
#sp h4{font-size:.7em;letter-spacing:.08em;text-transform:uppercase;
  color:var(--fg-dim);margin-bottom:11px;font-weight:600}
.sp-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sp-row label{font-size:.78em;color:var(--fg-dim);white-space:nowrap;min-width:54px}
.clrs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cb{
  width:22px;height:22px;border-radius:50%;
  border:2px solid transparent;cursor:pointer;flex-shrink:0;transition:transform .1s}
.cb:hover{transform:scale(1.15)}
.cb.act{border-color:#fff;outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{width:110px;accent-color:var(--accent);cursor:pointer}
input[type=number]{
  width:64px;padding:4px 8px;border-radius:7px;
  border:1px solid var(--sep);background:var(--input);
  color:var(--fg);font-size:.82em;transition:border-color .15s}
input[type=number]:focus{outline:none;border-color:var(--accent)}
.tog-row{display:flex;gap:4px}
.tog{
  min-width:36px;height:28px;padding:0 8px;
  border:1px solid var(--sep);border-radius:7px;
  cursor:pointer;background:transparent;color:var(--fg);
  font-size:.82em;transition:background .12s,color .12s}
.tog:hover{background:var(--hover)}
.tog.act{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ─── HUD (legacy, now hidden) ─── */
#hud{display:none}
.hb{
  width:32px;height:32px;border:1px solid var(--sep);border-radius:7px;
  background:transparent;color:var(--fg-dim);cursor:pointer;font-size:.88em;
  display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.hb:hover{background:var(--hover);color:var(--fg)}

/* ─── Canvas ─── */
canvas{position:fixed;top:52px;left:56px}

/* ─── Inline text editor ─── */
#ted-wrap{
  position:fixed;display:none;z-index:40;
  border:2px dashed var(--accent);border-radius:3px;
  background:transparent;overflow:visible;
  min-width:40px;min-height:1em;pointer-events:auto}
#ted-bar{display:none}
#ted{
  display:block;box-sizing:border-box;
  border:none;background:transparent;color:var(--fg);
  font-family:system-ui,sans-serif;resize:none;outline:none;
  padding:4px 6px;line-height:1.4;white-space:pre;overflow:hidden}
/* Mirror span for measuring text width during editing */
#ted-mirror{position:fixed;visibility:hidden;pointer-events:none;
  white-space:pre;padding:4px 6px;line-height:1.4;top:-9999px;left:-9999px}

/* ─── Selection properties bar ─── */
#selBar{
  position:fixed;top:60px;left:340px;
  background:var(--bg-ui);border:1px solid var(--sep);
  border-radius:10px;padding:8px 12px;
  z-index:25;box-shadow:0 4px 20px rgba(0,0,0,.3);
  display:none;align-items:center;gap:10px;flex-wrap:wrap;
  transition:opacity .15s}
#selBar.open{display:flex}
#selBar h5{font-size:.72em;opacity:.5;white-space:nowrap}

/* ─── Status / Tip ─── */
#status{position:fixed;bottom:8px;right:12px;font-size:.75em;z-index:10;display:none}

/* ─── Draggable panel handle (selBar + csSetPanel) ─── */
.panel-handle{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:0 0 6px 0;cursor:move;touch-action:none;flex-shrink:0;position:relative}
.panel-grip{
  width:36px;height:4px;border-radius:2px;background:var(--sep);
  position:absolute;left:50%;transform:translateX(-50%);top:2px}
.panel-close{
  margin-left:auto;width:24px;height:24px;border:none;cursor:pointer;
  background:transparent;color:var(--fg-dim);font-size:1.1em;
  display:flex;align-items:center;justify-content:center;
  border-radius:5px;line-height:1}
.panel-close:hover{background:var(--hover);color:var(--fg)}
/* keep old IDs working */
#selBarHandle{cursor:move}
#selBarGrip,#selBarClose{}

/* ─── Mobile layout ─── */
#tbMore{display:none}
#tbMoreMenu{
  position:fixed;top:52px;right:6px;z-index:40;
  background:var(--bg-ui);border:1px solid var(--sep);border-radius:10px;
  padding:6px;display:none;flex-direction:column;gap:4px;
  box-shadow:0 4px 16px var(--shadow)}
#tbMoreMenu.open{display:flex}
#tbMoreMenu .hb{width:auto;padding:6px 12px;justify-content:flex-start;gap:8px;font-size:.85em}

/* ─── Mobile tab bar ─── */
#mobTabs{
  position:fixed;bottom:0;left:0;right:0;z-index:28;
  background:var(--bg-ui);border-top:1px solid var(--sep);
  border-radius:14px 14px 0 0;
  padding:7px 12px 10px;
  display:none;flex-direction:column;gap:6px}
#mobTabs.vis{display:flex}
.mob-tab-row{display:flex;gap:6px;align-items:center}
.mob-tab{
  flex:1;padding:6px 4px;border:1px solid var(--sep);border-radius:8px;
  background:transparent;color:var(--fg-dim);font-size:.83em;cursor:pointer;
  transition:background .15s,color .15s}
.mob-tab.act{background:var(--accent);color:#fff;border-color:var(--accent)}
#mobCollapseBtn{
  width:28px;height:28px;border:none;border-radius:6px;
  background:transparent;color:var(--fg-dim);cursor:pointer;font-size:1.1em;
  display:flex;align-items:center;justify-content:center}
#mobCollapseBtn:hover{background:var(--hover)}

@media(max-width:600px){
  #topbar{padding:0 6px 0 62px;gap:4px}
  #topbar .tb-logo-text{display:none}
  #boardTitle{display:none}
  #onlinePanel{display:none!important}
  .hb-secondary{display:none!important}
  #tbMore{display:flex}
  #backLinkMob{display:flex!important}
  /* Panels become bottom sheets; bottom is set by JS (updateMobTabs) */
  #selBar.open,#csSetPanel.open{
    left:0!important;right:0!important;top:auto!important;
    border-radius:0!important;padding:8px 12px 8px!important;
    flex-direction:column!important;max-height:50vh;overflow-y:auto;
    width:100%!important;transition:transform .22s ease,opacity .22s;
    will-change:transform}
  #selBar.mob-hide,#csSetPanel.mob-hide{
    transform:translateX(110%);pointer-events:none;opacity:0}
  .panel-handle{display:none!important}
}

/* ─── Geo Picker ─── */
#geoPicker,#flowPicker{
  position:fixed;left:60px;
  background:var(--bg-ui);border:1px solid var(--sep);
  border-radius:10px;padding:6px;z-index:50;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  display:none;flex-direction:column;gap:2px;min-width:180px}
.fp-item{
  padding:7px 10px;border-radius:7px;cursor:pointer;
  font-size:.85em;display:flex;align-items:center;gap:8px;
  transition:background .1s}
.fp-item:hover{background:var(--hover)}
.fp-item.act{background:var(--accent);color:#fff}
.fp-item .gp-key{margin-left:auto;opacity:.5;font-size:.75em;background:var(--bg);border:1px solid var(--sep);border-radius:4px;padding:1px 5px}
.fp-item.act .gp-key{opacity:.7;background:rgba(255,255,255,.15);border-color:transparent}
/* ─── Connector routing toggle ─── */
#connRoutingBar{
  position:fixed;bottom:68px;left:50%;transform:translateX(-50%);
  display:none;background:var(--bg-ui);border:1px solid var(--sep);
  border-radius:20px;padding:4px 6px;gap:4px;z-index:50;
  box-shadow:0 2px 12px rgba(0,0,0,.35)}
#connRoutingBar.vis{display:flex}
.cr-btn{
  padding:5px 14px;border-radius:14px;border:none;background:transparent;
  color:var(--fg);cursor:pointer;font-size:.82em;transition:background .12s}
.cr-btn:hover{background:var(--hover)}
.cr-btn.act{background:var(--accent-bg);color:var(--accent)}
.gp-hdr{font-size:.68em;opacity:.45;text-transform:uppercase;letter-spacing:.07em;padding:2px 6px 4px}
.gp-item{
  padding:7px 10px;border-radius:7px;cursor:pointer;
  font-size:.85em;display:flex;align-items:center;gap:8px;
  transition:background .1s}
.gp-item:hover{background:var(--hover)}
.gp-item.act{background:var(--accent);color:#fff}
.gp-key{
  margin-left:auto;opacity:.5;font-size:.75em;
  background:var(--bg);border:1px solid var(--sep);
  border-radius:4px;padding:1px 5px}
.gp-item.act .gp-key{opacity:.7;background:rgba(255,255,255,.15);border-color:transparent}

/* ─── Code widget (inline on-board) ─── */
.cwo .CodeMirror{height:100%;font-size:inherit;background:#1e1e1e;border-bottom:1px solid #3c3c3c}
.cwo .CodeMirror-scroll{box-sizing:border-box;padding:4px 0}
.cwo{
  position:fixed;z-index:6;pointer-events:none;
  display:flex;flex-direction:column;box-sizing:border-box;
  background:#1e1e1e;border:1px solid #3c3c3c;border-radius:8px;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.5)}
.cwo.sel{border-color:#3fb950;border-width:2px}
.cwo-hdr{
  pointer-events:auto;cursor:move;user-select:none;
  background:#252526;border-bottom:1px solid #3c3c3c;
  display:flex;align-items:center;gap:6px;padding:0 8px;
  flex-shrink:0;height:2.2em}
.cwo-title{font-weight:600;color:#e6edf3;flex:1;font-size:.82em}
.cwo-lang{background:#3c3c3c;color:#d4d4d4;border:1px solid #555;pointer-events:auto;border-radius:4px;padding:1px 6px;font-size:.76em;cursor:pointer;flex:1}
.cwo-lang:focus{outline:none;border-color:#3fb950}
.cwo-run{
  pointer-events:auto;background:#238636;color:#fff;border:none;
  border-radius:5px;padding:2px 9px;cursor:pointer;font-weight:600;font-size:.78em;flex-shrink:0}
.cwo-run:hover{background:#2ea043}
.cwo-run:disabled{opacity:.5;cursor:default}
.cwo-ta{
  pointer-events:auto;flex:1;min-height:0;overflow:hidden;
  display:flex;flex-direction:column}
.cwo-out-hdr{
  padding:2px 9px;font-size:.68em;letter-spacing:.07em;
  text-transform:uppercase;color:#484f58;font-weight:600;flex-shrink:0}
.cwo-out{
  flex:1;font-family:'Consolas','Courier New',monospace;
  padding:3px 9px 6px;white-space:pre-wrap;overflow-y:auto;
  pointer-events:auto;  /* enables scrollbar + text selection */
  color:#d4d4d4;line-height:1.45;min-height:0}
.cwo-out.ok{color:#7ee787}
.cwo-out.err{color:#f87171}
/* 8-direction resize handles for code widget */
.cwo-rh{position:absolute;pointer-events:auto;opacity:0;transition:opacity .15s;z-index:2}
.cwo:hover .cwo-rh,.cwo.sel .cwo-rh{opacity:1}
.cwo-rh.n {top:0;left:12px;right:12px;height:5px;cursor:n-resize;background:linear-gradient(to bottom,#3fb950 0%,transparent 100%)}
.cwo-rh.s {bottom:0;left:12px;right:12px;height:5px;cursor:s-resize;background:linear-gradient(to top,#3fb950 0%,transparent 100%)}
.cwo-rh.e {top:12px;right:0;bottom:12px;width:5px;cursor:e-resize;background:linear-gradient(to left,#3fb950 0%,transparent 100%)}
.cwo-rh.w {top:12px;left:0;bottom:12px;width:5px;cursor:w-resize;background:linear-gradient(to right,#3fb950 0%,transparent 100%)}
.cwo-rh.ne{top:0;right:0;width:12px;height:12px;cursor:ne-resize}
.cwo-rh.nw{top:0;left:0;width:12px;height:12px;cursor:nw-resize}
.cwo-rh.se{bottom:0;right:0;width:14px;height:14px;cursor:se-resize;background:linear-gradient(135deg,transparent 40%,#3fb950 40%);border-radius:0 0 7px 0}
.cwo-rh.sw{bottom:0;left:0;width:14px;height:14px;cursor:sw-resize;background:linear-gradient(225deg,transparent 40%,#3fb950 40%);border-radius:0 0 0 7px}

/* ─── Rich-text overlay ─── */
.rto{
  position:fixed;pointer-events:none;overflow:hidden;z-index:5;
  line-height:1.4;word-wrap:break-word;box-sizing:border-box;padding:4px 6px}
/* In dark mode, force light text so pasted content (often black) stays readable */
body.dark  .rto{color:#e6edf3;background:rgba(13,17,23,.78)}
body.light .rto{color:#1f2328;background:rgba(246,248,250,.85)}
.rto *{max-width:100%}
.rto ul,.rto ol{padding-left:1.4em}
.rto ul{list-style:disc}
.rto ol{list-style:decimal}
.rto p{margin-bottom:.3em}
.rto h1,.rto h2,.rto h3{font-weight:bold;margin-bottom:.2em}

/* ─── Selection element list ─── */
.sel-list{
  width:100%;border-top:1px solid var(--sep);
  padding-top:6px;margin-top:4px;
  display:none;flex-direction:column;gap:2px;
  max-height:180px;overflow-y:auto}
.sel-list.open{display:flex}
.sel-item{
  display:flex;align-items:center;gap:6px;
  padding:3px 6px;border-radius:5px;font-size:.78em;
  cursor:default;transition:background .1s}
.sel-item:hover{background:var(--hover)}
.sel-item .si-icon{opacity:.6;width:18px;text-align:center;flex-shrink:0}
.sel-item .si-id{opacity:.38;font-family:monospace;font-size:.9em;flex:1;overflow:hidden}
.sel-item .si-rm{
  width:20px;height:20px;border:1px solid var(--sep);
  border-radius:4px;cursor:pointer;background:transparent;
  color:var(--fg);font-size:.9em;line-height:1;flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.sel-item .si-rm:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ─── Coordinate system panels ─── */
#csSetPanel{
  position:fixed;
  background:var(--bg-ui);border:1px solid var(--sep);
  border-radius:12px;padding:12px 14px;
  z-index:24;box-shadow:0 6px 24px var(--shadow);
  display:none;flex-direction:column;gap:6px;
  min-width:272px;max-width:320px;
  max-height:calc(100vh - 80px);overflow-y:auto}
#csSetPanel.open{display:flex}
#csGraphPanel{display:none!important}           /* merged into csSetPanel */
.cs-hdr{
  font-size:.68em;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);font-weight:700;margin-bottom:1px}
.cs-axis-block{
  background:var(--accent-bg);border-radius:8px;
  padding:7px 10px;display:flex;flex-direction:column;gap:5px}
.cs-row{display:flex;align-items:center;gap:7px;font-size:.82em}
.cs-row label{color:var(--fg-dim);min-width:50px;font-size:.92em;white-space:nowrap}
.cs-row input[type=number]{width:54px}
.cs-row .cs-unit{font-size:.75em;color:var(--fg-dim)}
.cs-sep{height:1px;background:var(--sep);margin:3px 0}
.csg-item{
  display:flex;align-items:center;gap:5px;
  padding:4px 6px;border-radius:7px;font-size:.79em;
  background:var(--accent-bg)}
.csg-item .csg-dot{
  width:13px;height:13px;border-radius:50%;flex-shrink:0;cursor:pointer;
  border:2px solid transparent;transition:transform .1s;position:relative}
.csg-item .csg-dot:hover{transform:scale(1.2)}
.csg-item .csg-eq{
  flex:1;font-family:monospace;font-size:.9em;
  cursor:pointer;color:var(--fg);overflow:hidden;white-space:nowrap}
.csg-item .csg-rm{
  width:18px;height:18px;border:1px solid var(--sep);
  border-radius:4px;cursor:pointer;background:transparent;
  color:var(--fg);font-size:.85em;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.csg-item .csg-rm:hover{background:#ef4444;color:#fff;border-color:#ef4444}
.csg-ctrl{display:flex;gap:3px;padding:1px 6px 3px 28px;flex-wrap:wrap;align-items:center}
.csg-sty{
  height:21px;padding:0 6px;border:1px solid var(--sep);border-radius:5px;

.csg-sty.cp:hover{background:var(--hover);color:var(--fg);border-color:var(--sep)}
.csg-add{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:2px}
.csg-add input[type=text]{
  flex:1;min-width:90px;padding:4px 8px;border-radius:6px;
  border:1px solid var(--sep);background:var(--input);
  color:var(--fg);font-size:.8em;font-family:monospace;
  transition:border-color .15s;-webkit-text-size-adjust:100%;touch-action:manipulation}

  .csg-add{flex-direction:column;align-items:stretch}

}
.csg-add input[type=text]:focus{outline:none;border-color:var(--accent)}
.cs-btn{

.cs-btn:hover{background:var(--accent);color:#fff}
.cs-btn.active{background:var(--accent);color:#fff}

<script>
// ══════════════════════════════════════════════════════════
// §0  BOOTSTRAP
// ══════════════════════════════════════════════════════════
const Q = new URLSearchParams(location.search);
const SID = Q.get('id');
const PERSONAL_ID = Q.get('personal'); // personal board id
const GID = Q.get('group') || null;    // lesson group id
const IS_PERSONAL = !!PERSONAL_ID;
const IS_GROUP = !!GID;
const INSTANCE_ID = Q.get('instance') || null; // program/course instance for this board
if (!SID && !PERSONAL_ID && !GID) { location.href = '/hbm_tutor.html'; throw ''; }
const ROLE = role();
document.getElementById('backLink').href =
  IS_PERSONAL ? '/workshop.html' :
  ROLE === 'student' ? '/student_lk.html' :
  ROLE === 'parent'  ? '/parent_lk.html'  : '/student.html?id=' + SID;
if (ROLE === 'student' || ROLE === 'parent')
  document.getElementById('btnClear').style.display = 'none';

// Load board name for topbar
(async function(){
  try{
    const tok=localStorage.getItem('token');
    if(!tok) return;
    if(IS_PERSONAL){
      const r=await fetch('/api/personal-boards/'+PERSONAL_ID,{headers:{Authorization:'Bearer '+tok}});
      if(r.ok){const b=await r.json();document.getElementById('boardTitle').textContent=b.title+' — Личная доска';}
    }else{
      const r=await fetch('/api/students/'+SID,{headers:{Authorization:'Bearer '+tok}});
      if(r.ok){const s=await r.json();document.getElementById('boardTitle').textContent=s.name+' — Доска';}
    }
  }catch(e){}
})();

// ══════════════════════════════════════════════════════════
// §1  THEME
// ══════════════════════════════════════════════════════════
const BOARD_THEMES = {
  'dark-blue':{
    bg:'#0d1117',bgUI:'#161b22',fg:'#e6edf3',fgDim:'#7d8590',
    sep:'#30363d',hover:'#21262d',accent:'#3fb950',input:'#21262d',
    gridR:255,gridG:255,gridB:255,
    penDefault:'#ffffff',isDark:true,dot:'#3fb950',label:'Ночная'},

/* ─── Draggable floating panel (desktop mouse drag + mobile swipe-down to close) ─── */
function initPanelDrag(handle, panel, onClose) {
  let ox=0, oy=0, _drag=false;
  const isMob = () => window.innerWidth <= 600;
  handle.addEventListener('mousedown', e => {
    if (isMob() || e.button !== 0) return;
    e.preventDefault(); _drag = true;
    const r = panel.getBoundingClientRect();
    ox = e.clientX - r.left; oy = e.clientY - r.top;
    document.addEventListener('mousemove', onM);
    document.addEventListener('mouseup', onU, {once:true});
  });
  function onM(e) {
    if (!_drag) return;
    const nx = Math.max(0, Math.min(window.innerWidth  - panel.offsetWidth,  e.clientX - ox));
    const ny = Math.max(52,Math.min(window.innerHeight - panel.offsetHeight, e.clientY - oy));
    panel.style.left = nx+'px'; panel.style.top = ny+'px';
    panel.style.right = 'auto'; panel.style.bottom = 'auto';
  }
  function onU() { _drag = false; document.removeEventListener('mousemove', onM); }
  /* Mobile: swipe down on handle → close */
  let _ty = 0;
  handle.addEventListener('touchstart', e => { if (!isMob()) return; _ty = e.touches[0].clientY; }, {passive:true});
  handle.addEventListener('touchend', e => {
    if (!isMob()) return;
    if (e.changedTouches[0].clientY - _ty > 50) { _mobCollapsed = true; updateMobTabs(); }
  }, {passive:true});
}
/* alias for backward-compat */
function initSelBarDrag(handle, bar) { initPanelDrag(handle, bar, () => clearSel()); }

/* Save element positions before a drag */
function snapPositions() {
  dragSnap = {};
  for (const id of selected) {
    const el = all.find(e => e.id === id); if (!el) continue;
    if      (el.type === 'stroke')   dragSnap[id] = el.pts.map(p => ({ ...p }));
    else if (el.type === 'shape' && el.shape === 'triangle')
      dragSnap[id] = { x1:el.x1, y1:el.y1, x2:el.x2, y2:el.y2, x3:el.x3, y3:el.y3 };
    else if (el.type === 'shape')   dragSnap[id] = { x1:el.x1, y1:el.y1, x2:el.x2, y2:el.y2, x3:el.x3, y3:el.y3, ro:el.ro?{...el.ro}:null };
    else if (el.type === 'text' || el.type === 'image' || el.type === 'richtext' || el.type === 'code' || el.type === 'docfile') dragSnap[id] = { x:el.x, y:el.y };
  }
}

/* Apply world-space delta to selected elements in real time */
function applyDrag(dwx, dwy) {
  dragMoved = true;
  for (const id of selected) {
    const el = all.find(e => e.id === id); if (!el || !dragSnap[id]) continue;
    if      (el.type === 'stroke')   el.pts = dragSnap[id].map(p => ({ x: p.x + dwx, y: p.y + dwy }));
    else if (el.type === 'shape') {
      el.x1 = dragSnap[id].x1+dwx; el.y1 = dragSnap[id].y1+dwy;
      el.x2 = dragSnap[id].x2+dwx; el.y2 = dragSnap[id].y2+dwy;
      if (el.shape === 'triangle' || el.shape === 'parallelogram') { el.x3 = dragSnap[id].x3+dwx; el.y3 = dragSnap[id].y3+dwy; }
      if (el.ro && dragSnap[id].ro) el.ro = { x: dragSnap[id].ro.x+dwx, y: dragSnap[id].ro.y+dwy };
    }
    else if (el.type === 'text' || el.type === 'image' || el.type === 'richtext' || el.type === 'code' || el.type === 'docfile') { el.x = dragSnap[id].x+dwx; el.y = dragSnap[id].y+dwy; }
  }
}

/* Commit moved elements: erase old + re-add at new position */
function commitDrag() {
  for (const id of selected) {
    const el = all.find(e => e.id === id); if (!el) continue;
    /* code widgets: update-in-place to avoid destroying the DOM overlay */
    if (el.type === 'code') { wsSend({ type: 'stroke_update', data: { ...el } }); continue; }
    wsSend({ type: 'erase_stroke', id: el.id });
    wsSend({ type: 'stroke', data: el });
  }
}

/* True if world point (wx,wy) falls inside the padded selection highlight of any selected element.
   Accounts for element rotation so the full visual bounding box is usable as drag handle. */
function isInSelBox(wx, wy) {
  for (const id of selected) {
    const el = all.find(e => e.id === id); if (!el) continue;
    const bb = elemBBox(el); if (!bb) continue;
    const lp = localPoint(wx, wy, el);
    const pad = 8 / vz;
    if (lp.x >= bb.x - pad && lp.y >= bb.y - pad &&
        lp.x <= bb.x + bb.w + pad && lp.y <= bb.y + bb.h + pad) return true;
  }
  return false;
}

/* Deep-clone element with fresh id, optionally shifted by (dx,dy) in world space */
function cloneEl(el, dx = 0, dy = 0) {
  const c = JSON.parse(JSON.stringify(el));
  c.id = gid();
  if (c.type === 'stroke')  c.pts = c.pts.map(p => p.x == null ? { x: null, y: null } : { x: p.x+dx, y: p.y+dy });
  else if (c.type === 'shape') { c.x1+=dx; c.y1+=dy; c.x2+=dx; c.y2+=dy; }
  else if (c.type === 'text' || c.type === 'image' || c.type === 'richtext' || c.type === 'code' || c.type === 'docfile') { c.x+=dx; c.y+=dy; }
  return c;
}

function doCopy() {
  if (!selected.size) return;
  clipboard = [...selected].map(id => {
    const el = all.find(e => e.id === id);
    return el ? JSON.parse(JSON.stringify(el)) : null;
  }).filter(Boolean);
}

function doCut() {
  if (!selected.size) return;
  addToUndo();
  doCopy();
  for (const id of selected) {
    const _el = all.find(e => e.id === id);
    if (_el && _el.csPartner && !selected.has(_el.csPartner)) {
      const _p = all.find(e => e.id === _el.csPartner);
      if (_p) { _p.csPartner=null; _p.csScale=null; _p.csTickStep=null; wsSend({type:'stroke_update',data:{..._p}}); }
    }
    all = all.filter(e => e.id !== id); wsSend({ type: 'erase_stroke', id });
  }
  clearSel(); redraw();
}

function doPaste() {
  if (!clipboard.length) return;
  addToUndo();
  const off = 20 / vz;   // 20 screen px → world units
  selected.clear();
  const newEls = clipboard.map(el => cloneEl(el, off, off));
  newEls.forEach(el => { all.push(el); wsSend({ type: 'stroke', data: el }); selected.add(el.id); });
  /* Shift clipboard origin for next paste so repeated Ctrl+V stacks neatly */
  clipboard = clipboard.map(el => cloneEl(el, off, off));
  redraw(); updateSelBar();
}

// ══════════════════════════════════════════════════════════
// §8d  LOCAL UNDO STACK
// ══════════════════════════════════════════════════════════

/* Save snapshot of all[] before a mutating operation.
   Image srcs are large (base64) — stored separately in imgSrcStore to avoid
   bloating the undo stack with megabytes per level. */
function addToUndo() {
  if (undoStack.length >= MAX_UNDO) undoStack.shift();
  redoStack.length = 0; // new action clears redo history
  /* Retroactively tag the previous entry with which IDs I touched */
  if (undoStack.length>0 && !undoStack[undoStack.length-1].myIds) {
    undoStack[undoStack.length-1].myIds = new Set(_myTouchedIds);
  }
  _myTouchedIds = new Set();
  undoStack.push({ myIds:null, state: all.map(el => {
    const copy = JSON.parse(JSON.stringify(el));
    if (el.type === 'image' && el.src) {
      imgSrcStore.set(el.id, el.src);
      copy.src = null;
    }
    return copy;
  })});
}

/* Helper: snapshot current all[] for undo/redo stack */
function _snapshot() {
  return { myIds:null, state: all.map(el => {
    const copy = JSON.parse(JSON.stringify(el));
    if (el.type==='image'&&el.src){imgSrcStore.set(el.id,el.src);copy.src=null;}
    return copy;
  })};
}
/* Helper: restore images in a state array */
function _restoreImgs(arr) {
  for(const el of arr){if(el.type==='image'&&!el.src){const s=imgSrcStore.get(el.id);if(s)el.src=s;}}
  return arr;
}
/* Broadcast diff between prev state and current all[] */
function _broadcastDiff(prev, myIdsFilter) {
  _inUndoRedo=true;
  const prevIds=new Set(prev.map(e=>e.id));
  const curIds=new Set(all.map(e=>e.id));
  const check = myIdsFilter ? (id=>myIdsFilter.has(id)) : ()=>true;
  for(const el of prev){ if(check(el.id)&&!curIds.has(el.id)) wsSend({type:'stroke',data:el}); }
  for(const el of all) { if(check(el.id)&&!prevIds.has(el.id)) wsSend({type:'erase_stroke',id:el.id}); }
  for(const el of prev){
    if(!check(el.id)||!curIds.has(el.id)) continue;
    const cur=all.find(e=>e.id===el.id);
    if(cur&&JSON.stringify(el)!==JSON.stringify(cur)){
      wsSend({type:'erase_stroke',id:el.id});
      setTimeout(()=>wsSend({type:'stroke',data:el}),40);
    }
  }
  _inUndoRedo=false;
}

/* localOnly=true → undo only MY last changes (partial restore), broadcast to all
   localOnly=false → undo entire board state (global), broadcast to all */
function doUndo(broadcast, localOnly=false) {
  if (!undoStack.length) return;
  /* Retroactively tag top entry with currently accumulated myTouchedIds */
  const topEntry = undoStack[undoStack.length-1];
  if (!topEntry.myIds) topEntry.myIds = new Set(_myTouchedIds);
  _myTouchedIds = new Set();

  const curSnap = _snapshot();
  const entry = undoStack.pop();
  const prev = entry.state ? entry.state : entry;
  _restoreImgs(prev);
  redoStack.push({...curSnap, myIds: entry.myIds});

  if (localOnly && entry.myIds && entry.myIds.size>0) {
    /* Partial undo: restore only MY touched elements from the snapshot */
    const prevMap = new Map(prev.map(e=>[e.id,e]));
    const toAdd=[], toRemove=[], toUpdate=[];
    for(const id of entry.myIds){
      const inPrev=prevMap.has(id);
      const inCur=all.findIndex(e=>e.id===id);
      if(inPrev&&inCur<0){
        const el=JSON.parse(JSON.stringify(prevMap.get(id)));
        all.push(el); toAdd.push(el);
      } else if(!inPrev&&inCur>=0){
        toRemove.push(id); all.splice(inCur,1);
      } else if(inPrev&&inCur>=0){
        const el=JSON.parse(JSON.stringify(prevMap.get(id)));
        all[inCur]=el; toUpdate.push(el);
      }
    }
    if(broadcast){
      _inUndoRedo=true;
      toAdd.forEach(el=>wsSend({type:'stroke',data:el}));
      toRemove.forEach(id=>wsSend({type:'erase_stroke',id}));
      toUpdate.forEach(el=>{wsSend({type:'stroke_update',data:{...el}});});
      _inUndoRedo=false;
    }
  } else {
    /* Global undo: restore full board */
    if(broadcast) _broadcastDiff(prev, null);
    all=prev;
  }
  clearSel(); redraw();
  _showUndoHint(localOnly?'↩ личная':'↩ глобально');
}

function doRedo(broadcast, localOnly=false) {
  if (!redoStack.length) return;
  _myTouchedIds = new Set();
  const curSnap = _snapshot();
  const entry = redoStack.pop();
  const next = entry.state ? entry.state : entry;
  _restoreImgs(next);
  undoStack.push({...curSnap, myIds: entry.myIds});

  if (localOnly && entry.myIds && entry.myIds.size>0) {
    const nextMap = new Map(next.map(e=>[e.id,e]));
    const toAdd=[], toRemove=[], toUpdate=[];
    for(const id of entry.myIds){
      const inNext=nextMap.has(id);
      const inCur=all.findIndex(e=>e.id===id);
      if(inNext&&inCur<0){
        const el=JSON.parse(JSON.stringify(nextMap.get(id)));
        all.push(el); toAdd.push(el);
      } else if(!inNext&&inCur>=0){
        toRemove.push(id); all.splice(inCur,1);
      } else if(inNext&&inCur>=0){
        const el=JSON.parse(JSON.stringify(nextMap.get(id)));
        all[inCur]=el; toUpdate.push(el);
      }
    }
    if(broadcast){
      _inUndoRedo=true;
      toAdd.forEach(el=>wsSend({type:'stroke',data:el}));
      toRemove.forEach(id=>wsSend({type:'erase_stroke',id}));
      toUpdate.forEach(el=>{wsSend({type:'stroke_update',data:{...el}});});
      _inUndoRedo=false;
    }
  } else {
    if(broadcast) _broadcastDiff(next, null);
    all=next;
  }
  clearSel(); redraw();
  _showUndoHint(localOnly?'↪ личная':'↪ глобально');
}

/* Brief toast hint showing what undo type was triggered */
let _undoHintTimer = null;
function _showUndoHint(msg) {
  let el = document.getElementById('undoHint');
  if (!el) {
    el = document.createElement('div'); el.id = 'undoHint';
    el.style.cssText = 'position:fixed;bottom:64px;left:50%;transform:translateX(-50%);' +
      'background:rgba(30,30,30,.88);color:#e0e0e0;font-size:.8em;padding:4px 14px;' +
      'border-radius:20px;pointer-events:none;z-index:200;transition:opacity .3s';
    document.body.appendChild(el);
  }
  el.textContent = msg; el.style.opacity = '1';
  clearTimeout(_undoHintTimer);
  _undoHintTimer = setTimeout(() => el.style.opacity = '0', 1200);
}

/* Build a row of color swatches + custom RGB picker */
function mkColorRow(current, onChange) {
  const d = document.createElement('div'); d.className = 'clrs';
  getColors().forEach(c => {
    const b = document.createElement('div');
    b.className = 'cb' + (c === current ? ' act' : '');
    b.style.background = c; b.title = c;
    b.onclick = () => {
      d.querySelectorAll('.cb, label.cb').forEach(x => x.classList.remove('act'));
      b.classList.add('act'); onChange(c);
    };
    d.appendChild(b);
  });
  /* Custom color picker — rainbow swatch opens native color picker */
  const lbl = document.createElement('label');
  const isCustom = !getColors().includes(current);
  lbl.className = 'cb' + (isCustom ? ' act' : '');
  lbl.title = 'Свой цвет (RGB)';
  lbl.style.cssText = `background:${isCustom ? current : 'conic-gradient(hsl(0,100%,55%),hsl(60,100%,55%),hsl(120,100%,45%),hsl(180,100%,45%),hsl(240,100%,60%),hsl(300,100%,55%),hsl(360,100%,55%))'};cursor:pointer;overflow:visible;position:relative`;
  const inp = document.createElement('input');
  inp.type = 'color'; inp.value = isCustom ? current : '#ff0000';
  inp.style.cssText = 'position:absolute;width:0;height:0;opacity:0;left:0;top:0;';
  inp.oninput = () => {
    d.querySelectorAll('.cb, label.cb').forEach(x => x.classList.remove('act'));
    lbl.classList.add('act');
    lbl.style.background = inp.value;
    onChange(inp.value);
  };
  lbl.appendChild(inp);
  d.appendChild(lbl);
  return d;
}

       <div class="sp-row"><label>Стиль</label>

        </div></div>
       <div class="sp-row"><label>Ширина</label>
        <input type="number" id="spTW" min="50" max="2000" value="${textBoxW}"></div>`);

    sp.querySelector('#tU').onclick = () => { textUnderline = !textUnderline; renderSP(); updateTedStyle(); };
  }

  sp.classList.add('open');
}

// ══════════════════════════════════════════════════════════
// §9b  LINE GEOMETRY HELPERS
// ══════════════════════════════════════════════════════════

/* Visual (world) positions of p1/pm/p2, accounting for el.rotation */
function getVisualPts(el) {
  const rot = el.rotation || 0;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  const mlx = (el.x1+el.x2)/2, mly = (el.y1+el.y2)/2;
  const hx = (el.x2-el.x1)/2, hy = (el.y2-el.y1)/2;
  const rhx = hx*cos - hy*sin, rhy = hx*sin + hy*cos;
  return { p1:{x:mlx-rhx,y:mly-rhy}, pm:{x:mlx,y:mly}, p2:{x:mlx+rhx,y:mly+rhy} };
}

/* Store new visual endpoints back into local coords (inverse of getVisualPts) */
function setVisualLine(el, W1x, W1y, W2x, W2y) {
  const rot = el.rotation || 0;
  const ic = Math.cos(-rot), is = Math.sin(-rot);
  const mlx=(W1x+W2x)/2, mly=(W1y+W2y)/2;
  const hx=(W2x-W1x)/2, hy=(W2y-W1y)/2;
  const lhx=hx*ic-hy*is, lhy=hx*is+hy*ic;
  el.x1=mlx-lhx; el.y1=mly-lhy; el.x2=mlx+lhx; el.y2=mly+lhy;
}

/* Translate el so that its handle lands at (tx,ty) */
function moveLineTo(el, handle, tx, ty) {
  const vp = getVisualPts(el);
  const dx = tx - vp[handle].x, dy = ty - vp[handle].y;
  setVisualLine(el, vp.p1.x+dx, vp.p1.y+dy, vp.p2.x+dx, vp.p2.y+dy);
}

/* Rotate el's visual endpoints around world point (cx,cy) by delta angle da */
function rotateLineAround(el, cx, cy, da) {
  const vp = getVisualPts(el);
  const cos = Math.cos(da), sin = Math.sin(da);
  const r2 = (px,py) => { const dx=px-cx,dy=py-cy; return {x:cx+dx*cos-dy*sin,y:cy+dx*sin+dy*cos}; };
  const nw1 = r2(vp.p1.x,vp.p1.y), nw2 = r2(vp.p2.x,vp.p2.y);
  setVisualLine(el, nw1.x,nw1.y, nw2.x,nw2.y);
}

/* Signed visual angle of line in radians (direction from p1→p2) */
function lineVisAngle(el) {
  const vp = getVisualPts(el);
  return Math.atan2(vp.p2.y - vp.p1.y, vp.p2.x - vp.p1.x);
}

/* Angle between two lines in degrees [0, 180] */
function angleBetwLines(a, b) {
  let da = lineVisAngle(b) - lineVisAngle(a);
  da = ((da % Math.PI) + Math.PI) % Math.PI;
  return da * 180 / Math.PI;
}

/* Rotate any element around world point (cx,cy) by angle da (radians).
   Used for group rotation with R+arrow keys. */
function rotateElementAround(el, cx, cy, da) {
  const cos = Math.cos(da), sin = Math.sin(da);
  const rot2 = (px, py) => ({
    x: cx + (px-cx)*cos - (py-cy)*sin,
    y: cy + (px-cx)*sin + (py-cy)*cos
  });
  if (el.type === 'shape' && el.shape === 'line') {
    rotateLineAround(el, cx, cy, da);                  // uses existing helper
  } else if (el.type === 'shape' && el.shape === 'triangle') {
    /* Rotate each vertex directly; accumulate visual rotation around fixed el.ro */
    const bb = elemBBox(el);
    if (!el.ro) el.ro = { x: bb.x+bb.w/2, y: bb.y+bb.h/2 }; // init once
    const nc = rot2(el.ro.x, el.ro.y);
    const dx = nc.x-el.ro.x, dy = nc.y-el.ro.y;
    el.x1+=dx; el.y1+=dy; el.x2+=dx; el.y2+=dy; el.x3+=dx; el.y3+=dy;
    el.ro = { x: nc.x, y: nc.y };
    el.rotation = (el.rotation||0) + da;
  } else if (el.type === 'shape' && el.shape === 'parallelogram') {
    const bb = elemBBox(el);
    if (!el.ro) el.ro = { x: bb.x+bb.w/2, y: bb.y+bb.h/2 };
    const nc = rot2(el.ro.x, el.ro.y);
    const dx = nc.x-el.ro.x, dy = nc.y-el.ro.y;
    el.x1+=dx; el.y1+=dy; el.x2+=dx; el.y2+=dy; el.x3+=dx; el.y3+=dy;
    el.ro = { x: nc.x, y: nc.y };
    el.rotation = (el.rotation||0) + da;
  } else if (el.type === 'shape') {
    const bb = elemBBox(el);
    const nc = rot2(bb.x + bb.w/2, bb.y + bb.h/2);
    const hw = bb.w/2, hh = bb.h/2;
    el.x1 = nc.x-hw; el.y1 = nc.y-hh; el.x2 = nc.x+hw; el.y2 = nc.y+hh;
    el.rotation = (el.rotation || 0) + da;
  } else if (el.type === 'text' || el.type === 'image' || el.type === 'richtext') {
    const bb = elemBBox(el);
    const nc = rot2(bb.x + bb.w/2, bb.y + bb.h/2);
    el.x = nc.x - bb.w/2; el.y = nc.y - bb.h/2;
    el.rotation = (el.rotation || 0) + da;
  } else if (el.type === 'stroke') {
    el.pts = el.pts.map(p => rot2(p.x, p.y));
  }
}

// §9c  COORDINATE SYSTEM HELPERS
// ══════════════════════════════════════════════════════════

/* Canonical key for a CS pair (order-independent) */
function csKey(id1, id2) { return [id1, id2].sort().join('|'); }

/* Intersection of two infinite lines defined by their visual endpoints.
   Returns null if lines are parallel (|det| < ε). */
function lineIntersection(la, lb) {
  const a = getVisualPts(la), b = getVisualPts(lb);
  const ax = a.p1.x, ay = a.p1.y, bx = a.p2.x, by = a.p2.y;
  const cx = b.p1.x, cy = b.p1.y, dx = b.p2.x, dy = b.p2.y;
  const dabx = bx-ax, daby = by-ay;
  const dcdx = dx-cx, dcdy = dy-cy;
  const det = dabx*dcdy - daby*dcdx;
  if (Math.abs(det) < 1e-9) return null;
  const t = ((cx-ax)*dcdy - (cy-ay)*dcdx) / det;
  return { x: ax + t*dabx, y: ay + t*daby };
}

/* True if two lines can form a CS (angle between them ≥ MIN_CS_ANGLE degrees) */
const MIN_CS_ANGLE = 10;
function linesCanFormCS(la, lb) {
  const ang = angleBetwLines(la, lb);          // 0..180
  const norm = Math.min(ang, 180 - ang);       // 0..90
  return norm >= MIN_CS_ANGLE;
}

/* True if intersection is "close enough" to be useful for graphing.
   We check that the intersection lies within MAX_CS_DIST world units
   from the viewport centre — roughly 10× the visible half-diagonal. */
function csIntersectionInView(pt) {
  if (!pt) return false;
  const cx = (tw(0,0).x + tw(W,H).x)/2, cy = (tw(0,0).y + tw(W,H).y)/2;
  const diagHalf = Math.hypot(W,H) / vz / 2;
  return Math.hypot(pt.x-cx, pt.y-cy) < diagHalf * 10;
}

/* Positive unit vector of a line (toward the "positive" end = arrow end).
   Falls back to p1→p2 when no arrow. */
function csPositiveDir(el) {
  const vp = getVisualPts(el);
  // positive = arrow target; if 'start' the positive end is p1, else p2
  const pos = (el.arrow === 'start') ? vp.p1 : vp.p2;
  const neg = (el.arrow === 'start') ? vp.p2 : vp.p1;
  const len = Math.hypot(pos.x-neg.x, pos.y-neg.y) || 1;
  return { x:(pos.x-neg.x)/len, y:(pos.y-neg.y)/len, posEnd:pos, negEnd:neg };
}

/* Create CS link between two lines.  Stores csPartner / csScale on both.
   Centers both lines at their intersection (midpoints → O). */
function makeCS(la, lb) {
  addToUndo();
  la.csPartner = lb.id;
  lb.csPartner = la.id;
  /* Center both lines at intersection so midpoints always equal O */
  const O = lineIntersection(la, lb);
  if (O) {
    [la, lb].forEach(el => {
      const vp = getVisualPts(el);
      const dx = vp.p2.x - vp.p1.x, dy = vp.p2.y - vp.p1.y;
      const len = Math.hypot(dx, dy);
      if (len < 0.001) return;
      const hl = len / 2;                          // half-length
      const nx = dx / len, ny = dy / len;           // unit vector p1→p2
      setVisualLine(el, O.x - nx*hl, O.y - ny*hl, O.x + nx*hl, O.y + ny*hl);
      el.csScale = Math.max(1, hl / 10);           // default: range of 10 units
    });
  }
  la.csScaled = true;
  /* Scaled mode: enforce equal pixel-per-unit on both axes from the start.
     Use la's scale as reference so la always covers exactly ±10 units. */
  lb.csScale = la.csScale;
  /* Sync via stroke_update (upsert — no data loss if WS is slow) */
  [la, lb].forEach(el => wsSend({ type:'stroke_update', data:{...el} }));
}

/* Dissolve CS link between two lines */
function dissolveCS(la, lb) {
  addToUndo();
  /* Nullify rather than delete so stroke_update can propagate the cleared state */
  la.csPartner=null; la.csScale=null; la.csTickStep=null; la.csGraphs=null; la.csScaled=null; la.csParams=null;
  la.csPanelOpen=null; la.csPanelDx=null; la.csPanelDy=null;
  lb.csPartner=null; lb.csScale=null; lb.csTickStep=null;
  [la, lb].forEach(el => wsSend({ type:'stroke_update', data:{...el} }));
}

/* Safe math expression evaluator: supports x,y, ^, sqrt, sin, cos, tan, abs, exp, ln, log, pi, e */
/* ── Expression preprocessor: WolframAlpha-style input ────
   Handles: implicit *, unary minus, Unicode symbols, etc.  */
function _preprocess(s) {
  s = s.trim();
  /* Unicode → ASCII */
  s = s.replace(/π/g,'pi').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  /* Russian/alternative notation → standard */
  s = s.replace(/\barcctg\b/g,'arccot').replace(/\barctg\b/g,'arctan')
       .replace(/\barcsh\b/g,'arcsinh').replace(/\barcch\b/g,'arccosh').replace(/\barcth\b/g,'arctanh')
       .replace(/\bctg\b/g,'cot').replace(/\btg\b/g,'tan')
       .replace(/\bsh\b/g,'sinh').replace(/\bch\b/g,'cosh').replace(/\bth\b/g,'tanh')
       .replace(/\blg\b/g,'log10');
  /* log_(base)(arg) → log2/log10/ln/general — full bracket matching */
  s = (function _expandLogBase(str){
    const re=/log_\(([^)]+)\)\s*\(/g; let out='',last=0,m;
    while((m=re.exec(str))!==null){
      const base=m[1].trim(); const oI=m.index+m[0].length-1;
      let dep=0,cI=oI;
      for(let i=oI;i<str.length;i++){if(str[i]==='(')dep++;else if(str[i]===')')if(--dep===0){cI=i;break;}}
      const arg=str.slice(oI+1,cI);
      out+=str.slice(last,m.index);
      if(base==='2')out+=`log2(${arg})`;
      else if(base==='10')out+=`log10(${arg})`;
      else if(base==='e')out+=`ln(${arg})`;
      else out+=`(ln(${arg})/ln(${base}))`;
      last=cI+1; re.lastIndex=last;
    }
    return out+str.slice(last);
  })(s);
  /* Normalize: remove spaces around operators */
  s = s.replace(/\s+/g,' ');
  /* Known functions + constants (order matters: longer names first) */
  const FUNS = ['sqrt','cbrt','sinh','cosh','tanh','asin','acos','atan2','atan',
                'arcsin','arccos','arctan','arccot','arcsinh','arccosh','arctanh',
                'erfc','erf','diff','int','sum',
                'cot','sin','cos','tan','abs','exp','log10',
                'log2','log','ln','sign','floor','ceil','round','max','min','pi'];
  /* Implicit multiplication rules (applied before function → Math.* substitution):
     1) digit immediately before letter or (  →  digit * ...
     2) ) immediately before digit, letter or (  →  ) * ...
     3) letter before (  →  letter * (  (unless protected fn)
     4) letter immediately before letter  →  a*b  (e.g. ax→a*x, bx→b*x)
     But NOT: function-name or constant (pi is protected above)  */
  /* Step 1: protect function names with a placeholder.
     IMPORTANT: placeholder must contain NO digit characters to avoid
     the implicit-mult rule `(\d)([A-Za-z\x01])` firing inside the placeholder
     and breaking the key used for restoration. Use letter-only index. */
  const _fnRe = new RegExp('\\b(' + FUNS.join('|') + ')\\b', 'g');
  const tokens = [], placeholders = {};
  let pidx = 0;
  function _pi2l(n){let s='';do{s=String.fromCharCode(65+(n%26))+s;n=Math.floor(n/26);}while(n>0);return s;}
  s = s.replace(_fnRe, m => { const ph = `\x01${_pi2l(pidx++)}\x01`; placeholders[ph] = m; tokens.push(ph); return ph; });
  /* Step 2: implicit mul — use \x01 as placeholder delimiter (not in normal math) */
  s = s
    .replace(/(\d)\s*([A-Za-z\x01])/g, '$1*$2')   // 2x, 2pi, 2sqrt…
    .replace(/(\d)\s*(\()/g, '$1*$2')              // 2(x+1) → 2*(x+1)
    .replace(/(\))\s*(\d)/g, '$1*$2')              // )2
    .replace(/(\))\s*([A-Za-z\x01])/g, '$1*$2')   // )x, )pi, )sqrt…
    .replace(/(\))\s*(\()/g, '$1*$2')              // )(
    .replace(/([A-Za-z])\s*(\()/g, (m,a,b) => {   // x( but not protected fn
      return `${a}*${b}`;
    })
    .replace(/([A-Za-z])([A-Za-z])/g, '$1*$2');  // ax→a*x, bx→b*x (param×var)
  /* Step 3: restore placeholders */
  for (const [ph, fn] of Object.entries(placeholders)) {
    s = s.split(ph).join(fn);
  }
  /* arcsin/arccos/arctan → asin/acos/atan */
  s = s.replace(/\barcsin\b/g,'asin').replace(/\barccos\b/g,'acos').replace(/\barctan\b/g,'atan');
  /* arccot/arcsinh/arccosh/arctanh pass through (defined as JS helpers in mathEval) */
  /* log without base → ln (natural log, WolframAlpha convention) */
  s = s.replace(/\blog\b(?!\s*\d)/g,'ln');
  /* log10 stays, log2 stays */
  return s;
}

/* Cache for compiled mathEval functions — avoids `new Function` on every graph point */
const _mathEvalFnCache = new Map();
/* Cache for graph display-coord paths — avoids 600 mathEval calls on every redraw */
const _graphPathCache = new Map();
const _csParamAnimTimers = new Map(); // key: `${laId}_${paramName}` → intervalId

/* ── Calculus transformer ────────────────────────────────────────────────────
   Converts diff(f,v[,n]), int(f,v[,a[,b]]), sum(f,k,a,b) in already-compiled
   JS code (after ^→** etc.) into inline numerical expressions.
   Called inside _compileMathFn before new Function(). */
function _transformCalculus(code) {
  /* Find closing paren starting at index of '(' */
  function exBr(s, i) {
    let d = 0;
    for (; i < s.length; i++) {
      if (s[i] === '(') d++;
      else if (s[i] === ')' && --d === 0) return i;
    }
    return s.length - 1;
  }
  /* Split top-level comma-separated args */
  function spArgs(inner) {
    const a = []; let d = 0, c = '';
    for (const ch of inner) {
      if (ch === '(') { d++; c += ch; }
      else if (ch === ')') { d--; c += ch; }
      else if (ch === ',' && d === 0) { a.push(c.trim()); c = ''; }
      else c += ch;
    }
    if (c.trim()) a.push(c.trim());
    return a;
  }
  /* Replace standalone variable name v with replacement string */
  function rnV(expr, v, repl) {
    const esc = v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return expr.replace(new RegExp(`(?<![A-Za-z0-9_])${esc}(?![A-Za-z0-9_])`, 'g'), repl);
  }

  let out = '', i = 0;
  while (i < code.length) {
    const atBound = i === 0 || !/[A-Za-z0-9_]/.test(code[i-1]);
    if (atBound) {
      /* ── diff(f, v [, n]) ── numerical derivative of order n */
      if (code.startsWith('diff(', i)) {
        const pI = i + 4, end = exBr(code, pI);
        const args = spArgs(code.slice(pI + 1, end));
        const f = _transformCalculus(args[0] || '0'); // recurse for nesting
        const v = (args[1] || 'x').trim();
        const n = parseInt(args[2]) || 1;
        if (n === 1) {
          const fp = rnV(f, v, `(_v0_+1e-7)`), fm = rnV(f, v, `(_v0_-1e-7)`);
          out += `(((_v0_=${v})=>((${fp})-(${fm}))/(2e-7))())`;
        } else if (n === 2) {
          const fp = rnV(f, v, `(_v0_+1e-5)`), fm = rnV(f, v, `(_v0_-1e-5)`);
          out += `(((_v0_=${v})=>((${fp})-2*(${rnV(f,v,'_v0_')})+(${fm}))/(1e-10))())`;
        } else { out += 'NaN'; }
        i = end + 1; continue;
      }
      /* ── int(f, v [, a [, b]]) ── numerical integration */
      if (code.startsWith('int(', i)) {
        const pI = i + 3, end = exBr(code, pI);
        const args = spArgs(code.slice(pI + 1, end));
        const f = _transformCalculus(args[0] || '0');
        const v = (args[1] || 'x').trim();
        const fFn = `((_k_)=>(${rnV(f, v, '_k_')}))`;
        const N = 80;
        const simp = `(()=>{const _a_=${args[2]||'0'},_b_=${args[3]||v},_N_=${N},_h_=(_b_-_a_)/_N_,_f_=${fFn};let _s_=_f_(_a_)+_f_(_b_);for(let _j_=1;_j_<_N_;_j_++){_s_+=_f_(_a_+_j_*_h_)*(_j_%2?4:2);}return _s_*_h_/3;})()`;
        out += simp;
        i = end + 1; continue;
      }
      /* ── sum(f, k, a, b) ── numerical sum */
      if (code.startsWith('sum(', i)) {
        const pI = i + 3, end = exBr(code, pI);
        const args = spArgs(code.slice(pI + 1, end));
        const f = _transformCalculus(args[0] || '0');
        const v = (args[1] || 'k').trim();
        const aE = args[2] || '1';
        const bRaw = args[3] || '10';
        const bE = (bRaw === 'Infinity' || bRaw === 'inf') ? '(_sa_+999)' : bRaw;
        const fFn = `((_k_)=>(${rnV(f, v, '_k_')}))`;
        out += `(()=>{const _sa_=Math.round(${aE}),_sb_=Math.min(Math.round(${bE}),_sa_+10000),_f_=${fFn};let _ss_=0;for(let _k_=_sa_;_k_<=_sb_;_k_++){_ss_+=_f_(_k_);}return _ss_;})()`;
        i = end + 1; continue;
      }
    }
    out += code[i++];
  }
  return out;
}

function _compileMathFn(expr, paramNames) {
  const pKey = (paramNames && paramNames.length) ? '|p:'+paramNames.slice().sort().join(',') : '';
  const key = expr + pKey;
  let fn = _mathEvalFnCache.get(key);
  if (fn) return fn;
  try {
    let code = _preprocess(expr);
    code = code
      .replace(/\^/g, '**')
      .replace(/\bsqrt\b/g,  'Math.sqrt')
      .replace(/\bcbrt\b/g,  'Math.cbrt')
      .replace(/\bsinh\b/g,  'Math.sinh')
      .replace(/\bcosh\b/g,  'Math.cosh')
      .replace(/\btanh\b/g,  'Math.tanh')
      .replace(/\basin\b/g,  'Math.asin')
      .replace(/\bacos\b/g,  'Math.acos')
      .replace(/\batan2\b/g, 'Math.atan2')
      .replace(/\batan\b/g,  'Math.atan')
      .replace(/\bsin\b/g,   'Math.sin')
      .replace(/\bcos\b/g,   'Math.cos')
      .replace(/\btan\b/g,   'Math.tan')
      .replace(/\babs\b/g,   'Math.abs')
      .replace(/\bexp\b/g,   'Math.exp')
      .replace(/\blog10\b/g, 'Math.log10')
      .replace(/\blog2\b/g,  'Math.log2')
      .replace(/\blog\b/g,   'Math.log10')
      .replace(/\bln\b/g,    'Math.log')
      .replace(/\bsign\b/g,  'Math.sign')
      .replace(/\bfloor\b/g, 'Math.floor')
      .replace(/\bceil\b/g,  'Math.ceil')
      .replace(/\bround\b/g, 'Math.round')
      .replace(/\bmax\b/g,   'Math.max')
      .replace(/\bmin\b/g,   'Math.min')
      .replace(/\bpi\b/gi,   'Math.PI')
      .replace(/(?<![A-Za-z_\d\.])e(?![A-Za-z_0-9])/g, 'Math.E');
    /* Transform diff/int/sum into numerical inline expressions */
    code = _transformCalculus(code);
    const extraArgs = (paramNames && paramNames.length) ? paramNames.slice().sort() : [];
    // eslint-disable-next-line no-new-func
    fn = new Function('x','y', ...extraArgs, '"use strict";'+
      'const cot=v=>1/Math.tan(v),arccot=v=>Math.PI/2-Math.atan(v),acot=arccot;'+
      'const arcsinh=Math.asinh,arccosh=Math.acosh,arctanh=Math.atanh;'+
      /* erf: Abramowitz & Stegun 7.1.26, max error 1.5e-7 */
      'const erf=(_u_)=>{const _t_=1/(1+.3275911*Math.abs(_u_));return Math.sign(_u_||1)*(1-((((1.061405429*_t_-1.453152027)*_t_+1.421413741)*_t_-.284496736)*_t_+.254829592)*_t_*Math.exp(-_u_*_u_));};'+
      'const erfc=(_u_)=>1-erf(_u_);'+
      'return (' + code + ');');
    _mathEvalFnCache.set(key, fn);
    return fn;
  } catch { return null; }
}

function mathEval(expr, xVal, yVal, params) {
  try {
    const paramNames = params ? Object.keys(params).sort() : [];
    const fn = _compileMathFn(expr, paramNames);
    if (!fn) return NaN;
    if (paramNames.length) return fn(xVal, yVal, ...paramNames.map(n => params[n] ?? 1));
    return fn(xVal, yVal);
  } catch { return NaN; }
}

/* Extract parameter names from equations: single or multi-letter identifiers that
   are not x, y, math constants/functions */
const _MATH_RESERVED = new Set([
  'x','y','pi','e','inf','nan',
  'sin','cos','tan','asin','acos','atan','atan2','sinh','cosh','tanh',
  'asinh','acosh','atanh','cot','arccot','acot','sqrt','cbrt','abs','exp',
  'log','log2','log10','ln','sign','floor','ceil','round','max','min','pow',
  'arcsin','arccos','arctan','arcctg','arctg','sh','ch','th','tg','ctg','lg',
  'erf','erfc','diff','int','sum',
  'mod','true','false','null','undefined','math','return','const','let','var'
]);
function detectParamNames(equations) {
  const names = new Set();
  for (const eq of (equations || [])) {
    if (!eq) continue;
    /* Preprocess to expand implicit multiplication (ax→a*x) before tokenising,
       so 'ax' is not mistaken for a single parameter named 'ax'. */
    const pre = _preprocess(eq + '');
    const matches = pre.matchAll(/\b([a-z_]\w*)\b(?!\s*\()/gi);
    for (const m of matches) {
      const name = m[1].toLowerCase();
      if (!_MATH_RESERVED.has(name)) names.add(name);
    }
  }
  return [...names].sort();
}

function syncCSParams(la) {
  const eqs = (la.csGraphs || []).map(g => g.eq);
  const names = detectParamNames(eqs);
  if (!la.csParams) la.csParams = [];
  /* Add newly detected params */
  for (const name of names) {
    if (!la.csParams.find(p => p.name === name)) {
      la.csParams.push({name, value:1, min:-5, max:5, step:0.1, animDir:1});
    }
  }
}

/* Parse equation/inequality string — WolframAlpha-style.
   Accepts: "y=x^2", "y<x^2", "y>=x^2", "x^2+y^2=1", "sin(x)" (no op → y=expr)
   Returns parsed object with optional .ineq: 'lt'|'gt'|'lte'|'gte' */
function parseEqn(raw) {
  raw = raw.trim();
  /* ── detect inequality (2-char ops before 1-char to avoid misparse) ── */
  let ineq = null;
  const _flipIneq = {lt:'gt',gt:'lt',lte:'gte',gte:'lte'};
  for (const [re, op] of [[/<=|≤/,'lte'],[/>=|≥/,'gte'],[/<(?!=)/,'lt'],[/>(?!=)/,'gt']]) {
    const m = re.exec(raw);
    if (m) { ineq = op; raw = raw.slice(0, m.index) + '=' + raw.slice(m.index + m[0].length); break; }
  }
  /* ── parse as equation ── */
  const eqIdx = raw.indexOf('=');
  if (eqIdx < 0) return Object.assign({mode:'yfx', rhs:raw}, ineq ? {ineq} : {});
  const lhs = raw.slice(0, eqIdx).trim();
  const rhs = raw.slice(eqIdx + 1).trim();
  let result, flipped = false;
  if (lhs === 'y') result = { mode:'yfx', rhs };
  else if (lhs === 'x') result = { mode:'xfy', rhs };
  else if (rhs === 'y') { result = { mode:'yfx', rhs:lhs }; flipped = true; }
  else if (rhs === 'x') { result = { mode:'xfy', rhs:lhs }; flipped = true; }
  else {
    const lhsHasY=/\by\b/.test(lhs), rhsHasY=/\by\b/.test(rhs);
    const lhsHasX=/\bx\b/.test(lhs), rhsHasX=/\bx\b/.test(rhs);
    if (!lhsHasY && !rhsHasX && rhsHasY) { result = { mode:'xfy', rhs:lhs }; flipped = true; }
    else if (!lhsHasX && !rhsHasY && rhsHasX) { result = { mode:'yfx', rhs:lhs }; flipped = true; }
    else result = { mode:'implicit', lhs, rhs };
  }
  if (ineq) result.ineq = flipped ? _flipIneq[ineq] : ineq;
  return result;
}

/* Returns {la, lb} if world point (wx,wy) is inside any CS parallelogram, else null.
   Uses the parallelogram spanned by the full extent of both CS axes (all 4 quadrants). */
function csParallelogramAt(wx, wy) {
  const seen = new Set();
  for (const el of all) {
    if (!el.csPartner) continue;
    const partner = all.find(e => e.id === el.csPartner);
    if (!partner) continue;
    const key = csKey(el.id, partner.id);
    if (seen.has(key)) continue; seen.add(key);
    const la = el, lb = partner;
    const O = lineIntersection(la, lb);
    if (!O) continue;
    const vA = getVisualPts(la), vB = getVisualPts(lb);
    /* Use the half-vectors (both directions) from O */
    const uA = { x: vA.p2.x - vA.p1.x, y: vA.p2.y - vA.p1.y }; // full vector p1→p2
    const uB = { x: vB.p2.x - vB.p1.x, y: vB.p2.y - vB.p1.y };
    /* Solve (wx-O.x, wy-O.y) = a*uA + b*uB  →  check |a|<=0.5, |b|<=0.5 (half-extent) */
    const det = uA.x * uB.y - uA.y * uB.x;
    if (Math.abs(det) < 1e-9) continue;
    const dx = wx - O.x, dy = wy - O.y;
    const a = (dx * uB.y - dy * uB.x) / det;
    const b = (uA.x * dy - uA.y * dx) / det;
    if (Math.abs(a) <= 0.5 && Math.abs(b) <= 0.5) return { la, lb };
  }
  return null;
}

/* Convert plain formula text to LaTeX for preview rendering */
function _eqToLatex(raw) {
  if (!raw) return '';
  let s = raw.replace(/<=|≤/g,'\\leq ').replace(/>=|≥/g,'\\geq ').replace(/</g,'<').replace(/>/g,'>');
  s = s.replace(/π/g,'pi').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  s = s.replace(/\barcctg\b/g,'arccot').replace(/\barctg\b/g,'arctan')
       .replace(/\bctg\b/g,'cot').replace(/\btg\b/g,'tan')
       .replace(/\blg\b/g,'log10');
  function exBr(str,i){let d=0,j=i;while(j<str.length){if(str[j]==='(')d++;else if(str[j]===')')if(--d===0)return j;j++;}return str.length-1;}
  /* Split comma-separated args respecting paren depth */
  function _spA(inner){const aa=[];let dd=0,cc='';for(const c of inner){if(c==='('){dd++;cc+=c;}else if(c===')'){dd--;cc+=c;}else if(c===','&&dd===0){aa.push(cc.trim());cc='';}else cc+=c;}if(cc.trim())aa.push(cc.trim());return aa;}
  const FUNS=[
    ['log10',  a=>`\\log_{10}\\!\\left(${cv(a)}\\right)`],
    ['log2',   a=>`\\log_{2}\\!\\left(${cv(a)}\\right)`],
    ['arcsinh',a=>`\\operatorname{arcsinh}\\!\\left(${cv(a)}\\right)`],
    ['arccosh',a=>`\\operatorname{arccosh}\\!\\left(${cv(a)}\\right)`],
    ['arctanh',a=>`\\operatorname{arctanh}\\!\\left(${cv(a)}\\right)`],
    ['arcsin', a=>`\\arcsin\\!\\left(${cv(a)}\\right)`],
    ['arccos', a=>`\\arccos\\!\\left(${cv(a)}\\right)`],
    ['arctan', a=>`\\arctan\\!\\left(${cv(a)}\\right)`],
    ['arccot', a=>`\\operatorname{arccot}\\!\\left(${cv(a)}\\right)`],
    ['sinh',   a=>`\\sinh\\!\\left(${cv(a)}\\right)`],
    ['cosh',   a=>`\\cosh\\!\\left(${cv(a)}\\right)`],
    ['tanh',   a=>`\\tanh\\!\\left(${cv(a)}\\right)`],
    ['sqrt',   a=>`\\sqrt{${cv(a)}}`],
    ['cbrt',   a=>`\\sqrt[3]{${cv(a)}}`],
    ['sin',    a=>`\\sin\\!\\left(${cv(a)}\\right)`],
    ['cos',    a=>`\\cos\\!\\left(${cv(a)}\\right)`],
    ['tan',    a=>`\\tan\\!\\left(${cv(a)}\\right)`],
    ['cot',    a=>`\\cot\\!\\left(${cv(a)}\\right)`],
    ['exp',    a=>`e^{${cv(a)}}`],
    ['ln',     a=>`\\ln\\!\\left(${cv(a)}\\right)`],
    ['log',    a=>`\\ln\\!\\left(${cv(a)}\\right)`],
    ['abs',    a=>`\\left|${cv(a)}\\right|`],
    ['floor',  a=>`\\lfloor ${cv(a)}\\rfloor`],
    ['ceil',   a=>`\\lceil ${cv(a)}\\rceil`],
    ['round',  a=>`\\operatorname{round}\\!\\left(${cv(a)}\\right)`],
    ['sign',   a=>`\\operatorname{sign}\\!\\left(${cv(a)}\\right)`],
    ['max',    a=>`\\max\\!\\left(${cv(a)}\\right)`],
    ['min',    a=>`\\min\\!\\left(${cv(a)}\\right)`],
    ['erfc',   a=>`\\operatorname{erfc}\\!\\left(${cv(a)}\\right)`],
    ['erf',    a=>`\\operatorname{erf}\\!\\left(${cv(a)}\\right)`],
    /* log_(base)(arg) */
    ['log_',   null], // handled specially below
  ];
  function cv(s){
    let r='',i=0;
    while(i<s.length){
      /* calculus: diff(f,x[,n]) | int(f,x[,a,b]) | sum(f,k,a,b) */
      if(i===0||!/[a-zA-Z0-9_]/.test(s[i-1])){
        if(s.startsWith('diff(',i)){
          let _d=0,_j=i+4;while(_j<s.length){if(s[_j]==='(')_d++;else if(s[_j]===')')if(--_d===0)break;_j++;}
          const _a=_spA(s.slice(i+5,_j)),_v=(_a[1]||'x').trim(),_n=_a[2]?parseInt(_a[2]):1,_fL=cv(_a[0]||'');
          r+=_n>1?`\\frac{d^{${_n}}}{d${_v}^{${_n}}}\\!\\left(${_fL}\\right)`:`\\frac{d}{d${_v}}\\!\\left(${_fL}\\right)`;
          i=_j+1;continue;
        }
        if(s.startsWith('int(',i)){
          let _d=0,_j=i+3;while(_j<s.length){if(s[_j]==='(')_d++;else if(s[_j]===')')if(--_d===0)break;_j++;}
          const _a=_spA(s.slice(i+4,_j)),_v=(_a[1]||'x').trim(),_fL=cv(_a[0]||'');
          const _cvLim=l=>{const lt=l.trim();return(lt==='inf'||lt==='Infinity')?'\\infty':(lt==='-inf'||lt==='-Infinity')?'-\\infty':cv(lt);};
          if(_a.length===2){r+=`\\int ${_fL}\\,d${_v}`;}
          else if(_a.length>=4){r+=`\\int_{${_cvLim(_a[2])}}^{${_cvLim(_a[3])}} ${_fL}\\,d${_v}`;}
          i=_j+1;continue;
        }
        if(s.startsWith('sum(',i)){
          let _d=0,_j=i+3;while(_j<s.length){if(s[_j]==='(')_d++;else if(s[_j]===')')if(--_d===0)break;_j++;}
          const _a=_spA(s.slice(i+4,_j)),_v=(_a[1]||'k').trim(),_fL=cv(_a[0]||'');
          const _lo=cv((_a[2]||'1').trim()),_hiR=(_a[3]||'').trim();
          const _hi=(_hiR==='inf'||_hiR==='Infinity')?'\\infty':cv(_hiR);
          r+=`\\sum_{${_v}=${_lo}}^{${_hi}} ${_fL}`;
          i=_j+1;continue;
        }
      }
      /* log_(base)( */
      if(s.startsWith('log_(',i)){
        const bi=i+5; const bEnd=exBr(s,i+4);
        const base=s.slice(bi,bEnd);
        if(bEnd+1<s.length&&s[bEnd+1]==='('){
          const aEnd=exBr(s,bEnd+1);
          r+=`\\log_{${cv(base)}}\\!\\left(${cv(s.slice(bEnd+2,aEnd))}\\right)`;
          i=aEnd+1; continue;
        }
      }
      /* known functions */
      let hit=false;
      for(const [name,fmt] of FUNS){
        if(!fmt)continue;
        if(s.startsWith(name,i)){
          const ni=i+name.length;
          if(ni<s.length&&s[ni]==='('){
            const cI=exBr(s,ni);
            r+=fmt(s.slice(ni+1,cI)); i=cI+1; hit=true; break;
          }
        }
      }
      if(hit)continue;
      /* pi */
      if(s.startsWith('pi',i)&&(i+2>=s.length||!/\w/.test(s[i+2]))&&(i===0||!/\w/.test(s[i-1]))){r+='\\pi';i+=2;continue;}
      /* ^ superscript */
      if(s[i]==='^'){i++;
        if(i<s.length&&s[i]==='('){const cI=exBr(s,i);r+=`^{${cv(s.slice(i+1,cI))}}`;i=cI+1;}
        else if(i<s.length){r+=`^{${s[i]}}`;i++;}
        else r+='^'; continue;
      }
      /* _ subscript */
      if(s[i]==='_'){i++;
        if(i<s.length&&s[i]==='('){const cI=exBr(s,i);r+=`_{${cv(s.slice(i+1,cI))}}`;i=cI+1;}
        else if(i<s.length){r+=`_{${s[i]}}`;i++;}
        else r+='_'; continue;
      }
      if(s[i]==='*'){r+='\\cdot ';i++;continue;}
      if(s[i]==='('){r+='\\left(';i++;continue;}
      if(s[i]===')'){{r+='\\right)';i++;continue;}}
      r+=s[i]; i++;
    }
    return r;
  }
  try{return cv(s);}catch(e){return raw;}
}

function buildMathKb(inp) {
  const kb = document.createElement('div'); kb.className = 'math-kb';

  /* ── Live preview ── */
  const prev = document.createElement('div'); prev.className = 'eq-preview';
  function updatePrev() {
    const v = inp.value.trim();
    if (!v) { prev.innerHTML = '<span class="eq-preview-ph">введите формулу…</span>'; return; }
    if (typeof katex !== 'undefined') {
      try { katex.render(_eqToLatex(v), prev, {throwOnError:false,displayMode:false}); return; }
      catch(e) {}
    }
    prev.textContent = v;
  }
  inp.addEventListener('input', updatePrev);
  /* defer first render until katex loads */
  if (typeof katex !== 'undefined') updatePrev();
  else { prev.innerHTML = '<span class="eq-preview-ph">введите формулу…</span>'; setTimeout(updatePrev,800); }
  kb.appendChild(prev);

  const tabBar = document.createElement('div'); tabBar.className = 'math-kb-tabs';
  const content = document.createElement('div');

  /* ── Insert helper ── */
  function ins(s) {
    const st = inp.selectionStart ?? inp.value.length;
    const en = inp.selectionEnd ?? st;
    const sel = inp.value.slice(st, en);
    let txt = s, cur;
    if (s.endsWith('(')) {
      /* Function: always close paren, cursor inside */
      if (sel) { txt = s + sel + ')'; cur = st + txt.length; }
      else { txt = s + ')'; cur = st + s.length; }
    } else if (s === '^()') {
      /* Superscript template */
      if (sel) { txt = '(' + sel + ')^()'; cur = st + txt.length - 1; }
      else { txt = '^()'; cur = st + 2; }
    } else if (s === '_()') {
      /* Subscript template */
      if (sel) { txt = sel + '_()'; cur = st + txt.length - 1; }
      else { txt = '_()'; cur = st + 2; }
    } else if (s === '^(2)') {
      if (sel) { txt = '(' + sel + ')^(2)'; cur = st + txt.length; }
      else { txt = '^(2)'; cur = st + txt.length; }
    } else {
      cur = st + s.length;
    }
    inp.value = inp.value.slice(0, st) + txt + inp.value.slice(en);
    inp.selectionStart = inp.selectionEnd = cur;
    inp.focus();
    inp.dispatchEvent(new Event('input'));
  }

  function mkB(label, val, cls='') {
    const b = document.createElement('button');
    b.className = 'math-kb-btn' + (cls ? ' '+cls : '');
    b.textContent = label; b.type = 'button';
    b.onmousedown = e => { e.preventDefault(); ins(val); };
    return b;
  }
  /* Button with HTML label (for templates) */
  function mkBH(html, val, cls='') {
    const b = document.createElement('button');
    b.className = 'math-kb-btn' + (cls ? ' '+cls : '');
    b.innerHTML = html; b.type = 'button';
    b.onmousedown = e => { e.preventDefault(); ins(val); };
    return b;
  }
  function row(...btns) {
    const r = document.createElement('div'); r.className = 'math-kb-row';
    btns.forEach(b => r.appendChild(b)); return r;
  }
  function mkBack() {
    const b = document.createElement('button');
    b.className = 'math-kb-btn kb-back'; b.textContent = '⌫'; b.type = 'button';
    b.onmousedown = e => {
      e.preventDefault();
      const st=inp.selectionStart, en=inp.selectionEnd;
      if(st!==en){ inp.value=inp.value.slice(0,st)+inp.value.slice(en); inp.selectionStart=inp.selectionEnd=st; }
      else if(st>0){ inp.value=inp.value.slice(0,st-1)+inp.value.slice(st); inp.selectionStart=inp.selectionEnd=st-1; }
      inp.focus(); inp.dispatchEvent(new Event('input'));
    };
    return b;
  }

  const TABS = [
    { label: 'Осн', render() {
      content.append(
        row(mkB('7','7'),mkB('8','8'),mkB('9','9'),mkB('÷','/', 'kb-op'),mkB('(','(', 'kb-op'),mkB(')',')', 'kb-op')),
        row(mkB('4','4'),mkB('5','5'),mkB('6','6'),mkB('+','+', 'kb-op'),mkB('−','-', 'kb-op'),mkBack()),
        row(mkB('1','1'),mkB('2','2'),mkB('3','3'),mkB('×','*', 'kb-op'),mkB('x','x', 'kb-op'),mkB('y','y', 'kb-op')),
        row(mkB('0','0'),mkB('.', '.'),mkB('π','π', 'kb-const'),mkB('e','e', 'kb-const'),mkB('=','=', 'kb-op'),
            mkBH('√<b>□</b>','sqrt(', 'kb-fn kb-tpl')),
        row(
          mkBH('<b>□</b><sup style="font-size:.6em">2</sup>','^(2)', 'kb-tpl'),
          mkBH('<b>□</b><sup style="font-size:.6em">n</sup>','^()', 'kb-tpl'),
          mkBH('<b>□</b><sub style="font-size:.6em">n</sub>','_()', 'kb-tpl'),
          mkBH('∛<b>□</b>','cbrt(', 'kb-fn kb-tpl'),
          mkBH('|<b>□</b>|','abs(', 'kb-fn kb-tpl')),
        row(mkB('<','<','kb-op'),mkB('>','>','kb-op'),mkB('≤','<=','kb-op'),mkB('≥','>=','kb-op'))
      );
    }},
    { label: 'Trig', render() {
      content.append(
        row(mkB('sin','sin(', 'kb-fn'),mkB('cos','cos(', 'kb-fn'),mkB('tan','tan(', 'kb-fn'),mkB('ctg','cot(', 'kb-fn')),
        row(mkB('arcsin','arcsin(', 'kb-fn'),mkB('arccos','arccos(', 'kb-fn')),
        row(mkB('arctan','arctan(', 'kb-fn'),mkB('arcctg','arccot(', 'kb-fn')),
        row(mkB('sinh','sinh(', 'kb-fn'),mkB('cosh','cosh(', 'kb-fn'),mkB('tanh','tanh(', 'kb-fn')),
        row(mkB('π','π', 'kb-const'),mkB('2π','2*pi', 'kb-const'),mkB('π/2','pi/2', 'kb-const'))
      );
    }},
    { label: 'Log', render() {
      content.append(
        row(mkB('ln','ln(', 'kb-fn'),mkB('lg','log10(', 'kb-fn'),mkB('log₂','log2(', 'kb-fn')),
        row(mkBH('log<sub style="font-size:.7em">n</sub>','log_()', 'kb-fn kb-tpl'),
            mkB('exp','exp(', 'kb-fn'),mkB('e','e', 'kb-const')),
        row(mkB('e²','e^(2)', 'kb-const'),mkB('eˣ','exp(', 'kb-fn'),mkB('10ˣ','10^(', 'kb-fn'))
      );
    }},
    { label: 'Разн', render() {
      content.append(
        row(mkB('floor','floor(', 'kb-fn'),mkB('ceil','ceil(', 'kb-fn'),mkB('round','round(', 'kb-fn')),
        row(mkB('max','max(', 'kb-fn'),mkB('min','min(', 'kb-fn'),mkB('sign','sign(', 'kb-fn')),
        row(mkB('mod','%', 'kb-op'),mkB('n!','!', 'kb-op'),mkB('∞','Infinity', 'kb-const'))
      );
    }},
    { label: '∫', render() {
      /* Cursor marker | — ins() will place caret there and strip it */
      const mkTpl = (label, tpl, cls='') => {
        const b = document.createElement('button');
        b.className = 'math-kb-btn' + (cls ? ' '+cls : '');
        b.innerHTML = label; b.type = 'button';
        b.onmousedown = e => {
          e.preventDefault();
          const st = inp.selectionStart ?? inp.value.length;
          const en = inp.selectionEnd ?? st;
          const sel = inp.value.slice(st, en);
          const ci = tpl.indexOf('|');
          const txt = ci >= 0 ? tpl.replace('|', sel) : tpl + sel;
          const cur = ci >= 0 ? st + ci : st + txt.length;
          inp.value = inp.value.slice(0, st) + txt + inp.value.slice(en);
          inp.selectionStart = inp.selectionEnd = cur;
          inp.focus(); inp.dispatchEvent(new Event('input'));
        };
        return b;
      };
      content.append(
        /* Differentiation: d/dx inserts diff(|,x), d²/dx² inserts diff(|,x,2), ∂/∂y inserts diff(|,y) */
        row(mkTpl('d/dx','diff(|,x)','kb-fn'),
            mkTpl('d²/dx²','diff(|,x,2)','kb-fn'),
            mkTpl('∂/∂y','diff(|,y)','kb-fn')),
        /* Integration: ∫dx = antiderivative, ∫ₐᵇdx = definite, erf */
        row(mkTpl('∫□dx','int(|,x)','kb-fn'),
            mkTpl('∫ₐᵇ□dx','int(|,x,a,b)','kb-fn'),
            mkTpl('erf','erf(','kb-fn')),
        /* Sum */
        row(mkTpl('Σₐᵇ','sum(|,k,1,10)','kb-fn'),
            mkTpl('Σₐ∞','sum(|,k,1,Infinity)','kb-fn'),
            mkBack())
      );
      const h=document.createElement('div');
      h.style.cssText='font-size:.7em;color:var(--fg2);padding:6px 4px 2px;line-height:1.85;border-top:1px solid var(--sep);margin-top:4px';
      h.innerHTML='<b>diff(</b>f, x<b>)</b> — df/dx &nbsp;·&nbsp; <b>diff(</b>f, x, 2<b>)</b> — d²f/dx²<br>'
        +'<b>int(</b>f, x<b>)</b> — ∫₀ˣ &nbsp;·&nbsp; <b>int(</b>f, x, a, b<b>)</b> — ∫ₐᵇ<br>'
        +'<b>sum(</b>f, k, 1, 10<b>)</b> — Σ₁¹⁰ &nbsp;·&nbsp; <b>erf(</b>x<b>)</b> — функция ошибок';
      content.appendChild(h);
    }}
  ];

  let curTab = 0;
  TABS.forEach((t, i) => {
    const tb = document.createElement('button');
    tb.className = 'math-kb-tab' + (i===0?' act':'');
    tb.textContent = t.label; tb.type = 'button';
    if (t.disabled) tb.disabled = true;
    tb.onmousedown = e => {
      e.preventDefault(); curTab = i;
      tabBar.querySelectorAll('.math-kb-tab').forEach((b,j) => b.classList.toggle('act', j===i));
      content.innerHTML = ''; TABS[i].render();
    };
    tabBar.appendChild(tb);
  });

  kb.appendChild(tabBar); kb.appendChild(content);
  TABS[0].render();
  return kb;
}

/* Position CS panel anchored to the CS origin in world space.
   csPanelDx/Dy are offsets from O in world coordinates — they follow pan & zoom. */
function _positionCSPanel(la, lb) {
  const panel = document.getElementById('csSetPanel');
  if (!panel.classList.contains('open') || !la || !lb) return;
  const O = lineIntersection(la, lb);
  if (!O) return;
  const dx = la.csPanelDx ?? 80, dy = la.csPanelDy ?? -80;
  const sp = ts(O.x + dx, O.y + dy);
  panel.style.left            = (sp.x + 56) + 'px';
  panel.style.top             = (sp.y + 52) + 'px';
  panel.style.right           = 'auto';
  panel.style.bottom          = 'auto';
  panel.style.transform       = `scale(${vz})`;
  panel.style.transformOrigin = 'top left';
}

function updateCSPanels(la, lb) {
  const panel = document.getElementById('csSetPanel');

  if (!la || !lb) {
    panel.classList.remove('open'); csPanelLaId = null; csPanelLbId = null; updateMobTabs(); return;
  }
  /* Auto-switch to CS tab on mobile so formula input is immediately visible */
  if (window.innerWidth <= 600) { _mobTab = 'cs'; _mobCollapsed = false; }

  /* Store IDs for persistence so panel can be restored after WS round-trips */
  csPanelLaId = la.id; csPanelLbId = lb.id;
  /* Helper: always look up the LIVE element from all[] to avoid stale references */
  const getLa = () => all.find(e => e.id === csPanelLaId) || la;
  const getLb = () => all.find(e => e.id === csPanelLbId) || lb;

  /* Custom drag: saves position as world-coord offset from O (synced via WS) */

    };
    rangeInp.onchange = () => {
      const liveEl = all.find(e => e.id === axEl.id) || axEl;
      wsSend({type:'stroke_update',data:{...liveEl}});
    };
    const rangeLabel = document.createElement('label'); rangeLabel.textContent='Диапазон';
    const rangeUnit  = document.createElement('span');  rangeUnit.className='cs-unit'; rangeUnit.textContent='ед';
    rangeRow.append(rangeLabel, rangeInp, rangeUnit);
    block.appendChild(rangeRow);

    /* ── Size row (физическая длина полуоси) ── */
    const sizeRow = document.createElement('div'); sizeRow.className = 'cs-row';
    const sizeInp = mkInp();
    sizeInp.value = Math.round(hl0);
    sizeInp.title = 'Физический размер полуоси (мировые пикселы)';
    sizeInp.oninput = () => {
      const newHl = parseFloat(sizeInp.value);
      if (newHl > 0) {
        const _la2 = getLa(), _lb2 = getLb();
        const Oi = lineIntersection(_la2, _lb2);
        if (!Oi) return;
        const liveEl = all.find(e => e.id === axEl.id) || axEl;
        const vp = getVisualPts(liveEl);
        const dx = vp.p2.x - vp.p1.x, dy = vp.p2.y - vp.p1.y;
        const len = Math.hypot(dx, dy); if (len < 0.001) return;
        const nx = dx/len, ny = dy/len;
        setVisualLine(liveEl, Oi.x - nx*newHl, Oi.y - ny*newHl, Oi.x + nx*newHl, Oi.y + ny*newHl);

    };
    sizeInp.onchange = () => {
      const liveEl = all.find(e => e.id === axEl.id) || axEl;
      wsSend({type:'stroke_update',data:{...liveEl}});

    const sizeLabel = document.createElement('label'); sizeLabel.textContent='Размер';
    const sizeUnit  = document.createElement('span');  sizeUnit.className='cs-unit'; sizeUnit.textContent='px';
    sizeRow.append(sizeLabel, sizeInp, sizeUnit);
    block.appendChild(sizeRow);

    /* ── Tick step row ── */
    const tickRow = document.createElement('div'); tickRow.className = 'cs-row';

        liveEl.csTickStep = axEl.csTickStep = v; redraw(); }

    tickInp.onchange = () => {

    const tickLabel = document.createElement('label'); tickLabel.textContent='Шаг';
    const tickUnit  = document.createElement('span');  tickUnit.className='cs-unit'; tickUnit.textContent='ед';
    tickRow.append(tickLabel, tickInp, tickUnit);
    block.appendChild(tickRow);

    /* ── Viewport center row (смещение начала координат) ── */
    const offKey = idx === 0 ? 'csOriginA' : 'csOriginB';

    offInp.type='number'; offInp.step='any';

    offInp.onfocus = () => offInp.style.borderColor='var(--accent)';

    offBtnReset.onclick = () => { getLa()[offKey] = 0; offInp.value = '0'; redraw();
      wsSend({ type:'stroke_update', data:{...getLa()} }); };
    const offLabel = document.createElement('label'); offLabel.textContent = 'Центр';
    const offUnit  = document.createElement('span');  offUnit.className='cs-unit'; offUnit.textContent='ед';

  /* ── Scaled toggle (equal unit size on both axes) ── */
  const scaledRow = document.createElement('div'); scaledRow.className = 'cs-row';
  scaledRow.style.cssText = 'margin-top:2px;justify-content:center;gap:6px';

  scaledBtn.style.cssText = 'padding:3px 10px;font-size:.8em;width:auto';
  scaledBtn.onclick = () => {
    const _la = getLa();
    _la.csScaled = !(_la.csScaled !== false);
    scaledBtn.classList.toggle('act', _la.csScaled !== false);
    if (_la.csScaled !== false) {
      /* sync lb to la's scale */
      const _lb = getLb();
      _lb.csScale = _la.csScale;

  const normalizeBtn = document.createElement('button');

  normalizeBtn.textContent = '⊞ По осям';
  normalizeBtn.title = 'Выровнять оси: X горизонтально, Y вертикально';
  normalizeBtn.style.cssText = 'padding:3px 10px;font-size:.8em;width:auto';
  normalizeBtn.onclick = () => {
    const _la = getLa(), _lb = getLb();
    const Oi = lineIntersection(_la, _lb);
    if (!Oi) return;
    addToUndo();
    const vpA = getVisualPts(_la), vpB = getVisualPts(_lb);
    const hlA = Math.hypot(vpA.p2.x-vpA.p1.x, vpA.p2.y-vpA.p1.y) / 2;
    const hlB = Math.hypot(vpB.p2.x-vpB.p1.x, vpB.p2.y-vpB.p1.y) / 2;
    const dirA = csPositiveDir(_la), dirB = csPositiveDir(_lb);

    setVisualLine(_lb,
      Oi.x, lbStart ? Oi.y+ySign*hlB : Oi.y-ySign*hlB,

    wsSend({type:'stroke_update', data:{..._lb}});
