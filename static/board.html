/* ── Russian rule-based phonetic transcription ──────────────────────────
   Supports: yotation (е/ё/ю/я), softness mark ('), hard sign (ъ),
   soft sign (ь), final devoicing, always-hard (ж/ш/ц), always-soft (ч/щ) */
function ruPhonetic(text) {
  const VOWELS    = new Set([...'аеёиоуыэюя']);
  const A_HARD    = new Set([...'жшц']);          // всегда твёрдые
  const A_SOFT    = new Set([...'чщ']);           // всегда мягкие
  const CONS      = new Set([...'бвгджзклмнпрстфхцчшщ']);
  const DEVOICE   = {б:'п',в:'ф',г:'к',д:'т',ж:'ш',з:'с'};

  function isVowel(c) { return VOWELS.has(c); }
  function isCons(c)  { return CONS.has(c); }

  return text.replace(/[а-яё]+/gi, word => {
    const w = [...word.toLowerCase()];
    const phs = []; // [{ch, soft}]

    const softPrev = () => {
      if (!phs.length) return;
      const last = phs[phs.length - 1];
      if (isCons(last.ch) && !A_HARD.has(last.ch) && last.ch !== 'й') last.soft = true;
    };

    for (let i = 0; i < w.length; i++) {
      const c = w[i], prev = w[i-1] || '';
      // Yotification: beginning of word, after vowel, after ъ or ь
      const yotPos = i === 0 || isVowel(prev) || prev === 'ъ' || prev === 'ь';

      if      (c === 'е') { if (yotPos) { phs.push({ch:'й'}); phs.push({ch:'э'}); } else { softPrev(); phs.push({ch:'э'}); } }
      else if (c === 'ё') { if (yotPos) { phs.push({ch:'й'}); phs.push({ch:'о'}); } else { softPrev(); phs.push({ch:'о'}); } }
      else if (c === 'ю') { if (yotPos) { phs.push({ch:'й'}); phs.push({ch:'у'}); } else { softPrev(); phs.push({ch:'у'}); } }
      else if (c === 'я') { if (yotPos) { phs.push({ch:'й'}); phs.push({ch:'а'}); } else { softPrev(); phs.push({ch:'а'}); } }
      else if (c === 'и') { softPrev(); phs.push({ch:'и'}); }
      else if (c === 'ь') { softPrev(); }           // мягкость, без звука
      else if (c === 'ъ') { /* разделитель, без звука */ }
      else if (A_SOFT.has(c)) { phs.push({ch:c, soft:true}); }
      else if (c === 'й') { phs.push({ch:'й'}); }
      else { phs.push({ch:c, soft:false}); }
    }

    // Конечное оглушение
    if (phs.length) {
      const last = phs[phs.length - 1];
      if (DEVOICE[last.ch]) last.ch = DEVOICE[last.ch];
    }

    const out = phs.map(p => {
      const up = p.ch.toUpperCase();
      return (p.soft && isCons(p.ch) && p.ch !== 'й') ? up + "'" : up;
    }).join('');
    return '[' + out + ']';
  });
}

/* IPA — English: dictionaryapi.dev (unlimited); Russian: rule-based ruPhonetic */
async function ipaTranscribe(el) {
  if (!el || !el.text) return;
  const btn = document.getElementById('sbIPA');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }

  const isRussian = /[а-яёА-ЯЁ]/.test(el.text);
  let ipaText;

  if (isRussian) {
    ipaText = ruPhonetic(el.text);
  } else {
    /* English: split on spaces AND hyphens so "rock-and-roll" works */
    const tokens = el.text.trim().split(/(\s+|-)/);
    const results = await Promise.all(tokens.map(async tok => {
      if (/^\s+$/.test(tok) || tok === '-') return tok;
      const clean = tok.replace(/[^a-zA-Z']/g, '');
      if (!clean) return tok;
      try {
        const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(clean.toLowerCase())}`);
        if (!r.ok) return clean;
        const d = await r.json();
        let phon = d[0]?.phonetics?.find(p => p.text)?.text || d[0]?.phonetic || null;
        if (phon) phon = phon.replace(/\//g, '').trim();
        return phon ? `${clean}  ${phon}` : clean;
      } catch { return clean; }
    }));
    /* words with phonetics get their own line, separators become spaces */
    ipaText = results.reduce((acc, tok) => {
      if (/^\s+$/.test(tok) || tok === '-') return acc + ' ';
      return acc + (acc ? '\n' : '') + tok;
    }, '').trim();
  }

  if (btn) { btn.disabled = false; btn.textContent = 'IPA'; }

  const ipaFs = Math.max(10, (el.fontSize || 18) - 2);
  const ipaLines = ipaText.split('\n').length;
  const newEl = {
    id: 'el_' + Date.now(), type: 'text',
    x: el.x, y: el.y + (el.h || 40) + 8,
    w: Math.max(el.w || 200, 200),
    h: Math.ceil(ipaLines * ipaFs * 1.4 + 10),
    text: ipaText, fontSize: ipaFs,
    color: '#4ec9b0', font: el.font || 'system-ui,sans-serif', italic: true
  };
  addToUndo(); all.push(newEl);
  wsSend({ type: 'stroke', data: newEl }); redraw();
}

/* Translate — MyMemory (5K chars/day) → fallback: Google Translate (unofficial) */
async function translateEl(el, langPair) {
  if (!el || !el.text) return;
  const btn = document.getElementById('sbTranslate');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }

  const [sl, tl] = langPair.split('|');
  let translated = null;

  try {
    /* 1. MyMemory */
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(el.text)}&langpair=${langPair}`);
    const d = await r.json();
    if (d?.responseData?.translatedText && d.responseStatus === 200
        && d.responseData.translatedText.toLowerCase() !== el.text.toLowerCase()) {
      translated = d.responseData.translatedText;
    } else {
      throw new Error('limit or unchanged');
    }
  } catch {
    try {
      /* 2. Fallback: unofficial Google Translate (client=gtx, no key) */
      const r2 = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(el.text)}`);
      const d2 = await r2.json();
      translated = Array.isArray(d2[0]) ? d2[0].map(x => x[0]).join('') : null;
    } catch { translated = null; }
  }

  if (btn) { btn.disabled = false; btn.textContent = '🌐'; }

  if (!translated) { alert('Ошибка перевода: оба сервиса недоступны'); return; }

  const trFs = el.fontSize || 18;
  const trLines = translated.split('\n').length;
  const newEl = {
    id: 'el_' + Date.now(), type: 'text',
    x: el.x, y: el.y + (el.h || 40) + 8,
    w: el.w || 200,
    h: Math.ceil(trLines * trFs * 1.4 + 10),
    text: translated, fontSize: trFs,
    color: '#f0a050', font: el.font || 'system-ui,sans-serif'
  };
  addToUndo(); all.push(newEl);
  wsSend({ type: 'stroke', data: newEl }); redraw();
}

// ══════════════════════════════════════════════════════════
// §14  POINTER HELPERS
// ══════════════════════════════════════════════════════════
function gp(e) {
  const r = cv.getBoundingClientRect();
  const t = (e.touches && e.touches.length > 0) ? e.touches[0]
           : (e.changedTouches && e.changedTouches.length > 0) ? e.changedTouches[0]
           : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

// ══════════════════════════════════════════════════════════
// §15  MOUSE / TOUCH EVENTS

function resetCursor() {
  const cursors = { select:'default', pen:'none', erase:'none',
    geo_line:'crosshair', geo_rect:'crosshair', geo_triangle:'crosshair',
    geo_parallelogram:'crosshair', geo_ellipse:'crosshair',
    flow_rect:'crosshair', flow_diamond:'crosshair', flow_rounded:'crosshair',
    flow_connector:'crosshair', flow_iopara:'crosshair', flow_hexagon:'crosshair',
    flow_cylinder:'crosshair', flow_document:'crosshair', flow_subprocess:'crosshair',
    text:'text', code:'crosshair' };
  cv.style.cursor = cursors[tool] || 'default';
}
let drawing = false, panning = false, panSt = null, spDown = false;

function onDown(e) {
  commitTextEdit();

  /* RMB / Space / Middle → pan */
  if (e.button === 2 || e.button === 1 || (e.button === 0 && spDown)) {
    if (followTarget) stopFollow();   // exit follow mode when user pans manually
    panning = true; panSt = gp(e); cv.style.cursor = 'grabbing'; e.preventDefault(); return;
  }
  if (e.button !== 0) return;
  e.preventDefault();

  const p = gp(e), w = tw(p.x, p.y);

  /* ── Select ── */
  if (tool === 'select') {
    /* check connector segment handles first */
    const _ch = _getConnHandle(w.x, w.y);
    if (_ch) {
      if (_ch.type==='endpoint') {
        addToUndo();
        _connEndDrag={conn:_ch.conn, which:_ch.which};
        cv.style.cursor='crosshair'; redraw(); return;
      }
      if (_ch.draggable) {
        addToUndo();
        /* Init conn.pts from resolved path if not yet set */
        if (!_ch.conn.pts) _ch.conn.pts=_ch.pts.map(p=>({...p}));
        const a=_ch.conn.pts[_ch.segIdx], b=_ch.conn.pts[_ch.segIdx+1];
        const isH=Math.abs(a.y-b.y)<0.5;
        _connSegDrag={conn:_ch.conn, segIdx:_ch.segIdx, isH};
        cv.style.cursor=isH?'ns-resize':'ew-resize';
      }
      /* Always return to prevent accidental deselection */
      redraw(); return;
    }
    /* check rotation handle first */
    const rot = getRotateHandle(w.x, w.y);
    if (rot) {
      addToUndo();
      rotating = true; rotateEl = rot;
      const bb = elemBBox(rot);
      const c = ts(bb.x + bb.w/2, bb.y + bb.h/2);
      rotateCenter = c;
      rotateStartAngle = Math.atan2(p.y - c.y, p.x - c.x) - (rot.rotation || 0);
      rotateMoved = false;
      cv.style.cursor = 'grab'; return;
    }
    /* check resize handles */
    const rh = getResizeHandle(w.x, w.y);
    if (rh) {
      /* Direct CS endpoint grab: auto-select both axes first */
      if (rh.autoSelect) {
        selected.clear(); lineLockedHandles.clear(); sbLineOrder = 0;
        selected.add(rh.el.id);
        const _csP = all.find(e => e.id === rh.el.csPartner);
        if (_csP) selected.add(_csP.id);
        updateSelBar(); redraw();
      }
      addToUndo();
      resizing = true; resizeHandle = rh.handle; resizeEl = rh.el;
      const el = rh.el;
      /* Normalize rect/ellipse coords (x1≤x2, y1≤y2) to fix backward-drawn shapes */
      if (el.type === 'shape' && el.shape !== 'line' && el.shape !== 'triangle' && el.shape !== 'parallelogram') {
        const nx1=Math.min(el.x1,el.x2), ny1=Math.min(el.y1,el.y2);
        const nx2=Math.max(el.x1,el.x2), ny2=Math.max(el.y1,el.y2);
        el.x1=nx1; el.y1=ny1; el.x2=nx2; el.y2=ny2;
      }
      const bb = elemBBox(el);
      if (el.type === 'shape' && el.shape === 'line') {
        /* Store visual (world) positions so constraint logic works after rotation */
        const rot=el.rotation||0, cos=Math.cos(rot), sin=Math.sin(rot);
        const mlx=(el.x1+el.x2)/2, mly=(el.y1+el.y2)/2;
        const hx=(el.x2-el.x1)/2, hy=(el.y2-el.y1)/2;
        const rhx=hx*cos-hy*sin, rhy=hx*sin+hy*cos;
        resizeSnap = { x1:el.x1,y1:el.y1,x2:el.x2,y2:el.y2,
          wm:{x:mlx,y:mly}, w1:{x:mlx-rhx,y:mly-rhy}, w2:{x:mlx+rhx,y:mly+rhy} };
      } else if (el.type === 'shape' && el.shape === 'triangle') {
        resizeSnap = { x1:el.x1,y1:el.y1,x2:el.x2,y2:el.y2,x3:el.x3,y3:el.y3 };
        vertexSnapState.delete(`${el.id}_tv1`);
        vertexSnapState.delete(`${el.id}_tv2`);
        vertexSnapState.delete(`${el.id}_tv3`);
      } else if (el.type === 'shape' && el.shape === 'parallelogram') {
        const _dx=el.x3-el.x2, _dy=el.y3-el.y2, _Dx=el.x1+_dx, _Dy=el.y1+_dy;
        resizeSnap = { x1:el.x1,y1:el.y1,x2:el.x2,y2:el.y2,x3:el.x3,y3:el.y3,
          m_ab:{x:(el.x1+el.x2)/2,y:(el.y1+el.y2)/2},
          m_bc:{x:(el.x2+el.x3)/2,y:(el.y2+el.y3)/2},
          m_cd:{x:(el.x3+_Dx)/2,  y:(el.y3+_Dy)/2},
          m_da:{x:(_Dx+el.x1)/2,  y:(_Dy+el.y1)/2} };
        const _AB={x:el.x2-el.x1,y:el.y2-el.y1}, _BC={x:el.x3-el.x2,y:el.y3-el.y2};
        const _la2=_AB.x*_AB.x+_AB.y*_AB.y, _lb2=_BC.x*_BC.x+_BC.y*_BC.y;
        paraSnapRect=_la2>0&&_lb2>0&&Math.abs(_AB.x*_BC.x+_AB.y*_BC.y)/Math.sqrt(_la2*_lb2)<0.05;
      } else {
        resizeSnap = el.type === 'stroke'
          ? { ...bb, pts: el.pts.map(p=>({...p})) }
          : el.type === 'shape' ? { x1:el.x1, y1:el.y1, x2:el.x2, y2:el.y2 }
          : el.type === 'text'  ? { x:el.x, y:el.y, w:el.w, h:el.h, fontSize: el.fontSize||18 }
          : { x:el.x, y:el.y, w:el.w, h:el.h };
      }
      return;
    }
    const el = getElemAt(w.x, w.y);
    if (el) {
      if (!e.shiftKey && !selected.has(el.id)) { selected.clear(); lineLockedHandles.clear(); sbLineOrder=0; }
      selected.add(el.id);
      /* CS unified: clicking one axis auto-selects its partner (desktop only; mobile selects single point) */
      if (el.csPartner && !e.touches) { const _csP=all.find(e=>e.id===el.csPartner); if(_csP) selected.add(_csP.id); }
      addToUndo();
      dragging = true; dragOrigin = { x: w.x, y: w.y }; dragMoved = false; snapPositions();
      cv.style.cursor = 'move';
    } else if (selected.size > 0 && !e.shiftKey && isInSelBox(w.x, w.y)) {
      /* Click anywhere inside the selection highlight area starts a drag */
      addToUndo();
      dragging = true; dragOrigin = { x: w.x, y: w.y }; dragMoved = false; snapPositions();
      cv.style.cursor = 'move';
    } else {
      /* Click in CS parallelogram with 2+ graphs → toggle intersection display */
      const _csp = csParallelogramAt(w.x, w.y);
      if (_csp && (_csp.la.csGraphs?.length || 0) >= 2 && !e.shiftKey) {
        const _ck = csKey(_csp.la.id, _csp.lb.id);
        const _curKey = csIntersections ? csKey(csIntersections.la.id, csIntersections.lb.id) : '';
        if (_curKey === _ck) {
          csIntersections = null; updateSelBar(); redraw();
        } else {
          /* Show loading indicator: rAF → browser paints spinner → setTimeout → compute */
          csIntersections = null; csIntersectionsComputing = true;
          updateMathOverlay(); redraw();
          const _snapLa = _csp.la, _snapLb = _csp.lb;
          requestAnimationFrame(() => {
            setTimeout(async () => {
              csIntersections = await computeAllIntersections(_snapLa, _snapLb);
              csIntersectionsComputing = false;
              updateMathOverlay(); redraw();
            }, 0);
          });
        }
        return;
      }
      if (!e.shiftKey) { selected.clear(); lineLockedHandles.clear(); sbLineOrder=0; }
      selBox = { x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    }
    updateSelBar(); redraw(); return;
  }

  /* ── Eraser ── */
  if (tool === 'erase') { addToUndo(); drawing = true; eraseAt(p.x, p.y); return; }

  /* ── Pen ── */
  if (tool === 'pen') {
    addToUndo();
    drawing = true;
    cur = { id: gid(), type: 'stroke', user_id: myId, color: penColor, size: penSize, pts: [w] };
    return;
  }

  /* ── Geometry ── */
  if (tool === 'geo_line' || tool === 'geo_ellipse') {
    addToUndo();
    drawing = true;
    cur = { id: gid(), type: 'shape', user_id: myId,
            shape: tool.replace('geo_',''), color: geoColor, size: geoSize, dash: geoDash,
            arrow: tool === 'geo_line' ? geoArrow : undefined,
            fill: tool === 'geo_ellipse' ? geoFill : undefined,
            fillOpacity: tool === 'geo_ellipse' ? geoFillOpacity : undefined,
            x1: w.x, y1: w.y, x2: w.x, y2: w.y };
    return;
  }
  if (tool === 'geo_triangle') {
    addToUndo(); drawing = true;
    cur = { id: gid(), type: 'shape', user_id: myId,
            shape: 'triangle', color: geoColor, size: geoSize, dash: geoDash,
            fill: geoFill, fillOpacity: geoFillOpacity,
            x1: w.x, y1: w.y, x2: w.x, y2: w.y, x3: w.x, y3: w.y,
            _ax: w.x, _ay: w.y };
    return;
  }
  if (tool === 'geo_parallelogram') {
    addToUndo(); drawing = true;
    cur = { id: gid(), type: 'shape', user_id: myId,
            shape: 'parallelogram', color: geoColor, size: geoSize, dash: geoDash,
            fill: geoFill, fillOpacity: geoFillOpacity,
            x1: w.x, y1: w.y, x2: w.x, y2: w.y, x3: w.x, y3: w.y };
    return;
  }
  if (tool === 'geo_rect' || tool === 'flow_rect') {
    addToUndo(); drawing = true;
    cur = { id: gid(), type: 'shape', user_id: myId,
            shape: 'rect', color: geoColor, size: geoSize, dash: geoDash,
            fill: geoFill, fillOpacity: geoFillOpacity,
            x1: w.x, y1: w.y, x2: w.x, y2: w.y };
    return;
  }
  if (tool === 'flow_diamond' || tool === 'flow_rounded') {
    addToUndo(); drawing = true;
    cur = { id: gid(), type: 'shape', user_id: myId,
            shape: tool === 'flow_diamond' ? 'diamond' : 'rounded',
            color: geoColor, size: geoSize, dash: geoDash,
            fill: geoFill, fillOpacity: geoFillOpacity,
            x1: w.x, y1: w.y, x2: w.x, y2: w.y };
    return;
  }
  if (tool === 'flow_iopara' || tool === 'flow_hexagon' || tool === 'flow_cylinder' ||
      tool === 'flow_document' || tool === 'flow_subprocess') {
    const shapeMap = { flow_iopara:'iopara', flow_hexagon:'hexagon',
                       flow_cylinder:'cylinder', flow_document:'document', flow_subprocess:'subprocess' };
    addToUndo(); drawing = true;
    cur = { id: gid(), type: 'shape', user_id: myId,
            shape: shapeMap[tool],
            color: geoColor, size: geoSize, dash: geoDash,
            fill: geoFill, fillOpacity: geoFillOpacity,
            x1: w.x, y1: w.y, x2: w.x, y2: w.y };
    return;
  }
  /* ── Flow node ── */
  if (tool === 'flow_node') {
    addToUndo();
    const el={id:gid(),type:'shape',user_id:myId,shape:'node',
              color:geoColor,size:geoSize,fill:geoFill,fillOpacity:geoFillOpacity,
              x1:w.x-12,y1:w.y-12,x2:w.x+12,y2:w.y+12};
    all.push(el); wsSend({type:'stroke',data:el});
    selected.clear(); selected.add(el.id);
    setTool('select'); updateSelBar(); redraw(); return;
  }
  /* ── Flow connector ── */
  if (tool === 'flow_connector') {
    /* Find nearest anchor among all connectable shapes */
    let bestEl=null, bestIdx=-1, bestDist=Infinity;
    const snapR = 18 / vz;
    for (const el of all) {
      if (el.type!=='shape'||!FLOW_SHAPES.has(el.shape)) continue;
      const anchors = getFlowAnchors(el);
      anchors.forEach((a,i)=>{
        const d=Math.hypot(w.x-a.x, w.y-a.y);
        if(d<snapR&&d<bestDist){bestDist=d;bestEl=el;bestIdx=i;}
      });
    }
    if (!bestEl) { connStart=null; connPreview=null; redraw(); return; }
    if (!connStart) {
      connStart={elemId:bestEl.id, anchorIdx:bestIdx};
      drawing=true;
    } else {
      /* Complete connector */
      if (bestEl.id!==connStart.elemId||bestIdx!==connStart.anchorIdx) {
        addToUndo();
        const conn={id:gid(),type:'shape',shape:'connector',user_id:myId,
                    from:{...connStart},to:{elemId:bestEl.id,anchorIdx:bestIdx},
                    routing:connRouting, color:geoColor, size:geoSize, arrow:'end'};
        all.push(conn); wsSend({type:'stroke',data:conn});
      }
      connStart=null; drawing=false; connPreview=null;
    }
    redraw(); return;
  }

  /* ── Code ── */
  if (tool === 'code') {
    addToUndo();
    const el = { id: gid(), type: 'code', user_id: myId, x: w.x - 200, y: w.y - 130, w: 400, h: 260, code: '# Python\nprint("Hello, HBM!")', output: '', outputErr: false };
    all.push(el);
    wsSend({ type: 'stroke', data: el });
    selected.clear(); selected.add(el.id);
    setTool('select');
    return;
  }

  /* ── Text ── */
  if (tool === 'text') {
    const existing = getElemAt(w.x, w.y);
    if (existing && existing.type === 'text') { openTextEditor(existing, false); return; }
    /* drag-to-define: start a temporary outline box */
    drawing = true;
    cur = { id: gid(), type: 'text', user_id: myId,
            x: w.x, y: w.y, w: 10, h: 10, text: '',
            color: textColor, fontSize: textFontSize, font: textFont,
            bold: textBold, italic: textItalic, underline: textUnderline,
            _drag: true };
  }
}

function onMove(e) {
  e.preventDefault();
  const isTouch = !!(e.touches || e.changedTouches);
  /* If mouse button was released outside canvas, clean up stale drag/rotate/pan state */
  if (!isTouch && !(e.buttons & 1) && (dragging || rotating || resizing)) {
    if (dragging)  { dragging  = false; dragOrigin  = null; if (dragMoved)   commitDrag();   dragMoved   = false; }
    if (rotating)  { rotating  = false; rotateCenter= null; rotateMoved = false; rotateEl = null; }
    if (resizing)  { resizing  = false; resizeEl = null; resizeHandle = null; resizeSnap = null; }
    cv.style.cursor = 'default'; redraw(); return;
  }
  if (!isTouch && !(e.buttons & 2) && panning) { panning = false; panSt = null; resetCursor(); }
  const p = gp(e), w = tw(p.x, p.y);
  if (_connEndDrag) _connEndDragLastW = w;
  if (tool === 'pen' || tool === 'erase') { cursorPos = p; if (!drawing && !panning) { redraw(); return; } }

  // Send cursor position (throttled, every 50ms)
  const now = Date.now();
  if (now - lastCursorSend > 50) {
    lastCursorSend = now;
    wsSend({ type: 'cursor', x: w.x, y: w.y });
  }

  if (panning && panSt) {
    vx += p.x - panSt.x; vy += p.y - panSt.y; panSt = p;
    // Send view when panning (throttled)
    if (now - lastViewSend > 100) { lastViewSend = now; wsSend({ type: 'view', vx, vy, vz }); }
    redraw(); return;
  }

  if (tool === 'select') {
    /* Connector endpoint drag */
    if (_connEndDrag) {
      connPreview={x:w.x,y:w.y};
      cv.style.cursor='crosshair'; redraw(); return;
    }
    /* Connector segment drag — move segment perpendicular to its direction */
    if (_connSegDrag) {
      const {conn,segIdx,isH}=_connSegDrag;
      if (isH) {
        conn.pts[segIdx].y=w.y; conn.pts[segIdx+1].y=w.y;
      } else {
        conn.pts[segIdx].x=w.x; conn.pts[segIdx+1].x=w.x;
      }
      cv.style.cursor=isH?'ns-resize':'ew-resize'; redraw(); return;
    }
    if (rotating && rotateEl && rotateCenter) {
      const angle = Math.atan2(p.y - rotateCenter.y, p.x - rotateCenter.x);
      rotateEl.rotation = angle - rotateStartAngle;
      rotateMoved = true;
      cv.style.cursor = 'grabbing'; redraw(); return;
    }
    if (resizing) {
      if (resizeEl.type==='shape' && resizeEl.shape==='line') { applyResizeLine(w.x,w.y); }
      else { const lp=localPoint(w.x,w.y,resizeEl); applyResize(lp.x,lp.y); }
      redraw(); return;
    }
    if (dragging && dragOrigin) { applyDrag(w.x - dragOrigin.x, w.y - dragOrigin.y); redraw(); return; }
    if (selBox) { selBox.x2 = p.x; selBox.y2 = p.y; redraw(); return; }
    /* update cursor for handle hover */
    const _chHov = _getConnHandle(w.x, w.y);
    if (_chHov) {
      if (_chHov.type==='endpoint') { cv.style.cursor='crosshair'; }
      else if (_chHov.draggable) {
        const a=_chHov.pts[_chHov.segIdx],b=_chHov.pts[_chHov.segIdx+1];
        cv.style.cursor=Math.abs(a.y-b.y)<0.5?'ns-resize':'ew-resize';
      } else {
        cv.style.cursor='pointer';
      }
      redraw(); return;
    }
    const rh = getResizeHandle(w.x, w.y);
    if (rh) {
      const RC = {tl:'nwse-resize',t:'ns-resize',tr:'nesw-resize',r:'ew-resize',
                  br:'nwse-resize',b:'ns-resize',bl:'nesw-resize',l:'ew-resize',
                  p1:'crosshair',p2:'crosshair',pm:'move',
                  tv1:'move',tv2:'move',tv3:'move',
                  t_mid:'ns-resize',b_mid:'ns-resize',l_mid:'ew-resize',r_mid:'ew-resize'};
      const isLkd = rh.el.type==='shape' && rh.el.shape==='line' && lineLockedHandles.has(rh.handle);
      cv.style.cursor = isLkd ? 'pointer' : (RC[rh.handle] || 'default');
    } else {
      const hovEl = getElemAt(w.x, w.y);
      cv.style.cursor = (hovEl || (selected.size > 0 && isInSelBox(w.x, w.y))) ? 'move' : 'default';
    }
    updateCSHoverAxis(w.x, w.y);
    updateCSGraphHover(w.x, w.y);
    return;
  }

  /* track which CS axis mouse is near (for scroll-on-tick) */
  updateCSHoverAxis(w.x, w.y);
  updateCSGraphHover(w.x, w.y);

  if (!drawing) return;
  if (tool === 'erase') { eraseAt(p.x, p.y); redraw(); return; }
  if (tool === 'text' && cur?._drag) {
    cur.w = Math.max(30, w.x - cur.x); cur.h = Math.max(20, w.y - cur.y); redraw(); return;
  }
  if (tool === 'pen' && cur) {
    if (e.shiftKey) {
      cur.pts = [cur.pts[0], w]; // Shift: прямая линия — только начало + текущая точка
    } else {
      cur.pts.push(w);
    }
    redraw(); return;
  }
  if ((tool === 'geo_line' || tool === 'geo_ellipse') && cur) {
    cur.x2 = w.x; cur.y2 = w.y;
    if (e.shiftKey) {
      const dx = cur.x2 - cur.x1, dy = cur.y2 - cur.y1;
      if (tool === 'geo_line') {
        const len = Math.hypot(dx, dy);
        if (len > 0) {
          const snapped = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
          cur.x2 = cur.x1 + Math.cos(snapped) * len;
          cur.y2 = cur.y1 + Math.sin(snapped) * len;
        }
      } else {
        const sz = Math.max(Math.abs(dx), Math.abs(dy));
        cur.x2 = cur.x1 + Math.sign(dx) * sz;
        cur.y2 = cur.y1 + Math.sign(dy) * sz;
      }
    }
    redraw();
  }
  if (tool === 'geo_triangle' && cur) {
    const ax = cur._ax, ay = cur._ay;
    const base_y = Math.max(w.y, ay);
    const apex_y = Math.min(w.y, ay);
    cur.x1 = ax; cur.y1 = base_y;
    cur.x2 = w.x; cur.y2 = base_y;
    cur.x3 = (ax + w.x) / 2; cur.y3 = apex_y;
    if (e.shiftKey) {
      /* Shift = equilateral */
      const base = Math.abs(cur.x2 - cur.x1);
      cur.y3 = base_y - base * Math.sqrt(3) / 2;
    }
    redraw();
  }
  if (tool === 'geo_parallelogram' && cur) {
    const shear = e.shiftKey ? 0 : (w.x - cur.x1) * 0.25;
    cur.x2 = w.x; cur.y2 = cur.y1;        // B: same y as A (horizontal base)
    cur.x3 = w.x + shear; cur.y3 = w.y;   // C: mouse + shear
    redraw();
  }
  /* rect / diamond / rounded / new flow shapes — same drag logic: x2,y2 = mouse; Shift = square */
  if ((tool==='geo_rect'||tool==='flow_rect'||tool==='flow_diamond'||tool==='flow_rounded'||
       tool==='flow_iopara'||tool==='flow_hexagon'||tool==='flow_cylinder'||
       tool==='flow_document'||tool==='flow_subprocess') && cur) {
    cur.x2=w.x; cur.y2=w.y;
    if (e.shiftKey) {
      const dx=cur.x2-cur.x1, dy=cur.y2-cur.y1;
      const sz=Math.max(Math.abs(dx),Math.abs(dy));
      cur.x2=cur.x1+Math.sign(dx)*sz; cur.y2=cur.y1+Math.sign(dy)*sz;
    }
    redraw();
  }
  /* connector tool: hover detection + preview line */
  if (tool==='flow_connector') {
    connPreview=w;
    fcHoverElem=null;
    const margin=24/vz;
    for(const el of all){
      if(el.type!=='shape'||!FLOW_SHAPES.has(el.shape))continue;
      const bb=elemBBox(el);if(!bb)continue;
      if(w.x>=bb.x-margin&&w.x<=bb.x+bb.w+margin&&w.y>=bb.y-margin&&w.y<=bb.y+bb.h+margin){
        fcHoverElem=el; break;
      }
    }
    redraw();
  }
}

function onUp(e) {
  if (panning) {
    panning = false; panSt = null;
    resetCursor(); return;
  }

  if (tool === 'select') {
    /* Connector endpoint drag commit */
    if (_connEndDrag) {
      const {conn,which}=_connEndDrag;
      _connEndDrag=null; connPreview=null;
      /* Snap to nearest anchor */
      const snapR=20/vz;
      let bestEl=null,bestIdx=-1,bestDist=Infinity;
      const wx2=_connEndDragLastW?.x??0, wy2=_connEndDragLastW?.y??0;
      for(const el of all){
        if(el.type!=='shape'||!FLOW_SHAPES.has(el.shape)) continue;
        getFlowAnchors(el).forEach((a,i)=>{
          const d=Math.hypot(wx2-a.x,wy2-a.y);
          if(d<snapR&&d<bestDist){bestDist=d;bestEl=el;bestIdx=i;}
        });
      }
      if(bestEl){
        conn[which]={elemId:bestEl.id,anchorIdx:bestIdx};
        conn.pts=null; // reset custom path, will be re-routed
        wsSend({type:'erase_stroke',id:conn.id});
        setTimeout(()=>wsSend({type:'stroke',data:conn}),40);
      } else {
        undoStack.pop(); // no valid target, cancel
      }
      cv.style.cursor='default'; redraw(); return;
    }
    /* Connector segment drag commit */
    if (_connSegDrag) {
      const conn=_connSegDrag.conn;
      _connSegDrag=null;
      wsSend({type:'erase_stroke',id:conn.id});
      setTimeout(()=>wsSend({type:'stroke',data:conn}),40);
      cv.style.cursor='default'; redraw(); return;
    }
    if (rotating) {
      rotating = false;
      if (rotateEl && rotateMoved) {
        const _rotEl = rotateEl;
        wsSend({ type: 'erase_stroke', id: _rotEl.id });
        setTimeout(() => wsSend({ type: 'stroke', data: _rotEl }), 40);
      } else {
        undoStack.pop(); // no actual rotation — discard snapshot
      }
      rotateEl = null; rotateCenter = null;
      cv.style.cursor = 'default'; redraw(); return;
    }
    if (resizing) {
      resizing = false;
      const _resEl = resizeEl, _s = resizeSnap, _h = resizeHandle;
      /* Line: check if element actually changed (click = toggle lock, drag = commit) */
      const unchanged = _resEl.type === 'shape'
        ? (_resEl.x1 === _s.x1 && _resEl.y1 === _s.y1 && _resEl.x2 === _s.x2 && _resEl.y2 === _s.y2)
        : false;
      if (_resEl.type === 'shape' && _resEl.shape === 'line' && unchanged) {
        undoStack.pop(); // click = toggle lock, not a real resize
        lineLockedHandles.has(_h) ? lineLockedHandles.delete(_h) : lineLockedHandles.add(_h);
      } else {
        /* After resize: snap height to content (l/r-only); b/t keeps user-set height */
        if (_resEl.type === 'text') {
          if (!_h.includes('b') && !_h.includes('t')) autoFitTextHeight(_resEl);
          updateSelBar();
        }
        /* code widgets: update-in-place so DOM overlay is preserved */
        if (_resEl.type === 'code') { wsSend({ type: 'stroke_update', data: { ..._resEl } }); }
        else {
          wsSend({ type: 'erase_stroke', id: _resEl.id });
          setTimeout(() => wsSend({ type: 'stroke', data: _resEl }), 40);
        }
        /* Refresh CS panel if a CS axis endpoint was dragged */
        if (_resEl.csPartner) {
          const _csPartner = all.find(e => e.id === _resEl.csPartner);
          if (_csPartner) setTimeout(() => updateCSPanels(_resEl, _csPartner), 60);
        }
      }
      resizeEl = null; resizeHandle = null; resizeSnap = null;
      paraSnapRect = false;
      cv.style.cursor = 'default'; redraw(); return;
    }
    if (dragging) {
      dragging = false; dragOrigin = null;
      if (dragMoved) commitDrag();
      else undoStack.pop(); // no movement — discard snapshot
      cv.style.cursor = 'default';
    }
    if (selBox) {
      const found = elemsInRect(selBox.x1, selBox.y1, selBox.x2, selBox.y2);
      if (!e?.shiftKey) selected.clear();
      found.forEach(el => selected.add(el.id));
      /* CS unified: rubber-band selection also adds CS partners */
      found.forEach(el => { if (el.csPartner) { const p=all.find(e=>e.id===el.csPartner); if(p) selected.add(p.id); } });
      selBox = null; updateSelBar();
    }
    redraw(); return;
  }

  if (!drawing) return; drawing = false;

  /* ── Text drag finalize ── */
  if (tool === 'text' && cur?._drag) {
    addToUndo(); // snapshot before adding text element
    delete cur._drag;
    const wasDragged = cur.w >= 40;
    if (cur.w < 40) cur.w = textBoxW;
    if (cur.h < 30) cur.h = 60;
    if (wasDragged) cur._wLocked = true; // lock width to dragged box → editor matches board
    all.push(cur);
    openTextEditor(cur, true);
    cur = null; return;
  }

  if (tool === 'pen' && cur && cur.pts.length >= 2) {
    all.push(cur); wsSend({ type: 'stroke', data: cur });
  }
  if ((tool === 'geo_line' || tool === 'geo_ellipse') && cur) {
    if (Math.abs(cur.x2 - cur.x1) > 1 || Math.abs(cur.y2 - cur.y1) > 1) {
      all.push(cur); wsSend({ type: 'stroke', data: cur });
    }
  }
  if (tool === 'geo_triangle' && cur) {
    delete cur._ax; delete cur._ay;
    const dx = cur.x2 - cur.x1, dy = cur.y2 - cur.y1;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
      all.push(cur); wsSend({ type: 'stroke', data: cur });
    }
  }
  if (tool === 'geo_parallelogram' && cur) {
    if (Math.hypot(cur.x3 - cur.x1, cur.y3 - cur.y1) > 4) {
      all.push(cur); wsSend({ type: 'stroke', data: cur });
    }
  }
  if ((tool==='geo_rect'||tool==='flow_rect'||tool==='flow_diamond'||tool==='flow_rounded'||
       tool==='flow_iopara'||tool==='flow_hexagon'||tool==='flow_cylinder'||
       tool==='flow_document'||tool==='flow_subprocess') && cur) {
    if (Math.abs(cur.x2-cur.x1)>2||Math.abs(cur.y2-cur.y1)>2) {
      all.push(cur); wsSend({type:'stroke',data:cur});
    }
  }
  cur = null; redraw();
}

function eraseAt(sx, sy) {
  const w = tw(sx, sy);
  const r = (penSize + 6) / vz;
  for (let i = all.length - 1; i >= 0; i--) {
    const el = all[i];
    if (el.type === 'image') continue;  // ластик не стирает картинки
    let hit = hitTest(el, w.x, w.y, true);
    /* Also test strokes with eraser-brush radius (segment distance) */
    if (!hit && el.type === 'stroke' && el.pts) {
      const _ep = el.pts.filter(p => p.x != null && isFinite(p.x));
      for (let _i = 0; _i < _ep.length && !hit; _i++) {
        if (Math.hypot(_ep[_i].x-w.x, _ep[_i].y-w.y) < r) { hit=true; break; }
        if (_i < _ep.length-1) {
          const _ax=_ep[_i].x,_ay=_ep[_i].y,_bx=_ep[_i+1].x,_by=_ep[_i+1].y;
          const _dx=_bx-_ax,_dy=_by-_ay,_l2=_dx*_dx+_dy*_dy;
          if (_l2>0) {
            const _t=Math.max(0,Math.min(1,((w.x-_ax)*_dx+(w.y-_ay)*_dy)/_l2));
            if (Math.hypot(w.x-_ax-_t*_dx,w.y-_ay-_t*_dy)<r) hit=true;
          }
        }
      }
    }
    if (hit) {
      /* If this is a CS axis, orphan the partner so it renders as plain line */
      if (el.csPartner) {
        const _p = all.find(e => e.id === el.csPartner);
        if (_p) { _p.csPartner=null; _p.csScale=null; _p.csTickStep=null; wsSend({type:'stroke_update',data:{..._p}}); }
      }
      wsSend({ type: 'erase_stroke', id: el.id }); all.splice(i, 1); return;
    }
  }
}

cv.addEventListener('mousedown',  onDown);
cv.addEventListener('mousemove',  onMove);
cv.addEventListener('mouseup',    onUp);
cv.addEventListener('mouseleave', e => { cursorPos = null; redraw(); });
/* Catch mouse-up outside canvas so dragging/panning state doesn't go stale */
document.addEventListener('mouseup', e => {
  if (dragging || panning || resizing || rotating) onUp(e);
});
cv.addEventListener('contextmenu', e => e.preventDefault());
/* Double-click: select CS parallelogram, or open text editor */
cv.addEventListener('dblclick', e => {
  if (tool !== 'select') return;
  const p = gp(e), w = tw(p.x, p.y);
  /* Check CS parallelogram hit first — select both CS axes */
  const csPair = csParallelogramAt(w.x, w.y);
  if (csPair) {
    e.preventDefault();
    selected.clear(); lineLockedHandles.clear(); sbLineOrder = 0;
    selected.add(csPair.la.id); selected.add(csPair.lb.id);
    updateSelBar(); redraw(); return;
  }
  /* Double-click on connector segment midpoint → insert 2 knees at that point */
  for(const connEl of all){
    if(!selected.has(connEl.id)) continue;
    if(connEl.type!=='shape'||connEl.shape!=='connector') continue;
    const cpts=resolveConnector(connEl); if(!cpts||cpts.length<2) continue;
    for(let i=0;i<cpts.length-1;i++){
      const mx=(cpts[i].x+cpts[i+1].x)/2, my=(cpts[i].y+cpts[i+1].y)/2;
      if(Math.hypot(w.x-mx,w.y-my)<12/vz){
        e.preventDefault(); addToUndo();
        if(!connEl.pts) connEl.pts=cpts.map(p=>({...p}));
        connEl.pts.splice(i+1,0,{x:mx,y:my},{x:mx,y:my});
        wsSend({type:'erase_stroke',id:connEl.id});
        setTimeout(()=>wsSend({type:'stroke',data:connEl}),40);
        redraw(); return;
      }
    }
  }
  const el = getElemAt(w.x, w.y);
  if (el && el.type === 'text') { e.preventDefault(); addToUndo(); openTextEditor(el, false); return; }
  if (el && el.type === 'docfile') { e.preventDefault(); window.open(el.url, '_blank'); return; }
  if (el && el.type === 'shape' && FLOW_SHAPES.has(el.shape)) {
    e.preventDefault(); addToUndo(); openLabelEditor(el);
  }
});

/* ─── Touch (mobile) ─── */
let _touchStartTime = 0, _touchStartPos = null;
let _pinchDist = null;
let _selMode = false; // tap activates selection mode; next drag = rubber-band / element move

function _getTouchDist(t) {
  return Math.hypot(t[1].clientX - t[0].clientX, t[1].clientY - t[0].clientY);
}
function _getTouchMid(t) {
  const r = cv.getBoundingClientRect();
  return { x: (t[0].clientX + t[1].clientX) / 2 - r.left,
           y: (t[0].clientY + t[1].clientY) / 2 - r.top };
}

cv.addEventListener('touchstart', e => {
  e.preventDefault();
  commitTextEdit();

  if (e.touches.length >= 2) {
    /* Pinch-to-zoom — cancel any ongoing action */
    drawing = false; cur = null; panning = false; panSt = null;
    _pinchDist = _getTouchDist(e.touches);
    return;
  }

  const p = gp(e);
  _touchStartTime = Date.now();
  _touchStartPos  = { x: p.x, y: p.y };

  if (tool === 'select') {
    if (_selMode) {
      /* Selection mode: route to standard mouse handler (rubber-band or drag) */
      onDown({ button: 0, clientX: e.touches[0].clientX, clientY: e.touches[0].clientY,
               shiftKey: false, touches: e.touches, preventDefault: () => {} });
    } else {
      /* Default: pan */
      panning = true; panSt = p;
    }
  } else {
    /* Drawing tools */
    onDown({ button: 0, clientX: e.touches[0].clientX, clientY: e.touches[0].clientY,
             shiftKey: false, touches: e.touches, preventDefault: () => {} });
  }
}, { passive: false });

cv.addEventListener('touchmove', e => {
  e.preventDefault();

  if (e.touches.length >= 2 && _pinchDist !== null) {
    /* Pinch-to-zoom */
    const newDist = _getTouchDist(e.touches);
    const mid     = _getTouchMid(e.touches);
    const ratio   = newDist / _pinchDist;
    const nz = Math.max(0.05, Math.min(20, vz * ratio));
    if (followTarget) stopFollow();   // exit follow mode on manual pinch-zoom
    vx = mid.x - (mid.x - vx) * nz / vz;
    vy = mid.y - (mid.y - vy) * nz / vz;
    vz = nz; _pinchDist = newDist;
    const _now = Date.now();
    if (_now - lastViewSend > 150) { lastViewSend = _now; wsSend({ type: 'view', vx, vy, vz }); }
    redraw(); return;
  }

  if (e.touches.length !== 1) return;

  if (tool === 'select' && panning && panSt) {
    /* Pan */
    const p = gp(e);
    vx += p.x - panSt.x; vy += p.y - panSt.y; panSt = p;
    const _now = Date.now();
    if (_now - lastViewSend > 100) { lastViewSend = _now; wsSend({ type: 'view', vx, vy, vz }); }
    redraw();
  } else {
    /* Drawing OR selection-mode drag/rubber-band */
    onMove(e);
  }
}, { passive: false });

cv.addEventListener('touchend', e => {
  e.preventDefault();
  _pinchDist = null;
  if (e.touches.length > 0) return;

  if (tool === 'select') {
    if (panning) {
      /* Was panning — check if it was actually a tap (no movement) */
      panning = false; panSt = null;
      const p = gp(e);
      const tapDist = _touchStartPos ? Math.hypot(p.x - _touchStartPos.x, p.y - _touchStartPos.y) : 999;
      const tapDur  = Date.now() - _touchStartTime;
      if (tapDist < 14 && tapDur < 300) {
        /* Tap: toggle selection mode */
        _selMode = !_selMode;
        /* Visual hint: brief highlight on canvas edge */
        if (_selMode) cv.style.outline = '2px solid var(--accent)';
        else { cv.style.outline = ''; selected.clear(); lineLockedHandles.clear(); sbLineOrder = 0; updateSelBar(); redraw(); }
      }
    } else {
      /* Was in selection mode (rubber-band or drag) — finish and exit selection mode */
      _selMode = false;
      cv.style.outline = '';
      onUp(e);
    }
  } else {
    onUp(e);
  }
});

/* ─── CS axis near-mouse detection (for scroll-on-tick) ─── */
let csHoverAxis = null;  // {el} of CS axis closest to mouse, or null
function updateCSHoverAxis(wx, wy) {
  const DIST_THRESH = 18 / vz;  // world units
  let best = null, bestD = DIST_THRESH;
  const seen = new Set();
  for (const el of all) {
    if (!el.csPartner) continue;
    const key = el.id < el.csPartner ? el.id+':'+el.csPartner : el.csPartner+':'+el.id;
    if (seen.has(key)) continue; seen.add(key);
    // project mouse onto this line segment
    const vp = getVisualPts(el);
    const dx=vp.p2.x-vp.p1.x, dy=vp.p2.y-vp.p1.y;
    const len2=dx*dx+dy*dy; if(len2<1e-9) continue;
    const t=Math.max(0,Math.min(1,((wx-vp.p1.x)*dx+(wy-vp.p1.y)*dy)/len2));
    const px=vp.p1.x+t*dx-wx, py=vp.p1.y+t*dy-wy;
    const d=Math.hypot(px,py);
    if(d<bestD){ bestD=d; best=el; }
    // also check partner
    const partner=all.find(e=>e.id===el.csPartner); if(!partner) continue;
    const vp2=getVisualPts(partner);
    const dx2=vp2.p2.x-vp2.p1.x, dy2=vp2.p2.y-vp2.p1.y;
    const len22=dx2*dx2+dy2*dy2; if(len22<1e-9) continue;
    const t2=Math.max(0,Math.min(1,((wx-vp2.p1.x)*dx2+(wy-vp2.p1.y)*dy2)/len22));
    const px2=vp2.p1.x+t2*dx2-wx, py2=vp2.p1.y+t2*dy2-wy;
    const d2=Math.hypot(px2,py2);
    if(d2<bestD){ bestD=d2; best=partner; }
  }
  csHoverAxis=best;
}

/* Snap tick step to a nice value: 0.1,0.2,0.5,1,2,5,10,20,50… */
function snapTickStep(v, up) {
  const NICE=[0.1,0.2,0.25,0.5,1,2,5,10,20,50,100];
  if (up) {
    for(const n of NICE) if(n>v+1e-9) return n;
    return v*2;
  } else {
    for(let i=NICE.length-1;i>=0;i--) if(NICE[i]<v-1e-9) return NICE[i];
    return Math.max(0.01, v/2);
  }
}

/* Snap CS range to a nice value: 0.5,1,2,5,10,20,50,100,200,500,1000…
   up=true → more units visible (zoom out), up=false → fewer (zoom in) */
function snapRange(v, up) {
  const NICE=[0.5,1,2,5,10,20,50,100,200,500,1000,2000,5000];
  if (up) {
    for(const n of NICE) if(n>v+1e-9) return n;
    return v*2;
  } else {
    for(let i=NICE.length-1;i>=0;i--) if(NICE[i]<v-1e-9) return NICE[i];
    return Math.max(0.1, v/2);
  }
}

/* Wheel = zoom, OR adjust CS range (density) when hovering a CS axis */
cv.addEventListener('wheel', e => {
  e.preventDefault();
  /* CS wheel zoom ОТКЛЮЧЁН — случайный скролл ломает общий график.
     Масштаб осей меняется только в панели настроек графика. */
  if (followTarget) stopFollow();
  const p=gp(e), d=e.deltaY>0?0.9:1.1;
  const nz=Math.max(0.05,Math.min(20,vz*d));
  vx=p.x-(p.x-vx)*nz/vz; vy=p.y-(p.y-vy)*nz/vz; vz=nz; redraw();
  const nowW=Date.now(); if(nowW-lastViewSend>150){lastViewSend=nowW;wsSend({type:'view',vx,vy,vz});}
}, { passive: false });

// ══════════════════════════════════════════════════════════
// §16  KEYBOARD
// ══════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target === ted) return;
  // Ctrl+Z/Redo pass through even when a board UI input has focus
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') {
    if (e.shiftKey && e.altKey) { e.preventDefault(); doRedo(true,false); return; }
    if (e.shiftKey)             { e.preventDefault(); doRedo(true,true);  return; }
    if (e.altKey)               { e.preventDefault(); doUndo(true,false); return; }
    e.preventDefault(); doUndo(true,true); return;
  }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.code === 'Space') { e.preventDefault(); spDown = true; if (!drawing) cv.style.cursor = 'grab'; return; }

  const k = e.key.toLowerCase();

  /* ESC — выйти из слежки / закрыть пикер / сбросить выделение */
  if (k === 'escape') {
    e.preventDefault();
    if (_openSm) { _closeSm(); return; }
    if (followTarget) { stopFollow(); return; }
    if (geoPicking) { hideGeoPicker(); return; }
    if (flowPicking) { hideFlowPicker(); return; }
    if (tool==='flow_connector'&&connStart) { connStart=null; connPreview=null; redraw(); return; }
    commitTextEdit(); clearSel(); setTool('select'); return;
  }

  /* ── Навигация в геопикере ── */
  if (geoPicking) {
    if (k === 'arrowdown' || k === 'arrowright') { geoPickIdx = (geoPickIdx+1) % GEO_TOOLS.length; updateGeoPickerHighlight(); e.preventDefault(); return; }
    if (k === 'arrowup'   || k === 'arrowleft')  { geoPickIdx = (geoPickIdx+GEO_TOOLS.length-1) % GEO_TOOLS.length; updateGeoPickerHighlight(); e.preventDefault(); return; }
    if (k === 'enter') { setTool(GEO_TOOLS[geoPickIdx]); hideGeoPicker(); e.preventDefault(); return; }
    if (k === 'l' || k === 'д') { geoPickIdx=0; setTool('geo_line');          hideGeoPicker(); e.preventDefault(); return; }
    if (k === 'r' || k === 'к') { geoPickIdx=1; setTool('geo_rect');          hideGeoPicker(); e.preventDefault(); return; }
    if (k === 't' || k === 'е') { geoPickIdx=2; setTool('geo_triangle');      hideGeoPicker(); e.preventDefault(); return; }
    if (k === 'p' || k === 'з') { geoPickIdx=3; setTool('geo_parallelogram'); hideGeoPicker(); e.preventDefault(); return; }
    if (k === 'c' || k === 'с') { geoPickIdx=4; setTool('geo_ellipse');       hideGeoPicker(); e.preventDefault(); return; }
    if (k === 'g' || k === 'п') { hideGeoPicker(); e.preventDefault(); return; }
    e.preventDefault(); return;
  }
  if (flowPicking) {
    if (k === 'arrowdown' || k === 'arrowright') { flowPickIdx = (flowPickIdx+1) % FLOW_TOOLS.length; _updateFlowPickerHighlight(); e.preventDefault(); return; }
    if (k === 'arrowup'   || k === 'arrowleft')  { flowPickIdx = (flowPickIdx+FLOW_TOOLS.length-1) % FLOW_TOOLS.length; _updateFlowPickerHighlight(); e.preventDefault(); return; }
    if (k === 'enter') { setTool(FLOW_TOOLS[flowPickIdx]); hideFlowPicker(); e.preventDefault(); return; }
    if (k === 'r' || k === 'к') { flowPickIdx=0; setTool('flow_rect');      hideFlowPicker(); e.preventDefault(); return; }
    if (k === 'd' || k === 'в') { flowPickIdx=1; setTool('flow_diamond');   hideFlowPicker(); e.preventDefault(); return; }
    if (k === 'o' || k === 'щ') { flowPickIdx=2; setTool('flow_rounded');   hideFlowPicker(); e.preventDefault(); return; }
    if (k === 'c' || k === 'с') { flowPickIdx=3; setTool('flow_connector'); hideFlowPicker(); e.preventDefault(); return; }
    if (k === 'b' || k === 'и') { hideFlowPicker(); e.preventDefault(); return; }
    e.preventDefault(); return;
  }

  /* ── R: отслеживать зажатие для горячих клавиш вращения ──
     Ставим ДО Ctrl-блока чтобы Ctrl+Arrow работало для точного вращения */
  if (k === 'r' || k === 'к') { rKeyDown = true; e.preventDefault(); return; }

  /* ── R + стрелки/AD → вращение выделения ── */
  if (rKeyDown && selected.size >= 1) {
    const isLeft  = k === 'arrowleft'  || k === 'a' || k === 'ф';
    const isRight = k === 'arrowright' || k === 'd' || k === 'в';
    if (isLeft || isRight) {
      e.preventDefault();
      /* Shift=15°, Ctrl=0.5°, иначе 2° */
      const step = e.shiftKey ? 15*Math.PI/180 : e.ctrlKey ? 0.5*Math.PI/180 : 2*Math.PI/180;
      const da   = isLeft ? -step : step;
      if (selected.size === 1) {
        /* Одиночное: вращать на месте */
        const el = all.find(x => x.id === [...selected][0]);
        if (el) {
          el.rotation = (el.rotation || 0) + da;
          wsSend({ type: 'erase_stroke', id: el.id });
          setTimeout(() => wsSend({ type: 'stroke', data: el }), 40);
          redraw();
        }
      } else {
        /* Группа: вращать всё вокруг общего центра bbox */
        let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
        for (const id of selected) {
          const el = all.find(x => x.id === id); if (!el) continue;
          const bb = elemBBox(el); if (!bb) continue;
          minX=Math.min(minX,bb.x); minY=Math.min(minY,bb.y);
          maxX=Math.max(maxX,bb.x+bb.w); maxY=Math.max(maxY,bb.y+bb.h);
        }
        const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
        for (const id of selected) {
          const el = all.find(x => x.id === id); if (!el) continue;
          rotateElementAround(el, cx, cy, da);
          wsSend({ type: 'erase_stroke', id: el.id });
          setTimeout(() => wsSend({ type: 'stroke', data: el }), 40);
        }
        redraw();
      }
      return;
    }
  }

  /* ── Ctrl / Meta комбинации — ПОСЛЕ R-блока чтобы Ctrl+Arrow работал ── */
  if (e.ctrlKey || e.metaKey) {
    if (e.code === 'KeyZ' && e.shiftKey && e.altKey) { e.preventDefault(); doRedo(true,false);  return; }
    if (e.code === 'KeyZ' && e.shiftKey)             { e.preventDefault(); doRedo(true,true);   return; }
    if (e.code === 'KeyZ' && e.altKey)               { e.preventDefault(); doUndo(true,false);  return; }
    if (e.code === 'KeyZ')                           { e.preventDefault(); doUndo(true,true);   return; }
    if (e.code === 'KeyC') { e.preventDefault(); doCopy(); return; }
    if (e.code === 'KeyX') { e.preventDefault(); doCut();  return; }
    /* Ctrl+V: если есть board-clipboard — вставляем его напрямую (не ждём paste-event,
       который может перехватить HTML/image из системного буфера) */
    if (e.code === 'KeyV' && clipboard.length) { e.preventDefault(); doPaste(); return; }
    /* Ctrl+V без board-clipboard: handled by document 'paste' event listener */
    return; // остальные Ctrl+key не пробрасываем как инструменты
  }

  /* ── Инструменты (только без Ctrl/Meta) ── */
  if (k === 'v' || k === 'м')      { setTool('select');    return; }
  if (k === 'p' || k === 'з')      { setTool('pen');       return; }
  if (k === 'e' || k === 'у')      { setTool('erase');     return; }
  if (k === 'i' || k === 'ш')      { openMediaPicker();   return; }
  if (k === 'g' || k === 'п')      { showGeoPicker();     return; }
  if (k === 'b' || k === 'и')      { showFlowPicker();    return; }
  if (k === 't' || k === 'е')      { setTool('text');     return; }
  if (k === 'k' || k === 'л')      { setTool('code');     return; }
  /* Escape cancels connector start */
  if (k === 'escape' && tool==='flow_connector') {
    connStart=null; connPreview=null; redraw(); return;
  }

  /* ── Удалить выделенное ── */
  if ((k === 'delete' || k === 'backspace') && selected.size) {
    addToUndo();
    for (const id of selected) { all = all.filter(el => el.id !== id); wsSend({ type: 'erase_stroke', id }); }
    clearSel(); redraw();
  }
});

document.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    spDown = false;
    if (!panning) resetCursor();
  }
  const k = e.key.toLowerCase();
  if (k === 'r' || k === 'к') rKeyDown = false;
});

// ══════════════════════════════════════════════════════════
// §16b  CODE WIDGETS (inline DOM overlays)
// ══════════════════════════════════════════════════════════

function createCodeWidget(el) {
  const div = document.createElement('div');
  div.className = 'cwo';
  div.dataset.id = el.id;
  const cwLang = el.lang || 'python';
  div.innerHTML =
    '<div class="cwo-hdr">' +
    '<select class="cwo-lang"><option value="python"' + (cwLang==='python'?' selected':'') + '>🐍 Python</option>' +
    '<option value="javascript"' + (cwLang==='javascript'?' selected':'') + '>🟨 JS</option></select>' +
    '<button class="cwo-run">▶ Запустить</button></div>' +
    '<div class="cwo-ta"></div>' +
    '<div class="cwo-out-hdr">OUTPUT</div>' +
    '<div class="cwo-out"></div>' +
    '<div class="cwo-rh n"></div><div class="cwo-rh ne"></div>' +
    '<div class="cwo-rh e"></div><div class="cwo-rh se"></div>' +
    '<div class="cwo-rh s"></div><div class="cwo-rh sw"></div>' +
    '<div class="cwo-rh w"></div><div class="cwo-rh nw"></div>';

  const out = div.querySelector('.cwo-out');
  const btn = div.querySelector('.cwo-run');
  const hdr = div.querySelector('.cwo-hdr');
  const cmEl = div.querySelector('.cwo-ta');

  const cwMode = (el.lang||'python')==='javascript' ? {name:'javascript'} : 'python';
  const cm = CodeMirror(cmEl, {
    value: el.code || '',
    mode: cwMode, lineNumbers: true, indentUnit: 4, tabSize: 4,
    indentWithTabs: false, autoCloseBrackets: true, matchBrackets: true, viewportMargin: Infinity,
    extraKeys: { Tab: cm => cm.execCommand('indentMore'), 'Shift-Tab': cm => cm.execCommand('indentLess') }
  });
  codeEditorMap.set(el.id, cm);
  let _cmSt = null;
  cm.on('change', () => {
    el.code = cm.getValue();
    clearTimeout(_cmSt);
    _cmSt = setTimeout(() => wsSend({ type: 'stroke_update', data: { ...el } }), 80);
  });
  const langSel = div.querySelector('.cwo-lang');
  if (langSel) langSel.addEventListener('change', () => {
    el.lang = langSel.value;
    const newMode = el.lang === 'javascript' ? {name:'javascript'} : 'python';
    cm.setOption('mode', newMode);
    wsSend({ type: 'stroke_update', data: { ...el } });
  });

  out.textContent = el.output || '';
  out.className = 'cwo-out' + (el.outputErr ? ' err' : (el.output ? ' ok' : ''));

  /* ── Header drag → move element ── */
  hdr.addEventListener('mousedown', e => {
    if (e.button !== 0 || e.target === btn || e.target === langSel ||
        e.target.tagName === 'SELECT' || e.target.tagName === 'OPTION') return;
    e.preventDefault(); e.stopPropagation();
    selected.clear(); selected.add(el.id);
    updateSelBar(); redraw();
    const sx = e.clientX, sy = e.clientY;
    const getEl = () => all.find(x => x.id === el.id) || el;
    const s0 = { x: getEl().x, y: getEl().y };
    const mv = e2 => { const cur = getEl(); cur.x = s0.x + (e2.clientX - sx) / vz; cur.y = s0.y + (e2.clientY - sy) / vz; updateCodeWidgets(); };
    const up = () => { const cur = getEl(); wsSend({ type: 'stroke_update', data: { ...cur } }); redraw(); document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
  });

  /* ── Resize handles (8 directions) ── */
  div.querySelectorAll('.cwo-rh').forEach(rh => {
    const dir = [...rh.classList].find(c => c !== 'cwo-rh') || 'se';
    rh.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      e.preventDefault(); e.stopPropagation();
      selected.clear(); selected.add(el.id); updateSelBar();
      const sx = e.clientX, sy = e.clientY;
      const getEl = () => all.find(x => x.id === el.id) || el;
      const snap  = () => { const cur = getEl(); return { x:cur.x, y:cur.y, w:cur.w||400, h:cur.h||260 }; };
      const s0 = snap();
      const mv = e2 => {
        const cur = getEl();
        const dx = (e2.clientX - sx) / vz, dy = (e2.clientY - sy) / vz;
        if (dir.includes('e')) cur.w = Math.max(220, s0.w + dx);
        if (dir.includes('s')) cur.h = Math.max(150, s0.h + dy);
        if (dir.includes('w')) { const nw = Math.max(220, s0.w - dx); cur.x = s0.x + (s0.w - nw); cur.w = nw; }
        if (dir.includes('n')) { const nh = Math.max(150, s0.h - dy); cur.y = s0.y + (s0.h - nh); cur.h = nh; }
        updateCodeWidgets();
      };
      const up = () => {
        const cur = getEl();
        wsSend({ type: 'stroke_update', data: { ...cur } });
        redraw();
        document.removeEventListener('mousemove', mv);
        document.removeEventListener('mouseup', up);
      };
      document.addEventListener('mousemove', mv);
      document.addEventListener('mouseup', up);
    });
  });

  /* ── Run button ── */
  btn.addEventListener('click', async () => {
    el.code = cm.getValue();
    btn.disabled = true; btn.textContent = '⏳';
    out.textContent = ''; out.className = 'cwo-out';
    try {
      const tok = localStorage.getItem('token');
      const resp = await fetch('/api/run_code_board', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
        body: JSON.stringify({ code: el.code, lang: el.lang || 'python', stid: SID || '', personal_id: PERSONAL_ID || '' })
      });
      const r = await resp.json();
      const txt = (r.stdout || '') + (r.stderr ? ((r.stdout ? '\n' : '') + r.stderr) : '');
      el.output = txt; el.outputErr = !r.ok;
      out.textContent = txt || '(нет вывода)';
      out.className = 'cwo-out ' + (!r.ok ? 'err' : 'ok');
      wsSend({ type: 'stroke_update', data: { ...el } });
      /* Sync board elements created/deleted/modified by code */
      if (r.new_elements?.length) {
        for (const ne of r.new_elements) { if (!all.find(e=>e.id===ne.id)) all.push(ne); }
      }
      if (r.deleted_ids?.length) {
        for (const did of r.deleted_ids) { const i=all.findIndex(e=>e.id===did); if(i>=0) all.splice(i,1); }
      }
      if (r.updated_elements?.length) {
        for (const ue of r.updated_elements) { const i=all.findIndex(e=>e.id===ue.id); if(i>=0) all[i]=ue; }
      }
      redraw();
    } catch(err) {
      out.textContent = 'Ошибка: ' + err.message;
      out.className = 'cwo-out err';
    } finally {
      btn.disabled = false; btn.textContent = '▶ Запустить';
    }
  });

  /* CM handles Tab, indent, bracket matching and live sync above */

  document.body.appendChild(div);
  return div;
}

function updateCodeWidgets() {
  /* Remove overlays for deleted elements */
  for (const [id, div] of codeOverlayMap) {
    if (!all.find(e => e.id === id)) { div.remove(); codeOverlayMap.delete(id); codeEditorMap.delete(id); }
  }
  /* Add/position overlays for code elements */
  for (const el of all) {
    if (el.type !== 'code') continue;
    let div = codeOverlayMap.get(el.id);
    if (!div) { div = createCodeWidget(el); codeOverlayMap.set(el.id, div); }
    const sp = ts(el.x, el.y);
    const sw = (el.w || 400) * vz, sh = (el.h || 260) * vz;
    div.style.left   = (sp.x + 56) + 'px';
    div.style.top    = (sp.y + 52) + 'px';  /* +52 = topbar height */
    div.style.width  = sw + 'px';
    div.style.height = sh + 'px';
    const newFs = Math.max(9, Math.round(vz * 13)) + 'px';
    if (div.style.fontSize !== newFs) {
      div.style.fontSize = newFs;
      const cm2 = codeEditorMap.get(el.id);
      if (cm2) requestAnimationFrame(() => cm2.refresh());
    }
    div.classList.toggle('sel', selected.has(el.id));
  }
}

// ══════════════════════════════════════════════════════════
// §17  WEBSOCKET
// ══════════════════════════════════════════════════════════
const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
const tok   = localStorage.getItem('token');
let ws = null, rc = 0;
/* Буфер сообщений: накапливает stroke/erase_stroke/stroke_update пока WS не готов */
let _wsBuf = [];
/* При реконнекте сюда переносится _wsBuf — будет реально отправлен и применён
   локально поверх свежего состояния с сервера (см. обработку 'strokes') */
let _pendingReplay = null;

function connect() {
  const wsUrl = IS_PERSONAL
    ? `${proto}//${location.host}/ws/personal-board/${PERSONAL_ID}?token=${tok}`
    : GID
    ? `${proto}//${location.host}/ws/board/group/${GID}?token=${tok}&instance_id=${INSTANCE_ID||''}`
    : `${proto}//${location.host}/ws/board/${SID}?token=${tok}${INSTANCE_ID?'&instance_id='+INSTANCE_ID:''}`;
  ws = new WebSocket(wsUrl);
  ws.onopen  = () => {
    const _s=document.getElementById('status'); _s.style.display='none'; _s.textContent=''; rc = 0;
    /* При реконнекте запрашиваем полное состояние — это решает рассинхрон */
    ws.send(JSON.stringify({ type: 'load' }));
    /* Изменения, накопленные пока связи не было, ещё не сохранены на сервере —
       перенесём их на повторную отправку после получения свежего 'strokes' */
    _pendingReplay = _wsBuf;
    _wsBuf = [];
  };
  ws.onclose = (ev) => {
    if (ev.code === 4001) { localStorage.removeItem('token'); location.href='/login.html'; return; }
    const _s=document.getElementById('status'); _s.style.display='block'; _s.style.color='#f87171'; _s.textContent='⚠ нет связи — переподключение...';
    setTimeout(() => { rc++; if (rc < 60) connect(); }, 1000 * Math.min(rc+1, 5));
  };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if      (m.type === 'hello') {
      myId = m.user_id;
      if (m.online) { m.online.forEach(u => { onlineUsers[u.uid] = u.name; }); updateOnlinePanel(); }
    }
    else if (m.type === 'user_join') {
      if (m.uid && m.uid !== myId) { onlineUsers[m.uid] = m.name; updateOnlinePanel(); scheduleRedraw(); }
    }
    else if (m.type === 'user_leave') {
      delete onlineUsers[m.uid]; delete peerCursors[m.uid];
      if (followTarget === m.uid) { followTarget = null; updateFollowInd(); }
      updateOnlinePanel(); scheduleRedraw();
    }
    else if (m.type === 'cursor') {
      if (m.uid && m.uid !== myId) {
        if (!peerCursors[m.uid]) peerCursors[m.uid] = {};
        peerCursors[m.uid].x = m.x; peerCursors[m.uid].y = m.y;
        peerCursors[m.uid].name = m.name;
        scheduleRedraw();  /* batched — many cursor msgs/sec, max 1 repaint/frame */
      }
    }
    else if (m.type === 'view') {
      if (m.uid && m.uid !== myId) {
        if (!peerCursors[m.uid]) peerCursors[m.uid] = {};
        peerCursors[m.uid].view = { vx: m.vx, vy: m.vy, vz: m.vz };
        /* Follow mode: sync viewport immediately (no rAF delay — must feel instant) */
        if (followTarget === m.uid) { vx = m.vx; vy = m.vy; vz = m.vz; redraw(); }
        /* Non-follow: no redraw needed (stored view is only used on follow activation) */
      }
    }
    else if (m.type === 'strokes') {
      all = m.data || [];
      /* Применяем локальные изменения, накопленные во время разрыва связи,
         поверх свежего состояния — и отправляем их на сервер, чтобы не потерять */
      if (_pendingReplay && _pendingReplay.length) {
        for (const bm of _pendingReplay) {
          if (bm.type === 'stroke') {
            const i = all.findIndex(s => s.id === bm.data.id);
            if (i >= 0) all[i] = bm.data; else all.push(bm.data);
          } else if (bm.type === 'erase_stroke') {
            all = all.filter(s => s.id !== bm.id);
          } else if (bm.type === 'stroke_update') {
            const i = all.findIndex(s => s.id === bm.data.id);
            if (i >= 0) Object.assign(all[i], bm.data); else all.push(bm.data);
          }
          if (ws && ws.readyState === 1) ws.send(JSON.stringify(bm));
        }
        _pendingReplay = null;
      }
      redraw(); /* initial load — immediate */
    }
    else if (m.type === 'stroke')       { const _si=all.findIndex(s=>s.id===m.data.id); if(_si>=0) all[_si]=m.data; else all.push(m.data); scheduleRedraw(); }
    else if (m.type === 'stroke_update') {
      const idx = all.findIndex(s => s.id === m.data.id);
      if (idx >= 0) { Object.assign(all[idx], m.data); } else { all.push(m.data); }
      /* Update code widget DOM immediately (textarea / output text) */
      const cDiv = codeOverlayMap.get(m.data.id);
      if (cDiv) {
        const _cm = codeEditorMap.get(m.data.id);
        const cout = cDiv.querySelector('.cwo-out');
        if (_cm && _cm.getInputField() !== document.activeElement && _cm.getValue() !== (m.data.code||''))
          _cm.setValue(m.data.code || '');
        cout.textContent = m.data.output || '';
        cout.className = 'cwo-out' + (m.data.outputErr ? ' err' : (m.data.output ? ' ok' : ''));
      }
      scheduleRedraw();
    }
    else if (m.type === 'clear')        { all = []; scheduleRedraw(); }
    else if (m.type === 'erase_stroke') { all = all.filter(s => s.id !== m.id); scheduleRedraw(); }
  };
}
connect();

function wsSend(m) {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify(m));
  } else if (m.type === 'stroke' || m.type === 'erase_stroke' || m.type === 'stroke_update') {
    /* Буферизуем важные изменения — при реконнекте они будут сброшены
       (т.к. load запросит актуальное состояние с сервера) */
    _wsBuf.push(m);
  }
  /* Track elements touched by ME (for local undo filtering) */
  if (!_inUndoRedo) {
    if (m.type==='stroke')        _myTouchedIds.add(m.data.id);
    else if (m.type==='erase_stroke') _myTouchedIds.add(m.id);
    else if (m.type==='stroke_update') _myTouchedIds.add(m.data.id);
  }
}
let _inUndoRedo = false;

/* scheduleRedraw: batches WS-triggered redraws — at most one canvas repaint per animation frame.
   Use for incoming WS events. Keep calling redraw() directly for local interactions (pen, drag)
   so local input stays instant. */
let _rdraf = false;
function scheduleRedraw() {
  if (_rdraf) return;
  _rdraf = true;
  requestAnimationFrame(() => { _rdraf = false; redraw(); });
}

/* doUndo is defined in §8d above */
function doClear() {
  if (confirm('Очистить всю доску?')) {
    addToUndo();
    all = []; clearSel(); redraw(); wsSend({ type: 'clear' });
  }
}

/* ── Media: open file picker ── */
function openMediaPicker() { document.getElementById('mediaInput').click(); }

/* ── Document picker & upload ── */
const _DOC_ACCEPT_EXTS = new Set(['pdf','doc','docx','xls','xlsx','ppt','pptx','odt','ods','odp','txt','csv','rtf','zip','7z']);
function openDocPicker() { document.getElementById('docInput').click(); }

async function processDocFile(file, worldPos) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!_DOC_ACCEPT_EXTS.has(ext)) { alert('Тип файла не поддерживается: .' + ext); return; }
  const status = document.getElementById('status');
  if (status) { status.textContent = '⏳ Загрузка…'; status.style.display = 'block'; }
  try {
    const pos = worldPos || tw(W/2, H/2);
    const eid = gid();
    const ex = pos.x - 130, ey = pos.y - 36, ew = 260, eh = 72;
    const fd = new FormData();
    fd.append('file', file);
    if (SID && !IS_PERSONAL) {
      fd.append('stid', SID);
      fd.append('element_id', eid);
      fd.append('el_x', String(ex)); fd.append('el_y', String(ey));
      fd.append('el_w', String(ew)); fd.append('el_h', String(eh));
    }
    const res = await fetch('/api/board/upload-doc', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + localStorage.getItem('token') },
      body: fd
    });
    if (!res.ok) { const err = await res.json().catch(()=>({})); throw new Error(err.detail || res.status); }
    const data = await res.json();
    addToUndo();
    const el = { type:'docfile', id:eid, x:ex, y:ey,
                 w:ew, h:eh, url:data.url, filename:data.filename, filesize:data.filesize, mime:data.mime };
    if (data.saved) {
      /* Сервер атомарно сохранил stroke и отправил broadcast всем по WS.
         Добавляем локально только если WS-broadcast ещё не дошёл. */
      if (!all.find(e => e.id === eid)) all.push(el);
    } else {
      /* Личная доска или fallback — сохраняем через WS как обычно */
      all.push(el);
      wsSend({ type:'stroke', data:el });
    }
    selected.clear(); selected.add(el.id);
    setTool('select'); redraw(); updateSelBar();
  } catch(e) { alert('Ошибка загрузки: ' + e.message); }
  finally { if (status) status.style.display = 'none'; }
}

/* Process an image File/Blob: read as DataURL, create element on board */
function processImageFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const src = ev.target.result;
    const img = new Image();
    img.onload = () => {
      addToUndo();
      let w = img.naturalWidth, h = img.naturalHeight;
      const maxW = 600, maxH = 500;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
      const pos = tw(W / 2, H / 2);
      const el = { type: 'image', id: gid(), x: pos.x - w/2, y: pos.y - h/2, w, h, src };
      imgSrcStore.set(el.id, src);
      imgCache.set(el.id, { img, loaded: true });
      all.push(el);
      wsSend({ type: 'stroke', data: el });
      selected.clear(); selected.add(el.id);
      setTool('select');
      redraw(); updateSelBar();
    };
    img.src = src;
  };
  reader.readAsDataURL(file);
}

/* File input change → process selected image */
document.getElementById('mediaInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) processImageFile(file);
  e.target.value = '';
});

/* File input change → process selected document */
document.getElementById('docInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) processDocFile(file, null);
  e.target.value = '';
});

/* ── Desktop drag-and-drop onto canvas ── */
cv.addEventListener('dragover', e => {
  if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }
});
cv.addEventListener('drop', e => {
  const files = [...(e.dataTransfer.files || [])];
  if (!files.length) return;
  e.preventDefault();
  const p = gp(e), pos = tw(p.x, p.y);
  for (const file of files) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (file.type.startsWith('image/') || ['jpg','jpeg','png','gif','webp','bmp','svg'].includes(ext))
      processImageFile(file);
    else if (_DOC_ACCEPT_EXTS.has(ext))
      processDocFile(file, pos);
  }
});

/* ── Paste event: image from clipboard, rich text, or board elements ── */
document.addEventListener('paste', e => {
  if (e.target === ted) return;
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;

  const items = [...(e.clipboardData?.items || [])];

  /* 1. Office / binary document files — BLOCKED for security (use drag-and-drop or 📎 button) */
  const docItem = items.find(i => i.kind === 'file' && !i.type.startsWith('image/') && !i.type.startsWith('text/'));
  if (docItem) { e.preventDefault(); return; } // silently ignore — no clipboard doc uploads

  /* 2. Image (screenshot, Ctrl+C from image editor) */
  const imgItem = items.find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (imgItem) {
    e.preventDefault();
    const file = imgItem.getAsFile();
    if (file) processImageFile(file);
    return;
  }

  /* 2. HTML (formatted text from Word, browser, etc.) */
  const htmlItem = items.find(i => i.type === 'text/html');
  if (htmlItem) {
    e.preventDefault();
    htmlItem.getAsString(html => {
      addToUndo();
      const pos = tw(W / 2, H / 2);
      const el = { type: 'richtext', id: gid(), x: pos.x - 150, y: pos.y - 60, w: 320, h: 180, html };
      all.push(el);
      wsSend({ type: 'stroke', data: el });
      selected.clear(); selected.add(el.id);
      redraw(); updateSelBar();
    });
    return;
  }

  /* 3. Board elements from clipboard */
  if (clipboard.length) { e.preventDefault(); doPaste(); }
});

/* Draggable text editor */
(function() {
  const tedWrap = document.getElementById('ted-wrap');
  const tedBar  = document.getElementById('ted-bar');
  let tdrag = false, tdx = 0, tdy = 0, tlx = 0, tly = 0;
  tedBar.addEventListener('mousedown', e => {
    e.stopPropagation();
    tdrag = true;
    tdx = e.clientX; tdy = e.clientY;
    tlx = parseInt(tedWrap.style.left) || 0;
    tly = parseInt(tedWrap.style.top)  || 0;
  });
  document.addEventListener('mousemove', e => {
    if (!tdrag) return;
    const nx = tlx + e.clientX - tdx, ny = tly + e.clientY - tdy;
    tedWrap.style.left = nx + 'px'; tedWrap.style.top = ny + 'px';
    /* sync world position of text element */
    if (tedEl) { const wc = tw(nx - 56, ny); tedEl.x = wc.x; tedEl.y = wc.y; redraw(); }
  });
  document.addEventListener('mouseup', () => { tdrag = false; });
})();
