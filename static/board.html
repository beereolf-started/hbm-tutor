  scaledRow.appendChild(normalizeBtn);

  panel.appendChild(scaledRow);

  /* Intersection info */
  const sep1 = document.createElement('div'); sep1.className='cs-sep'; panel.appendChild(sep1);
  if (O) {
    const info = document.createElement('div'); info.className='cs-row'; info.style.fontSize='.78em';
    const lbl=document.createElement('label'); lbl.textContent='Пересечение';
    const val=document.createElement('span');
    val.style.cssText='font-family:monospace;color:var(--fg-dim)';
    val.textContent=`(${O.x.toFixed(0)}, ${O.y.toFixed(0)})`;
    info.append(lbl,val); panel.appendChild(info);
    if (!inView) {
      const w=document.createElement('div');
      w.style.cssText='font-size:.73em;color:#f59e0b';
      w.textContent='⚠ Пересечение вне экрана — график недоступен';
      panel.appendChild(w);
    }
  } else {
    const w=document.createElement('div');
    w.style.cssText='font-size:.73em;color:#ef4444';
    w.textContent='⚠ Прямые параллельны'; panel.appendChild(w);
  }

  /* Graphs section — only if arrows set AND intersection visible */
  if (!hasDir || !inView) return;

  const sep2 = document.createElement('div'); sep2.className='cs-sep'; panel.appendChild(sep2);
  const ghdr = document.createElement('div'); ghdr.className='cs-hdr';
  ghdr.textContent='∫ Графики'; panel.appendChild(ghdr);

  const graphs = la.csGraphs || [];

  /* Existing graph items */
  graphs.forEach((g, i) => {
    /* ── Main row ── */
    const item = document.createElement('div'); item.className='csg-item';

    const dot = document.createElement('div'); dot.className='csg-dot';
    dot.style.background = g.color||'#ef4444'; dot.title='Сменить цвет';
    const cpk = document.createElement('input'); cpk.type='color'; cpk.value=g.color||'#ef4444';
    cpk.style.cssText='position:absolute;width:0;height:0;opacity:0';
    dot.appendChild(cpk);
    dot.onclick=()=>cpk.click();
    const gIdx = i; // capture index for live-lookup
    const liveG = () => { const _la=getLa(); return (_la.csGraphs && _la.csGraphs[gIdx]) || g; };
    cpk.oninput=()=>{ const lg=liveG(); lg.color=g.color=cpk.value; dot.style.background=lg.color; redraw(); };
    cpk.onchange=()=>{ const _la=getLa(); wsSend({type:'stroke_update',data:{..._la}}); };

    const eq=document.createElement('span'); eq.className='csg-eq';
    eq.title='Нажмите для редактирования';
    function _renderEq(eqEl, eqStr, graph) {
      if (graph && graph.resolving) { eqEl.textContent = '⏳ ' + eqStr; return; }
      let latexStr = _eqToLatex(eqStr);
      if (graph && graph.resultLatex) latexStr += ' = ' + graph.resultLatex;
      else if (graph && graph.calcError) latexStr += '\\ \\color{\\#ef4444}{!}';
      if (typeof katex !== 'undefined') {

        catch(e) {}
      }
      eqEl.textContent = eqStr + (graph?.resultLatex ? ' = …' : '');
    }
    _renderEq(eq, g.eq, g);
    eq.onclick=()=>{

      const nw=prompt('Уравнение:',curEq);
      if (nw!==null && nw.trim()) {
        const lg=liveG(); const p=parseEqn(nw.trim());
        lg.eq=g.eq=nw.trim(); if(p){ lg.mode=g.mode=p.mode; }
        lg.resolvedEq=g.resolvedEq=null; lg.resultLatex=g.resultLatex=null; lg.calcError=g.calcError=null;
        _renderEq(eq, lg.eq, lg);

        if(_hasCalcOp(nw.trim())){

      btn.textContent=label; btn.title=`Стиль: ${val}`;
      if ((g.dash||'solid')===val) btn.classList.add('act');
      btn.onclick=()=>{

        const _la=getLa(),_lb=getLb();

        updateCSPanels(_la,_lb); };
      ctrl.appendChild(btn);

    /* Width buttons */
    const WIDTHS=[[1,'1px'],[2,'2px'],[3,'3px']];

      btn.onclick=()=>{

        wsSend({type:'stroke_update',data:{..._la}});
        updateCSPanels(_la,_lb); };

    cpBtn.textContent='📋 на доску'; cpBtn.title='Скопировать линию графика на доску';

  });

  /* ── Parameters section ── */
  syncCSParams(la); // auto-detect params from current equations
  if (la.csParams && la.csParams.length > 0) {
    const sepP = document.createElement('div'); sepP.className = 'cs-sep'; panel.appendChild(sepP);
    const phdr = document.createElement('div'); phdr.className = 'cs-hdr';
    phdr.textContent = '⊞ Параметры'; panel.appendChild(phdr);

    la.csParams.forEach((p, pi) => {
      const pRow = document.createElement('div');
      pRow.style.cssText = 'display:flex;flex-direction:column;gap:3px;padding:3px 0';

      /* Main slider row */
      const mainRow = document.createElement('div');
      mainRow.style.cssText = 'display:flex;align-items:center;gap:4px';

      const nameLbl = document.createElement('span');
      nameLbl.textContent = p.name;
      nameLbl.style.cssText = 'font-weight:600;font-size:.85em;min-width:16px;color:var(--accent)';

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.id = `csp-slider-${p.name}`;
      slider.min = p.min ?? -5; slider.max = p.max ?? 5;
      slider.step = p.step ?? 0.1; slider.value = p.value ?? 1;
      slider.style.cssText = 'flex:1;min-width:80px;cursor:pointer;accent-color:var(--accent)';

      const valInp = document.createElement('input');
      valInp.type = 'number'; valInp.id = `csp-val-${p.name}`;
      valInp.value = Number((p.value ?? 1).toPrecision(4));
      valInp.step = p.step ?? 0.1;
      valInp.style.cssText = 'width:54px;padding:2px 4px;border-radius:5px;border:1px solid var(--sep);background:var(--input);color:var(--fg);font-size:.8em;text-align:right';

      const updateParam = (v) => {
        v = Math.max(p.min??-5, Math.min(p.max??5, v));
        const liveP = (getLa().csParams || [])[pi];
        if (liveP) liveP.value = v;
        p.value = v;
        slider.value = v;
        valInp.value = Number(v.toPrecision(4));
        _graphPathCache.clear();
        redraw();
        /* Live intersection update — recompute numerically without SymPy */
        if (csIntersections) {
          const _la=getLa(),_lb=getLb();
          if (csKey(_la.id,_lb.id)===csKey(csIntersections.la.id,csIntersections.lb.id)) {
            const _r=_computeISectNumericalSync(_la,_lb);
            if (_r) { csIntersections=_r; updateMathOverlay(); redraw(); }
          }
        }
      };

      slider.oninput = () => updateParam(parseFloat(slider.value));
      /* Sync on slider release so other clients see the final value */
      slider.onchange = () => { const _la=getLa(); wsSend({type:'stroke_update',data:{..._la}}); };
      valInp.oninput = () => { const v = parseFloat(valInp.value); if (!isNaN(v)) updateParam(v); };
      valInp.onchange = () => { const _la=getLa(); wsSend({type:'stroke_update',data:{..._la}}); };

      /* Animate button */
      const animKey = `${la.id}_${p.name}`;
      const animBtn = document.createElement('button');
      animBtn.className = 'cs-btn';
      const isAnim = _csParamAnimTimers.has(animKey);
      animBtn.textContent = isAnim ? '⏸' : '▶';
      animBtn.title = isAnim ? 'Остановить анимацию' : 'Анимировать';
      animBtn.style.cssText = 'padding:1px 6px;font-size:.85em;min-width:26px';
      animBtn.onclick = () => {
        if (_csParamAnimTimers.has(animKey)) {
          clearInterval(_csParamAnimTimers.get(animKey));
          _csParamAnimTimers.delete(animKey);
          animBtn.textContent = '▶'; animBtn.title = 'Анимировать';
        } else {
          if (!p.animDir) p.animDir = 1;
          let _animTick = 0;
          const timer = setInterval(() => {
            const liveP = (getLa().csParams || []).find(x => x.name === p.name);
            if (!liveP) { clearInterval(timer); _csParamAnimTimers.delete(animKey); return; }
            liveP.value = (liveP.value ?? 1) + (liveP.step ?? 0.1) * (liveP.animDir ?? 1);
            if (liveP.value >= (liveP.max ?? 5)) { liveP.value = liveP.max ?? 5; liveP.animDir = -1; }
            if (liveP.value <= (liveP.min ?? -5)) { liveP.value = liveP.min ?? -5; liveP.animDir = 1; }
            const sl = document.getElementById(`csp-slider-${liveP.name}`);
            if (sl) sl.value = liveP.value;
            const vi = document.getElementById(`csp-val-${liveP.name}`);
            if (vi) vi.value = Number(liveP.value.toPrecision(4));
            _graphPathCache.clear();
            /* Broadcast every 3rd tick (~150ms) so all clients stay in sync */
            if (++_animTick % 3 === 0) wsSend({type:'stroke_update', data:{...getLa()}});
            redraw();
          }, 50);
          _csParamAnimTimers.set(animKey, timer);
          animBtn.textContent = '⏸'; animBtn.title = 'Остановить';
        }
      };

      /* Remove param button */
      const rmBtn = document.createElement('button');
      rmBtn.className = 'cs-btn'; rmBtn.textContent = '×'; rmBtn.title = 'Удалить параметр';
      rmBtn.style.cssText = 'padding:1px 5px;font-size:.85em;min-width:22px';
      rmBtn.onclick = () => {
        if (_csParamAnimTimers.has(animKey)) { clearInterval(_csParamAnimTimers.get(animKey)); _csParamAnimTimers.delete(animKey); }
        const _la = getLa();
        if (_la.csParams) _la.csParams.splice(pi, 1);
        wsSend({type:'stroke_update',data:{..._la}});
        updateCSPanels(_la, getLb());
      };

      mainRow.append(nameLbl, slider, valInp, animBtn, rmBtn);
      pRow.appendChild(mainRow);

      /* Range config row (min/max/step) */
      const cfgRow = document.createElement('div');
      cfgRow.style.cssText = 'display:flex;align-items:center;gap:3px;padding-left:20px;font-size:.75em;color:var(--fg-dim)';
      const mkSmInp = (label, val, onChange) => {
        const wrap = document.createElement('span');
        const lbl = document.createElement('span'); lbl.textContent = label + ':';
        lbl.style.marginRight = '1px';
        const inp = document.createElement('input');
        inp.type = 'number'; inp.value = val; inp.step = 'any';
        inp.style.cssText = 'width:42px;padding:1px 3px;border-radius:4px;border:1px solid var(--sep);background:var(--input);color:var(--fg);font-size:1em;text-align:center';
        inp.onchange = () => { const v = parseFloat(inp.value); if (!isNaN(v)) { onChange(v); const lp=(getLa().csParams||[])[pi]; if(lp){slider.min=lp.min??-5;slider.max=lp.max??5;slider.step=lp.step??0.1;valInp.step=lp.step??0.1;} wsSend({type:'stroke_update',data:{...getLa()}}); } };
        wrap.append(lbl, inp); return wrap;
      };
      cfgRow.appendChild(mkSmInp('min', p.min??-5, v => { const lp=(getLa().csParams||[])[pi]; if(lp) lp.min=v; p.min=v; }));
      cfgRow.appendChild(mkSmInp('max', p.max??5, v => { const lp=(getLa().csParams||[])[pi]; if(lp) lp.max=v; p.max=v; }));
      cfgRow.appendChild(mkSmInp('шаг', p.step??0.1, v => { const lp=(getLa().csParams||[])[pi]; if(lp) lp.step=v; p.step=v; }));
      pRow.appendChild(cfgRow);

      panel.appendChild(pRow);
    });
  }

  /* Add graph row */
  const sep3=document.createElement('div'); sep3.className='cs-sep'; panel.appendChild(sep3);
  const addRow=document.createElement('div'); addRow.className='csg-add';

  let nextColor=GRAPH_COLORS[graphs.length%GRAPH_COLORS.length];
  const colorDot=document.createElement('div'); colorDot.className='csg-dot'; colorDot.style.cssText=`background:${nextColor};position:relative`;
  const colorPick=document.createElement('input'); colorPick.type='color'; colorPick.value=nextColor;
  colorPick.style.cssText='position:absolute;width:0;height:0;opacity:0';
  colorDot.appendChild(colorPick); colorDot.onclick=()=>colorPick.click();
  colorPick.oninput=()=>{ nextColor=colorPick.value; colorDot.style.background=nextColor; };

  const eqInp=document.createElement('input'); eqInp.type='text';
  eqInp.placeholder='y=x^2  ·  x^2+y^2=r^2';
  eqInp.title='y=f(x) | x=f(y) | F(x,y)=G(x,y)';

  const addBtn=document.createElement('button'); addBtn.className='cs-btn'; addBtn.textContent='+';
  addBtn.onclick=()=>{
    const raw=eqInp.value.trim(); if(!raw) return;
    const parsed=parseEqn(raw);
    if(!parsed){ eqInp.style.outline='2px solid #ef4444'; return; }
    eqInp.style.outline='';
    const _la=getLa(), _lb=getLb();
    if(!_la.csGraphs) _la.csGraphs=[];
    const _g={eq:raw,mode:parsed.mode,color:nextColor,dash:'solid',width:2};
    _la.csGraphs.push(_g);
    syncCSParams(_la);
    redraw(); wsSend({type:'stroke_update',data:{..._la}});
    eqInp.value=''; updateCSPanels(_la,_lb);
    if(_hasCalcOp(raw)){
      _resolveCalcGraph(_g,getLa()).then(()=>{
        const __la=getLa(),__lb=getLb();
        _graphPathCache.clear();redraw();
        wsSend({type:'stroke_update',data:{...__la}});updateCSPanels(__la,__lb);
      });
    }
  };
  eqInp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addBtn.click();}});

  /* Help button */
  const helpBtn=document.createElement('button'); helpBtn.className='cs-btn';
  helpBtn.textContent='?'; helpBtn.title='Справка по командам';
  helpBtn.style.cssText='min-width:22px;font-weight:bold;color:var(--accent);flex-shrink:0';
  helpBtn.onclick=()=>{
    let hp=panel.querySelector('.cs-calc-help');
    if(hp){hp.remove();return;}
    hp=document.createElement('div'); hp.className='cs-calc-help';
    hp.style.cssText='font-size:.72em;padding:8px 10px;background:var(--bg-ui);border:1px solid var(--sep);border-radius:8px;line-height:2;margin:2px 0 4px';
    hp.innerHTML='<b>Команды матанализа</b><br>'
      +'<code>diff(f, x)</code> &mdash; df/dx<br>'
      +'<code>diff(f, x, n)</code> &mdash; d<sup>n</sup>f/dx<sup>n</sup><br>'
      +'<code>int(f, x)</code> &mdash; неопр. интеграл<br>'
      +'<code>int(f, x, a, b)</code> &mdash; опред. интеграл<br>'
      +'<code>int(f, x, a, inf)</code> &mdash; несобств. интеграл<br>'
      +'<code>sum(f, k, a, b)</code> &mdash; конечная сумма<br>'
      +'<code>sum(f, k, a, inf)</code> &mdash; бесконечный ряд<br>'
      +'<hr style="border-color:var(--sep);margin:4px 0">'
      +'<b>Примеры:</b><br>'
      +'<code>diff(x^3, x)</code> → 3x²<br>'
      +'<code>int(x^2, x, 0, 1)</code> → ⅓<br>'
      +'<code>sum(1/k^2, k, 1, inf)</code> → π²/6';
    addRow.insertAdjacentElement('afterend', hp);
  };

  addRow.append(colorDot,colorPick,eqInp,addBtn,helpBtn); panel.appendChild(addRow);
  panel.appendChild(buildMathKb(eqInp));
}

function updateSelBar() {
  const bar = document.getElementById('selBar');
  bar.innerHTML = '';
  /* CS panel is now board-anchored and persistent — no longer tied to selection */
  if (!selected.size || tool !== 'select') { bar.classList.remove('open'); updateMobTabs(); return; }

  const selEls  = all.filter(e => selected.has(e.id));
  const editable = selEls.filter(e => e.type === 'stroke' || e.type === 'shape');
  if (!selEls.length) { bar.classList.remove('open'); updateMobTabs(); return; }

  bar.classList.add('open');

  /* ── Drag handle + close button ── */
  const handle = document.createElement('div');
  handle.id = 'selBarHandle';
  handle.style.position = 'relative';
  const grip = document.createElement('div'); grip.id = 'selBarGrip';
  const closeBtn = document.createElement('button'); closeBtn.id = 'selBarClose';
  closeBtn.title = 'Закрыть'; closeBtn.textContent = '×';
  closeBtn.onclick = () => clearSel();
  handle.appendChild(grip); handle.appendChild(closeBtn);
  bar.appendChild(handle);
  initSelBarDrag(handle, bar);

  /* ── Header: count + list toggle ── */
  const hRow = document.createElement('div');
  hRow.style.cssText = 'display:flex;align-items:center;gap:6px';
  const h5 = document.createElement('h5');
  h5.textContent = `Выделено: ${selEls.length}`;
  hRow.appendChild(h5);
  /* List toggle */
  const listToggle = document.createElement('button');
  listToggle.className = 'tog' + (selListOpen ? ' act' : '');
  listToggle.title = 'Список элементов';
  listToggle.textContent = '↳';
  listToggle.style.cssText = 'min-width:26px;height:22px;padding:0;font-size:.85em';
  listToggle.onclick = () => { selListOpen = !selListOpen; updateSelBar(); };
  hRow.appendChild(listToggle);
  bar.appendChild(hRow);

  /* ── Text element controls ── */
  const textEls = selEls.filter(e => e.type === 'text');
  if (textEls.length) {
    const sep = document.createElement('div');
    sep.style.cssText = 'width:1px;align-self:stretch;background:var(--sep);margin:0 2px';
    bar.appendChild(sep);

    /* Color */
    bar.appendChild(mkColorRow(textEls[0].color || getColors()[0], c => {
      addToUndo();
      textEls.forEach(el => el.color = c);
      redraw();
      textEls.forEach(el => { wsSend({ type:'stroke_update', data:{...el} }); });
    }));

    /* Font size */
    const fsRow = document.createElement('div'); fsRow.className = 'sp-row';
    fsRow.innerHTML = `<label style="min-width:0">Размер</label>
      <input type="number" id="sbTFs" min="8" max="200" value="${textEls[0].fontSize||18}" style="width:54px">`;
    let fsUndo = false;
    fsRow.querySelector('#sbTFs').addEventListener('focus', () => { addToUndo(); fsUndo = true; });
    fsRow.querySelector('#sbTFs').oninput = e => {
      const v = +e.target.value || 18;
      textEls.forEach(el => el.fontSize = v); redraw();
    };
    fsRow.querySelector('#sbTFs').onchange = () => {
      textEls.forEach(el => { wsSend({ type:'stroke_update', data:{...el} }); });
    };
    bar.appendChild(fsRow);

    /* Font family */
    const fv = textEls[0].font || 'system-ui,sans-serif';
    const fontRow = document.createElement('div'); fontRow.className = 'sp-row';
    fontRow.innerHTML = `<label style="min-width:0">Шрифт</label>
      <select id="sbTFont" style="flex:1;min-width:80px;max-width:110px;background:var(--input);color:var(--fg);border:1px solid var(--sep);border-radius:5px;padding:2px 4px;font-size:.78em">
        ${TEXT_FONTS.map(([v,l]) => `<option value="${v}"${v===fv?' selected':''}>${l}</option>`).join('')}
      </select>`;
    fontRow.querySelector('#sbTFont').onchange = e => {
      addToUndo();
      textEls.forEach(el => el.font = e.target.value); redraw();
      textEls.forEach(el => { wsSend({ type:'stroke_update', data:{...el} }); });
    };
    bar.appendChild(fontRow);

    /* B / I / U */
    const styRow = document.createElement('div'); styRow.className = 'sp-row';
    styRow.innerHTML = `<div class="tog-row">
      <button class="tog${textEls[0].bold?' act':''}" id="sbTB"><b>B</b></button>
      <button class="tog${textEls[0].italic?' act':''}" id="sbTI"><i>I</i></button>
      <button class="tog${textEls[0].underline?' act':''}" id="sbTU"><u>U</u></button>
    </div>`;
    const togTxt = (prop, btn) => {
      addToUndo();
      const nv = !textEls[0][prop];
      textEls.forEach(el => el[prop] = nv);
      btn.classList.toggle('act', nv); redraw();
      textEls.forEach(el => { wsSend({ type:'stroke_update', data:{...el} }); });
    };
    styRow.querySelector('#sbTB').onclick = e => togTxt('bold',      e.currentTarget);
    styRow.querySelector('#sbTI').onclick = e => togTxt('italic',    e.currentTarget);
    styRow.querySelector('#sbTU').onclick = e => togTxt('underline', e.currentTarget);
    bar.appendChild(styRow);

    /* ── English tools: IPA + Translate ── */
    const engRow = document.createElement('div'); engRow.className = 'sp-row';
    engRow.style.cssText = 'gap:4px;flex-wrap:wrap';
    engRow.innerHTML = `
      <button class="tog" id="sbIPA" title="Фонетическая расшифровка (IPA)">IPA</button>
      <button class="tog" id="sbTranslate" title="Перевести текст">🌐</button>
      <select id="sbLangPair" title="Направление перевода" style="background:var(--input);color:var(--fg);border:1px solid var(--sep);border-radius:5px;padding:2px 4px;font-size:.75em">
        <option value="en|ru">EN→RU</option>
        <option value="ru|en">RU→EN</option>
        <option value="en|de">EN→DE</option>
        <option value="en|fr">EN→FR</option>
        <option value="en|es">EN→ES</option>
        <option value="en|zh">EN→ZH</option>
      </select>`;
    engRow.querySelector('#sbIPA').onclick    = () => ipaTranscribe(textEls[0]);
    engRow.querySelector('#sbTranslate').onclick = () => {
      const pair = document.getElementById('sbLangPair').value;
      translateEl(textEls[0], pair);
    };
    bar.appendChild(engRow);
  }

  if (editable.length) {
    /* Color row */
    const firstColor = editable[0].color || getColors()[0];
    let colorUndoAdded = false;
    bar.appendChild(mkColorRow(firstColor, c => {
      if (!colorUndoAdded) { addToUndo(); colorUndoAdded = true; }
      editable.forEach(el => el.color = c);
      redraw();
      editable.forEach(el => { wsSend({ type: 'stroke_update', data:{...el} }); });
    }));

    /* Thickness slider */
    const firstSize = editable[0].size || 3;
    const rRow = document.createElement('div'); rRow.className = 'sp-row';
    rRow.innerHTML = `<label style="min-width:0">Толщина <span id="sbSzV" style="font-size:.8em;opacity:.65">${firstSize}</span></label>
      <input type="range" id="sbSz" min="1" max="40" value="${firstSize}" style="width:90px">`;
    rRow.querySelector('#sbSz').addEventListener('mousedown', () => addToUndo());
    rRow.querySelector('#sbSz').oninput = e => {
      const v = +e.target.value;
      document.getElementById('sbSzV').textContent = v;
      editable.forEach(el => el.size = v);
      redraw();
    };
    rRow.querySelector('#sbSz').onchange = () => {
      editable.forEach(el => { wsSend({ type: 'stroke_update', data:{...el} }); });
    };
    bar.appendChild(rRow);

    /* Arrow selector — only when selected lines are present */
    const lineEls = selEls.filter(e => e.type === 'shape' && e.shape === 'line');
    if (lineEls.length) {
      const firstArrow = lineEls[0].arrow || 'none';
      const arRow = document.createElement('div'); arRow.className = 'sp-row';
      arRow.innerHTML = `<label style="min-width:0">Стрелки</label>
        <div class="tog-row">
          <button class="tog${firstArrow==='none' ?' act':''}" id="sbArN">—</button>
          <button class="tog${firstArrow==='end'  ?' act':''}" id="sbArE">→</button>
          <button class="tog${firstArrow==='start'?' act':''}" id="sbArS">←</button>
          <button class="tog${firstArrow==='both' ?' act':''}" id="sbArB">↔</button>
        </div>`;
      const setArrow = v => {
        addToUndo();
        lineEls.forEach(el => { el.arrow = v; });
        redraw();
        lineEls.forEach(el => { wsSend({ type: 'stroke_update', data:{...el} }); });
        updateSelBar();
      };
      arRow.querySelector('#sbArN').onclick = () => setArrow('none');
      arRow.querySelector('#sbArE').onclick = () => setArrow('end');
      arRow.querySelector('#sbArS').onclick = () => setArrow('start');
      arRow.querySelector('#sbArB').onclick = () => setArrow('both');
      bar.appendChild(arRow);
    }

    /* Fill — for closed shapes (triangle, parallelogram, ellipse) */
    const fillEls = selEls.filter(e => e.type==='shape' && e.shape!=='line');
    if (fillEls.length) {
      const hasFill = !!fillEls[0].fill;
      const fillRow = document.createElement('div'); fillRow.className = 'sp-row';
      fillRow.innerHTML = `<label style="min-width:0">Заливка</label>
        <div class="tog-row">
          <button class="tog${!hasFill?' act':''}" id="sbFillNo">нет</button>
          <button class="tog${hasFill?' act':''}"  id="sbFillYes">цвет</button>
        </div>`;
      const setFill = (v) => {
        addToUndo();
        fillEls.forEach(el => { el.fill = v || null; });
        redraw();
        fillEls.forEach(el => { wsSend({type:'stroke_update',data:{...el}}); });
        updateSelBar();
      };
      fillRow.querySelector('#sbFillNo').onclick  = () => setFill(null);
      fillRow.querySelector('#sbFillYes').onclick = () => setFill(fillEls[0].fill || fillEls[0].color || '#3fb950');
      bar.appendChild(fillRow);
      if (hasFill) {
        bar.appendChild(mkColorRow(fillEls[0].fill, c => {
          addToUndo();
          fillEls.forEach(el => el.fill = c); redraw();
          fillEls.forEach(el => { wsSend({type:'stroke_update',data:{...el}}); });
        }));
        const foRow = document.createElement('div'); foRow.className = 'sp-row';
        const foV = Math.round((fillEls[0].fillOpacity??0.35)*100);
        foRow.innerHTML = `<label style="min-width:0">Прозрач. <span id="sbFOV" style="font-size:.8em;opacity:.65">${foV}%</span></label>
          <input type="range" id="sbFO" min="5" max="100" value="${foV}" style="width:90px">`;
        foRow.querySelector('#sbFO').addEventListener('mousedown', () => addToUndo());
        foRow.querySelector('#sbFO').oninput = e => {
          const v = +e.target.value / 100;
          document.getElementById('sbFOV').textContent = e.target.value + '%';
          fillEls.forEach(el => el.fillOpacity = v); redraw();
        };
        foRow.querySelector('#sbFO').onchange = () => {
          fillEls.forEach(el => { wsSend({type:'stroke_update',data:{...el}}); });
        };
        bar.appendChild(foRow);
      }
    }

    /* Label controls — for flowchart shapes */
    const labelEls = selEls.filter(e => e.type === 'shape' && FLOW_SHAPES.has(e.shape));
    if (labelEls.length) {
      const sep = document.createElement('div');
      sep.style.cssText = 'height:1px;background:var(--sep);margin:4px 0';
      bar.appendChild(sep);

      const lsRow = document.createElement('div'); lsRow.className = 'sp-row';
      const curSize = labelEls[0].labelSize || 24;
      lsRow.innerHTML = `<label style="min-width:0">Текст</label>
        <input type="number" id="sbLblSz" min="6" max="72" value="${curSize}"
          style="width:50px;background:#0d1117;color:#e6edf3;border:1px solid var(--sep);border-radius:4px;padding:2px 4px;font-size:.8em">
        <span style="font-size:.75em;opacity:.5">px</span>`;
      lsRow.querySelector('#sbLblSz').addEventListener('mousedown', e => e.stopPropagation());
      lsRow.querySelector('#sbLblSz').oninput = e => {
        const v = Math.max(6, Math.min(72, +e.target.value || 14));
        labelEls.forEach(el => { el.labelSize = v; }); redraw();
      };
      lsRow.querySelector('#sbLblSz').onchange = () => {
        addToUndo();
        labelEls.forEach(el => { wsSend({type:'stroke_update',data:{...el}}); });
      };
      bar.appendChild(lsRow);

      const lcRow = document.createElement('div'); lcRow.className = 'sp-row';
      const curClr = labelEls[0].labelColor || '#ffffff';
      lcRow.innerHTML = `<label style="min-width:0">Цвет текста</label>
        <input type="color" id="sbLblClr" value="${curClr}"
          style="width:32px;height:24px;border:none;background:none;cursor:pointer;padding:0">`;
      lcRow.querySelector('#sbLblClr').addEventListener('mousedown', e => e.stopPropagation());
      lcRow.querySelector('#sbLblClr').oninput = e => {
        labelEls.forEach(el => { el.labelColor = e.target.value; }); redraw();
      };
      lcRow.querySelector('#sbLblClr').onchange = () => {
        addToUndo();
        labelEls.forEach(el => { wsSend({type:'stroke_update',data:{...el}}); });
      };
      bar.appendChild(lcRow);
    }

    /* Two-line positioning — shows when exactly 2 lines are selected */
    const lineElsSel = selEls.filter(e => e.type === 'shape' && e.shape === 'line');
    if (lineElsSel.length === 2) {
      const la = sbLineOrder === 0 ? lineElsSel[0] : lineElsSel[1];
      const lb = sbLineOrder === 0 ? lineElsSel[1] : lineElsSel[0];

      const mkHBtns = (sel, id) =>
        `<div class="tog-row" id="${id}">${['p1','pm','p2'].map(h =>
          `<button class="tog${h===sel?' act':''}" data-h="${h}">${h}</button>`).join('')}</div>`;

      const posDiv = document.createElement('div');
      posDiv.style.cssText = 'display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--sep);padding-left:10px;';

      const laClr = la.color || COLORS[2], lbClr = lb.color || COLORS[2];
      const orderRow = document.createElement('div'); orderRow.className = 'sp-row'; orderRow.style.gap = '4px';
      orderRow.innerHTML = `
        <button class="tog act" style="border-left:3px solid ${laClr};padding:0 6px" title="Прямая 1 — якорь">Л1</button>
        <button class="tog" id="spSwap" title="Поменять местами Л1 и Л2">⇄</button>
        <button class="tog" style="border-left:3px solid ${lbClr};padding:0 6px" title="Прямая 2 — двигается">Л2</button>
        <span style="font-size:.72em;opacity:.45;margin-left:4px">∠&nbsp;${angleBetwLines(la,lb).toFixed(1)}°</span>`;
      orderRow.querySelector('#spSwap').onclick = () => { sbLineOrder = 1 - sbLineOrder; updateSelBar(); };
      posDiv.appendChild(orderRow);

      const snapRow = document.createElement('div'); snapRow.className = 'sp-row'; snapRow.style.gap = '4px';
      snapRow.innerHTML = `<label style="min-width:0">Совм.</label>
        <span style="font-size:.7em;opacity:.55">Л1</span>${mkHBtns(sbSnapHA,'spHA')}
        <span style="opacity:.4">≡</span>
        <span style="font-size:.7em;opacity:.55">Л2</span>${mkHBtns(sbSnapHB,'spHB')}
        <button class="tog" id="spSnap" title="Переместить Л2">✓</button>`;
      snapRow.querySelectorAll('#spHA .tog').forEach(b => b.onclick = () => {
        sbSnapHA = b.dataset.h; snapRow.querySelectorAll('#spHA .tog').forEach(x => x.classList.toggle('act', x===b));
      });
      snapRow.querySelectorAll('#spHB .tog').forEach(b => b.onclick = () => {
        sbSnapHB = b.dataset.h; snapRow.querySelectorAll('#spHB .tog').forEach(x => x.classList.toggle('act', x===b));
      });
      snapRow.querySelector('#spSnap').onclick = () => {
        addToUndo();
        const anchor = getVisualPts(la)[sbSnapHA];
        moveLineTo(lb, sbSnapHB, anchor.x, anchor.y);
        redraw();
        wsSend({ type:'stroke_update', data:{...lb} });
        updateSelBar();
      };
      posDiv.appendChild(snapRow);

      const curAng = angleBetwLines(la, lb);
      const angRow = document.createElement('div'); angRow.className = 'sp-row'; angRow.style.gap = '4px';
      angRow.innerHTML = `<label style="min-width:0">∠Л2</label>
        <input type="number" id="spAngV" min="-360" max="360" value="${curAng.toFixed(1)}" style="width:56px">
        <span style="opacity:.35">°</span>
        <span style="opacity:.5;font-size:.78em">вкруг&nbsp;Л2</span>
        ${mkHBtns(sbRotCenter,'spRC')}
        <button class="tog" id="spAngOk">Ок</button>`;
      angRow.querySelectorAll('#spRC .tog').forEach(b => b.onclick = () => {
        sbRotCenter = b.dataset.h; angRow.querySelectorAll('#spRC .tog').forEach(x => x.classList.toggle('act', x===b));
      });
      angRow.querySelector('#spAngOk').onclick = () => {
        const tgt = parseFloat(angRow.querySelector('#spAngV').value);
        if (isNaN(tgt)) return;
        addToUndo();
        const tgtRad = tgt * Math.PI / 180;
        const curRad = ((lineVisAngle(lb) - lineVisAngle(la)) % Math.PI + Math.PI) % Math.PI;
        const da = tgtRad - curRad;
        const center = getVisualPts(lb)[sbRotCenter];
        rotateLineAround(lb, center.x, center.y, da);
        redraw();
        wsSend({ type:'stroke_update', data:{...lb} });
        updateSelBar();
      };
      posDiv.appendChild(angRow);

      /* ── Coordinate System button ── */
      const csRow = document.createElement('div'); csRow.className = 'sp-row'; csRow.style.gap='5px';
      const alreadyCS = la.csPartner === lb.id || lb.csPartner === la.id;
      const canCS = linesCanFormCS(la, lb);
      const O_cs = lineIntersection(la, lb);
      if (alreadyCS) {
        const btnDissolve = document.createElement('button');
        btnDissolve.className = 'cs-btn active'; btnDissolve.textContent = '⊕ СК ✓';
        btnDissolve.title = 'Система координат активна. Нажмите, чтобы отключить';
        btnDissolve.onclick = () => { dissolveCS(la, lb); updateSelBar(); updateCSPanels(null,null); redraw(); };
        csRow.appendChild(btnDissolve);
        const btnSettings = document.createElement('button');
        btnSettings.className = 'cs-btn'; btnSettings.textContent = '⚙';
        btnSettings.title = 'Настройки СК';
        btnSettings.onclick = () => updateCSPanels(la, lb);
        csRow.appendChild(btnSettings);
      } else if (canCS && O_cs) {
        const btnMake = document.createElement('button');
        btnMake.className = 'cs-btn'; btnMake.textContent = '⊕ Создать СК';
        btnMake.title = 'Сделать эти прямые системой координат';
        btnMake.onclick = () => { makeCS(la, lb); updateSelBar(); updateCSPanels(la, lb); redraw(); };
        csRow.appendChild(btnMake);
      } else if (!canCS) {
        const note = document.createElement('span');
        note.style.cssText = 'font-size:.72em;opacity:.42';
        const ang = angleBetwLines(la, lb), norm = Math.min(ang, 180-ang);
        note.textContent = `∠${norm.toFixed(0)}° — слишком мал для СК`;
        csRow.appendChild(note);
      }
      posDiv.appendChild(csRow);
      bar.appendChild(posDiv);

      /* Refresh CS panels whenever 2 lines are shown in selBar */
      if (alreadyCS) updateCSPanels(la, lb); else updateCSPanels(null, null);
    } else {
      /* Not exactly 2 lines selected — hide CS panels */
      updateCSPanels(null, null);
    }
  }

  /* Aspect ratio lock — shown when at least one image is selected */
  const imgEls = selEls.filter(e => e.type === 'image');
  if (imgEls.length) {
    const sep2 = document.createElement('div');
    sep2.style.cssText = 'width:1px;align-self:stretch;background:var(--sep);margin:0 2px';
    bar.appendChild(sep2);
    const lockBtn = document.createElement('button');
    lockBtn.className = 'tog' + (imgLockAspect ? ' act' : '');
    lockBtn.title = 'Заблокировать пропорции при масштабировании';
    lockBtn.textContent = imgLockAspect ? '⛓' : '⛓';
    lockBtn.style.cssText = 'min-width:30px;padding:0 6px';
    lockBtn.onclick = () => { imgLockAspect = !imgLockAspect; updateSelBar(); };
    bar.appendChild(lockBtn);
    const lockLbl = document.createElement('span');
    lockLbl.style.cssText = 'font-size:.75em;opacity:.6;white-space:nowrap';
    lockLbl.textContent = imgLockAspect ? '1:1' : '1:1?';
    bar.appendChild(lockLbl);
  }

  /* Delete button */
  const del = document.createElement('button');
  del.className = 'tog'; del.textContent = '🗑 Удалить';
  del.onclick = () => {
    addToUndo();
    for (const id of selected) {
      const _el = all.find(e => e.id === id);
      if (_el && _el.csPartner && !selected.has(_el.csPartner)) {
        const _p = all.find(e => e.id === _el.csPartner);
        if (_p) { _p.csPartner=null; _p.csScale=null; _p.csTickStep=null; wsSend({type:'stroke_update',data:{..._p}}); }
      }
      all = all.filter(el => el.id !== id); wsSend({ type: 'erase_stroke', id });
    }
    clearSel(); redraw();
  };
  bar.appendChild(del);

  /* ── Element list (expandable) ── */
  const listDiv = document.createElement('div');
  listDiv.className = 'sel-list' + (selListOpen ? ' open' : '');
  const typeIcon = el => {
    if (el.type === 'stroke')   return '🖊';
    if (el.type === 'image')    return '🖼';
    if (el.type === 'richtext') return '📄';
    if (el.type === 'text')     return 'T';
    if (el.type === 'docfile')  return '📎';
    if (el.type === 'shape') {
      const ic = { line:'╱', triangle:'△', parallelogram:'▱', ellipse:'⬭' };
      return ic[el.shape] || '◻';
    }
    return '?';
  };
  selEls.forEach(el => {
    const row    = document.createElement('div'); row.className = 'sel-item';
    const icon   = document.createElement('span'); icon.className = 'si-icon'; icon.textContent = typeIcon(el);
    const idSpan = document.createElement('span'); idSpan.className = 'si-id';
    idSpan.textContent = el.type + ' ' + el.id.slice(0, 5) + '…';
    const rmBtn  = document.createElement('button'); rmBtn.className = 'si-rm'; rmBtn.textContent = '×';
    rmBtn.title = 'Убрать из выделения';
    rmBtn.onclick = ev => {
      ev.stopPropagation();
      selected.delete(el.id);
      if (hoverHighlightId === el.id) hoverHighlightId = null;
      updateSelBar(); redraw();
    };
    row.appendChild(icon); row.appendChild(idSpan); row.appendChild(rmBtn);
    row.addEventListener('mouseenter', () => { hoverHighlightId = el.id; redraw(); });
    row.addEventListener('mouseleave', () => { hoverHighlightId = null; redraw(); });
    listDiv.appendChild(row);
  });
  bar.appendChild(listDiv);
  requestAnimationFrame(updateMobTabs);
}

// ══════════════════════════════════════════════════════════
// §11  DRAWING
// ══════════════════════════════════════════════════════════
function drawGrid() {
  if (gridStyle === 'none') return;
  const t = BOARD_THEMES[boardTheme] || BOARD_THEMES['dark-blue'];
  const {gridR:r, gridG:g, gridB:b} = t;

  // Screen pixel spacing for each level
  const s1   = 40   * vz;
  const s10  = 400  * vz;
  const s100 = 4000 * vz;

  // Alpha: fades in linearly as screen spacing grows from 2→20px, caps at `max`
  function gridAlpha(screenPx, max) {
    if (screenPx < 2) return 0;
    return Math.min(1, (screenPx - 2) / 18) * max;
  }

  const a1   = gridAlpha(s1,   0.13);
  const a10  = gridAlpha(s10,  0.23);
  const a100 = gridAlpha(s100, 0.38);

  ctx.save();
  ctx.lineWidth = 1;

  if (gridStyle === 'grid') {
    function drawLines(spacing, alpha) {
      if (alpha <= 0.005 || spacing > Math.max(W, H) * 2) return;
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha.toFixed(3)})`;
      const ox = ((vx % spacing) + spacing) % spacing;
      const oy = ((vy % spacing) + spacing) % spacing;
      ctx.beginPath();
      for (let x = ox; x <= W; x += spacing) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
      for (let y = oy; y <= H; y += spacing) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
      ctx.stroke();
    }
    drawLines(s100, a100);
    drawLines(s10,  a10);
    drawLines(s1,   a1);

  } else if (gridStyle === 'dots') {
    // Fine dots at every grid intersection
    function drawDots(spacing, alpha, radius) {
      if (alpha <= 0.01 || spacing < 4 || spacing > Math.max(W, H) * 2) return;
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(3)})`;
      const ox = ((vx % spacing) + spacing) % spacing;
      const oy = ((vy % spacing) + spacing) % spacing;
      ctx.beginPath();
      for (let x = ox; x <= W; x += spacing)
        for (let y = oy; y <= H; y += spacing) {
          ctx.moveTo(x + radius, y);
          ctx.arc(x, y, radius, 0, Math.PI * 2);
        }
      ctx.fill();
    }
    // Medium dots (10× grid)
    drawDots(s100, a100 * 2.2, Math.min(4, s100 / 24));
    drawDots(s10,  a10  * 1.8, Math.min(2.5, s10 / 20));
    drawDots(s1,   a1   * 3.0, Math.min(1.8, s1  / 18));
  }

  ctx.restore();
}

function drawStroke(s) {
  if (!s.pts || s.pts.length < 2) return;
  ctx.save();
  if (s.rotation) {
    const bb = elemBBox(s);
    if (bb) { const c=ts(bb.x+bb.w/2,bb.y+bb.h/2); ctx.translate(c.x,c.y); ctx.rotate(s.rotation); ctx.translate(-c.x,-c.y); }
  }
  ctx.strokeStyle = s.color || '#e2e8f0'; ctx.lineWidth = (s.size || 3) * vz;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  let penDown = false;
  for (let i = 0; i < s.pts.length; i++) {
    const pt = s.pts[i];
    /* null/NaN point = pen-up separator (used for monolithic graph copies) */
    if (pt.x == null || !isFinite(pt.x) || !isFinite(pt.y)) { penDown = false; continue; }
    const p = ts(pt.x, pt.y);
    if (!penDown) { ctx.moveTo(p.x, p.y); penDown = true; }
    else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke(); ctx.restore();
}

function hexFill(hex, a) {
  if (!hex) return null;
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a??0.35})`;
}

/* Rounded-rect path helper */
function rrPath(x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

/* drawCode: lightweight canvas placeholder (real widget is a DOM overlay via codeOverlayMap).
   Only visible during initial drag-to-place (before overlay is created). */
function drawCode(el) {
  if (codeOverlayMap.has(el.id)) return; // overlay handles rendering
  const sp = ts(el.x, el.y);
  const sw = (el.w || 400) * vz, sh = (el.h || 260) * vz;
  ctx.save();
  ctx.fillStyle = '#0d1117';
  ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(sp.x, sp.y, sw, sh, 8 * vz); ctx.fill(); ctx.stroke();
  const hh = Math.min(30, sh);
  ctx.fillStyle = '#161b22';
  ctx.fillRect(sp.x + 1, sp.y + 1, sw - 2, hh - 1);
  ctx.strokeStyle = '#30363d'; ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(sp.x, sp.y + hh); ctx.lineTo(sp.x + sw, sp.y + hh); ctx.stroke();
  ctx.fillStyle = '#e6edf3';
  ctx.font = `600 ${Math.max(8, Math.round(10 * vz))}px system-ui`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('🐍 Python', sp.x + 8 * vz, sp.y + hh / 2);
  ctx.restore();
}

function drawShape(s) {
  const s1 = ts(s.x1, s.y1), s2 = ts(s.x2, s.y2);
  ctx.save();
  if (s.rotation) {
    const bb = elemBBox(s);
    if (bb) {
      const rx = s.ro ? s.ro.x : bb.x+bb.w/2, ry = s.ro ? s.ro.y : bb.y+bb.h/2;
      const c = ts(rx, ry);
      ctx.translate(c.x,c.y); ctx.rotate(s.rotation); ctx.translate(-c.x,-c.y);
    }
  }
  ctx.strokeStyle = s.color || '#22c55e'; ctx.lineWidth = (s.size || 2) * vz; ctx.lineCap = 'round';
  if (s.dash) ctx.setLineDash([(s.size||2) * 5 * vz, (s.size||2) * 3 * vz]);
  ctx.beginPath();
  if (s.shape === 'line') {
    ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
    /* Arrowheads */
    if (s.arrow && s.arrow !== 'none') {
      ctx.setLineDash([]);
      ctx.fillStyle = s.color || '#22c55e';
      const lw = (s.size || 2) * vz;
      const hl = Math.max(14, lw * 4), sp = 0.42; // half-angle ~24°
      const ah = (ax, ay, bx, by) => {
        const a = Math.atan2(ay - by, ax - bx);
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax - hl * Math.cos(a - sp), ay - hl * Math.sin(a - sp));
        ctx.lineTo(ax - hl * Math.cos(a + sp), ay - hl * Math.sin(a + sp));
        ctx.closePath(); ctx.fill();
      };
      if (s.arrow === 'end'   || s.arrow === 'both') ah(s2.x, s2.y, s1.x, s1.y);
      if (s.arrow === 'start' || s.arrow === 'both') ah(s1.x, s1.y, s2.x, s2.y);
    }
  }
  else if (s.shape === 'ellipse') {
    const cx = (s1.x+s2.x)/2, cy = (s1.y+s2.y)/2;
    const rx = Math.abs(s2.x-s1.x)/2, ry = Math.abs(s2.y-s1.y)/2;
    ctx.ellipse(cx, cy, Math.max(rx,1), Math.max(ry,1), 0, 0, Math.PI*2);
    if (s.fill) { ctx.fillStyle=hexFill(s.fill,s.fillOpacity); ctx.fill(); }
    ctx.stroke();
  }
  else if (s.shape === 'triangle') {
    const p1 = ts(s.x1, s.y1), p2 = ts(s.x2, s.y2), p3 = ts(s.x3, s.y3);
    ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y);
    ctx.closePath();
    if (s.fill) { ctx.fillStyle=hexFill(s.fill,s.fillOpacity); ctx.fill(); }
    ctx.stroke();
  }
  else if (s.shape === 'parallelogram') {
    /* A=(x1,y1) B=(x2,y2) C=(x3,y3) D=A+C-B. Migrate old ox-format on the fly. */
    if (s.x3 === undefined) { s.x3=s.x2+(s.ox||0); s.y3=s.y1; const ty=s.y2; s.y1=ty; s.y2=ty; delete s.ox; }
    const A=ts(s.x1,s.y1), B=ts(s.x2,s.y2), C=ts(s.x3,s.y3);
    const D=ts(s.x1+s.x3-s.x2, s.y1+s.y3-s.y2);
    ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.lineTo(C.x,C.y);
    ctx.lineTo(D.x,D.y); ctx.closePath();
    if (s.fill) { ctx.fillStyle=hexFill(s.fill,s.fillOpacity); ctx.fill(); }
    ctx.stroke();
  }
  else if (s.shape === 'rect') {
    const lx=Math.min(s1.x,s2.x), ly=Math.min(s1.y,s2.y);
    const rw=Math.abs(s2.x-s1.x),  rh=Math.abs(s2.y-s1.y);
    ctx.rect(lx, ly, rw, rh);
    if (s.fill) { ctx.fillStyle=hexFill(s.fill,s.fillOpacity); ctx.fill(); }
    ctx.stroke();
  }
  else if (s.shape === 'diamond') {
    const lx=Math.min(s1.x,s2.x), ly=Math.min(s1.y,s2.y);
    const rw=Math.abs(s2.x-s1.x),  rh=Math.abs(s2.y-s1.y);
    const cx=lx+rw/2, cy=ly+rh/2;
    ctx.moveTo(cx,ly); ctx.lineTo(lx+rw,cy);
    ctx.lineTo(cx,ly+rh); ctx.lineTo(lx,cy);
    ctx.closePath();
    if (s.fill) { ctx.fillStyle=hexFill(s.fill,s.fillOpacity); ctx.fill(); }
    ctx.stroke();
  }
  else if (s.shape === 'rounded') {
    const lx=Math.min(s1.x,s2.x), ly=Math.min(s1.y,s2.y);
    const rw=Math.abs(s2.x-s1.x),  rh=Math.abs(s2.y-s1.y);
    const rad = Math.min(rw, rh) / 2;
    ctx.roundRect(lx, ly, rw, rh, rad);
    if (s.fill) { ctx.fillStyle=hexFill(s.fill,s.fillOpacity); ctx.fill(); }
    ctx.stroke();
  }
  else if (s.shape === 'node') {
    const lx=Math.min(s1.x,s2.x), ly=Math.min(s1.y,s2.y);
    const rw=Math.abs(s2.x-s1.x),  rh=Math.abs(s2.y-s1.y);
    const r=Math.min(rw,rh)/2;
    ctx.beginPath(); ctx.arc(lx+rw/2, ly+rh/2, r, 0, Math.PI*2);
    if (s.fill) { ctx.fillStyle=hexFill(s.fill,s.fillOpacity); ctx.fill(); }
    ctx.stroke();
  }
  /* ── New flowchart shapes ── */
  else if (s.shape === 'iopara') {
    /* Input/Output: parallelogram with fixed horizontal skew */
    const lx=Math.min(s1.x,s2.x), ly=Math.min(s1.y,s2.y);
    const rw=Math.abs(s2.x-s1.x), rh=Math.abs(s2.y-s1.y);
    const sk = Math.min(rw * 0.18, rh * 0.6);
    ctx.beginPath();
    ctx.moveTo(lx+sk,   ly);
    ctx.lineTo(lx+rw,   ly);
    ctx.lineTo(lx+rw-sk, ly+rh);
    ctx.lineTo(lx,       ly+rh);
    ctx.closePath();
    if (s.fill) { ctx.fillStyle=hexFill(s.fill,s.fillOpacity); ctx.fill(); }
    ctx.stroke();
  }
  else if (s.shape === 'hexagon') {
    /* Preparation: horizontal hexagon (indent on left/right) */
    const lx=Math.min(s1.x,s2.x), ly=Math.min(s1.y,s2.y);
    const rw=Math.abs(s2.x-s1.x), rh=Math.abs(s2.y-s1.y);
    const cx=lx+rw/2, cy=ly+rh/2;
    const ind = Math.min(rw*0.2, rh*0.5);
    ctx.beginPath();
    ctx.moveTo(lx+ind,    ly);
    ctx.lineTo(lx+rw-ind, ly);
    ctx.lineTo(lx+rw,     cy);
    ctx.lineTo(lx+rw-ind, ly+rh);
    ctx.lineTo(lx+ind,    ly+rh);
    ctx.lineTo(lx,        cy);
    ctx.closePath();
    if (s.fill) { ctx.fillStyle=hexFill(s.fill,s.fillOpacity); ctx.fill(); }
    ctx.stroke();
  }
  else if (s.shape === 'cylinder') {
    /* Database: cylinder shape */
    const lx=Math.min(s1.x,s2.x), ly=Math.min(s1.y,s2.y);
    const rw=Math.abs(s2.x-s1.x), rh=Math.abs(s2.y-s1.y);
    const er = Math.min(rw/2, rh*0.2); // y-radius of ellipses
    const cx = lx+rw/2;
    if (s.fill) {
      ctx.beginPath();
      ctx.rect(lx, ly+er, rw, rh-2*er);
      ctx.fillStyle=hexFill(s.fill,s.fillOpacity); ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx, ly+er, rw/2, er, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx, ly+rh-er, rw/2, er, 0, 0, Math.PI*2);
      ctx.fill();
    }
    // Side lines
    ctx.beginPath();
    ctx.moveTo(lx,    ly+er); ctx.lineTo(lx,    ly+rh-er);
    ctx.moveTo(lx+rw, ly+er); ctx.lineTo(lx+rw, ly+rh-er);
    ctx.stroke();
    // Bottom ellipse
    ctx.beginPath();
    ctx.ellipse(cx, ly+rh-er, rw/2, er, 0, 0, Math.PI*2);
    ctx.stroke();
    // Top ellipse (fully visible cap)
    ctx.beginPath();
    ctx.ellipse(cx, ly+er, rw/2, er, 0, 0, Math.PI*2);
    ctx.stroke();
  }
  else if (s.shape === 'document') {
    /* Document: rect with wavy bottom */
    const lx=Math.min(s1.x,s2.x), ly=Math.min(s1.y,s2.y);
    const rw=Math.abs(s2.x-s1.x), rh=Math.abs(s2.y-s1.y);
    const waveH = Math.min(rh*0.15, 12*vz);
    const bly = ly+rh-waveH; // baseline y for wave start
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(lx+rw, ly);
    ctx.lineTo(lx+rw, bly);
    // two-hump wave across the bottom
    ctx.bezierCurveTo(lx+rw*0.75, bly, lx+rw*0.75, ly+rh, lx+rw*0.5, ly+rh);
    ctx.bezierCurveTo(lx+rw*0.25, ly+rh, lx+rw*0.25, bly, lx, bly);
    ctx.closePath();
    if (s.fill) { ctx.fillStyle=hexFill(s.fill,s.fillOpacity); ctx.fill(); }
    ctx.stroke();
  }
  else if (s.shape === 'subprocess') {
    /* Predefined Process: rect with inner vertical double-bar */
    const lx=Math.min(s1.x,s2.x), ly=Math.min(s1.y,s2.y);
    const rw=Math.abs(s2.x-s1.x), rh=Math.abs(s2.y-s1.y);
    ctx.beginPath();
    ctx.rect(lx, ly, rw, rh);
    if (s.fill) { ctx.fillStyle=hexFill(s.fill,s.fillOpacity); ctx.fill(); }
    ctx.stroke();
    const mg = Math.min(rw*0.1, 16*vz);
    ctx.beginPath();
    ctx.moveTo(lx+mg, ly); ctx.lineTo(lx+mg, ly+rh);
    ctx.moveTo(lx+rw-mg, ly); ctx.lineTo(lx+rw-mg, ly+rh);
    ctx.stroke();
  }
  else if (s.shape === 'connector') {
    ctx.restore(); // we draw it separately
    drawConnector(s);
    return;
  }
  /* ── Label inside shape (set by double-click) ── */
  if (s.label) {
    const bb = elemBBox(s);
    if (bb) {
      const fontSize = (s.labelSize || 24) * vz;
      if (fontSize >= 6) {
        const ctr = ts(bb.x + bb.w/2, bb.y + bb.h/2);
        ctx.save();
        ctx.font = `${fontSize}px system-ui,sans-serif`;
        ctx.fillStyle = s.labelColor || (dark ? '#fff' : '#111');
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.setLineDash([]);
        const lines = s.label.split('\n');
        const lh = fontSize * 1.35;
        lines.forEach((line, i) =>
          ctx.fillText(line, ctr.x, ctr.y + (i - (lines.length-1)/2) * lh)
        );
        ctx.restore();
      }
    }
  }
  ctx.restore();
}

/* ─── Flowchart helpers ─── */
function getFlowAnchors(el) {
  /* Returns [{x,y,dir}] — 8 anchors for rect/rounded, 4 for diamond, 4 for para */
  const bb = elemBBox(el);
  if (!bb) return [];
  const {x, y, w, h} = bb, cx=x+w/2, cy=y+h/2;
  if (el.shape === 'diamond' || el.shape === 'hexagon')
    return [{x:cx,y,dir:'up'},{x:x+w,y:cy,dir:'right'},{x:cx,y:y+h,dir:'down'},{x,y:cy,dir:'left'}];
  if (el.shape === 'node' || el.shape === 'cylinder')
    return [{x:cx,y,dir:'up'},{x:x+w,y:cy,dir:'right'},{x:cx,y:y+h,dir:'down'},{x,y:cy,dir:'left'}];
  // rect, rounded, parallelogram, iopara, document, subprocess (8-anchor bounding box)
  return [
    {x:cx,   y,      dir:'up'},
    {x:x+w,  y:cy,   dir:'right'},
    {x:cx,   y:y+h,  dir:'down'},
    {x,      y:cy,   dir:'left'},
    {x,      y,      dir:'up'},
    {x:x+w,  y,      dir:'up'},
    {x:x+w,  y:y+h,  dir:'down'},
    {x,      y:y+h,  dir:'down'},
  ];
}

function _orthoPath(sx,sy,sd, tx,ty,td) {
  /* Returns [{x,y}] polyline for orthogonal (Manhattan) routing */
  const hSrc = sd==='left'||sd==='right';
  const hTgt = td==='left'||td==='right';
  if (hSrc && !hTgt) { // horizontal exit, vertical entry
    return [{x:sx,y:sy},{x:tx,y:sy},{x:tx,y:ty}];
  } else if (!hSrc && hTgt) { // vertical exit, horizontal entry
    return [{x:sx,y:sy},{x:sx,y:ty},{x:tx,y:ty}];
  } else if (hSrc) { // both horizontal → Z-shape
    const mx=(sx+tx)/2;
    return [{x:sx,y:sy},{x:mx,y:sy},{x:mx,y:ty},{x:tx,y:ty}];
  } else { // both vertical → Z-shape
    const my=(sy+ty)/2;
    return [{x:sx,y:sy},{x:sx,y:my},{x:tx,y:my},{x:tx,y:ty}];
  }
}

function resolveConnector(conn) {
  const fromEl=all.find(e=>e.id===conn.from?.elemId);
  const toEl  =all.find(e=>e.id===conn.to?.elemId);
  if (!fromEl||!toEl) return null;
  const fa=getFlowAnchors(fromEl)[conn.from.anchorIdx];
  const ta=getFlowAnchors(toEl)[conn.to.anchorIdx];
  if (!fa||!ta) return null;
  if (conn.pts && conn.pts.length >= 2) {
    const pts = conn.pts;
    const n = pts.length;
    const hSrc = fa.dir==='left'||fa.dir==='right';
    const hTgt = ta.dir==='left'||ta.dir==='right';
    if (n >= 4) {
      const prevAx=pts[0].x, prevAy=pts[0].y;
      const prevBx=pts[n-1].x, prevBy=pts[n-1].y;
      pts[0]={x:fa.x,y:fa.y};
      pts[n-1]={x:ta.x,y:ta.y};
      const aSeg=_connSegDrag?.conn===conn?_connSegDrag.segIdx:-1;
      if ((prevAx!==fa.x||prevAy!==fa.y) && aSeg!==1) {
        if (hSrc) pts[1].y=pts[0].y; else pts[1].x=pts[0].x;
      }
      if ((prevBx!==ta.x||prevBy!==ta.y) && aSeg!==n-2) {
        if (hTgt) pts[n-2].y=pts[n-1].y; else pts[n-2].x=pts[n-1].x;
      }
      return pts.map(p=>({...p}));
    }
    if (n===3) {
      pts[0]={x:fa.x,y:fa.y}; pts[2]={x:ta.x,y:ta.y};
      if (hSrc!==hTgt) {
        pts[1]= hSrc ? {x:ta.x,y:fa.y} : {x:fa.x,y:ta.y};
      } else {
        conn.pts=null;
        return _orthoPath(fa.x,fa.y,fa.dir,ta.x,ta.y,ta.dir);
      }
      return pts.map(p=>({...p}));
    }
    conn.pts=null;
  }
  if (conn.routing==='direct') return [{x:fa.x,y:fa.y},{x:ta.x,y:ta.y}];
  return _orthoPath(fa.x,fa.y,fa.dir,ta.x,ta.y,ta.dir);
}

function drawConnector(conn) {
  const pts = resolveConnector(conn);
  if (!pts||pts.length<2) return;
  ctx.save();
  ctx.strokeStyle=conn.color||geoColor; ctx.lineWidth=(conn.size||2)*vz;
  ctx.lineCap='round'; ctx.lineJoin='round';
  if (conn.dash) ctx.setLineDash([(conn.size||2)*5*vz,(conn.size||2)*3*vz]);
  ctx.beginPath();
  const p0=ts(pts[0].x,pts[0].y); ctx.moveTo(p0.x,p0.y);
  for(let i=1;i<pts.length;i++){const pi=ts(pts[i].x,pts[i].y);ctx.lineTo(pi.x,pi.y);}
  ctx.stroke();
  /* Arrowhead at end */
  if (!conn.arrow||conn.arrow!=='none') {
    ctx.setLineDash([]);
    ctx.fillStyle=conn.color||geoColor;
    const lw=(conn.size||2)*vz, hl=Math.max(14,lw*4), sp=0.42;
    const last=ts(pts[pts.length-1].x,pts[pts.length-1].y);
    const prev=ts(pts[pts.length-2].x,pts[pts.length-2].y);
    const a=Math.atan2(last.y-prev.y,last.x-prev.x);
    ctx.beginPath(); ctx.moveTo(last.x,last.y);
    ctx.lineTo(last.x-hl*Math.cos(a-sp),last.y-hl*Math.sin(a-sp));
    ctx.lineTo(last.x-hl*Math.cos(a+sp),last.y-hl*Math.sin(a+sp));
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ── Connector selection highlight (replaces generic dashed rect) ── */
function _drawConnSelHighlight(conn) {
  const pts = resolveConnector(conn);
  if (!pts||pts.length<2) return;
  ctx.save();
  /* Wide glow */
  ctx.strokeStyle='rgba(34,197,94,0.28)'; ctx.lineWidth=10*vz;
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.setLineDash([]);
  ctx.beginPath();
  const p0=ts(pts[0].x,pts[0].y); ctx.moveTo(p0.x,p0.y);
  for(let i=1;i<pts.length;i++){const pi=ts(pts[i].x,pts[i].y);ctx.lineTo(pi.x,pi.y);}
  ctx.stroke();
  /* Thin green outline */
  ctx.strokeStyle='#22c55e'; ctx.lineWidth=1.5; ctx.stroke();
  /* Endpoint drag handles — big circles at fa and ta */
  if (selected.size===1) {
    for (const ep of [pts[0], pts[pts.length-1]]) {
      const sp=ts(ep.x,ep.y);
      ctx.fillStyle='#22c55e'; ctx.strokeStyle='#fff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(sp.x,sp.y,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
    }
  }
  /* Knee handles — squares at interior points (visual only, not draggable) */
  if (selected.size===1) {
    for(let i=1;i<pts.length-1;i++){
      const sp=ts(pts[i].x,pts[i].y);
      ctx.fillStyle='#fff'; ctx.strokeStyle='#22c55e'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.rect(sp.x-5,sp.y-5,10,10); ctx.fill(); ctx.stroke();
    }
    /* Midpoint circles on ALL segments.
       Green = interior/draggable; grey = first/last (double-click to add knees) */
    const _n=pts.length;
    for(let i=0;i<_n-1;i++){
      const a=pts[i],b=pts[i+1];
      const mp=ts((a.x+b.x)/2,(a.y+b.y)/2);
      ctx.fillStyle=(i>0&&i<_n-2)?'#22c55e':'#6b7280';
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(mp.x,mp.y,5,0,Math.PI*2); ctx.fill(); ctx.stroke();
    }
  }
  ctx.restore();
}

/* ── Hit-test connector segment midpoint handles (world coords) ── */
function _getConnHandle(wx, wy) {
  const r=9/vz;
  for(const el of all){
    if(!selected.has(el.id)) continue;
    if(el.type!=='shape'||el.shape!=='connector') continue;
    const pts=resolveConnector(el); if(!pts||pts.length<2) continue;
    const n=pts.length;
    /* Endpoint handles */
    if(Math.hypot(wx-pts[0].x,wy-pts[0].y)<r*1.5)
      return {type:'endpoint',conn:el,which:'from',pts};
    if(Math.hypot(wx-pts[n-1].x,wy-pts[n-1].y)<r*1.5)
      return {type:'endpoint',conn:el,which:'to',pts};
    /* Midpoint circles on all segments */
    for(let i=0;i<n-1;i++){
      const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
      if(Math.hypot(wx-mx,wy-my)<r){
        /* Interior segments (not touching anchors) are draggable */
        const draggable=i>0&&i<n-2;
        return {type:'seg',conn:el,segIdx:i,draggable,pts};
      }
    }
  }
  return null;
}

/* Word-wrap helper */
function wrapText(txt, maxW) {
  const out = [];
  for (const raw of txt.split('\n')) {
    const words = raw.split(' '); let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; }
      else line = test;
    }
    out.push(line);
  }
  return out;
}

function drawText(t) {
  /* Skip canvas render while this element is open in the inline editor */
  if (tedEl && tedEl.id === t.id && !tedIsLabel) return;
  const sp = ts(t.x, t.y);
  const sw = (t.w || 240) * vz, sh = (t.h || 60) * vz;
  if (t._drag) {
    ctx.save();
    ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]);
    ctx.fillStyle = 'rgba(34,197,94,.06)'; ctx.fillRect(sp.x, sp.y, sw, sh);
    ctx.strokeRect(sp.x, sp.y, sw, sh);
    ctx.font = `${12*vz}px system-ui,sans-serif`; ctx.fillStyle = 'rgba(34,197,94,.5)';
    ctx.fillText('Текст', sp.x+6, sp.y+16*vz);
    ctx.restore(); return;
  }
  if (!t.text) return;
  const fs = (t.fontSize || 18) * vz;
  ctx.save();
  if (t.rotation) { const cx=sp.x+sw/2,cy=sp.y+sh/2; ctx.translate(cx,cy); ctx.rotate(t.rotation); ctx.translate(-cx,-cy); }
  ctx.font = `${t.italic?'italic ':''}${t.bold?'bold ':''}${fs}px ${t.font||'system-ui,sans-serif'}`;
  ctx.fillStyle = t.color || '#e2e8f0';
  ctx.beginPath(); ctx.rect(sp.x, sp.y, sw, sh); ctx.clip();
  const lines = wrapText(t.text, sw - 10);
  let ly = sp.y + fs;
  for (const line of lines) {
    if (ly - fs > sp.y + sh) break;
    ctx.fillText(line, sp.x + 5, ly);
    if (t.underline) {
      const mw = ctx.measureText(line).width;
      ctx.save(); ctx.strokeStyle = t.color||'#e2e8f0'; ctx.lineWidth = Math.max(1, vz);
      ctx.beginPath(); ctx.moveTo(sp.x+5, ly+2); ctx.lineTo(sp.x+5+mw, ly+2); ctx.stroke(); ctx.restore();
    }
    ly += fs * 1.35;
  }
  ctx.restore();
}

function drawSelHighlight(el) {
  /* Don't draw selection rect while the inline text editor is open — the
     dashed textarea border already shows the editing boundary */
  if (tedEl && el.id === tedEl.id && !tedIsLabel) return;
  /* Connectors get a special path-glow highlight instead of a bounding rect */
  if (el.type==='shape' && el.shape==='connector') { _drawConnSelHighlight(el); return; }
  const bb = elemBBox(el); if (!bb) return;
  const sp = ts(bb.x, bb.y);
  /* Screen-space centre of the element's bounding box */
  const cx_s = sp.x + bb.w * vz / 2;
  const cy_s = sp.y + bb.h * vz / 2;
  const rot = el.rotation || 0;
  ctx.save();
  /* Rotate the entire selection decoration around the element's screen centre */
  if (rot) { ctx.translate(cx_s, cy_s); ctx.rotate(rot); ctx.translate(-cx_s, -cy_s); }
  ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
  ctx.strokeRect(sp.x - 5, sp.y - 5, bb.w * vz + 10, bb.h * vz + 10);
  /* resize + rotation handles (single selection, or CS pair with 2 selected) */
  const csPairSel = selected.size === 2 && el.type === 'shape' && el.shape === 'line' &&
                    el.csPartner && selected.has(el.csPartner);
  if (selected.size === 1 || csPairSel) {
    ctx.setLineDash([]);
    if (el.type === 'shape' && el.shape === 'line') {
      /* Show p1/p2 endpoint handles for all lines (including CS axes) */
      for (const [pt, hname] of [[[el.x1,el.y1],'p1'],[[el.x2,el.y2],'p2']]) {
        const hsp = ts(pt[0], pt[1]);
        const lk = lineLockedHandles.has(hname);
        ctx.fillStyle = lk ? '#22c55e' : '#fff';
        ctx.strokeStyle = lk ? '#fff' : '#22c55e'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(hsp.x, hsp.y, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      }
      /* Midpoint diamond — filled blue when locked; for CS shows origin */
      const msp = ts((el.x1+el.x2)/2, (el.y1+el.y2)/2);
      const lkPm = lineLockedHandles.has('pm');
      ctx.save(); ctx.translate(msp.x, msp.y); ctx.rotate(Math.PI/4);
      ctx.fillStyle = lkPm ? '#22c55e' : '#fff';
      ctx.strokeStyle = lkPm ? '#fff' : '#22c55e'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.rect(-5,-5,10,10); ctx.fill(); ctx.stroke();
      ctx.restore();
    } else if (el.type === 'shape' && el.shape === 'triangle') {
      /* Vertex handles — circles, color-coded by snap type */
      const snapColors = { equil:'#facc15', iso:'#60a5fa', right:'#f87171' };
      for (const [vx,vy,hname] of [[el.x1,el.y1,'tv1'],[el.x2,el.y2,'tv2'],[el.x3,el.y3,'tv3']]) {
        const hsp = ts(vx, vy);
        const snap = vertexSnapState.get(`${el.id}_${hname}`);
        ctx.fillStyle = snap ? snapColors[snap] : '#fff';
        ctx.strokeStyle = snap ? '#fff' : '#22c55e'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(hsp.x, hsp.y, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      }
    } else if (el.type === 'shape' && el.shape === 'parallelogram') {
      /* Edge-midpoint handles — diamonds */
      const dx=el.x3-el.x2, dy=el.y3-el.y2;
      const Dx=el.x1+dx, Dy=el.y1+dy;
      const midPts = [
        ts((el.x1+el.x2)/2,   (el.y1+el.y2)/2),   // p_ab
        ts((el.x2+el.x3)/2,   (el.y2+el.y3)/2),   // p_bc
        ts((el.x3+Dx)/2,       (el.y3+Dy)/2),       // p_cd
        ts((Dx+el.x1)/2,       (Dy+el.y1)/2),       // p_da
      ];
      const _AB={x:el.x2-el.x1,y:el.y2-el.y1}, _BC={x:el.x3-el.x2,y:el.y3-el.y2};
      const _la2=_AB.x*_AB.x+_AB.y*_AB.y, _lb2=_BC.x*_BC.x+_BC.y*_BC.y;
      const isRect = paraSnapRect || (_la2>0&&_lb2>0&&Math.abs(_AB.x*_BC.x+_AB.y*_BC.y)/Math.sqrt(_la2*_lb2)<0.05);
      ctx.fillStyle = isRect ? '#facc15' : '#fff';
      ctx.strokeStyle = isRect ? '#fff' : '#22c55e'; ctx.lineWidth = 1.5;
      for (const hsp of midPts) {
        ctx.save(); ctx.translate(hsp.x, hsp.y); ctx.rotate(Math.PI/4);
        ctx.beginPath(); ctx.rect(-5,-5,10,10); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    } else {
      for (const pos of Object.values(getHandles(bb))) {
        const hsp = ts(pos.x, pos.y);
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.rect(hsp.x-5, hsp.y-5, 10, 10); ctx.fill(); ctx.stroke();
      }
    }
    /* rotation handle — only for single selection (not for code widgets) */
    if (!csPairSel && el.type !== 'code') {
      const rhx = sp.x - 5 + (bb.w * vz + 10) / 2;
      const rhy = sp.y - 5 - 26;
      ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1; ctx.setLineDash([3,2]);
      ctx.beginPath(); ctx.moveTo(rhx, sp.y - 5); ctx.lineTo(rhx, rhy + 7); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(rhx, rhy, 7, 0, Math.PI*2);
      ctx.fillStyle = '#22c55e'; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 9px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('↻', rhx, rhy);
    }
  }
  ctx.restore();
}

function drawSelBox() {
  if (!selBox) return;
  const x = Math.min(selBox.x1, selBox.x2), y = Math.min(selBox.y1, selBox.y2);
  const w = Math.abs(selBox.x2 - selBox.x1), h = Math.abs(selBox.y2 - selBox.y1);
  ctx.save();
  ctx.fillStyle = 'rgba(34,197,94,.07)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]);
  ctx.strokeRect(x, y, w, h);
  ctx.restore();
}

// ══════════════════════════════════════════════════════════
// §11b  COORDINATE SYSTEM RENDERING
// ══════════════════════════════════════════════════════════

/* Draw a text label on canvas, always readable (not affected by transform) */
function drawCSLabel(txt, wx, wy, color) {
  const sp = ts(wx, wy);
  ctx.save();
  ctx.font = `${Math.max(9, 11*vz)}px system-ui,sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, sp.x, sp.y);
  ctx.restore();
}

/* Return a color that is readable on the current canvas background.
   In dark mode, very dark colors (luminance < 60) are replaced with the accent. */
function readableColor(c) {
  if (!dark) return c;
  const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c);
  if (!m) return c;
  const lum = 0.299*parseInt(m[1],16) + 0.587*parseInt(m[2],16) + 0.114*parseInt(m[3],16);
  return lum < 60 ? '#22c55e' : c;
}

/* Draw tick marks and numeric labels on one CS axis line.
   csTickStep: CS units per tick (default 1); csScale: world px per CS unit. */
function drawCSTicks(el, origin, color, offset) {
  const offV   = offset || 0;
  const scale  = el.csScale    || 50;  // world px per CS unit
  const tStep  = el.csTickStep != null ? el.csTickStep : 1;  // CS units per tick
  const tickPx = scale * tStep;        // world px per tick
  if (tickPx <= 0) return;

  const dir    = csPositiveDir(el);
  const tickLen = 7 / vz;             // perp tick length in world units
  const px = -dir.y, py = dir.x;     // perpendicular

  const toPosEnd = { x: dir.posEnd.x - origin.x, y: dir.posEnd.y - origin.y };
  const toNegEnd = { x: dir.negEnd.x - origin.x, y: dir.negEnd.y - origin.y };
  const posLen = Math.max(0, toPosEnd.x * dir.x + toPosEnd.y * dir.y);
  const negLen = Math.max(0, -(toNegEnd.x * dir.x + toNegEnd.y * dir.y));

  const nPos = Math.min(200, Math.floor(posLen / tickPx));
  const nNeg = Math.min(200, Math.floor(negLen / tickPx));

  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 1 * vz;
  ctx.fillStyle   = color;

  for (let k = -nNeg; k <= nPos; k++) {
    if (k === 0 && Math.abs(offV) < 1e-9) continue;   // hide tick at physical O only when no offset
    const worldVal = k * tStep;                         // physical distance from O (world CS)
    const csVal    = offV + worldVal;                   // displayed mathematical label
    const wx = origin.x + worldVal * scale * dir.x;    // world position (physical tick)
    const wy = origin.y + worldVal * scale * dir.y;
    const sp  = ts(wx, wy);
    const tp1 = ts(wx + px*tickLen, wy + py*tickLen);
    const tp2 = ts(wx - px*tickLen, wy - py*tickLen);
    ctx.beginPath(); ctx.moveTo(tp1.x, tp1.y); ctx.lineTo(tp2.x, tp2.y); ctx.stroke();
    // label offset perpendicular
    const lsp = ts(wx + px*tickLen*2.5, wy + py*tickLen*2.5);
    ctx.save();
    ctx.font = `${Math.max(7, Math.round(10*vz))}px system-ui`;
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lbl = Number.isInteger(csVal) ? String(csVal) : parseFloat(csVal.toPrecision(6)).toString();
    ctx.fillText(lbl, lsp.x, lsp.y);
    ctx.restore();
  }
  ctx.restore();
}

/* Clip path = parallelogram defined by two vectors from origin */
function csParallelogramPath(O, ua, ub) {
  // ua = positive end - O  for line A
  // ub = positive end - O  for line B
  const A = ts(O.x + ua.x, O.y + ua.y);
  const B = ts(O.x + ub.x, O.y + ub.y);
  const AB = ts(O.x + ua.x + ub.x, O.y + ua.y + ub.y);
  const Os = ts(O.x, O.y);
  ctx.beginPath();
  ctx.moveTo(Os.x, Os.y);
  ctx.lineTo(A.x,  A.y);
  ctx.lineTo(AB.x, AB.y);
  ctx.lineTo(B.x,  B.y);
  ctx.closePath();
}

/* ─── Marching squares: draw contour of f(a,b)=0 in CS space ─── */
function marchingSquares(fn, ra, rb, toWorld, GRID) {
  const da = 2*ra/GRID, db = 2*rb/GRID;
  // pre-compute grid values
  const V = [];
  for (let j = 0; j <= GRID; j++) {
    V[j] = [];
    for (let i = 0; i <= GRID; i++) {
      const v = fn(-ra + i*da, -rb + j*db);
      V[j][i] = isFinite(v) ? v : NaN;
    }
  }
  const cross = (va, vb) => (va < 0) !== (vb < 0);
  const lerp  = (va, vb, v0, v1) => {
    const t = Math.abs(vb-va) < 1e-12 ? 0.5 : -va/(vb-va);
    return v0 + t*(v1-v0);
  };
  ctx.beginPath();
  for (let j = 0; j < GRID; j++) {
    for (let i = 0; i < GRID; i++) {
      const a0=-ra+i*da, b0=-rb+j*db, a1=a0+da, b1=b0+db;
      const vBL=V[j][i], vBR=V[j][i+1], vTR=V[j+1][i+1], vTL=V[j+1][i];
      if (!isFinite(vBL)||!isFinite(vBR)||!isFinite(vTR)||!isFinite(vTL)) continue;
      const pts = [];
      if (cross(vBL,vBR)) pts.push({a:lerp(vBL,vBR,a0,a1), b:b0});
      if (cross(vBR,vTR)) pts.push({a:a1,                   b:lerp(vBR,vTR,b0,b1)});
      if (cross(vTR,vTL)) pts.push({a:lerp(vTR,vTL,a1,a0), b:b1});
      if (cross(vTL,vBL)) pts.push({a:a0,                   b:lerp(vTL,vBL,b1,b0)});
      const seg = (p0, p1) => {
        const w0=toWorld(p0.a,p0.b), s0=ts(w0.x,w0.y);
        const w1=toWorld(p1.a,p1.b), s1=ts(w1.x,w1.y);
        ctx.moveTo(s0.x,s0.y); ctx.lineTo(s1.x,s1.y);
      };
      if (pts.length===2) seg(pts[0],pts[1]);
      else if (pts.length===4) { seg(pts[0],pts[1]); seg(pts[2],pts[3]); }
    }
  }
  ctx.stroke();
}

/* Plot one graph equation in CS space, clipped to the parallelogram */
function drawCSGraph(O, uA, uB, scaleA, scaleB, graph, offA, offB, params) {
  const ao = offA || 0, bo = offB || 0;
  /* For calculus expressions use the resolved equation; skip if still computing */
  if (graph.resolving) return;
  if (graph.plottable === false) return;
  const _plotEq = graph.resolvedEq || graph.eq;
  const parsed = parseEqn(_plotEq);
  if (!parsed) return;
  const color = graph.color || '#ef4444';
  const lw    = Math.max(1, (graph.width||2) * vz);
  const dash  = graph.dash||'solid';

  const lenA = Math.hypot(uA.x, uA.y);
  const lenB = Math.hypot(uB.x, uB.y);
  const rangeA = lenA / scaleA;
  const rangeB = lenB / scaleB;
  const nA = { x:uA.x/lenA, y:uA.y/lenA };
  const nB = { x:uB.x/lenB, y:uB.y/lenB };
  /* toWorld maps DISPLAY coordinates (a_disp, b_disp) → world.
     Display origin is at physical O; disp(a) = math(a) - ao */
  const toWorld = (a, b) => ({
    x: O.x + a*scaleA*nA.x + b*scaleB*nB.x,
    y: O.y + a*scaleA*nA.y + b*scaleB*nB.y
  });

  /* clip region: full 4-quadrant parallelogram (always physical O) */
  ctx.save();
  const negA={x:-uA.x,y:-uA.y}, negB={x:-uB.x,y:-uB.y};
  const c1=ts(O.x+uA.x+uB.x,  O.y+uA.y+uB.y);
  const c2=ts(O.x+negA.x+uB.x,O.y+negA.y+uB.y);
  const c3=ts(O.x+negA.x+negB.x,O.y+negA.y+negB.y);
  const c4=ts(O.x+uA.x+negB.x,O.y+uA.y+negB.y);
  ctx.beginPath();
  ctx.moveTo(c1.x,c1.y); ctx.lineTo(c2.x,c2.y);
  ctx.lineTo(c3.x,c3.y); ctx.lineTo(c4.x,c4.y);
  ctx.closePath(); ctx.clip();

  ctx.strokeStyle = color;
  ctx.lineWidth   = lw;
  ctx.lineJoin    = 'round'; ctx.lineCap = 'round';

  const { mode } = parsed;
  const _isIneq  = !!parsed.ineq;
  const _isStrict = parsed.ineq === 'lt' || parsed.ineq === 'gt';

  /* ── helper: draw semi-transparent fill for explicit (yfx/xfy) inequality ── */
  const _drawIneqFill = (path) => {
    const _fillLow = parsed.ineq === 'lt' || parsed.ineq === 'lte';
    const _EDGE = (rangeA + rangeB) * 12;
    /* Split path into continuous segments (gaps are NaN breaks) */
    const _segs = []; let _cur = [];
    for (const pt of path) {
      if (!pt) { if (_cur.length) { _segs.push(_cur); _cur = []; } } else _cur.push(pt);
    }
    if (_cur.length) _segs.push(_cur);
    ctx.save();
    ctx.globalAlpha *= 0.22;
    ctx.fillStyle = color;
    ctx.beginPath();
    for (const _seg of _segs) {
      if (_seg.length < 2) continue;
      if (mode === 'yfx') {
        const _eB = _fillLow ? -_EDGE : _EDGE;
        const _w0 = toWorld(_seg[0].a, _eB), _s0 = ts(_w0.x, _w0.y);
        ctx.moveTo(_s0.x, _s0.y);
        for (const pt of _seg) { const _w=toWorld(pt.a,pt.b),_s=ts(_w.x,_w.y); ctx.lineTo(_s.x,_s.y); }
        const _wn = toWorld(_seg[_seg.length-1].a, _eB), _sn = ts(_wn.x, _wn.y);
        ctx.lineTo(_sn.x, _sn.y);
      } else {
        const _eA = _fillLow ? -_EDGE : _EDGE;
        const _w0 = toWorld(_eA, _seg[0].b), _s0 = ts(_w0.x, _w0.y);
        ctx.moveTo(_s0.x, _s0.y);
        for (const pt of _seg) { const _w=toWorld(pt.a,pt.b),_s=ts(_w.x,_w.y); ctx.lineTo(_s.x,_s.y); }
        const _wn = toWorld(_eA, _seg[_seg.length-1].b), _sn = ts(_wn.x, _wn.y);
        ctx.lineTo(_sn.x, _sn.y);
      }
      ctx.closePath();
    }
    ctx.fill();
    ctx.restore();
  };

  if (mode==='implicit') {
    /* ── marching squares: evaluate F(a+ao, b+bo) - G(a+ao, b+bo) = 0 ── */
    const fn = (a, b) => mathEval(parsed.lhs, a+ao, b+bo, params) - mathEval(parsed.rhs, a+ao, b+bo, params);
    const GRID = Math.min(120, Math.max(60, Math.round(Math.max(rangeA,rangeB)*4)));
    /* ── inequality fill: sample grid, paint cells on correct side ── */
    if (_isIneq) {
      const _fillNeg = parsed.ineq === 'lt' || parsed.ineq === 'lte';
      const _FG = 50, _sa = 2*rangeA/_FG, _sb = 2*rangeB/_FG;
      ctx.save(); ctx.globalAlpha *= 0.22; ctx.fillStyle = color; ctx.beginPath();
      for (let _i=0; _i<_FG; _i++) for (let _j=0; _j<_FG; _j++) {
        const _a=-rangeA+(_i+.5)*_sa, _b=-rangeB+(_j+.5)*_sb;
        const _v = fn(_a, _b);
        if (!isFinite(_v)) continue;
        if (_fillNeg ? _v<0 : _v>0) {
          const _c = [[-rangeA+_i*_sa,-rangeB+_j*_sb],[-rangeA+(_i+1)*_sa,-rangeB+_j*_sb],
                      [-rangeA+(_i+1)*_sa,-rangeB+(_j+1)*_sb],[-rangeA+_i*_sa,-rangeB+(_j+1)*_sb]]
            .map(([_a2,_b2])=>{ const _w=toWorld(_a2,_b2); return ts(_w.x,_w.y); });
          ctx.moveTo(_c[0].x,_c[0].y); ctx.lineTo(_c[1].x,_c[1].y);
          ctx.lineTo(_c[2].x,_c[2].y); ctx.lineTo(_c[3].x,_c[3].y); ctx.closePath();
        }
      }
      ctx.fill(); ctx.restore();
    }
    /* boundary line: dashed if strict inequality, else use graph dash setting */
    if (_isIneq && _isStrict) ctx.setLineDash([6*vz, 5*vz]);
    else if (dash==='dashed') ctx.setLineDash([8*vz, 6*vz]);
    else if (dash==='dotted') ctx.setLineDash([2*vz, 5*vz]);
    else ctx.setLineDash([]);
    marchingSquares(fn, rangeA, rangeB, toWorld, GRID);
  } else {
    /* ── parametric plot: sweep display coords, evaluate at shifted CS values ──
       Path is cached by equation+range+offset so mathEval is skipped on redraws
       where only vz/pan changed (world coords are stable, only screen mapping changes) */
    const STEPS = 600;
    const independent = (mode==='yfx') ? rangeA : rangeB;
    const paramsKey = params ? Object.keys(params).sort().map(k=>`${k}=${params[k]}`).join('&') : '';
    const cacheKey = `${graph.eq}|${mode}|${ao}|${bo}|${scaleA}|${scaleB}|${independent.toFixed(4)}|${paramsKey}`;
    let path = _graphPathCache.get(cacheKey);
    if (!path) {
      /* Compute and cache the path in display (a,b) coords — vz-independent */
      path = [];
      const step = 2*independent/STEPS;
      const paramNames = params ? Object.keys(params).sort() : [];
      const evalFn = _compileMathFn(parsed.rhs, paramNames);
      const evalArgs = paramNames.map(n => params ? (params[n] ?? 1) : 1);
      for (let i = 0; i <= STEPS; i++) {
        const v = -independent + i*step;
        let a, b;
        if (mode==='yfx') {
          a = v;
          try { b = (evalFn ? evalFn(a+ao, 0, ...evalArgs) : mathEval(parsed.rhs, a+ao, 0, params)) - bo; } catch { b = NaN; }
        } else {
          b = v;
          try { a = (evalFn ? evalFn(0, b+bo, ...evalArgs) : mathEval(parsed.rhs, 0, b+bo, params)) - ao; } catch { a = NaN; }
        }
        path.push(isFinite(a)&&isFinite(b)&&Math.abs(b)<=rangeB*50&&Math.abs(a)<=rangeA*50 ? {a,b} : null);
      }
      /* Limit cache size to avoid memory bloat */
      if (_graphPathCache.size > 200) _graphPathCache.clear();
      _graphPathCache.set(cacheKey, path);
    }
    /* fill inequality region before drawing boundary line */
    if (_isIneq) _drawIneqFill(path);
    /* boundary line: dashed if strict inequality, else use graph dash setting */
    if (_isIneq && _isStrict) ctx.setLineDash([6*vz, 5*vz]);
    else if (dash==='dashed') ctx.setLineDash([8*vz, 6*vz]);
    else if (dash==='dotted') ctx.setLineDash([2*vz, 5*vz]);
    else ctx.setLineDash([]);
    ctx.beginPath();
    let penDown = false;
    for (const pt of path) {
      if (!pt) { penDown=false; continue; }
      const _w=toWorld(pt.a,pt.b); const sp=ts(_w.x,_w.y);
      if (!penDown) { ctx.moveTo(sp.x,sp.y); penDown=true; }
      else ctx.lineTo(sp.x,sp.y);
    }
    ctx.stroke();
  }

  ctx.setLineDash([]);
  ctx.restore();
}

/* ═══ CS Graph Extras: hover, intersections, algebraic ═══ */

function csWorldToDisplay(wx,wy,O,nA,nB,scaleA,scaleB){
  const dx=wx-O.x,dy=wy-O.y,det=nA.x*nB.y-nA.y*nB.x;
  if(Math.abs(det)<1e-9)return null;
  return{a:(dx*nB.y-dy*nB.x)/det/scaleA,b:(nA.x*dy-nA.y*dx)/det/scaleB};
}
/* ══════════════════════════════════════════════════════════
   Exact-value arithmetic + LaTeX canvas renderer
   ══════════════════════════════════════════════════════════ */
function _gcd(a,b){a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){[a,b]=[b,a%b];}return a||1;}
function _lcm(a,b){const g=_gcd(Math.abs(a),Math.abs(b));return g?Math.abs(a)*Math.abs(b)/g:0;}
function _lcm3(a,b,c){return _lcm(_lcm(a,b),c);}

/* Snap float → reduced [p,q] fraction, or null */
function _snapRat(x,maxD=144){
  const eps=6e-7,sg=x<0?-1:1,ax=Math.abs(x);
  if(ax<eps)return[0,1];
  for(let q=1;q<=maxD;q++){const p=Math.round(ax*q);if(p&&Math.abs(ax-p/q)<eps){const g=_gcd(p,q);return[sg*p/g,q/g];}}
  return null;
}

/* ── Canvas segment types ──────────────────────────────────
   {k:'t',s:string}         plain text
   {k:'f',n:Seg[],d:Seg[]}  stacked fraction  (n/d)
   {k:'r',c:Seg[]}          √ with overline
   ───────────────────────────────────────────────────────── */
function _measSegs(segs,fs){
  ctx.font=`bold ${fs}px monospace`;
  let w=0;
  for(const seg of segs){
    if(seg.k==='t'){w+=ctx.measureText(seg.s).width;}
    else if(seg.k==='f'){const sfs=fs*0.72;w+=Math.max(_measSegs(seg.n,sfs),_measSegs(seg.d,sfs))+6;}
    else if(seg.k==='r'){ctx.font=`bold ${fs}px monospace`;w+=ctx.measureText('√').width+_measSegs(seg.c,fs*0.82)+3;}
  }
  return w;
}
function _drawSegs(segs,x,y,fs,col){
  ctx.font=`bold ${fs}px monospace`;ctx.fillStyle=col;
  let cx=x;
  for(const seg of segs){
    if(seg.k==='t'){ctx.fillText(seg.s,cx,y);cx+=ctx.measureText(seg.s).width;}
    else if(seg.k==='f'){
      const sfs=fs*0.72;
      const nw=_measSegs(seg.n,sfs),dw=_measSegs(seg.d,sfs);
      const bw=Math.max(nw,dw)+6;
      const mid=y-fs*0.22;
      _drawSegs(seg.n,cx+(bw-nw)/2,mid-3,sfs,col);
      ctx.save();ctx.beginPath();ctx.moveTo(cx,mid+1.5);ctx.lineTo(cx+bw,mid+1.5);
      ctx.lineWidth=1.2;ctx.strokeStyle=col;ctx.stroke();ctx.restore();
      _drawSegs(seg.d,cx+(bw-dw)/2,mid+sfs+3,sfs,col);
      ctx.font=`bold ${fs}px monospace`;cx+=bw;
    } else if(seg.k==='r'){
      const sfs=fs*0.82;const sw=ctx.measureText('√').width;
      const cw=_measSegs(seg.c,sfs);
      ctx.fillText('√',cx,y);
      ctx.save();ctx.beginPath();
      ctx.moveTo(cx+sw-1,y-fs*0.75);ctx.lineTo(cx+sw+cw+3,y-fs*0.75);
      ctx.lineWidth=1.2;ctx.strokeStyle=col;ctx.stroke();ctx.restore();
      _drawSegs(seg.c,cx+sw,y,sfs,col);
      ctx.font=`bold ${fs}px monospace`;cx+=sw+cw+3;
    }
  }
  return cx-x;
}

/* ── Exact value types ─────────────────────────────────────
   {t:'rat', p, q}             value = p/q
   {t:'surd', p, s, n, q}      value = (p + s*sqrt(n)) / q
   {t:'dec', v}                fallback decimal
   ───────────────────────────────────────────────────────── */
/* Base exact-val detection (no recursion into sqrtsurd) */
function _toExactBase(x, tol=3e-6){
  if(!isFinite(x))return{t:'dec',v:x};
  const r=_snapRat(x);
  if(r)return{t:'rat',p:r[0],q:r[1]};
  const sg=x<0?-1:1,ax=Math.abs(x);
  for(let n=2;n<=300;n++){
    if(Number.isInteger(Math.sqrt(n)))continue;
    const sqn=Math.sqrt(n);
    const rk=_snapRat(ax/sqn,48);
    if(rk&&rk[0]>0&&Math.abs(rk[0]/rk[1]*sqn-ax)<tol){const g=_gcd(Math.abs(rk[0]),rk[1]);return{t:'surd',p:0,s:sg*rk[0]/g,n,q:rk[1]/g};}
    for(let q=1;q<=28;q++){
      for(let s=-6;s<=6;s++){
        if(s===0)continue;
        const rem=ax*q-s*sqn,pr=Math.round(rem);
        if(Math.abs(rem-pr)<tol&&Math.abs((pr+s*sqn)/q-ax)<tol){
          const gv=_gcd(_gcd(Math.abs(pr)||1,Math.abs(s)),q);
