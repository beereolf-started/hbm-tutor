<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HBM — Вход</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#7d8590;--green:#1a7f37;--green-h:#2ea043;--green-t:#3fb950}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;width:360px;max-width:90vw;box-shadow:0 8px 40px #0008}
h1{text-align:center;margin-bottom:6px;font-size:1.7em;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px}
h1 svg{flex-shrink:0}
.sub{text-align:center;color:var(--muted);margin-bottom:28px;font-size:.9em}
input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.95em;margin-bottom:10px;outline:none;transition:border-color .15s}
input:focus{border-color:var(--green-t)}
button{width:100%;padding:11px;border:none;border-radius:8px;background:var(--green);color:#fff;font-size:.95em;cursor:pointer;font-weight:600;transition:background .15s}
button:hover{background:var(--green-h)}
.err{color:#f87171;text-align:center;margin-top:10px;font-size:.88em;display:none}
.chpw{display:none}.chpw h2{font-size:1.15em;margin-bottom:14px;font-weight:600}
</style></head><body>
<div class="card">
<div id="loginForm">
<h1><svg width="38" height="38" viewBox="0 0 100 100" fill="none" stroke="#3fb950" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><line x1="16" y1="12" x2="16" y2="88"/><line x1="16" y1="50" x2="54" y2="50"/><line x1="54" y1="12" x2="88" y2="12"/><line x1="54" y1="12" x2="88" y2="50"/><line x1="88" y1="50" x2="54" y2="88"/><line x1="54" y1="88" x2="88" y2="88"/></svg>HBM</h1><p class="sub">Платформа репетитора</p>
<input id="login" placeholder="Логин" autocomplete="username">
<input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
<button onclick="doLogin()">Войти</button>
<p class="err" id="err"></p>
</div>
<div id="chpw" class="chpw">
<h2>&#128274; Первый вход</h2>
<p class="sub" style="margin-bottom:18px;line-height:1.5">Это ваш первый вход. Придумайте постоянный пароль для аккаунта&nbsp;<strong id="chpwName"></strong>.</p>
<label style="display:block;font-size:.82em;color:var(--muted);margin-bottom:4px">Текущий пароль (выданный администратором)</label>
<input id="oldPw" type="password" placeholder="Текущий пароль">
<label style="display:block;font-size:.82em;color:var(--muted);margin-bottom:4px;margin-top:6px">Новый пароль</label>
<input id="newPw" type="password" placeholder="Минимум 6 символов" onkeydown="if(event.key==='Enter')doChange()">
<button onclick="doChange()" style="margin-top:8px">Сохранить и войти</button>
<p class="err" id="err2"></p>
</div>
</div>
<script src="/api.js"></script>
<script>
const ROUTES={owner:'/hbm_tutor.html',tutor:'/hbm_tutor.html',student:'/student_lk.html',parent:'/parent_lk.html',board_user:'/board_user_lk.html'};
if(localStorage.getItem('token')){const r=role();if(r&&ROUTES[r])location.href=ROUTES[r]}
async function doLogin(){
    const e=document.getElementById('err');e.style.display='none';
    try{
        const d=await post('/api/auth/login',{login:document.getElementById('login').value,password:document.getElementById('pw').value});
        localStorage.setItem('token',d.token);localStorage.setItem('role',d.role);localStorage.setItem('name',d.name);
        if(d.must_change_password){document.getElementById('loginForm').style.display='none';const cp=document.getElementById('chpw');cp.style.display='block';document.getElementById('oldPw').value=document.getElementById('pw').value;const nm=document.getElementById('chpwName');if(nm)nm.textContent=d.name||'';document.getElementById('newPw').focus();return}
        location.href=ROUTES[d.role]||'/hbm_tutor.html';
    }catch(x){e.textContent=x.detail||'Ошибка';e.style.display='block'}}
async function doChange(){
    const e=document.getElementById('err2');e.style.display='none';
    try{
        await post('/api/auth/change-password',{old_password:document.getElementById('oldPw').value,new_password:document.getElementById('newPw').value});
        location.href=ROUTES[role()]||'/hbm_tutor.html';
    }catch(x){e.textContent=x.detail||'Ошибка';e.style.display='block'}}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
</script></body></html>
