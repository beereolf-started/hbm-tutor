<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HBM — Мой кабинет</title>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface-2:#21262d;--border:#30363d;
  --text:#e6edf3;--muted:#7d8590;--green:#1a7f37;--green-h:#2ea043;--green-t:#3fb950;
  --red:#b91c1c;--blue:#1f6feb;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--green-t);text-decoration:none}a:hover{text-decoration:underline}

.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-logo{font-weight:700;font-size:1em;display:flex;align-items:center;gap:8px}
.topbar-logo svg{width:20px;height:20px;fill:none}
.topbar-r{display:flex;align-items:center;gap:10px}
.topbar-name{color:var(--muted);font-size:.88em}
.link-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.85em;padding:4px 8px;border-radius:6px}
.link-btn:hover{background:var(--surface-2);color:var(--text)}
.notif-btn{position:relative;background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.1em;padding:4px 8px;border-radius:6px;line-height:1}
.notif-btn:hover{background:var(--surface-2)}
.notif-badge{position:absolute;top:0;right:0;background:#ef4444;color:#fff;font-size:.6em;font-weight:700;padding:1px 4px;border-radius:10px;min-width:14px;text-align:center;display:none}
.notif-panel{position:fixed;top:52px;right:12px;width:320px;max-height:440px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 30px #0008;z-index:200;display:none;flex-direction:column;overflow:hidden}
.notif-panel.open{display:flex}
.notif-panel-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:.88em;flex-shrink:0}
.notif-panel-body{overflow-y:auto;flex:1}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:var(--surface-2)}
.notif-item.unread{background:#1a2a1a}
.notif-item-text{font-size:.85em;line-height:1.4}
.notif-item-time{font-size:.75em;color:var(--muted);margin-top:3px}
.notif-msgs-row{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:.85em;cursor:pointer}
.notif-msgs-row:hover{background:var(--surface-2)}
.notif-empty{padding:24px;text-align:center;color:var(--muted);font-size:.85em}

.wrap{max-width:860px;margin:0 auto;padding:28px 20px}

/* ── HOME DASHBOARD ── */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:4px}
.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px 20px;cursor:pointer;transition:border-color .15s,transform .1s;text-decoration:none;display:block;color:var(--text)}
.dash-card:hover{border-color:var(--green-t);transform:translateY(-1px)}
.dash-card-icon{font-size:2em;margin-bottom:10px}
.dash-card h3{font-size:1em;font-weight:600;margin-bottom:4px}
.dash-card-sub{color:var(--muted);font-size:.82em}
.dash-card-count{font-size:1.6em;font-weight:700;color:var(--green-t);line-height:1;margin-bottom:2px}

/* ── SECTION HEADER ── */
.sec-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.back-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 12px;cursor:pointer;color:var(--muted);font-size:.85em}
.back-btn:hover{background:var(--surface-2);color:var(--text)}
.sec-title{font-size:1.1em;font-weight:700;flex:1}

/* ── COURSE INFO BLOCK ── */
.course-head{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.course-head-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.course-head-title{font-size:1.05em;font-weight:700}
.course-head-meta{color:var(--muted);font-size:.85em;margin-top:3px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.btn-board{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85em;text-decoration:none;cursor:pointer;transition:border-color .15s}
.btn-board:hover{border-color:var(--green-t);color:var(--green-t)}
.goal{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.75em;font-weight:600}
.goal-ege{background:#2d1f5e;color:#a78bfa}.goal-olymp{background:#3a2a00;color:#fbbf24}.goal-base{background:#0d2e1e;color:#34d399}

/* ── PRICE ── */
.price-block{background:var(--surface-2);border-radius:10px;padding:14px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:14px}
.price-cur{font-size:1.4em;font-weight:700;color:var(--green-t);line-height:1}
.price-base{font-size:.8em;color:var(--muted);text-decoration:line-through;margin-top:1px}
.price-disc{font-size:.83em;color:#fbbf24;font-weight:500}
.price-prog{height:5px;background:var(--border);border-radius:3px;flex:1;min-width:70px;max-width:140px}
.price-prog-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green-t));border-radius:3px;transition:width .4s}

/* ── SECTIONS ── */
.sec{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.sec.locked{border-color:#1a5e32}
.sec-h{padding:13px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.sec-h:hover{background:var(--surface-2)}
.sec-h h3{font-size:.92em;font-weight:600;display:flex;align-items:center;gap:8px;flex:1}
.sec-body{padding:0 16px 14px;display:none}
.sec.open .sec-body{display:block}
.lock-badge{font-size:.72em;padding:2px 7px;border-radius:20px;background:#0d2e1e;color:var(--green-t);border:1px solid #1a5e32}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:.72em;padding:2px 7px;border-radius:20px;font-weight:600}
.b-ctrl-pass{background:#0d2e1e;color:#34d399}.b-ctrl-fail{background:#2d0d0d;color:#f87171}.b-ctrl-none{background:var(--surface-2);color:var(--muted)}
.b-idz{background:#1a1040;color:#a78bfa}

/* ── ITEMS ── */
.item{padding:8px 10px;background:var(--surface-2);border-radius:6px;margin-bottom:4px;display:flex;align-items:center;gap:8px;font-size:.87em;border:1px solid transparent}
.item:hover{border-color:var(--border)}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.st-none{background:#1c5e30}.st-progress{background:#f59e0b}.st-done{background:#10b981}
.grade-sel{padding:3px 8px;font-size:.82em;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.grade-sel:disabled{opacity:.6}
.grade-5{border-color:var(--green-t)!important;color:var(--green-t)!important}
.grade-4{border-color:#84cc16!important;color:#bef264!important}
.grade-3{border-color:#eab308!important;color:#fde047!important}
.grade-2{border-color:#f97316!important;color:#fdba74!important}
.grade-1{border-color:#ef4444!important;color:#fca5a5!important}
.sec-footer{border-top:1px solid var(--border);padding:10px 16px;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.panel-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-lbl{font-size:.85em;font-weight:600}
.panel-lbl-ctrl{color:var(--green-t)}.panel-lbl-idz{color:#a78bfa}
.idz-desc{font-size:.8em;color:var(--muted);flex:1}
.subblocks{margin-top:4px;margin-left:16px}
.subblock{padding:5px 9px;background:var(--bg);border-radius:5px;margin-bottom:3px;border-left:2px solid var(--border);font-size:.82em;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.subblock.sb-media{border-left-color:#6e40c9}
.subblock a{font-size:.9em;color:var(--green-t)}

/* ── COURSE GROUP ── */
.course-grp{margin-bottom:16px}
.course-grp-hd{background:var(--surface);border:1px solid var(--border);border-radius:10px 10px 0 0;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.course-grp-title{font-size:.95em;font-weight:700}
.course-grp-meta{color:var(--muted);font-size:.82em;margin-top:2px}
.course-grp-body{border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;overflow:hidden;padding:8px 8px 4px}
/* ── STUDENT ANSWER ── */
.st-ans-wrap{margin:5px 0 2px 16px}
.st-ans-area{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font-size:.82em;resize:vertical;min-height:44px;font-family:inherit;outline:none}
.st-ans-area:focus{border-color:var(--green-t)}
.st-ans-row{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.st-ans-btn{padding:4px 10px;background:var(--green);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.8em}
.st-ans-sent{font-size:.78em;color:var(--green-t)}
.st-att-list{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.st-att-item{display:flex;align-items:center;gap:6px;font-size:.79em;padding:3px 6px;background:var(--bg);border-radius:4px;border:1px solid var(--border)}
.st-att-item a{color:var(--green-t);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-att-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.9em;padding:0 2px;line-height:1}
.st-att-del:hover{color:#f87171}
.st-upload-lbl{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:.79em;color:var(--muted)}
.st-upload-lbl:hover{border-color:var(--green-t);color:var(--green-t)}
/* ── SCHEDULE ── */
.sched-wrap{overflow-x:auto;margin-top:4px}
.sched-tbl{border-collapse:collapse;width:100%;min-width:500px;font-size:.82em}
.sched-tbl th,.sched-tbl td{border:1px solid var(--border);padding:2px 4px;vertical-align:top}
.sched-tbl th{background:var(--surface-2);text-align:center;font-weight:600;font-size:.82em;padding:5px 4px}
.sched-tbl .tc{color:var(--muted);font-size:.75em;text-align:right;padding:2px 5px;white-space:nowrap;min-width:38px}
.sched-chip{border-radius:5px;padding:3px 6px;cursor:pointer;font-size:.82em;display:block;line-height:1.35;transition:opacity .15s}
.sched-chip:hover{opacity:.8}
.sched-chip b{font-weight:600;display:block;white-space:nowrap}
.sched-note-area{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:5px 7px;color:var(--text);font-size:.8em;resize:none;height:40px;font-family:inherit;outline:none;margin-top:5px}
.sched-note-area:focus{border-color:var(--green-t)}

/* ── PLATFORM COURSES ── */
.course-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.course-card:hover{border-color:var(--green-t)}
.course-card h3{font-size:.95em;font-weight:600;margin-bottom:4px}
.access-pill{font-size:.7em;padding:1px 7px;border-radius:20px;font-weight:600}
.access-public{background:#0d2e1e;color:#34d399}

/* ── PLATFORM COURSE DETAIL ── */
.pc-sec{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.pc-sec-h{padding:11px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.pc-sec-h:hover{background:var(--surface-2)}
.pc-sec-h h4{font-size:.88em;font-weight:600}
.pc-sec-body{padding:0 14px 12px;display:none}
.pc-sec.open .pc-sec-body{display:block}
.pc-item{padding:6px 8px;background:var(--surface-2);border-radius:5px;margin-bottom:3px;font-size:.84em;display:flex;align-items:center;gap:7px}

/* ── CONTACTS ── */
.contact-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.contact-avatar{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1em;font-weight:700;flex-shrink:0}
.contact-info{flex:1;min-width:0}
.contact-name{font-size:.95em;font-weight:600;margin-bottom:2px}
.contact-sub{color:var(--muted);font-size:.82em}
.btn-msg{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.82em;cursor:pointer;transition:border-color .15s}
.btn-msg:hover{border-color:var(--green-t);color:var(--green-t)}

/* ── MESSAGES OVERLAY ── */
#msgOverlay{display:none;position:fixed;inset:0;background:#000c;z-index:200;align-items:flex-end;justify-content:flex-end}
.msg-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px 12px 0 0;width:380px;max-width:100vw;height:72vh;display:flex;flex-direction:column}
.msg-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.msg-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.msg-foot{padding:10px;border-top:1px solid var(--border);display:flex;gap:6px;flex-shrink:0}
.msg-bubble{max-width:76%;padding:8px 12px;border-radius:12px;font-size:.87em;line-height:1.4}
.msg-mine{background:var(--green);color:#fff;align-self:flex-end;border-radius:12px 12px 4px 12px}
.msg-their{background:var(--surface-2);color:var(--text);align-self:flex-start;border-radius:12px 12px 12px 4px}

/* ── EMPTY ── */
.empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:.9em}
/* Code block */
.code-block{margin-top:6px;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.code-block-label{font-size:.73em;color:var(--muted);padding:3px 8px;background:var(--surface)}
.code-check-row{padding:6px 8px;display:flex;gap:8px;align-items:center;background:var(--surface)}
.code-result{font-size:.82em;font-weight:600}
.code-result.ok{color:#4ade80}.code-result.fail{color:#f87171}
.code-ta-lk{width:100%;min-height:100px;background:#0d1117;color:#c9d1d9;font-family:'Courier New',Consolas,monospace;font-size:.82em;padding:6px 8px;border:none;resize:vertical;display:block}
</style>
<link rel="stylesheet" href="/cm/codemirror.min.css">
<link rel="stylesheet" href="/cm/vscode-dark.css">
<script src="/cm/codemirror.min.js"></script>
<script src="/cm/mode/python/python.min.js"></script>
<script src="/cm/mode/javascript/javascript.min.js"></script>

<script src="/cm/addon/edit/matchbrackets.min.js"></script>
</head><body>

<div class="topbar">
  <div class="topbar-logo"><svg viewBox="0 0 100 100" fill="none" stroke="#3fb950" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><line x1="16" y1="12" x2="16" y2="88"/><line x1="16" y1="50" x2="54" y2="50"/><line x1="54" y1="12" x2="88" y2="12"/><line x1="54" y1="12" x2="88" y2="50"/><line x1="88" y1="50" x2="54" y2="88"/><line x1="54" y1="88" x2="88" y2="88"/></svg> Мой кабинет</div>
  <div class="topbar-r">
    <span class="topbar-name" id="uname"></span>
    <a class="link-btn" href="/profile.html" title="Мой профиль">👤</a>
    <button class="notif-btn" onclick="toggleNotifPanel()" title="Уведомления">🔔<span class="notif-badge" id="notifBadge"></span></button>
    <button class="link-btn" onclick="logout()">Выйти</button>
  </div>
</div>

<div class="notif-panel" id="notifPanel">
  <div class="notif-panel-head">
    <span>🔔 Уведомления</span>
    <div style="display:flex;gap:8px">
      <button class="link-btn" style="font-size:.78em" onclick="markAllNotifsRead()">Прочитать все</button>
      <button class="link-btn" style="font-size:.78em" onclick="closeNotifPanel()">✕</button>
    </div>
  </div>
  <div class="notif-panel-body" id="notifPanelBody"><div class="notif-empty">Загрузка...</div></div>
</div>

<div class="wrap" id="main"></div>

<!-- Messages overlay -->
<div id="msgOverlay">
<div class="msg-panel">
  <div class="msg-head">
    <span id="msgTitle" style="font-weight:600;font-size:.95em">💬 Сообщения</span>
    <button class="link-btn" onclick="toggleMessages()">✕</button>
  </div>
  <div class="msg-body" id="msgBody"></div>
  <div class="msg-foot" id="msgFoot" style="display:none">
    <input type="file" id="stuMsgFileIn" style="display:none" onchange="sendStuMsgFile()">
    <button onclick="document.getElementById('stuMsgFileIn').click()" title="Прикрепить файл" style="padding:7px 10px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:.88em;flex-shrink:0">📎</button>
    <input id="msgIn" placeholder="Написать..." style="flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);color:var(--text);font-size:.88em;outline:none" onkeydown="if(event.key==='Enter')sendMsg()">
    <button style="padding:7px 14px;background:var(--green);color:#fff;border:none;border-radius:7px;cursor:pointer;font-weight:600;font-size:.88em" onclick="sendMsg()">→</button>
  </div>
</div>
</div>

<script src="/api.js"></script>
<script>
if(!requireAuth(['student']))throw'';
document.getElementById('uname').textContent=localStorage.getItem('name');

let curSection=null; // null=home, 'courses', 'extra', 'extra-detail', 'contacts', 'schedule'
let student=null, contacts={tutors:[],parents:[]}, apiContacts=[];
let platformCourses=[], curPlatformCourse=null;
let studentCourses=[], schedSlots=[];

function onlineLabel(uid){
  const c=apiContacts.find(x=>x.id===uid);
  if(!c||!c.last_seen) return '<span style="color:var(--muted);font-size:.75em">не был в сети</span>';
  const diff=Date.now()-new Date(c.last_seen).getTime(), mins=Math.floor(diff/60000);
  if(mins<2) return '<span style="color:#3fb950;font-size:.75em">● онлайн</span>';
  if(mins<60) return `<span style="color:var(--muted);font-size:.75em">был(а) ${mins} мин назад</span>`;
  const hrs=Math.floor(mins/60);
  if(hrs<24) return `<span style="color:var(--muted);font-size:.75em">был(а) ${hrs} ч назад</span>`;
  return `<span style="color:var(--muted);font-size:.75em">был(а) ${Math.floor(hrs/24)} д назад</span>`}
const openSecs=new Set(), openPcSecs=new Set();

// ── NAV ──────────────────────────────────────────────────────────────────
function goHome(){curSection=null;render()}
function goSection(s){
  curSection=s;
  if(s==='contacts') get('/api/contacts').then(d=>{apiContacts=d;render()}).catch(()=>render());
  else if(s==='schedule') get('/api/schedule/my').then(d=>{schedSlots=d;render()}).catch(()=>render());
  else render();}

function render(){
  const m=document.getElementById('main');
  if(curSection===null) renderHome(m);
  else if(curSection==='courses'){renderCourses(m);requestAnimationFrame(()=>setTimeout(initStudentCodeEditors,80));}
  else if(curSection==='extra') renderExtra(m);
  else if(curSection==='extra-detail') renderExtraDetail(m);
  else if(curSection==='contacts') renderContacts(m);
  else if(curSection==='schedule') renderSchedule(m);
}

// ── HOME ─────────────────────────────────────────────────────────────────
function renderHome(m){
  if(!student){m.innerHTML='<div class="empty">Загрузка...</div>';return}
  const courseCount=studentCourses.length||student.sections.length;
  const tutorCount=contacts.tutors.length+contacts.parents.length;
  const pcCount=platformCourses.length;
  m.innerHTML=`<div style="margin-bottom:20px">
  <div style="font-size:1.15em;font-weight:700;margin-bottom:2px">Добро пожаловать, ${esc(student.name)}</div>
  <div style="color:var(--muted);font-size:.85em">${student.grade} класс · ${student.format}</div>
</div>
<div class="dash-grid">
  <div class="dash-card" onclick="goSection('courses')">
    <div class="dash-card-icon">📚</div>
    <h3>Основные курсы</h3>
    <div class="dash-card-count">${courseCount}</div>
    <div class="dash-card-sub">${studentCourses.length?'курсов в программе':'разделов в программе'}</div>
  </div>
  <div class="dash-card" onclick="goSection('schedule')">
    <div class="dash-card-icon">📅</div>

function calcPrice(st){
  if(!st.rewards_enabled) return{base:st.base_rate,discount:0,current:st.base_rate,pct:0};
  const n=st.sections.length;
  if(!n)return{base:st.base_rate,discount:0,current:st.base_rate,pct:0};
  const share=st.base_rate*0.30/n; let disc=0;
  for(const sec of st.sections){
    const hw=sec.items.filter(i=>i.type==='hw');
    if(hw.length>0&&hw.every(i=>(i.grade||0)===5)) disc+=share/3;
    if(sec.control==='passed') disc+=share/3;
    if(sec.idz_enabled&&(sec.idz||0)===5) disc+=share/3;
  }
  const d=Math.round(disc);
  return{base:st.base_rate,discount:d,current:st.base_rate-d,pct:Math.round(d/st.base_rate*100)};
}

async function setStatus(itemId,status){

const _cmStInstances=new Map();
function initStudentCodeEditors(){
  document.querySelectorAll('.code-ta-st:not([data-cm-inited])').forEach(ta=>{
    ta.setAttribute('data-cm-inited','1');
    const langRaw=ta.dataset.lang||'python';
    const mode=langRaw==='javascript'?{name:'javascript'}:langRaw;
    const cm=CodeMirror.fromTextArea(ta,{
      mode,lineNumbers:true,indentUnit:4,tabSize:4,
      indentWithTabs:false,autoCloseBrackets:true,matchBrackets:true,viewportMargin:Infinity,
      extraKeys:{Tab:cm=>cm.execCommand('indentMore'),'Shift-Tab':cm=>cm.execCommand('indentLess')}
    });
    cm.setSize('100%',200);
    _cmStInstances.set(ta.dataset.iid,cm);
    if(ta.disabled) cm.setOption('readOnly',true);
  });
}
async function runStudentCode(itemId){
  const cm=_cmStInstances.get(itemId);
  const code=cm?cm.getValue():(document.getElementById('cta_'+itemId)?.value||'');
  const outEl=document.getElementById('cout_'+itemId);
  const resEl=document.getElementById('cres_'+itemId);
  if(!code.trim()) return;
  if(outEl) outEl.style.display='block';
  if(resEl) resEl.textContent='Запуск...';
  try{
    const r=await post('/api/run_code',{code,lang:'python'});
    const txt=(r.stdout||'')+(r.stderr?'\n'+r.stderr:'');
    if(outEl){outEl.textContent=txt||'(нет вывода)';outEl.style.color=r.ok?'#c9d1d9':'#f87171';}
    if(resEl) resEl.textContent='';
  }catch(e){if(resEl)resEl.textContent='Ошибка: '+(e.detail||e);}
}
async function checkCode(itemId){
  const cm=_cmStInstances.get(itemId);
  const code=cm?cm.getValue():(document.getElementById('cta_'+itemId)?.value||'');
  const resEl=document.getElementById('cres_'+itemId);
  const outEl=document.getElementById('cout_'+itemId);
  if(!code.trim()){if(resEl)resEl.textContent='Введите код';return}
  try{
    const r=await post('/api/items/'+itemId+'/check-code',{code});
    const match=r.match||r.correct;
    if(match){
      if(resEl){resEl.style.color='var(--green-t)';resEl.textContent='✓ Верно! Задание выполнено.'}
      if(outEl) outEl.style.display='none';
      _allSecs().forEach(s=>{const it=s.items.find(i=>i.id===itemId);if(it){it.status='done';it.student_answer=code;}});
      renderCourses(document.getElementById('main'));
      setTimeout(initStudentCodeEditors,0);
    }else{
      if(resEl){resEl.style.color='#f87171';resEl.textContent='✗ Не совпадает. Попробуй ещё раз.'}
    }
  }catch(e){if(resEl)resEl.textContent='Ошибка: '+(e.detail||e);}
}

async function submitAnswer(itemId){
  const ta=document.getElementById('ans_'+itemId);if(!ta) return;
  try{await patch('/api/items/'+itemId,{student_answer:ta.value.trim()});
    _allSecs().forEach(s=>{const it=s.items.find(i=>i.id===itemId);if(it)it.student_answer=ta.value.trim()});
    renderCourses(document.getElementById('main'))}catch(e){alert(e.detail||'Ошибка')}}

async function uploadStudentAtt(itemId,input){
  const file=input.files[0];if(!file) return;
  input.value='';
  try{
    const att=await upload('/api/items/'+itemId+'/attachments',file);
    _allSecs().forEach(s=>{const it=s.items.find(i=>i.id===itemId);
      if(it){if(!it.attachments)it.attachments=[];it.attachments.push(att);}});
    renderCourses(document.getElementById('main'));
  }catch(e){alert(e.detail||'Ошибка загрузки')}}

async function delStudentAtt(attId,itemId){
  try{
    await del('/api/attachments/'+attId);
    _allSecs().forEach(s=>{const it=s.items.find(i=>i.id===itemId);
      if(it&&it.attachments)it.attachments=it.attachments.filter(a=>a.id!==attId);});
    renderCourses(document.getElementById('main'));
  }catch(e){alert(e.detail||'Ошибка')}}

    <div class="contact-name"><a href="/profile.html?uid=${uid}" style="color:inherit;text-decoration:none" onmouseover="this.style.color='var(--green-t)'" onmouseout="this.style.color='inherit'">${esc(name)}</a></div>
    <div class="contact-sub" style="display:flex;gap:8px;align-items:center">${sub} ${onlineLabel(uid)}</div>
  </div>
  <button class="btn-msg" onclick="${btnFn}">💬 Написать</button>
</div>`}

function renderContacts(m){

    <span class="sec-title">👥 Контакты</span>

// ── MESSAGING ────────────────────────────────────────────────────────────
let msgChatUid=null, msgOpen=false, chatPollTimer=null, msgChatName='';
let msgGroups=[], msgGroupId=null, msgGroupName='', msgGroupPollTimer=null;
let _sMyId=null;
async function _getSMyId(){if(!_sMyId){try{const r=await get('/api/auth/me');_sMyId=r.id;}catch{}}return _sMyId;}

function toggleMessages(){
  const ov=document.getElementById('msgOverlay');
  msgOpen=!msgOpen;ov.style.display=msgOpen?'flex':'none';
  if(msgOpen&&!msgChatUid&&!msgGroupId) loadConvos();
  if(!msgOpen){clearInterval(chatPollTimer);chatPollTimer=null;clearInterval(msgGroupPollTimer);msgGroupPollTimer=null;}}

function startChat(uid,name){
  msgOpen=true; document.getElementById('msgOverlay').style.display='flex';
  openChatWith(uid,name)}

async function loadConvos(){
  clearInterval(chatPollTimer);chatPollTimer=null;
  clearInterval(msgGroupPollTimer);msgGroupPollTimer=null;
  const [convos,groups]=await Promise.all([get('/api/messages').catch(()=>[]),get('/api/groups').catch(()=>[])]);
  msgGroups=groups;
  const body=document.getElementById('msgBody');
  document.getElementById('msgTitle').textContent='💬 Сообщения';
  document.getElementById('msgFoot').style.display='none';
  msgChatUid=null;msgGroupId=null;
  let h='';
  for(const g of groups){
    h+=`<div style="padding:10px 6px;cursor:pointer;border-radius:8px;display:flex;align-items:center;gap:10px" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background=''" onclick="openGroupChat('${g.id}','${esc(g.name)}')">
  <div style="width:34px;height:34px;border-radius:50%;background:#1f3a27;color:var(--green-t);display:flex;align-items:center;justify-content:center;font-size:1.1em;flex-shrink:0">👥</div>
  <div style="flex:1;min-width:0"><div style="font-size:.88em;font-weight:600">${esc(g.name)}</div><div style="font-size:.78em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.last_msg_text||'')}</div></div>
  ${g.unread>0?`<span style="background:#ef4444;color:#fff;font-size:.68em;font-weight:700;padding:1px 5px;border-radius:8px">${g.unread}</span>`:''}
</div>`}
  for(const c of convos){
    h+=`<div style="padding:10px 6px;cursor:pointer;border-radius:8px;display:flex;align-items:center;gap:10px" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background=''" onclick="openChatWith('${c.partner_id}','${esc(c.partner_name)}')">
  <div style="width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9em;flex-shrink:0">${(c.partner_name||'?')[0].toUpperCase()}</div>
  <div style="flex:1;min-width:0">
    <div style="font-size:.88em;font-weight:600">${esc(c.partner_name)}</div>
    <div style="font-size:.78em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.last_text||'')}</div>
  </div>
  ${c.unread>0?`<span style="background:#ef4444;color:#fff;font-size:.68em;font-weight:700;padding:1px 5px;border-radius:8px">${c.unread}</span>`:''}
</div>`}
  body.innerHTML=h||'<div class="empty">Нет сообщений</div>';}

async function openChatWith(uid,name){
  msgChatUid=uid;
  if(name) msgChatName=name;
  document.getElementById('msgTitle').innerHTML=`<button onclick="loadConvos()" style="background:none;border:none;cursor:pointer;color:var(--muted);margin-right:4px;font-size:.85em">←</button> ${esc(msgChatName)}`;
  document.getElementById('msgFoot').style.display='flex';
  await refreshChat();
  clearInterval(chatPollTimer);
  chatPollTimer=setInterval(refreshChat,5000);}

async function openGroupChat(gid,name){
  msgGroupId=gid;msgGroupName=name;
  document.getElementById('msgTitle').innerHTML=`<button onclick="loadConvos()" style="background:none;border:none;cursor:pointer;color:var(--muted);margin-right:4px;font-size:.85em">←</button> 👥 ${esc(name)}`;
  document.getElementById('msgFoot').style.display='flex';
  await refreshGroupChatStu();
  clearInterval(msgGroupPollTimer);
  msgGroupPollTimer=setInterval(refreshGroupChatStu,5000);}

function _fmtFileSizeStu(bytes){
  if(bytes<1024) return bytes+' Б';
  if(bytes<1048576) return (bytes/1024).toFixed(1)+' КБ';
  return (bytes/1048576).toFixed(1)+' МБ';}
function _renderBubble(m,mine,showSender){
  try{
    const j=JSON.parse(m.text);
    if(j.type==='board_invite'){
      if(mine) return`<div class="msg-bubble msg-mine" style="opacity:.8">📋 Приглашение на доску «${esc(j.board_title)}» — отправлено</div>`;
      return`<div class="msg-bubble msg-their" style="padding:10px 14px;border:1px solid var(--border)">
  <div style="font-weight:600;margin-bottom:4px">📋 Приглашение на доску</div>
  <div style="color:var(--green-t);margin-bottom:8px">«${esc(j.board_title)}»</div>
  <div id="invact_${esc(j.invite_id)}" style="display:flex;gap:6px;flex-wrap:wrap">
    <button style="padding:4px 12px;background:var(--green);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:.82em" onclick="_acceptBI('${esc(j.invite_id)}','${esc(j.board_title)}',this)">Принять</button>
    <button style="padding:4px 12px;background:none;color:#ef4444;border:1px solid #ef4444;border-radius:5px;cursor:pointer;font-size:.82em" onclick="_declineBI('${esc(j.invite_id)}',this)">Отклонить</button>
  </div></div>`;}
    if(j.type==='file'){
      const url=esc(j.url);const name=esc(j.name||'файл');const sz=_fmtFileSizeStu(j.size||0);
      if((j.mime||'').startsWith('image/')){
        return`<div class="msg-bubble ${mine?'msg-mine':'msg-their'}" style="padding:6px"><a href="${url}" target="_blank"><img src="${url}" style="max-width:220px;border-radius:6px;display:block"></a><div style="font-size:.72em;opacity:.8;margin-top:2px">${name} · ${sz}</div></div>`;}
      if((j.mime||'').startsWith('video/')){
        return`<div class="msg-bubble ${mine?'msg-mine':'msg-their'}" style="padding:6px"><video src="${url}" controls style="max-width:220px;border-radius:6px;display:block"></video><div style="font-size:.72em;opacity:.8;margin-top:2px">${name} · ${sz}</div></div>`;}
      return`<div class="msg-bubble ${mine?'msg-mine':'msg-their'}"><a href="${url}" target="_blank" style="color:inherit;text-decoration:none">📎 ${name}</a><div style="font-size:.72em;opacity:.8;margin-top:2px">${sz}</div></div>`;}
  }catch{}
  const senderLabel=(!mine&&showSender&&m.from_name)?`<div style="font-size:.72em;color:var(--muted);margin-bottom:2px">${esc(m.from_name)}</div>`:'';
  return`<div class="msg-bubble ${mine?'msg-mine':'msg-their'}">${senderLabel}${esc(m.text)}</div>`;}
async function _acceptBI(iid,title,btn){
  btn.disabled=true;
  try{
    await post('/api/board-invites/'+iid+'/accept',{});
    const wrap=document.getElementById('invact_'+iid);
    if(wrap) wrap.innerHTML=`<span style="color:var(--green-t);font-size:.82em">✓ Принято — доска добавлена в <a href="/workshop.html" style="color:var(--green-t)">Мастерскую</a></span>`;
  }catch(e){btn.disabled=false;alert(e.detail||'Ошибка');}}
async function _declineBI(iid,btn){
  btn.disabled=true;
  try{
    await post('/api/board-invites/'+iid+'/decline',{});
    const wrap=document.getElementById('invact_'+iid);
    if(wrap) wrap.innerHTML=`<span style="color:var(--muted);font-size:.82em">Отклонено</span>`;
  }catch(e){btn.disabled=false;}}
async function refreshChat(){
  if(!msgChatUid) return;
  const msgs=await get('/api/messages/'+msgChatUid).catch(()=>[]);
  const body=document.getElementById('msgBody');
  if(!body) return;
  const atBottom=body.scrollHeight-body.scrollTop-body.clientHeight<60;
  body.innerHTML=msgs.map(m=>{const mine=m.to_id===msgChatUid;return _renderBubble(m,mine,false)}).join('');
  if(atBottom) body.scrollTop=body.scrollHeight;
  pollNotifs();}
async function refreshGroupChatStu(){
  if(!msgGroupId) return;
  const msgs=await get('/api/groups/'+msgGroupId+'/messages').catch(()=>[]);
  const body=document.getElementById('msgBody');
  if(!body) return;
  const myId=await _getSMyId();
  const atBottom=body.scrollHeight-body.scrollTop-body.clientHeight<60;
  body.innerHTML=msgs.map(m=>{const mine=m.from_id===myId;return _renderBubble(m,mine,true)}).join('');
  if(atBottom) body.scrollTop=body.scrollHeight;
  pollNotifs();}

async function sendMsg(){
  if(msgGroupId){await sendGroupMsgStu();return;}
  const inp=document.getElementById('msgIn');if(!inp||!inp.value.trim())return;
  try{await post('/api/messages',{to_id:msgChatUid,text:inp.value.trim()});inp.value='';
    await refreshChat();}catch(e){alert(e.detail||'Ошибка')}}
async function sendGroupMsgStu(){
  const inp=document.getElementById('msgIn');if(!inp||!inp.value.trim())return;
  try{await post('/api/groups/'+msgGroupId+'/messages',{text:inp.value.trim()});inp.value='';
    await refreshGroupChatStu();}catch(e){alert(e.detail||'Ошибка')}}
async function sendStuMsgFile(){
  const fi=document.getElementById('stuMsgFileIn');
  if(!fi||!fi.files.length)return;
  const file=fi.files[0];fi.value='';
  try{
    const r=await upload('/api/messages/upload',file);
    const txt=JSON.stringify({type:'file',url:r.url,name:r.name,mime:r.mime,size:r.size});
    if(msgGroupId){
      await post('/api/groups/'+msgGroupId+'/messages',{text:txt});
      await refreshGroupChatStu();
    }else{
      await post('/api/messages',{to_id:msgChatUid,text:txt});
      await refreshChat();
    }}catch(e){alert(e.detail||'Ошибка загрузки файла')}}

let notifPanelOpen=false;
let lastNotifsData=null;
function fmtNotifTime(iso){
  if(!iso) return '';
  const d=Date.now()-new Date(iso).getTime(),m=Math.floor(d/60000);
  if(m<2) return 'только что';if(m<60) return m+' мин назад';
  const h=Math.floor(m/60);if(h<24) return h+' ч назад';
  return new Date(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
async function pollNotifs(){
  try{
    const r=await get('/api/notifications');
    lastNotifsData=r;
    const n=r.unread||0;
    const b=document.getElementById('notifBadge');
    if(b){b.textContent=n>99?'99+':n;b.style.display=n>0?'':'none'}
    if(notifPanelOpen) renderNotifPanel(r);
  }catch(e){}
  setTimeout(pollNotifs,30000)}
function renderNotifPanel(r){
  const body=document.getElementById('notifPanelBody');if(!body) return;
  const msgs=r.unread_messages||0;
  const notifs=r.notifications||[];
  let h='';
  if(msgs>0) h+=`<div class="notif-msgs-row" onclick="closeNotifPanel();toggleMessages()">
    <span>💬 ${msgs} новых сообщений</span><span style="color:var(--green-t);font-size:.8em">Открыть →</span></div>`;
  if(!notifs.length&&!msgs){h='<div class="notif-empty">Нет уведомлений</div>';}
  else h+=notifs.map(n=>`<div class="notif-item${n.is_read?'':' unread'}" onclick="handleNotif('${n.id}','${n.link||''}')">
    <div class="notif-item-text">${esc(n.text)}</div>
    <div class="notif-item-time">${fmtNotifTime(n.created_at)}</div></div>`).join('');
  body.innerHTML=h}
function toggleNotifPanel(){
  notifPanelOpen=!notifPanelOpen;
  document.getElementById('notifPanel').classList.toggle('open',notifPanelOpen);
  if(notifPanelOpen){if(lastNotifsData) renderNotifPanel(lastNotifsData);pollNotifs();}}
function closeNotifPanel(){notifPanelOpen=false;document.getElementById('notifPanel').classList.remove('open')}
async function handleNotif(id,link){
  await post('/api/notifications/'+id+'/read',{}).catch(()=>{});
  if(link) location.href=link;
  pollNotifs();}
async function markAllNotifsRead(){
  await post('/api/notifications/read-all',{}).catch(()=>{});
  pollNotifs();}
document.addEventListener('click',e=>{
  const panel=document.getElementById('notifPanel');
  const btn=e.target.closest('.notif-btn');
  if(!btn&&panel&&!panel.contains(e.target)){closeNotifPanel();}});

// ── SCHEDULE ─────────────────────────────────────────────────────────────
const SCHED_DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const SCHED_COLORS={blue:'#1f6feb',red:'#b91c1c',purple:'#6e40c9',orange:'#d97706',teal:'#0e7490'};
function slotToTime(idx){const h=Math.floor(idx/2),mn=idx%2?'30':'00';return`${String(h).padStart(2,'0')}:${mn}`}

function renderSchedule(m){
  let h=`<div class="sec-header">
    <button class="back-btn" onclick="goHome()">← Главная</button>
    <span class="sec-title">📅 Расписание</span>
  </div>`;
  if(!schedSlots.length){h+='<div class="empty">Расписание ещё не назначено</div>';m.innerHTML=h;return}

  // Group by day, find visible range
  const byDay=Array.from({length:7},()=>[]);
  schedSlots.forEach(s=>byDay[s.day_of_week].push(s));
  let minSl=48,maxSl=0;
  schedSlots.forEach(s=>{minSl=Math.min(minSl,s.slot_index);maxSl=Math.max(maxSl,s.slot_index+(s.duration||2)-1)});
  minSl=Math.max(0,minSl-1); maxSl=Math.min(47,maxSl+1);
  const activeDays=[];for(let d=0;d<7;d++) if(byDay[d].length) activeDays.push(d);

  h+=`<div class="sched-wrap"><table class="sched-tbl"><thead><tr><th class="tc">Время</th>`;
  h+=activeDays.map(d=>`<th>${SCHED_DAYS[d]}</th>`).join('');
  h+=`</tr></thead><tbody>`;
  const skipSet=new Set();
  for(let si=minSl;si<=maxSl;si++){
    h+=`<tr><td class="tc">${slotToTime(si)}</td>`;
    for(const d of activeDays){
      const key=`${d}_${si}`;
      if(skipSet.has(key)){continue}
      const slot=byDay[d].find(s=>s.slot_index===si);
      if(slot){
        const dur=slot.duration||2;
        for(let dd=1;dd<dur;dd++) skipSet.add(`${d}_${si+dd}`);
        const bg=SCHED_COLORS[slot.color]||'#1a7f37';
        h+=`<td rowspan="${dur}" style="background:${bg}22;padding:3px">
<div class="sched-chip" style="background:${bg};color:#fff" onclick="scrollToNote('${slot.id}')">
  <b>${slotToTime(slot.slot_index)}–${slotToTime(slot.slot_index+dur)}</b>
  ${slot.note?`<div style="font-size:.78em;opacity:.9">${esc(slot.note)}</div>`:''}
</div>
${slot.student_note?`<div style="font-size:.75em;color:var(--muted);padding:2px 2px 0;line-height:1.3">${esc(slot.student_note)}</div>`:''}
</td>`;
      } else {h+=`<td></td>`;}
    }
    h+=`</tr>`;
  }
  h+=`</tbody></table></div>`;

  h+=`<div style="margin-top:20px"><div style="font-size:.82em;font-weight:600;margin-bottom:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Заметки к занятиям</div>`;
  h+=schedSlots.map(s=>{
    const dur=s.duration||2;
    const bg=SCHED_COLORS[s.color]||'#1a7f37';
    return`<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px" id="snwrap_${s.id}">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <div style="width:10px;height:10px;border-radius:50%;background:${bg};flex-shrink:0"></div>
    <div style="font-size:.88em;font-weight:600">${SCHED_DAYS[s.day_of_week]} · ${slotToTime(s.slot_index)}–${slotToTime(s.slot_index+dur)}</div>
    ${s.note?`<div style="color:var(--muted);font-size:.82em">${esc(s.note)}</div>`:''}
  </div>
  <textarea class="sched-note-area" id="snote_${s.id}" placeholder="Личная заметка к занятию...">${esc(s.student_note||'')}</textarea>
  <div style="text-align:right;margin-top:4px">
    <button class="st-ans-btn" onclick="saveSchedNote('${s.id}')">Сохранить</button>
  </div>
</div>`}).join('');
  h+=`</div>`;
  m.innerHTML=h}

function scrollToNote(slotId){
  const el=document.getElementById('snwrap_'+slotId);
  if(el) el.scrollIntoView({behavior:'smooth',block:'center'});}

async function saveSchedNote(slotId){
  const ta=document.getElementById('snote_'+slotId);if(!ta) return;
  try{
    await patch('/api/schedule/'+slotId+'/student-note',{student_note:ta.value.trim()});
    const s=schedSlots.find(x=>x.id===slotId);if(s) s.student_note=ta.value.trim();
    const btn=ta.nextElementSibling&&ta.nextElementSibling.querySelector('button');
    if(btn){const orig=btn.textContent;btn.textContent='✓ Сохранено';setTimeout(()=>btn.textContent=orig,1500);}
  }catch(e){alert(e.detail||'Ошибка')}}

// ── LOAD ─────────────────────────────────────────────────────────────────
async function load(){
  const list=await get('/api/students');
  if(!list.length){
    document.getElementById('main').innerHTML='<div class="empty">Профиль не привязан к аккаунту</div>';return}
  const id=list[0].id;
  [student,contacts,platformCourses,apiContacts,studentCourses,schedSlots]=await Promise.all([
    get('/api/students/'+id),
    get('/api/students/'+id+'/contacts').catch(()=>({tutors:[],parents:[]})),
    get('/api/students/'+id+'/platform-courses').catch(()=>[]),
    get('/api/contacts').catch(()=>[]),
    get('/api/students/'+id+'/courses').catch(()=>[]),
    get('/api/schedule/my').catch(()=>[])]);
  for(const sec of student.sections){if(sec.is_open) openSecs.add(sec.id)}
  render();
  // Handle ?chat=uid&name=name from profile page
  const _qp=new URLSearchParams(location.search);
  const _initChat=_qp.get('chat');
  if(_initChat){history.replaceState(null,'',location.pathname);startChat(_initChat,_qp.get('name')||_initChat);}}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}

load();pollNotifs();
</script></body></html>
