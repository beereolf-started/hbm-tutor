name: Build Android APK

on:
  push:
    branches:
      - android-apk
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          status=$?
          echo "Exit status: $status" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 300 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Output files:" >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs -type f >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit $status

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hbm-tutor-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
